ent.getElementById('decrementPasswordInput').value;\n  const action = pendingDecrementAction;\n  const expectedPassword = action && (action.type === 'discount' || action.type === 'ownerDiscount')\n    ? getDiscountPassword()\n    : getDecrementPassword();\n  if(!window.__BEANS_DEMO_ANY_PW && pass !== expectedPassword){\n    showToast('كلمة المرور غير صحيحة!');\n    return;\n  }\n  closeDecrementPasswordModal();\n  if(action && action.type === 'discount'){\n    const input = document.getElementById(action.inputId);\n    input.readOnly = false;\n    input.focus();\n  } else if(action && action.type === 'ownerDiscount'){\n    toggleOwnerMode(true);\n  } else if(action && action.type === 'emptyTable') emptyActiveTable();\n  else if(action && action.id !== null) changeQty(action.id, -1);\n}\ndocument.getElementById('decrementPasswordBtn').addEventListener('click', confirmDecrementPassword);\ndocument.getElementById('decrementPasswordModalClose').addEventListener('click', closeDecrementPasswordModal);\ndecrementPasswordModalOverlay.addEventListener('click', (e)=>{ if(e.target===decrementPasswordModalOverlay) closeDecrementPasswordModal(); });\ndocument.getElementById('decrementPasswordInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') confirmDecrementPassword(); });\n\n// إفراغ الترابيزة الحالية بالكامل (حذف كل الأوردر عليها) — بعد تأكيد كلمة مرور إنقاص الأصناف\nfunction emptyActiveTable(){\n  const tData = tablesCarts[activeHall][activeTable];\n  if(!tData || tData.items.length===0){ showToast('الترابيزة فاضية بالفعل'); return; }\n  const tableNameStr = tableDisplayLabel(activeHall, activeTable);\n  recordVoid({ type:'table_emptied', tableName: tableNameStr, items: tData.items.map(i=>({name:i.name, qty:i.qty, price:i.price})), value: r2(tData.items.reduce((s,i)=>s+i.qty*i.price,0)) });\n  tablesCarts[activeHall][activeTable] = { items: [], discount: 0, notes: \"\", ownerMode: false, printedBon: {}, label: tData.label || null, openedAt: null };\n  saveTablesCarts();\n  renderAll();\n  closeSheet();\n  showToast(`تم إفراغ ${tableNameStr}`);\n}\ndocument.getElementById('emptyTableBtnD').addEventListener('click', ()=> openDecrementPasswordModal({ type:'emptyTable' }));\ndocument.getElementById('emptyTableBtnM').addEventListener('click', ()=> openDecrementPasswordModal({ type:'emptyTable' }));\n\n/* ============ SWAP / MOVE TABLE (نقل شيك ترابيزة لترابيزة تانية، أو تبديل شيكي ترابيزتين مع بعض) ============ */\n// اسم الترابيزة (label) بيفضل ثابت على مكانه الفعلي، وبس محتوى الشيك (الأصناف والخصم والملاحظات...) هو اللي بيتنقل/يتبدل\nconst SWAP_TABLE_FIELDS = ['items','discount','notes','ownerMode','printedBon','openedAt'];\nfunction openSwapTableModal(){\n  document.getElementById('swapTableFromLbl').textContent = `هتنقلي شيك: ${tableDisplayLabel(activeHall, activeTable)}`;\n  populateSwapTableSelects();\n  document.getElementById('swapTableModalOverlay').classList.add('show');\n}\nfunction populateSwapTableSelects(){\n  const hallSel = document.getElementById('swapTableHallSel');\n  const numSel = document.getElementById('swapTableNumSel');\n  hallSel.innerHTML = HALLS.map(h=>`<option value=\"${h.id}\">${h.name}<\/option>`).join('');\n  hallSel.value = activeHall;\n  function fillNums(){\n    const h = getHall(hallSel.value);\n    const count = h ? h.tableCount : 0;\n    let opts = '';\n    for(let i=1;i<=count;i++){\n      if(hallSel.value===activeHall && i===activeTable) continue; // متعرضش نفس الترابيزة المفتوحة\n      opts += `<option value=\"${i}\">${tableDisplayLabel(hallSel.value, i)}<\/option>`;\n    }\n    numSel.innerHTML = opts;\n    updateSwapWarnNote();\n  }\n  function updateSwapWarnNote(){\n    const note = document.getElementById('swapTableWarnNote');\n    const destHall = hallSel.value, destNum = parseInt(numSel.value);\n    const dest = tablesCarts[destHall] && tablesCarts[destHall][destNum];\n    if(dest && dest.items && dest.items.length){\n      note.style.display = 'block';\n      note.textContent = ` ${tableDisplayLabel(destHall, destNum)} فيها شيك مفتوح فعلاً — هيتبدل الشيكين مع بعض.`;\n    } else {\n      note.style.display = 'none';\n    }\n  }\n  hallSel.onchange = fillNums;\n  numSel.onchange = updateSwapWarnNote;\n  fillNums();\n}\ndocument.getElementById('swapTableConfirmBtn').addEventListener('click', ()=>{\n  const destHall = document.getElementById('swapTableHallSel').value;\n  const destNum = parseInt(document.getElementById('swapTableNumSel').value);\n  if(!destHall || !destNum || !tablesCarts[destHall] || !tablesCarts[destHall][destNum]) return;\n  if(destHall===activeHall && destNum===activeTable){ showToast('اختاري ترابيزة مختلفة'); return; }\n\n  const srcTable = tablesCarts[activeHall][activeTable];\n  const destTable = tablesCarts[destHall][destNum];\n  const srcCopy = {};\n  SWAP_TABLE_FIELDS.forEach(k => srcCopy[k] = srcTable[k]);\n  SWAP_TABLE_FIELDS.forEach(k => srcTable[k] = destTable[k]);\n  SWAP_TABLE_FIELDS.forEach(k => destTable[k] = srcCopy[k]);\n  // بيانات الدليفري/العميل (لو موجودة) بتتنقل مع الشيك\n  if(srcTable.extra || destTable.extra){ const ex = srcTable.extra || null; srcTable.extra = destTable.extra || null; destTable.extra = ex; }\n\n  const fromLbl = tableDisplayLabel(activeHall, activeTable);\n  const toLbl = tableDisplayLabel(destHall, destNum);\n  saveTablesCarts();\n  document.getElementById('swapTableModalOverlay').classList.remove('show');\n  // نتابع الزبون لمكانه الجديد، فتفتح شاشتك على الترابيزة اللي نقلته ليها\n  activeHall = destHall;\n  activeTable = destNum;\n  renderHallTabs();\n  renderAll();\n  showToast(`تم نقل الشيك من ${fromLbl} إلى ${toLbl} بنجاح`);\n});\ndocument.getElementById('swapTableModalClose').addEventListener('click', ()=> document.getElementById('swapTableModalOverlay').classList.remove('show'));\ndocument.getElementById('swapTableModalOverlay').addEventListener('click', (e)=>{ if(e.target===document.getElementById('swapTableModalOverlay')) document.getElementById('swapTableModalOverlay').classList.remove('show'); });\ndocument.getElementById('swapTableBtnD').addEventListener('click', openSwapTableModal);\ndocument.getElementById('swapTableBtnM').addEventListener('click', openSwapTableModal);\n\nfunction cartSubTotal(){ \n  return tablesCarts[activeHall][activeTable].items.reduce((s,i)=>s+i.price*i.qty,0); \n}\nfunction cartTotal(){ \n  let sub = cartSubTotal();\n  let disc = parseFloat(tablesCarts[activeHall][activeTable].discount) || 0;\n  let total = sub - disc;\n  return total < 0 ? 0 : total;\n}\nfunction cartCount(){ \n  return tablesCarts[activeHall][activeTable].items.reduce((s,i)=>s+i.qty,0); \n}\n\nfunction renderAll(){\n  renderTablesBar();\n  renderGrid(searchInput.value);\n  renderCart();\n}\n\nfunction cartLineHtml(i){\n  return `\n    <div class=\"cart-line\" data-id=\"${i.id}\">\n      <div class=\"info\">\n        <div class=\"nm\">${i.name}<\/div>\n        <div class=\"pr\">${i.price} ج.م × ${i.qty}<\/div>\n      <\/div>\n      <div class=\"stepper\">\n        <button type=\"button\" data-act=\"minus\">−<\/button>\n        <span class=\"q\">${i.qty}<\/span>\n        <button type=\"button\" data-act=\"plus\">+<\/button>\n      <\/div>\n      <div class=\"line-total\">${fmt(i.price*i.qty)}<\/div>\n    <\/div>`;\n}\n\nfunction renderCart(){\n  const tData = tablesCarts[activeHall][activeTable];\n  const empty = tData.items.length===0;\n  const tableNameStr = tableDisplayLabel(activeHall, activeTable);\n  \n  const emptyHtml = `<div class=\"cart-empty\">${beansEmpty('orders','شيك '+tableNameStr+' فارغ','اضغط على أي صنف لإضافته')}<\/div>`;\n  const linesHtml = tData.items.map(cartLineHtml).join('');\n\n  document.getElementById('cartTitleD').textContent = `الشيك: ${tableNameStr}`;\n  document.getElementById('cartTitleM').textContent = `الشيك: ${tableNameStr}`;\n\n  const cartItemsD = document.getElementById('cartItemsD');\n  const cartItemsM = document.getElementById('cartItemsM');\n  cartItemsD.innerHTML = empty ? emptyHtml : linesHtml;\n  cartItemsM.innerHTML = empty ? emptyHtml : linesHtml;\n\n  [cartItemsD, cartItemsM].forEach(container=>{\n    container.querySelectorAll('.stepper button').forEach(btn=>{\n      btn.addEventListener('click', (e)=>{\n        const id = parseFloat(btn.closest('.cart-line').dataset.id);\n        if(btn.dataset.act==='plus'){\n          changeQty(id, 1);\n        } else {\n          openDecrementPasswordModal(id);\n        }\n      });\n    });\n  });\n\n  const subTotal = cartSubTotal();\n  const total = cartTotal();\n  const count = cartCount();\n\n  document.getElementById('subTotalD').textContent = fmt(subTotal)+' ج.م';\n  document.getElementById('subTotalM').textContent = fmt(subTotal)+' ج.م';\n  document.getElementById('cartTotalD').textContent = fmt(total)+' ج.م';\n  document.getElementById('cartTotalM').textContent = fmt(total)+' ج.م';\n\n  const discVal = tData.discount;\n  document.getElementById('discountInputD').value = discVal;\n  document.getElementById('discountInputM').value = discVal;\n\n  const notesVal = tData.notes || \"\";\n  document.getElementById('notesInputD').value = notesVal;\n  document.getElementById('notesInputM').value = notesVal;\n\n  document.getElementById('checkoutBtnD').disabled = count===0;\n  document.getElementById('checkoutBtnM').disabled = count===0;\n  document.getElementById('instapayBtnD').disabled = count===0 || tData.ownerMode;\n  document.getElementById('instapayBtnM').disabled = count===0 || tData.ownerMode;\n\n  document.getElementById('mbCount').textContent = count;\n  document.getElementById('mbTotal').textContent = fmt(total)+' ج.م';\n  renderCheckExtras();\n  document.getElementById('mbCtaText').textContent = `${tableNameStr} (${count}) `;\n  document.getElementById('mobileBarInner').classList.toggle('disabled', count===0);\n\n  const ownerMode = tData.ownerMode;\n  const btnLabel = ownerMode ? ` إغلاق شيك ${tableNameStr} كخصم مالك (دون تحصيل)` : `تحصيل نقدي وإغلاق شيك ${tableNameStr}`;\n  document.getElementById('checkoutBtnD').textContent = btnLabel;\n  document.getElementById('checkoutBtnM').textContent = btnLabel;\n  document.getElementById('checkoutBtnD').classList.toggle('owner-mode', ownerMode);\n  document.getElementById('checkoutBtnM').classList.toggle('owner-mode', ownerMode);\n  document.getElementById('ownerToggleD').classList.toggle('active', ownerMode);\n  document.getElementById('ownerToggleM').classList.toggle('active', ownerMode);\n}\n\n// التحكم في Discount والملاحظات\nfunction requestDiscountInputEdit(input){\n  if(!input.readOnly) return;\n  if(hasPermission('cashDiscount')){\n    input.readOnly = false;\n    input.focus();\n    return;\n  }\n  openDiscountPasswordModal({ type:'discount', inputId:input.id });\n}\nfunction lockDiscountInput(input){\n  input.readOnly = true;\n}\nfunction handleDiscountChange(val){\n  tablesCarts[activeHall][activeTable].discount = Math.max(0, parseFloat(val) || 0);\n  saveTablesCarts();\n  renderCart();\n}\ndocument.getElementById('discountInputD').addEventListener('input', (e)=>handleDiscountChange(e.target.value));\ndocument.getElementById('discountInputM').addEventListener('input', (e)=>handleDiscountChange(e.target.value));\n['discountInputD','discountInputM'].forEach(id=>{\n  const input = document.getElementById(id);\n  input.addEventListener('click', ()=>requestDiscountInputEdit(input));\n  input.addEventListener('blur', ()=>lockDiscountInput(input));\n});\n\nfunction handleNotesChange(val){\n  tablesCarts[activeHall][activeTable].notes = val;\n  saveTablesCarts();\n}\ndocument.getElementById('notesInputD').addEventListener('input', (e)=>handleNotesChange(e.target.value));\ndocument.getElementById('notesInputM').addEventListener('input', (e)=>handleNotesChange(e.target.value));\n\nasync function toggleOwnerMode(authorizedByPassword=false){\n  if(!hasPermission('ownerDiscount') && !authorizedByPassword){\n    openDiscountPasswordModal({ type:'ownerDiscount' });\n    return;\n  }\n  const tData = tablesCarts[activeHall][activeTable];\n  tData.ownerMode = !tData.ownerMode;\n  saveTablesCarts();\n  renderCart();\n}\ndocument.getElementById('ownerToggleD').addEventListener('click', toggleOwnerMode);\ndocument.getElementById('ownerToggleM').addEventListener('click', toggleOwnerMode);\n\n/* ============ CHECKOUT / CLOSE TABLE BILL ============ */\nasync function checkout(paymentMethod='cash'){\n  const tData = tablesCarts[activeHall][activeTable];\n  if(tData.items.length===0) return;\n\n  const activeShift = getOpenShift();\n  if(!activeShift){\n    closeSheet();\n    showToast('من فضلك افتح الوردية وسجّل العهدة أولاً');\n    openShiftModal();\n    return;\n  }\n\n  const isOwner = tData.ownerMode;\n  const T = computeCheckTotals();\n  if(T.isDelivery && !T.address && !(T.customer && T.customer.phone)){\n    closeSheet();\n    showToast('الدليفري محتاج عنوان أو عميل برقم موبايل');\n    openOrderInfoModal();\n    return;\n  }\n  const subTotal = T.sub;\n  const discount = r2(T.manualDisc + T.ptsDisc);\n  const finalTotal = T.grand;\n  const notes = tData.notes || \"\";\n\n  const order = {\n    id: Date.now(),\n    hall: hallShortName(activeHall),\n    tableNumber: activeTable,\n    tableName: tableDisplayLabel(activeHall, activeTable),\n    time: new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}),\n    items: tData.items.map(i=>({name:i.name, price:i.price, qty:i.qty})),\n    subTotal: subTotal,\n    discount: discount,\n    notes: notes,\n    total: finalTotal,\n    owner: isOwner,\n    paymentMethod: isOwner ? 'owner' : paymentMethod,\n    shiftId: activeShift.id,\n    cashier: currentCashier || ''\n  };\n  Object.assign(order, orderExtraFields(T));\n  if(isOwner){ delete order.pointsRedeemed; delete order.pointsDiscount; delete order.pointsEarned; }\n  const invNo = takeInvoiceNumber();\n  if(invNo) order.invoiceNo = invNo;\n  applyOrderToCustomer(order);\n\n  dayData.orders.push(order);\n  saveDay();\n  deductInventoryForOrder(order);\n  cloudSync('syncOrder', order, dayData.id, dayData.dateKey);\n\n  // تصفير شيك الترابيزة الحالية بعد التحصيل\n  tablesCarts[activeHall][activeTable] = { items: [], discount: 0, notes: \"\", ownerMode: false, printedBon: {}, label: tablesCarts[activeHall][activeTable].label || null, openedAt: null };\n  saveTablesCarts();\n  \n  renderAll();\n  updateDayPill();\n  updateShiftPill();\n  closeSheet();\n\n  const drawerSettings = getDrawerSettings();\n  if(!isOwner && paymentMethod === 'cash' && drawerSettings.autoOpen !== false) openCashDrawer(true);\n\n  showToast(isOwner\n    ? `تم إغلاق شيك ${order.tableName} كخصم مالك — ${fmt(order.total)} ج.م`\n    : `تم تحصيل شيك ${order.tableName} عبر ${paymentMethod === 'instapay' ? 'إنستا باي' : 'النقدية'} بنجاح — ${fmtMoney(order.total)} ج.م${order.pointsEarned ? ' — اكتسب العميل '+order.pointsEarned+' نقطة' : ''}`);\n\n  const wantsPrint = await customConfirm('هل تريد طباعة إيصال للعميل؟', 'طباعة الإيصال', 'طباعة الإيصال');\n  if(wantsPrint) printReceipt(order);\n}\n\n/* ============ ADMIN PANEL (LOGIN & PRICE EDITING) ============ */\nconst ADMIN_PASSWORD_KEY = 'beans_admin_password';\nfunction getAdminPassword(){\n  return localStorage.getItem(ADMIN_PASSWORD_KEY) || '1';\n}\nfunction setAdminPassword(pass){\n  localStorage.setItem(ADMIN_PASSWORD_KEY, pass);\n}\nconst adminModalOverlay = document.getElementById('adminModalOverlay');\nlet adminTabAfterLogin = 'menu';\nfunction showCustomersDirectly(){\n  document.getElementById('adminLoginBox').style.display = 'none';\n  document.getElementById('adminEditBox').style.display = 'block';\n  document.querySelector('.admin-tabs').style.display = 'none';\n  document.querySelector('#adminEditBox > .sub-note').style.display = 'none';\n  adminModalOverlay.querySelector('h2').textContent = 'إدارة العملاء';\n  setAdminTab('customers');\n  renderCustomersAdmin();\n}\nfunction setAdminTab(tabName){\n  document.querySelectorAll('[data-admin-panel]').forEach(panel=>{\n    panel.hidden = panel.dataset.adminPanel !== tabName;\n  });\n  document.querySelectorAll('[data-admin-tab]').forEach(tab=>{\n    const isActive = tab.dataset.adminTab === tabName;\n    tab.classList.toggle('active', isActive);\n    tab.setAttribute('aria-selected', isActive ? 'true' : 'false');\n  });\n}\ndocument.querySelectorAll('[data-admin-tab]').forEach(tab=>{\n  tab.addEventListener('click', ()=>setAdminTab(tab.dataset.adminTab));\n});\nfunction openAdminForTab(tabName){\n  adminTabAfterLogin = tabName;\n  if(window.electronAPI){\n    window.electronAPI.openWindow(tabName === 'customers' ? 'customers' : 'admin');\n    return;\n  }\n  if(tabName === 'customers'){\n    showCustomersDirectly();\n    adminModalOverlay.classList.add('show');\n    return;\n  }\n  document.querySelector('.admin-tabs').style.display = '';\n  document.querySelector('#adminEditBox > .sub-note').style.display = '';\n  adminModalOverlay.querySelector('h2').textContent = 'لوحة الإعدادات';\n  document.getElementById('adminPasswordInput').value = '';\n  document.getElementById('adminLoginBox').style.display = 'block';\n  document.getElementById('adminEditBox').style.display = 'none';\n  setAdminTab('menu');\n  adminModalOverlay.classList.add('show');\n}\ndocument.getElementById('adminBtn').addEventListener('click', () => openAdminForTab('menu'));\ndocument.getElementById('customersBtn').addEventListener('click', () => openAdminForTab('customers'));\ndocument.getElementById('adminModalClose').addEventListener('click', () => adminModalOverlay.classList.remove('show'));\nadminModalOverlay.addEventListener('click', (e) => { if(e.target===adminModalOverlay && !document.body.classList.contains('standalone-page')) adminModalOverlay.classList.remove('show'); });\n\ndocument.getElementById('adminLoginBtn').addEventListener('click', () => {\n  const pass = document.getElementById('adminPasswordInput').value;\n  if(window.__BEANS_DEMO_ANY_PW || pass === getAdminPassword()){\n    document.getElementById('adminLoginBox').style.display = 'none';\n    document.getElementById('adminEditBox').style.display = 'block';\n    const requestedTab = adminTabAfterLogin;\n    setAdminTab(requestedTab);\n    populateNewItemCatSelect();\n    renderAdminItemsList();\n    renderAdminHallsList();\n    populateRenameTableSelects();\n    renderAdminCatsList();\n    loadDrawerSettingsForm();\n    loadInstapayBtnSettingForm();\n    loadAccounts();\n    renderAdminCashierAccountsList();\n    showToast('تم تسجيل دخول الأدمن بنجاح');\n  } else {\n    showToast('كلمة المرور غير صحيحة!');\n  }\n});\n\nfunction populateNewItemCatSelect(){\n  const sel = document.getElementById('newItemCat');\n  const selectedCat = sel.value;\n  sel.replaceChildren(...MENU.map(c=>new Option(c.label, c.cat)));\n  if(MENU.some(c=>c.cat === selectedCat)) sel.value = selectedCat;\n  else if(MENU.length) sel.value = MENU[0].cat;\n  populateNewItemGroupSelect();\n}\n\nfunction populateNewItemGroupSelect(){\n  const catSel = document.getElementById('newItemCat');\n  const groupSel = document.getElementById('newItemGroup');\n  const customGroupInput = document.getElementById('newItemCustomGroup');\n  const cat = MENU.find(c=>c.cat === catSel.value);\n  const selectedGroup = groupSel.value;\n  const groups = cat ? cat.groups : [];\n\n  groupSel.replaceChildren(\n    new Option('اختاري مجموعة فرعية (اختياري)', ''),\n    ...groups.map(group=>new Option(group.g, group.g)),\n    new Option('＋ إضافة مجموعة جديدة', '__new_group__')\n  );\n  if(groups.some(group=>group.g === selectedGroup)) groupSel.value = selectedGroup;\n  else groupSel.value = '';\n  customGroupInput.style.display = groupSel.value === '__new_group__' ? '' : 'none';\n}\n\ndocument.getElementById('newItemCat').addEventListener('change', populateNewItemGroupSelect);\ndocument.getElementById('newItemGroup').addEventListener('change', ()=>{\n  const customGroupInput = document.getElementById('newItemCustomGroup');\n  const isCustomGroup = document.getElementById('newItemGroup').value === '__new_group__';\n  customGroupInput.style.display = isCustomGroup ? '' : 'none';\n  if(!isCustomGroup) customGroupInput.value = '';\n});\n\nfunction renderAdminItemsList(){\n  const listEl = document.getElementById('adminItemsList');\n  let html = '';\n  MENU.forEach((cat, catIdx) => {\n    cat.groups.forEach((g, gIdx) => {\n      g.items.forEach(([name, price, img], itemIdx) => {\n        html += `\n          <div class=\"admin-item-row\" data-name=\"${escapeHtml(name.toLowerCase())}\">\n            ${img?`<img class=\"admin-item-thumb\" src=\"${img}\" alt=\"\">`:`<div class=\"admin-item-thumb-empty\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h3l2-3h6l2 3h3v12H4z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/><\/svg><\/div>`}\n            <span>${bnIcon(cat.emoji)} ${name} <small style=\"color:var(--muted)\">(${cat.label} — ${g.g})<\/small><\/span>\n            <input type=\"text\" class=\"barcode-edit-input\" data-name=\"${escapeHtml(name)}\" value=\"${escapeHtml(getBarcodeFor(name))}\" placeholder=\"باركود\" title=\"باركود الصنف\">\n            <input type=\"number\" class=\"price-edit-input\" data-cat=\"${catIdx}\" data-group=\"${gIdx}\" data-item=\"${itemIdx}\" value=\"${price}\">\n            <button type=\"button\" class=\"admin-item-img-btn\" data-cat=\"${catIdx}\" data-group=\"${gIdx}\" data-item=\"${itemIdx}\" title=\"تغيير الصورة\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><circle cx=\"9\" cy=\"10\" r=\"2\"/><path d=\"M21 16l-5-5-8 8\"/><\/svg><\/button>\n            <button type=\"button\" class=\"admin-item-del\" data-cat=\"${catIdx}\" data-group=\"${gIdx}\" data-item=\"${itemIdx}\" title=\"حذف الصنف\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg><\/button>\n          <\/div>`;\n      });\n    });\n  });\n  listEl.innerHTML = html;\n  filterAdminItemsList();\n\n  listEl.querySelectorAll('.price-edit-input').forEach(input => {\n    input.addEventListener('input', (e) => {\n      const cIdx = parseInt(e.target.dataset.cat);\n      const gIdx = parseInt(e.target.dataset.group);\n      const iIdx = parseInt(e.target.dataset.item);\n      const newPrice = parseFloat(e.target.value) || 0;\n\n      MENU[cIdx].groups[gIdx].items[iIdx][1] = newPrice;\n      // حفظ التعديلات محلياً لتبقى محفوظة للأبد\n      localStorage.setItem('beans_menu', JSON.stringify(MENU));\n      cloudSync('syncMenu', MENU);\n      renderGrid(searchInput.value);\n    });\n  });\n\n  const adminItemImgInput = document.getElementById('adminItemImgInput');\n  listEl.querySelectorAll('.admin-item-img-btn').forEach(btn => {\n    btn.addEventListener('click', () => {\n      adminItemImgInput.dataset.cat = btn.dataset.cat;\n      adminItemImgInput.dataset.group = btn.dataset.group;\n      adminItemImgInput.dataset.item = btn.dataset.item;\n      adminItemImgInput.value = '';\n      adminItemImgInput.click();\n    });\n  });\n\n  listEl.querySelectorAll('.admin-item-del').forEach(btn => {\n    btn.addEventListener('click', async () => {\n      const cIdx = parseInt(btn.dataset.cat);\n      const gIdx = parseInt(btn.dataset.group);\n      const iIdx = parseInt(btn.dataset.item);\n      const item = MENU[cIdx].groups[gIdx].items[iIdx];\n      const ok = await customConfirm(`هل أنت متأكد من حذف \"${item[0]}\" نهائياً من المنيو؟`, 'حذف صنف', 'حذف');\n      if(!ok) return;\n      MENU[cIdx].groups[gIdx].items.splice(iIdx, 1);\n      if(MENU[cIdx].groups[gIdx].items.length === 0){\n        MENU[cIdx].groups.splice(gIdx, 1);\n      }\n      localStorage.setItem('beans_menu', JSON.stringify(MENU));\n      cloudSync('syncMenu', MENU);\n      renderAdminItemsList();\n      renderGrid(searchInput.value);\n      showToast('تم حذف الصنف من المنيو');\n    });\n  });\n}\n\nfunction filterAdminItemsList(){\n  const searchEl = document.getElementById('adminItemsSearch');\n  if(!searchEl) return;\n  const term = searchEl.value.trim().toLowerCase();\n  document.querySelectorAll('#adminItemsList .admin-item-row').forEach(row=>{\n    const name = row.dataset.name || '';\n    row.style.display = (!term || name.includes(term)) ? '' : 'none';\n  });\n}\ndocument.getElementById('adminItemsSearch').addEventListener('input', filterAdminItemsList);\n\nfunction fileToDataUrl(file){\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => resolve(reader.result);\n    reader.onerror = reject;\n    reader.readAsDataURL(file);\n  });\n}\n\ndocument.getElementById('adminItemImgInput').addEventListener('change', async (e) => {\n  const file = e.target.files[0];\n  if(!file) return;\n  const cIdx = parseInt(e.target.dataset.cat);\n  const gIdx = parseInt(e.target.dataset.group);\n  const iIdx = parseInt(e.target.dataset.item);\n  try{\n    const dataUrl = await fileToDataUrl(file);\n    MENU[cIdx].groups[gIdx].items[iIdx][2] = dataUrl;\n    localStorage.setItem('beans_menu', JSON.stringify(MENU));\n    cloudSync('syncMenu', MENU);\n    renderAdminItemsList();\n    renderGrid(searchInput.value);\n    showToast('تم تحديث صورة الصنف');\n  }catch(err){\n    showToast('تعذر تحميل الصورة');\n  }\n});\n\nlet newItemImgData = null;\nconst newItemImgInput = document.getElementById('newItemImgInput');\nconst newItemImgPreview = document.getElementById('newItemImgPreview');\nconst newItemImgClear = document.getElementById('newItemImgClear');\nnewItemImgInput.addEventListener('change', async (e) => {\n  const file = e.target.files[0];\n  if(!file) return;\n  try{\n    newItemImgData = await fileToDataUrl(file);\n    newItemImgPreview.src = newItemImgData;\n    newItemImgPreview.style.display = 'block';\n    newItemImgClear.style.display = 'inline-block';\n  }catch(err){\n    showToast('تعذر تحميل الصورة');\n  }\n});\nnewItemImgClear.addEventListener('click', () => {\n  newItemImgData = null;\n  newItemImgInput.value = '';\n  newItemImgPreview.style.display = 'none';\n  newItemImgClear.style.display = 'none';\n});\n\ndocument.getElementById('addNewItemBtn').addEventListener('click', () => {\n  const catVal = document.getElementById('newItemCat').value;\n  const selectedGroup = document.getElementById('newItemGroup').value;\n  let groupName = selectedGroup === '__new_group__'\n    ? document.getElementById('newItemCustomGroup').value.trim()\n    : selectedGroup;\n  const name = document.getElementById('newItemName').value.trim();\n  const price = parseFloat(document.getElementById('newItemPrice').value);\n\n  if(!name){ showToast('من فضلك اكتب اسم الصنف'); return; }\n  if(isNaN(price) || price < 0){ showToast('من فضلك اكتب سعر صحيح'); return; }\n\n  const cat = MENU.find(c => c.cat === catVal);\n  if(!cat){ showToast('حصل خطأ في اختيار القسم'); return; }\n  if(selectedGroup === '__new_group__' && !groupName){ showToast('من فضلك اكتبي اسم المجموعة الجديدة'); return; }\n\n  if(!groupName) groupName = cat.groups[0] ? cat.groups[0].g : 'أصناف أخرى';\n  let group = cat.groups.find(g => g.g === groupName);\n  if(!group){\n    group = { g: groupName, items: [] };\n    cat.groups.push(group);\n  }\n  group.items.push([name, price, newItemImgData || null]);\n  const newBarcode = document.getElementById('newItemBarcode').value.trim();\n  if(newBarcode){\n    const bres = setBarcodeFor(name, newBarcode);\n    if(bres.error) showToast(bres.error);\n  }\n  document.getElementById('newItemBarcode').value = '';\n  localStorage.setItem('beans_menu', JSON.stringify(MENU));\n  cloudSync('syncMenu', MENU);\n\n  document.getElementById('newItemGroup').value = '';\n  document.getElementById('newItemCustomGroup').value = '';\n  document.getElementById('newItemCustomGroup').style.display = 'none';\n  populateNewItemGroupSelect();\n  document.getElementById('newItemName').value = '';\n  document.getElementById('newItemPrice').value = '';\n  newItemImgData = null;\n  newItemImgInput.value = '';\n  newItemImgPreview.style.display = 'none';\n  newItemImgClear.style.display = 'none';\n\n  renderAdminItemsList();\n  renderGrid(searchInput.value);\n  showToast(`تم إضافة \"${name}\" للمنيو بنجاح`);\n});\n\n/* ============ ADMIN: إدارة الصالات والترابيزات ============ */\nfunction renderAdminHallsList(){\n  const el = document.getElementById('adminHallsList');\n  if(!el) return;\n  el.innerHTML = HALLS.map((h, idx) => `\n    <div class=\"admin-item-row\">\n      <input type=\"text\" class=\"hall-name-input\" data-idx=\"${idx}\" value=\"${h.name}\" style=\"flex:1; min-width:90px;\">\n      <button type=\"button\" class=\"admin-item-img-btn hall-dec-btn\" data-idx=\"${idx}\" title=\"تقليل ترابيزة\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14\"/><\/svg><\/button>\n      <span style=\"min-width:70px; text-align:center; font-weight:800; color:var(--gold-bright);\">${h.tableCount} ترابيزة<\/span>\n      <button type=\"button\" class=\"admin-item-img-btn hall-inc-btn\" data-idx=\"${idx}\" title=\"زيادة ترابيزة\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/button>\n      <button type=\"button\" class=\"admin-item-del hall-del-btn\" data-idx=\"${idx}\" title=\"حذف الصالة\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg><\/button>\n    <\/div>`).join('');\n\n  el.querySelectorAll('.hall-name-input').forEach(inp=>{\n    inp.addEventListener('change', ()=>{\n      const idx = parseInt(inp.dataset.idx);\n      const val = inp.value.trim();\n      if(!val){ inp.value = HALLS[idx].name; return; }\n      HALLS[idx].name = val;\n      saveHalls();\n      renderHallTabs(); renderTablesBar(); populateRenameTableSelects();\n      showToast('تم تعديل اسم الصالة');\n    });\n  });\n  el.querySelectorAll('.hall-inc-btn').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      const idx = parseInt(btn.dataset.idx);\n      HALLS[idx].tableCount++;\n      saveHalls(); ensureTablesCartsShape(); saveTablesCarts();\n      renderAdminHallsList(); renderTablesBar(); populateRenameTableSelects();\n    });\n  });\n  el.querySelectorAll('.hall-dec-btn').forEach(btn=>{\n    btn.addEventListener('click', async ()=>{\n      const idx = parseInt(btn.dataset.idx);\n      const h = HALLS[idx];\n      if(h.tableCount<=1){ showToast('لازم يفضل ترابيزة واحدة على الأقل في الصالة'); return; }\n      const lastTable = tablesCarts[h.id] && tablesCarts[h.id][h.tableCount];\n      if(lastTable && lastTable.items.length>0){\n        const ok = await customConfirm(`آخر ترابيزة في \"${h.name}\" فيها شيك مفتوح. هل أنت متأكد من حذفها؟ هيتم فقد الشيك.`, 'حذف ترابيزة', 'حذف');\n        if(!ok) return;\n      }\n      if(tablesCarts[h.id]) delete tablesCarts[h.id][h.tableCount];\n      h.tableCount--;\n      if(activeHall===h.id && activeTable>h.tableCount) activeTable = 1;\n      saveHalls(); saveTablesCarts();\n      renderAdminHallsList(); renderTablesBar(); populateRenameTableSelects();\n    });\n  });\n  el.querySelectorAll('.hall-del-btn').forEach(btn=>{\n    btn.addEventListener('click', async ()=>{\n      const idx = parseInt(btn.dataset.idx);\n      const h = HALLS[idx];\n      if(HALLS.length<=1){ showToast('لازم يفضل صالة واحدة على الأقل'); return; }\n      const ok = await customConfirm(`هل أنت متأكد من حذف صالة \"${h.name}\" بكل ترابيزاتها؟`, 'حذف صالة', 'حذف');\n      if(!ok) return;\n      HALLS.splice(idx,1);\n      delete tablesCarts[h.id];\n      if(activeHall===h.id){ activeHall = HALLS[0].id; activeTable = 1; }\n      saveHalls(); saveTablesCarts();\n      renderAdminHallsList(); renderHallTabs(); renderTablesBar(); populateRenameTableSelects();\n      showToast('تم حذف الصالة');\n    });\n  });\n}\n\ndocument.getElementById('addHallBtn').addEventListener('click', ()=>{\n  const nameInp = document.getElementById('newHallName');\n  const countInp = document.getElementById('newHallTables');\n  const name = nameInp.value.trim();\n  const count = parseInt(countInp.value) || 0;\n  if(!name){ showToast('من فضلك اكتب اسم الصالة'); return; }\n  if(count<1){ showToast('من فضلك حددي عدد ترابيزات صحيح'); return; }\n  const id = nextHallId();\n  HALLS.push({id, name, tableCount:count});\n  saveHalls(); ensureTablesCartsShape(); saveTablesCarts();\n  nameInp.value = ''; countInp.value = '5';\n  renderAdminHallsList(); renderHallTabs(); renderTablesBar(); populateRenameTableSelects();\n  showToast(`تم إضافة صالة \"${name}\" بنجاح`);\n});\n\nfunction populateRenameTableSelects(){\n  const hallSel = document.getElementById('renameTableHallSel');\n  const numSel = document.getElementById('renameTableNumSel');\n  if(!hallSel || !numSel) return;\n  hallSel.innerHTML = HALLS.map(h=>`<option value=\"${h.id}\">${h.name}<\/option>`).join('');\n  function fillNums(){\n    const h = getHall(hallSel.value);\n    const count = h ? h.tableCount : 0;\n    let opts = '';\n    for(let i=1;i<=count;i++) opts += `<option value=\"${i}\">ترابيزة ${i}<\/option>`;\n    numSel.innerHTML = opts;\n  }\n  hallSel.onchange = fillNums;\n  fillNums();\n}\ndocument.getElementById('renameTableBtn').addEventListener('click', ()=>{\n  const hallId = document.getElementById('renameTableHallSel').value;\n  const num = parseInt(document.getElementById('renameTableNumSel').value);\n  const newLabel = document.getElementById('renameTableInput').value.trim();\n  if(!hallId || !num || !tablesCarts[hallId] || !tablesCarts[hallId][num]) return;\n  tablesCarts[hallId][num].label = newLabel || null;\n  saveTablesCarts();\n  renderTablesBar();\n  document.getElementById('renameTableInput').value = '';\n  showToast('تم حفظ اسم الترابيزة');\n});\n\n/* ============ ADMIN: إدارة أقسام ومجموعات المنيو ============ */\nfunction renderAdminCatsList(){\n  const el = document.getElementById('adminCatsList');\n  if(!el) return;\n  let html = '';\n  MENU.forEach((cat, cIdx) => {\n    html += `\n      <div class=\"admin-item-row\" style=\"flex-wrap:wrap;\">\n        <button type=\"button\" class=\"cat-emoji-input bn-ic-btn\" data-cat=\"${cIdx}\" data-icon=\"${cat.emoji}\" title=\"اضغط لتغيير الأيقونة\">${bnIcon(cat.emoji)}<\/button>\n        <input type=\"text\" class=\"cat-name-input\" data-cat=\"${cIdx}\" value=\"${cat.label}\" style=\"flex:1; min-width:120px;\">\n        <button type=\"button\" class=\"admin-item-del cat-del-btn\" data-cat=\"${cIdx}\" title=\"حذف القسم\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg> حذف القسم<\/button>\n      <\/div>`;\n    cat.groups.forEach((g, gIdx) => {\n      html += `\n        <div class=\"admin-item-row\" style=\"padding-inline-start:24px; background:var(--surface-2);\">\n          <span style=\"font-size:12px; color:var(--muted);\"> مجموعة:<\/span>\n          <input type=\"text\" class=\"grp-name-input\" data-cat=\"${cIdx}\" data-group=\"${gIdx}\" value=\"${g.g}\" style=\"flex:1; min-width:120px;\">\n          <button type=\"button\" class=\"admin-item-del grp-del-btn\" data-cat=\"${cIdx}\" data-group=\"${gIdx}\" title=\"حذف المجموعة\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg><\/button>\n        <\/div>`;\n    });\n  });\n  el.innerHTML = html;\n\n  el.querySelectorAll('.cat-emoji-input').forEach(inp=>{\n    inp.addEventListener('change', ()=>{\n      MENU[parseInt(inp.dataset.cat)].emoji = inp.dataset.icon || 'ic:plate';\n      localStorage.setItem('beans_menu', JSON.stringify(MENU));\n      cloudSync('syncMenu', MENU);\n      renderTabs(); renderGrid(searchInput.value); renderAdminCatsList(); populateNewItemCatSelect();\n    });\n  });\n  el.querySelectorAll('.cat-name-input').forEach(inp=>{\n    inp.addEventListener('change', ()=>{\n      const val = inp.value.trim();\n      const idx = parseInt(inp.dataset.cat);\n      if(!val){ inp.value = MENU[idx].label; return; }\n      MENU[idx].label = val;\n      localStorage.setItem('beans_menu', JSON.stringify(MENU));\n      cloudSync('syncMenu', MENU);\n      renderTabs(); renderGrid(searchInput.value); populateNewItemCatSelect();\n      showToast('تم تعديل اسم القسم');\n    });\n  });\n  el.querySelectorAll('.cat-del-btn').forEach(btn=>{\n    btn.addEventListener('click', async ()=>{\n      const idx = parseInt(btn.dataset.cat);\n      if(MENU.length<=1){ showToast('لازم يفضل قسم واحد على الأقل في المنيو'); return; }\n      const ok = await customConfirm(`هل أنت متأكد من حذف قسم \"${MENU[idx].label}\" بكل مجموعاته وأصنافه؟`, 'حذف قسم', 'حذف');\n      if(!ok) return;\n      MENU.splice(idx,1);\n      localStorage.setItem('beans_menu', JSON.stringify(MENU));\n      cloudSync('syncMenu', MENU);\n      if(activeCat === MENU[idx] && MENU[0]) activeCat = MENU[0].cat;\n      renderTabs(); renderGrid(searchInput.value); renderAdminCatsList(); populateNewItemCatSelect();\n      showToast('تم حذف القسم');\n    });\n  });\n  el.querySelectorAll('.grp-name-input').forEach(inp=>{\n    inp.addEventListener('change', ()=>{\n      const cIdx = parseInt(inp.dataset.cat), gIdx = parseInt(inp.dataset.group);\n      const val = inp.value.trim();\n      if(!val){ inp.value = MENU[cIdx].groups[gIdx].g; return; }\n      MENU[cIdx].groups[gIdx].g = val;\n      localStorage.setItem('beans_menu', JSON.stringify(MENU));\n      cloudSync('syncMenu', MENU);\n      renderGrid(searchInput.value); renderAdminItemsList();\n      showToast('تم تعديل اسم المجموعة');\n    });\n  });\n  el.querySelectorAll('.grp-del-btn').forEach(btn=>{\n    btn.addEventListener('click', async ()=>{\n      const cIdx = parseInt(btn.dataset.cat), gIdx = parseInt(btn.dataset.group);\n      const g = MENU[cIdx].groups[gIdx];\n      const ok = await customConfirm(`هل أنت متأكد من حذف مجموعة \"${g.g}\" بكل أصنافها (${g.items.length} صنف)؟`, 'حذف مجموعة', 'حذف');\n      if(!ok) return;\n      MENU[cIdx].groups.splice(gIdx,1);\n      localStorage.setItem('beans_menu', JSON.stringify(MENU));\n      cloudSync('syncMenu', MENU);\n      renderGrid(searchInput.value); renderAdminItemsList(); renderAdminCatsList();\n      showToast('تم حذف المجموعة');\n    });\n  });\n}\n\ndocument.getElementById('addCatBtn').addEventListener('click', ()=>{\n  const emojiInp = document.getElementById('newCatEmoji');\n  const nameInp = document.getElementById('newCatName');\n  const name = nameInp.value.trim();\n  if(!name){ showToast('من فضلك اكتب اسم القسم'); return; }\n  const emoji = emojiInp.dataset.icon || 'ic:plate';\n  let catId = 'cat_' + Date.now();\n  MENU.push({cat:catId, label:name, emoji, groups:[]});\n  localStorage.setItem('beans_menu', JSON.stringify(MENU));\n  cloudSync('syncMenu', MENU);\n  nameInp.value = ''; emojiInp.dataset.icon = 'ic:plate'; emojiInp.innerHTML = bnIcon('ic:plate');\n  renderTabs(); renderGrid(searchInput.value); renderAdminCatsList(); populateNewItemCatSelect();\n  showToast(`تم إضافة قسم \"${name}\" بنجاح`);\n});\n\n/* ============ DAY MODAL ============ */\nlet salesUnlocked = false;\nfunction updateDayPill(){\n  const paidTotal = dayData.orders.filter(o=>!o.owner).reduce((s,o)=>s+o.total,0);\n  document.getElementById('dayTotalLbl').textContent = salesUnlocked ? (fmt(paidTotal)+' ج.م') : '••••';\n}\n\nfunction shiftCardHtml(shift, idx){\n  const openedTime = new Date(shift.openedAt).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});\n  if(shift.status === 'open'){\n    const sales = shiftSales(shift);\n    const expenses = shiftExpenses(shift);\n    const expected = shiftExpectedCash(shift);\n    return `<div class=\"shift-card\">\n      <div class=\"sc-top\"><span class=\"sc-title\">وردية #${idx} — فتحت ${openedTime}<\/span><span class=\"sc-badge open\">مفتوحة<\/span><\/div>\n      <div class=\"variance-row\"><span class=\"k\">الكاشير<\/span><span class=\"v\">${shift.cashierName || '-'}<\/span><\/div>\n      <div class=\"variance-row\"><span class=\"k\">عهدة البداية<\/span><span class=\"v\">${fmt(shift.openingCash)} ج.م<\/span><\/div>\n      <div class=\"variance-row\"><span class=\"k\">مبيعات كاش حتى الآن<\/span><span class=\"v\">${fmt(sales)} ج.م<\/span><\/div>\n      <div class=\"variance-row\"><span class=\"k\">مصروفات الوردية<\/span><span class=\"v neg\">- ${fmt(expenses)} ج.م<\/span><\/div>\n      <div class=\"variance-row\"><span class=\"k\">المطلوب في الدرج الآن<\/span><span class=\"v\">${fmt(expected)} ج.م<\/span><\/div>\n    <\/div>`;\n  }\n  const closedTime = new Date(shift.closedAt).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});\n  const vCls = shift.variance === 0 ? '' : (shift.variance > 0 ? 'pos' : 'neg');\n  const vLabel = shift.variance === 0 ? 'مطابق' : (shift.variance > 0 ? `فائض ${fmt(shift.variance)} ج.م` : `عجز ${fmt(Math.abs(shift.variance))} ج.م`);\n  const cashierLabel = (shift.closedByCashier && shift.cashierName && shift.closedByCashier !== shift.cashierName)\n    ? `${shift.cashierName} (قفلها ${shift.closedByCashier})`\n    : (shift.cashierName || shift.closedByCashier || '-');\n  const shiftExp = shiftExpenses(shift);\n  return `<div class=\"shift-card\">\n    <div class=\"sc-top\"><span class=\"sc-title\">وردية #${idx} — ${openedTime} إلى ${closedTime}<\/span><span class=\"sc-badge closed\">مغلقة<\/span><\/div>\n    <div class=\"variance-row\"><span class=\"k\">الكاشير<\/span><span class=\"v\">${cashierLabel}<\/span><\/div>\n    <div class=\"variance-row\"><span class=\"k\">عهدة البداية<\/span><span class=\"v\">${fmt(shift.openingCash)} ج.م<\/span><\/div>\n    <div class=\"variance-row\"><span class=\"k\">مصروفات الوردية<\/span><span class=\"v neg\">- ${fmt(shiftExp)} ج.م<\/span><\/div>\n    <div class=\"variance-row\"><span class=\"k\">النقدية المطلوبة<\/span><span class=\"v\">${fmt(shift.expectedCash)} ج.م<\/span><\/div>\n    <div class=\"variance-row\"><span class=\"k\">النقدية الفعلية المعدودة<\/span><span class=\"v\">${fmt(shift.countedCash)} ج.م<\/span><\/div>\n    <div class=\"variance-row\"><span class=\"k\">الفرق (عجز/فائض)<\/span><span class=\"v ${vCls}\">${vLabel}<\/span><\/div>\n  <\/div>`;\n}\nfunction renderShiftsBlock(shifts, containerId){\n  const el = document.getElementById(containerId);\n  if(!shifts || shifts.length===0){\n    el.innerHTML = `<div class=\"empty-line\">لم يتم فتح أي وردية<\/div>`;\n  } else {\n    el.innerHTML = shifts.map((s,idx)=>shiftCardHtml(s, idx+1)).join('');\n  }\n}\n// حالة \"تحديد متعدد\" لكل قايمة فواتير (المبيعات الحالية / تفاصيل يوم من التقويم)\nconst orderListState = {\n  orderList: { selectMode:false, selected:new Set() },\n  detailOrderList: { selectMode:false, selected:new Set() }\n};\nconst ORDER_TOOLBAR_IDS = {\n  orderList: { toggle:'orderSelectToggleBtn', bulk:'orderDeleteSelectedBtn', cancel:'orderSelectCancelBtn', count:'orderSelectCountLbl' },\n  detailOrderList: { toggle:'detailOrderSelectToggleBtn', bulk:'detailOrderDeleteSelectedBtn', cancel:'detailOrderSelectCancelBtn', count:'detailOrderSelectCountLbl' }\n};\nfunction ordersListHtml(orders, canDelete, state){\n  if(orders.length===0){\n    return `<div class=\"empty-line\">لا توجد فواتير<\/div>`;\n  }\n  const selectMode = !!(canDelete && state && state.selectMode);\n  return orders.slice().reverse().map((o,idx)=>{\n    const num = orders.length - idx;\n    const itemsStr = o.items.map(i=>`${i.name} ×${i.qty}`).join('، ');\n    const badge = o.owner\n      ? `<span class=\"owner-badge\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 12V4h8l10 10-8 8z\"/><circle cx=\"7.5\" cy=\"8.5\" r=\"1.5\"/><\/svg> أونر<\/span>`\n      : ((o.paymentMethod || 'cash') === 'instapay' ? `<span class=\"owner-badge\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"6\" y=\"2.5\" width=\"12\" height=\"19\" rx=\"2.5\"/><path d=\"M11 18.5h2\"/><\/svg> إنستا باي<\/span>` : `<span class=\"owner-badge\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"2.5\" y=\"6\" width=\"19\" height=\"12\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><path d=\"M6 9v.01M18 15v.01\"/><\/svg> كاش<\/span>`);\n    const discStr = o.discount > 0 ? ` | خصم: ${o.discount} ج.م` : '';\n    const notesStr = o.notes ? ` | ملاحظات: ${o.notes}` : '';\n    const checked = (state && state.selected.has(String(o.id))) ? 'checked' : '';\n    const checkboxHtml = selectMode ? `<input type=\"checkbox\" class=\"order-select-chk\" data-oid=\"${o.id}\" ${checked}>` : '';\n    const reprintBtn = !selectMode ? `<button type=\"button\" class=\"reprint-btn\" data-oid=\"${o.id}\" title=\"إعادة طباعة إيصال العميل\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 9V3h10v6\"/><rect x=\"4\" y=\"9\" width=\"16\" height=\"8\" rx=\"2\"/><path d=\"M7 14h10v7H7z\"/><\/svg><\/button>` : '';\n    const deleteBtn = (canDelete && !selectMode) ? `<button type=\"button\" class=\"delete-order-btn\" data-oid=\"${o.id}\" title=\"حذف الفاتورة\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg><\/button>` : '';\n    return `<div class=\"order-row\">\n      <div class=\"top\">\n        <span>${checkboxHtml}${o.tableName} #${num} <span class=\"t\">— ${o.time}<\/span>${badge}<\/span>\n        <span class=\"right-actions\">\n          <span class=\"amt\">${fmt(o.total)} ج.م<\/span>\n          ${reprintBtn}\n          ${deleteBtn}\n        <\/span>\n      <\/div>\n      <div class=\"items-str\">${itemsStr}${discStr}${notesStr}<\/div>\n    <\/div>`;\n  }).join('');\n}\nfunction updateOrderSelectToolbar(containerId, canDelete, orders){\n  const ids = ORDER_TOOLBAR_IDS[containerId];\n  if(!ids) return;\n  const toggleBtn = document.getElementById(ids.toggle);\n  if(!toggleBtn) return;\n  const bulkBtn = document.getElementById(ids.bulk);\n  const cancelBtn = document.getElementById(ids.cancel);\n  const countLbl = document.getElementById(ids.count);\n  const state = orderListState[containerId];\n  const active = !!(canDelete && state && state.selectMode);\n  toggleBtn.style.display = (canDelete && !active && orders && orders.length>0) ? 'inline-block' : 'none';\n  bulkBtn.style.display = active ? 'inline-block' : 'none';\n  cancelBtn.style.display = active ? 'inline-block' : 'none';\n  countLbl.style.display = active ? 'inline-block' : 'none';\n  if(active){\n    countLbl.textContent = `محدد: ${state.selected.size}`;\n    bulkBtn.textContent = `حذف المحدد (${state.selected.size})`;\n    bulkBtn.disabled = state.selected.size === 0;\n  }\n}\nfunction renderOrdersList(orders, containerId, canDelete){\n  const state = orderListState[containerId];\n  const el = document.getElementById(containerId);\n  el.innerHTML = ordersListHtml(orders, canDelete, state);\n  const selectMode = !!(canDelete && state && state.selectMode);\n  if(!selectMode){\n    el.querySelectorAll('.reprint-btn').forEach(btn=>{\n      btn.addEventListener('click', (e)=>{\n        e.stopPropagation();\n        const order = orders.find(o=>String(o.id)===String(btn.dataset.oid));\n        if(order) printReceipt(order);\n      });\n    });\n  } else {\n    el.querySelectorAll('.order-select-chk').forEach(chk=>{\n      chk.addEventListener('click', (e)=>e.stopPropagation());\n      chk.addEventListener('change', ()=>{\n        const oid = String(chk.dataset.oid);\n        if(chk.checked) state.selected.add(oid); else state.selected.delete(oid);\n        updateOrderSelectToolbar(containerId, canDelete, orders);\n      });\n    });\n  }\n  updateOrderSelectToolbar(containerId, canDelete, orders);\n}\nfunction refreshOrderListUI(){\n  renderOrdersList(dayData.orders, 'orderList', false);\n}\nfunction refreshDetailOrderListUI(){\n  if(!currentDetailDayKey) return;\n  const dObj = mergedDayView(currentDetailDayKey);\n  renderOrdersList(dObj.orders, 'detailOrderList', false);\n}\n// حذف الفواتير (الفردي والمتعدد) بقى من الداشبورد بس — الكاشير مفيهوش حذف فواتير.\n\n// لما تتحذف فاتورة كاش غلط (مفيش فلوس اتقبضت) من وردية اتقفلت، بنشيلها من النقدية المتوقعة والفعلية المخزنة مع بعض\n// عشان العجز/الزيادة يفضل زي ما هو والتقرير يطلع متسق.\nfunction adjustClosedShiftsForRemovedOrders(bd, removedOrders){\n  if(!bd || !bd.shifts) return;\n  const touched = new Set();\n  (removedOrders||[]).forEach(o=>{\n    if(!o || o.owner || (o.paymentMethod || 'cash') !== 'cash') return;\n    const sh = bd.shifts.find(x => x.id === o.shiftId);\n    if(!sh || sh.status !== 'closed') return;\n    const amt = o.total || 0;\n    sh.expectedCash = (sh.expectedCash || 0) - amt;\n    sh.countedCash = (sh.countedCash || 0) - amt;\n    touched.add(sh);\n  });\n  touched.forEach(sh => cloudSync('syncShift', sh, bd.id));\n}\n\n// حذف فاتورة عادية من مبيعات يوم العمل الحالي (المفتوح دلوقتي).\n// (دوال حذف الفواتير اتشالت من الكاشير — الحذف من الداشبورد بس، والكاشير بيشيل الفاتورة تلقائي لما تتحذف من هناك)\n\nfunction expensesListHtml(expenses){\n  if(!expenses || expenses.length===0){\n    return `<div class=\"empty-line\">لا توجد مصروفات مسجلة<\/div>`;\n  }\n  return expenses.slice().reverse().map(e=>{\n    return `<div class=\"order-row\">\n      <div class=\"top\">\n        <span>${expenseCategoryLabel(e.category)} <span class=\"t\">— ${e.time} — ${e.cashierName || '-'}<\/span><\/span>\n        <span class=\"amt\">- ${fmt(e.amount)} ج.م<\/span>\n      <\/div>\n      ${e.note ? `<div class=\"items-str\">${e.note}<\/div>` : ''}\n    <\/div>`;\n  }).join('');\n}\nfunction renderExpensesBlock(expenses, containerId){\n  document.getElementById(containerId).innerHTML = expensesListHtml(expenses);\n}\nfunction renderDayModal(){\n  if(dayData.openedAt){\n    const opened = new Date(dayData.openedAt);\n    const dateLbl = opened.toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});\n    const timeLbl = opened.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});\n    document.getElementById('modalDateLbl').textContent = `يوم عمل بدأ ${dateLbl} — الساعة ${timeLbl}`;\n  } else {\n    document.getElementById('modalDateLbl').textContent = 'لا يوجد يوم عمل مفتوح حالياً — افتح وردية جديدة للبدء';\n  }\n  const paidOrders = dayData.orders.filter(o=>!o.owner);\n  const ownerOrders = dayData.orders.filter(o=>o.owner);\n  const paidTotal = paidOrders.reduce((s,o)=>s+o.total,0);\n  const ownerTotal = ownerOrders.reduce((s,o)=>s+o.total,0);\n  const cashTotal = paidOrders.filter(o=>(o.paymentMethod || 'cash') === 'cash').reduce((s,o)=>s+o.total,0);\n  const instapayTotal = paidOrders.filter(o=>o.paymentMethod === 'instapay').reduce((s,o)=>s+o.total,0);\n  const expensesTotal = dayExpensesTotal();\n  document.getElementById('statOrders').textContent = dayData.orders.length;\n  document.getElementById('statTotal').textContent = fmt(paidTotal);\n  document.getElementById('statOwnerCount').textContent = ownerOrders.length;\n  document.getElementById('statOwnerTotal').textContent = fmt(ownerTotal);\n  document.getElementById('statCashTotal').textContent = fmt(cashTotal);\n  document.getElementById('statInstapayTotal').textContent = fmt(instapayTotal);\n  fillTypeSummary('sum', dayData.orders);\n  document.getElementById('statExpensesTotal').textContent = '- ' + fmt(expensesTotal);\n  document.getElementById('statNetIncome').textContent = fmt(paidTotal - expensesTotal);\n  renderTopItemsList(dayData.orders, 'topItemsList');\n  renderShiftsBlock(dayData.shifts, 'shiftsList');\n  renderExpensesBlock(dayData.expenses, 'dayExpensesList');\n  renderOrdersList(dayData.orders, 'orderList', false);\n}\n\n// ترتيب الأصناف المباعة (من كل الفواتير المدفوعة وأونر) من الأكثر مبيعاً للأقل\nfunction itemsSoldRanking(orders){\n  const map = {};\n  (orders||[]).forEach(o=>{\n    (o.items||[]).forEach(i=>{\n      if(!map[i.name]) map[i.name] = { name:i.name, qty:0, revenue:0 };\n      map[i.name].qty += i.qty;\n      map[i.name].revenue += (i.price||0) * i.qty;\n    });\n  });\n  return Object.values(map).sort((a,b)=> b.qty - a.qty);\n}\n// خريطة اسم الصنف -> اسم القسم (الفئة) بتاعه في المنيو، عشان نقدر نجمّع المبيعات حسب الفئة في التقارير\nfunction buildItemCategoryMap(){\n  const map = {};\n  MENU.forEach(cat=>{\n    (cat.groups||[]).forEach(g=>{\n      (g.items||[]).forEach(([name])=>{ map[name] = cat.label; });\n    });\n  });\n  return map;\n}\n// إجمالي المبيعات مقسّم حسب الفئة (من كل الفواتير المدفوعة وأونر، زي ترتيب الأصناف)\nfunction categorySalesBreakdown(orders){\n  const catMap = buildItemCategoryMap();\n  const totals = {}; // اسم الفئة -> إجمالي المبيعات\n  let grandTotal = 0;\n  (orders||[]).forEach(o=>{\n    (o.items||[]).forEach(i=>{\n      const label = catMap[i.name] || 'أخرى';\n      const amt = (i.price||0) * i.qty;\n      totals[label] = (totals[label]||0) + amt;\n      grandTotal += amt;\n    });\n  });\n  return { totals, grandTotal };\n}\nfunction topItemsListHtml(orders){\n  const ranking = itemsSoldRanking(orders);\n  if(ranking.length===0){\n    return beansEmpty('reports','لا توجد أصناف مباعة بعد','ستظهر هنا بعد أول عملية بيع');\n  }\n  return ranking.map((it, idx)=>{\n    return `<div class=\"order-row\">\n      <div class=\"top\">\n        <span>#${idx+1} ${it.name}<\/span>\n        <span class=\"right-actions\"><span class=\"amt\">${fmtQty(it.qty)} قطعة<\/span><\/span>\n      <\/div>\n      <div class=\"items-str\">إجمالي مبيعات الصنف: ${fmt(it.revenue)} ج.م<\/div>\n    <\/div>`;\n  }).join('');\n}\nfunction renderTopItemsList(orders, containerId){\n  document.getElementById(containerId).innerHTML = topItemsListHtml(orders);\n}\n\n/* ============ MONTH REPORTS (بالتقويم) ============ */\nconst AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];\nconst AR_DOW = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];\nlet monthCursor = null; // {y, m} m is 0-11\nconst pad2 = n => String(n).padStart(2,'0');\n\n// يوم عمل واحد ممكن يمتد لبعد نص الليل، وبيفضل منسوب لتاريخ فتح أول وردية فيه (dateKey).\n// نادراً ممكن يكون فيه أكتر من يوم عمل بنفس تاريخ الفتح (اتقفل الأول وفتح التاني في نفس اليوم)،\n// فبنجمعهم مع بعض لما نعرض تقرير يوم معين في التقويم.\nfunction getBusinessDaysForDate(dateKey){\n  return Object.values(appData.history).filter(bd => bd.dateKey === dateKey);\n}\nfunction mergedDayView(dateKey){\n  const bds = getBusinessDaysForDate(dateKey);\n  return {\n    dateKey,\n    orders: bds.flatMap(bd=>bd.orders),\n    shifts: bds.flatMap(bd=>bd.shifts),\n    expenses: bds.flatMap(bd=>bd.expenses || [])\n  };\n}\nfunction dayTotalFor(dateKey){\n  const bds = getBusinessDaysForDate(dateKey);\n  return bds.reduce((sum,bd)=> sum + bd.orders.filter(o=>!o.owner).reduce((s,o)=>s+o.total,0), 0);\n}\nfunction dayOrdersCountFor(dateKey){\n  return getBusinessDaysForDate(dateKey).reduce((s,bd)=>s+bd.orders.length, 0);\n}\nlet currentDetailDayKey = null;\nfunction renderMonthCalendar(){\n  if(!monthCursor){\n    const now = new Date();\n    monthCursor = { y: now.getFullYear(), m: now.getMonth() };\n  }\n  const { y, m } = monthCursor;\n  document.getElementById('monthTitleLbl').textContent = `${AR_MONTHS[m]} ${y}`;\n\n  const dowRow = document.getElementById('calDowRow');\n  dowRow.innerHTML = AR_DOW.map(d=>`<div class=\"cal-dow\">${d}<\/div>`).join('');\n\n  const firstDow = (new Date(y, m, 1).getDay() + 1) % 7; // Saturday-first index\n  const daysInMonth = new Date(y, m+1, 0).getDate();\n  const todayKey = dayKeyStr();\n  const monthPrefix = `${y}-${pad2(m+1)}`;\n\n  let monthTotal = 0, monthOrders = 0;\n  let cells = '';\n  for(let i=0;i<firstDow;i++) cells += `<div class=\"cal-day empty\"><\/div>`;\n  for(let d=1; d<=daysInMonth; d++){\n    const key = `${monthPrefix}-${pad2(d)}`;\n    const total = dayTotalFor(key);\n    const ordersCount = dayOrdersCountFor(key);\n    monthTotal += total; monthOrders += ordersCount;\n    const hasSales = total > 0;\n    const isToday = key === todayKey;\n    cells += `<div class=\"cal-day ${hasSales?'has-sales':''} ${isToday?'today':''}\" data-key=\"${key}\">\n      <div class=\"d-num\">${d}<\/div>\n      ${hasSales ? `<div class=\"d-amt\">${fmt(total)}<\/div>` : ''}\n    <\/div>`;\n  }\n  document.getElementById('calGrid').innerHTML = cells;\n  document.getElementById('monthTotalLbl').textContent = fmt(monthTotal);\n  document.getElementById('monthOrdersLbl').textContent = monthOrders;\n\n  document.getElementById('calGrid').querySelectorAll('.cal-day[data-key]').forEach(cell=>{\n    cell.addEventListener('click', ()=> openMonthDayDetail(cell.dataset.key));\n  });\n}\nfunction openMonthDayDetail(key){\n  currentDetailDayKey = key;\n  orderListState.detailOrderList.selectMode = false;\n  orderListState.detailOrderList.selected.clear();\n  const dObj = mergedDayView(key);\n  const d = new Date(key+'T00:00:00');\n  document.getElementById('detailDateLbl').textContent = d.toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});\n  const paidTotal = dObj.orders.filter(o=>!o.owner).reduce((s,o)=>s+o.total,0);\n  const cashTotal = dObj.orders.filter(o=>!o.owner && (o.paymentMethod || 'cash') === 'cash').reduce((s,o)=>s+o.total,0);\n  const instapayTotal = dObj.orders.filter(o=>!o.owner && o.paymentMethod === 'instapay').reduce((s,o)=>s+o.total,0);\n  const expensesTotal = (dObj.expenses||[]).reduce((s,e)=>s+e.amount,0);\n  document.getElementById('detailStatOrders').textContent = dObj.orders.length;\n  document.getElementById('detailStatTotal').textContent = fmt(paidTotal);\n  document.getElementById('detailStatCash').textContent = fmt(cashTotal);\n  document.getElementById('detailStatInstapay').textContent = fmt(instapayTotal);\n  fillTypeSummary('detailSum', dObj.orders);\n  document.getElementById('detailStatExpenses').textContent = '- ' + fmt(expensesTotal);\n  document.getElementById('detailStatNetIncome').textContent = fmt(paidTotal - expensesTotal);\n  renderTopItemsList(dObj.orders, 'detailTopItemsList');\n  renderShiftsBlock(dObj.shifts, 'detailShiftsList');\n  renderExpensesBlock(dObj.expenses, 'detailExpensesList');\n  renderOrdersList(dObj.orders, 'detailOrderList', false);\n  document.getElementById('monthCalendarView').style.display = 'none';\n  document.getElementById('monthDayDetailView').style.display = 'block';\n}\ndocument.getElementById('backToCalendarBtn').addEventListener('click', ()=>{\n  document.getElementById('monthDayDetailView').style.display = 'none';\n  document.getElementById('monthCalendarView').style.display = 'block';\n});\ndocument.getElementById('monthPrevBtn').addEventListener('click', ()=>{\n  monthCursor.m--; if(monthCursor.m<0){ monthCursor.m=11; monthCursor.y--; }\n  renderMonthCalendar();\n});\ndocument.getElementById('monthNextBtn').addEventListener('click', ()=>{\n  monthCursor.m++; if(monthCursor.m>11){ monthCursor.m=0; monthCursor.y++; }\n  renderMonthCalendar();\n});\n\n/* ============ التقارير المتقدمة (نفس تقارير الداشبورد، من بيانات الكاشير المحلية) ============ */\nconst ADV_REPORTS = [\n  { id:'menu',   title:'مصفوفة الربحية والمبيعات', desc:'نجوم · أحصنة عمل · ألغاز · أوزان ميتة' },\n  { id:'hourly', title:'مبيعات الساعات', desc:'أوقات الذروة والساعات الهادية' },\n  { id:'dow',    title:'أيام الأسبوع ومواسم الذروة', desc:'مقارنة السبت لحد الجمعة' },\n  { id:'aov',    title:'متوسط قيمة الفاتورة (AOV)', desc:'فلوس الزبون الواحد وتقسيمها' },\n  { id:'loyal',  title:'ولاء العملاء والنقاط', desc:'أكتر الزبائن ترددًا على المحل' },\n  { id:'pay',    title:'توزيع طرق الدفع', desc:'كاش · إنستا باي · غيرهم' }\n];\nconst ADV_DOW = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];\nconst ADV_DOW_ORDER = [6,0,1,2,3,4,5]; // يبدأ بالسبت\nlet advMode = 'day', advView = null;\n\nconst advEsc = s => String(s==null?'':s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst advFmt2 = n => (Number(n)||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});\nconst advPct = (a,b) => b ? (a/b*100).toFixed(1)+'%' : '0%';\nconst advEmpty = msg => `<div class=\"adv-empty\">${msg}<\/div>`;\nconst advNote = html => `<div class=\"adv-note\">${html}<\/div>`;\nconst advStat = (lbl, val, cls='') => `<div class=\"adv-stat ${cls}\"><div class=\"v\">${val}<\/div><div class=\"l\">${lbl}<\/div><\/div>`;\nconst advStats = html => `<div class=\"adv-stats\">${html}<\/div>`;\nconst advTable = (heads, rows) => `<div class=\"adv-table-wrap\"><table class=\"adv-table\"><thead><tr>${heads.map(h=>`<th>${h}<\/th>`).join('')}<\/tr><\/thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody><\/table><\/div>`;\nconst advBars = rows => {\n  const max = Math.max(1, ...rows.map(r=>r.value));\n  return rows.map(r=>`<div class=\"adv-bar-row\"><span class=\"adv-bar-lbl\">${r.label}<\/span><div class=\"adv-bar-track\"><div class=\"adv-bar-fill${r.hot?' hot':''}\" style=\"width:${(r.value/max*100).toFixed(1)}%\"><\/div><\/div><b class=\"adv-bar-val\">${r.display}<\/b><\/div>`).join('');\n};\n\nfunction advTodayKey(){ return (dayData && dayData.dateKey) || dayKeyStr(); }\nfunction advPeriodKey(){\n  return advMode==='day'\n    ? (document.getElementById('advDateInput').value || advTodayKey())\n    : (document.getElementById('advMonthInput').value || advTodayKey().slice(0,7));\n}\n// كل فواتير الفترة المختارة من أيام العمل المحفوظة على الجهاز (+ يوم العمل الحالي)\nfunction advOrders(){\n  const key = advPeriodKey();\n  const days = Object.values((appData && appData.history) || {});\n  if(dayData && !days.includes(dayData)) days.push(dayData);\n  const out = [];\n  days.forEach(bd=>{\n    if(!bd || !Array.isArray(bd.orders) || !bd.dateKey) return;\n    const inPeriod = advMode==='day' ? bd.dateKey===key : String(bd.dateKey).startsWith(key);\n    if(!inPeriod) return;\n    bd.orders.forEach(o=> out.push(Object.assign({}, o, { dateKey: bd.dateKey, ts: Number(o.id)||0 })));\n  });\n  return out;\n}\n// تكلفة الوحدة لكل صنف من وصفات المخزون\nfunction advCostMap(){\n  const map = {}, inv = (typeof inventoryData !== 'undefined' && inventoryData) || {};\n  const unit = {};\n  (inv.items||[]).forEach(i=>{ unit[i.id] = parseFloat(i.costPerUnit) || 0; });\n  Object.keys(inv.recipes||{}).forEach(name=>{\n    const c = (inv.recipes[name]||[]).reduce((sum,r)=> sum + (Number(r.qty)||0) * (unit[r.itemId]||0), 0);\n    if(c > 0) map[name] = c;\n  });\n  return map;\n}\nconst advPaid = orders => orders.filter(o=>!o.owner);\n\nfunction advMenuReport(orders){\n  const agg = {};\n  orders.forEach(o=>(o.items||[]).forEach(i=>{\n    const k = i.name; if(!agg[k]) agg[k] = { name:k, qty:0, rev:0 };\n    agg[k].qty += (i.qty||1); agg[k].rev += (i.price||0)*(i.qty||1);\n  }));\n  const list = Object.values(agg).sort((a,b)=>b.qty-a.qty);\n  if(!list.length) return advEmpty('مفيش مبيعات مسجلة في الفترة دي');\n  const n = list.length, totalQty = list.reduce((s,x)=>s+x.qty,0);\n  const popThreshold = 0.7 * totalQty / n;\n  const costs = advCostMap();\n  const hasCost = list.some(x=>costs[x.name]!=null);\n  list.forEach(x=>{\n    x.popular = x.qty >= popThreshold;\n    if(costs[x.name]!=null) x.unitMargin = x.rev/x.qty - costs[x.name];\n  });\n  const withCost = list.filter(x=>x.unitMargin!=null);\n  const avgMargin = withCost.length ? withCost.reduce((s,x)=>s+x.unitMargin,0)/withCost.length : 0;\n  const label = x => {\n    if(!hasCost || x.unitMargin==null) return x.popular ? '<span class=\"adv-tag\">شعبي<\/span>' : '<span class=\"adv-tag\">أقل طلباً<\/span>';\n    const prof = x.unitMargin >= avgMargin;\n    if(x.popular && prof)   return 'نجمة (احتفظ بيها)';\n    if(x.popular && !prof)  return 'حصان عمل (ارفع سعرها شوية)';\n    if(!x.popular && prof)  return 'لغز (محتاجة تسويق)';\n    return 'وزن ميت (اشيلها من المنيو)';\n  };\n  const rows = list.map((x,i)=>[\n    i+1, advEsc(x.name), x.qty, advFmt2(x.rev), advPct(x.qty,totalQty),\n    x.unitMargin!=null ? advFmt2(x.unitMargin) : '—', label(x)\n  ]);\n  const note = hasCost ? '' : advNote('عشان نقسم الأصناف لـ 4 أجزاء بالربحية لازم تكلفة كل صنف تتحسب من وصفاته في المخزون. لحد دلوقتي التصنيف بالكمية بس.');\n  return note + advTable(['#','الصنف','الكمية','المبيعات','نسبة','هامش/وحدة','التصنيف'], rows);\n}\n\nfunction advHourlyReport(orders){\n  if(!orders.length) return advEmpty('مفيش فواتير في الفترة دي');\n  const cnt = new Array(24).fill(0);\n  orders.forEach(o=>{ if(o.ts){ cnt[new Date(o.ts).getHours()]++; } });\n  const active = []; for(let h=0;h<24;h++) if(cnt[h]>0) active.push(h);\n  if(!active.length) return advEmpty('مفيش بيانات أوقات كفاية');\n  const first = active[0], last = active[active.length-1];\n  const top3 = active.slice().sort((a,b)=>cnt[b]-cnt[a]).slice(0,3);\n  const dead = []; for(let h=first;h<=last;h++) if(cnt[h]===0) dead.push(String(h).padStart(2,'0')+':00');\n  const bars = advBars(active.map(h=>({ label:String(h).padStart(2,'0')+':00', value:cnt[h], display:`${cnt[h]} فاتورة`, hot:top3.includes(h) })));\n  return advStats(advStat('أزحم ساعة', String(top3[0]).padStart(2,'0')+':00', 'ok') + advStat('ساعات هادية وسط اليوم', dead.length||0))\n    + `<div class=\"adv-block\"><div class=\"adv-sub\">عدد الفواتير حسب الساعة (الأعمدة الغامقة = أعلى 3 ساعات)<\/div>${bars}<\/div>`\n    + (dead.length ? advNote(`الساعات الهادية وسط النشاط: ${dead.join('، ')} — ممكن تقلل فيها عدد الباريستا.`) : '');\n}\n\nfunction advDowReport(orders){\n  if(!orders.length) return advEmpty('مفيش فواتير في الفترة دي');\n  const days = {};\n  orders.forEach(o=>{\n    if(!o.dateKey) return;\n    const [y,m,d] = o.dateKey.split('-').map(Number);\n    const dow = new Date(y,m-1,d).getDay();\n    if(!days[dow]) days[dow] = { dates:new Set(), count:0, rev:0 };\n    days[dow].dates.add(o.dateKey); days[dow].count++; days[dow].rev += (o.total||0);\n  });\n  const rows = ADV_DOW_ORDER.filter(d=>days[d]).map(d=>{\n    const g = days[d], nDays = g.dates.size;\n    return { name:ADV_DOW[d], avgRev:g.rev/nDays, avgCount:g.count/nDays, nDays };\n  });\n  if(!rows.length) return advEmpty('مفيش بيانات تواريخ كفاية');\n  const maxRev = Math.max(...rows.map(r=>r.avgRev));\n  const bars = advBars(rows.map(r=>({ label:r.name, value:r.avgRev, display:`${advFmt2(r.avgRev)} ج.م`, hot:r.avgRev===maxRev })));\n  return `<div class=\"adv-block\"><div class=\"adv-sub\">متوسط المبيعات لكل يوم من نفس الاسم<\/div>${bars}<\/div>`\n    + advTable(['اليوم','عدد الأيام','متوسط الفواتير','متوسط المبيعات'], rows.map(r=>[r.name, r.nDays, r.avgCount.toFixed(1), advFmt2(r.avgRev)]))\n    + advNote('أعلى يوم ضغط: <b>'+rows.find(r=>r.avgRev===maxRev).name+'<\/b>. التقرير بيقسم على عدد الأيام الفعلية، عشان أسبوع واحد ميقلبش الصورة.');\n}\n\nfunction advAovReport(orders){\n  const paid = advPaid(orders);\n  if(!paid.length) return advEmpty('مفيش فواتير في الفترة دي');\n  const avg = a => a.length ? a.reduce((s,o)=>s+(o.total||0),0)/a.length : 0;\n  const itemsPer = a => a.length ? a.reduce((s,o)=>s+(o.items||[]).reduce((x,i)=>x+(i.qty||1),0),0)/a.length : 0;\n  const del = paid.filter(o=>o.orderType==='delivery'), hall = paid.filter(o=>o.orderType!=='delivery');\n  return advStats(\n      advStat('متوسط الفاتورة', advFmt2(avg(paid)), 'ok')\n    + advStat('أصناف في الفاتورة', itemsPer(paid).toFixed(1))\n    + advStat('فواتير الصالة', hall.length) + advStat('فواتير الدليفري', del.length))\n    + advTable(['النوع','عدد الفواتير','متوسط الفاتورة','متوسط الأصناف'], [\n        ['صالة / تيك أواي', hall.length, advFmt2(avg(hall)), itemsPer(hall).toFixed(1)],\n        ['دليفري', del.length, advFmt2(avg(del)), itemsPer(del).toFixed(1)] ])\n    + advNote('بيحسب بس الفواتير المدفوعة (من غير خصم المالك).');\n}\n\nfunction advLoyalReport(orders){\n  const allPaid = advPaid(orders);\n  const paid = allPaid.filter(o=>o.customerId);\n  if(!paid.length) return advEmpty('مفيش فواتير مرتبطة بعملاء في الفترة دي. العميل بيتسجل لما تختاره في الشيك.');\n  const map = {};\n  paid.forEach(o=>{\n    const k = String(o.customerId);\n    if(!map[k]) map[k] = { name:o.customerName||'—', phone:o.customerPhone||'', visits:0, spent:0, pts:0 };\n    map[k].visits++; map[k].spent += (o.total||0); map[k].pts += (o.pointsEarned||0);\n  });\n  const list = Object.values(map).sort((a,b)=>b.visits-a.visits || b.spent-a.spent).slice(0,10);\n  const totalRev = allPaid.reduce((s,o)=>s+(o.total||0),0);\n  const custRev = paid.reduce((s,o)=>s+(o.total||0),0);\n  return advStats(advStat('عملاء مسجلين بالفترة', Object.keys(map).length) + advStat('نسبة مبيعاتهم', advPct(custRev,totalRev), 'ok'))\n    + advTable(['#','العميل','الموبايل','زيارات','إجمالي الإنفاق','نقاط مكتسبة'], list.map((c,i)=>[\n        i+1, advEsc(c.name), advEsc(c.phone||'—'), c.visits, advFmt2(c.spent), c.pts ]))\n    + advNote('الترتيب لأعلى زيارات في الفترة المختارة. للمقارنة بين شهور، اختار \"شهر كامل\" وقارن.');\n}\n\nfunction advPayReport(orders){\n  const paid = advPaid(orders);\n  if(!paid.length) return advEmpty('مفيش فواتير في الفترة دي');\n  const labels = { cash:'كاش', instapay:'إنستا باي', owner:'خصم مالك' };\n  const g = {};\n  paid.forEach(o=>{ const k = o.paymentMethod||'cash'; if(!g[k]) g[k]={count:0, amt:0}; g[k].count++; g[k].amt += (o.total||0); });\n  const totalAmt = Object.values(g).reduce((s,x)=>s+x.amt,0);\n  const keys = Object.keys(g).sort((a,b)=>g[b].amt-g[a].amt);\n  const bars = advBars(keys.map(k=>({ label:labels[k]||advEsc(k), value:g[k].amt, display:`${advPct(g[k].amt,totalAmt)} · ${advFmt2(g[k].amt)} ج.م` })));\n  return `<div class=\"adv-block\"><div class=\"adv-sub\">نسبة المبيعات لكل طريقة دفع<\/div>${bars}<\/div>`\n    + advTable(['طريقة الدفع','عدد الفواتير','نسبة الفواتير','المبلغ','نسبة المبلغ'], keys.map(k=>[\n        labels[k]||advEsc(k), g[k].count, advPct(g[k].count,paid.length), advFmt2(g[k].amt), advPct(g[k].amt,totalAmt) ]));\n}\n\nconst ADV_RENDERERS = { menu:advMenuReport, hourly:advHourlyReport, dow:advDowReport, aov:advAovReport, loyal:advLoyalReport, pay:advPayReport };\n\nfunction renderAdvReports(){\n  const tiles = document.getElementById('advTiles'), body = document.getElementById('advBody');\n  const back = document.getElementById('advBackBtn'), title = document.getElementById('advTitle');\n  const r = ADV_REPORTS.find(x=>x.id===advView);\n  back.style.display = r ? '' : 'none';\n  if(!r){\n    title.textContent = 'اختار التقرير اللي عايز تشوفه';\n    body.innerHTML = '';\n    tiles.innerHTML = ADV_REPORTS.map(x=>`<button type=\"button\" class=\"adv-tile\" data-adv=\"${x.id}\"><b>${x.title}<\/b><small>${x.desc}<\/small><\/button>`).join('');\n  } else {\n    title.textContent = `${r.title} · ${advPeriodKey()}${advMode==='month' ? ' (شهر كامل)' : ''}`;\n    tiles.innerHTML = '';\n    body.innerHTML = ADV_RENDERERS[r.id](advOrders());\n  }\n}\n\n(function initAdvReports(){\n  const dateInput = document.getElementById('advDateInput');\n  const monthInput = document.getElementById('advMonthInput');\n  const setMode = (mode)=>{\n    advMode = mode;\n    document.getElementById('advPeriodDayBtn').classList.toggle('active', mode==='day');\n    document.getElementById('advPeriodMonthBtn').classList.toggle('active', mode==='month');\n    dateInput.style.display = mode==='day' ? '' : 'none';\n    monthInput.style.display = mode==='month' ? '' : 'none';\n    renderAdvReports();\n  };\n  document.getElementById('advPeriodDayBtn').addEventListener('click', ()=>setMode('day'));\n  document.getElementById('advPeriodMonthBtn').addEventListener('click', ()=>setMode('month'));\n  dateInput.addEventListener('change', renderAdvReports);\n  monthInput.addEventListener('change', renderAdvReports);\n  document.getElementById('advTiles').addEventListener('click', (e)=>{\n    const b = e.target.closest('[data-adv]'); if(!b) return;\n    advView = b.dataset.adv; renderAdvReports();\n  });\n  document.getElementById('advBackBtn').addEventListener('click', ()=>{ advView = null; renderAdvReports(); });\n\n  document.getElementById('repTabAdv').addEventListener('click', ()=>{\n    ['repTabDay','repTabMonth'].forEach(id=>document.getElementById(id).classList.remove('active'));\n    ['repPaneDay','repPaneMonth'].forEach(id=>document.getElementById(id).classList.remove('active'));\n    document.getElementById('repTabAdv').classList.add('active');\n    document.getElementById('repPaneAdv').classList.add('active');\n    dateInput.value = advTodayKey();\n    monthInput.value = advTodayKey().slice(0,7);\n    advView = null;\n    renderAdvReports();\n  });\n  // الضغط على تقرير اليوم / الشهر يقفل تبويب التقارير المتقدمة\n  ['repTabDay','repTabMonth'].forEach(id=>{\n    document.getElementById(id).addEventListener('click', ()=>{\n      document.getElementById('repTabAdv').classList.remove('active');\n      document.getElementById('repPaneAdv').classList.remove('active');\n    });\n  });\n})();\n\n/* ============ REPORT TABS WIRING ============ */\ndocument.getElementById('repTabDay').addEventListener('click', ()=>{\n  document.getElementById('repTabDay').classList.add('active');\n  document.getElementById('repTabMonth').classList.remove('active');\n  document.getElementById('repPaneDay').classList.add('active');\n  document.getElementById('repPaneMonth').classList.remove('active');\n});\ndocument.getElementById('repTabMonth').addEventListener('click', ()=>{\n  document.getElementById('repTabMonth').classList.add('active');\n  document.getElementById('repTabDay').classList.remove('active');\n  document.getElementById('repPaneMonth').classList.add('active');\n  document.getElementById('repPaneDay').classList.remove('active');\n  document.getElementById('monthDayDetailView').style.display = 'none';\n  document.getElementById('monthCalendarView').style.display = 'block';\n  monthCursor = null;\n  renderMonthCalendar();\n});\n\n/* ============ PRINT / PDF ============ */\n// اسم ملف الـ PDF بيتبني من التاريخ الفعلي في التقويم + وقت الضغط على \"حفظ\" بالظبط\nfunction fileStamp(){\n  const d = new Date();\n  const p = n => String(n).padStart(2,'0');\n  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`;\n}\n// بيغيّر عنوان الصفحة مؤقتاً قبل الطباعة عشان يبقى ده اسم ملف الـ PDF المقترح من المتصفح\n// وبيتأكد إن منطقة الطباعة المطلوبة (بون / إيصال / تقرير) هي الوحيدة الظاهرة، وبيمسح\n// أي محتوى قديم فاضل من طباعة سابقة في المناطق التانية عشان مايحصلش تداخل بينهم\n// بيظبط حجم الصفحة وقت الطباعة: 80mm بعرض ثابت وطول تلقائي لطابعة الحرارية (البون/الإيصال)\n// عشان الورقة متطلعش مقصوصة نص طباعة، وA4 عادي للتقارير\nfunction setPrintPageStyle(mode){\n  let styleEl = document.getElementById('print-page-style');\n  if(!styleEl){\n    styleEl = document.createElement('style');\n    styleEl.id = 'print-page-style';\n    document.head.appendChild(styleEl);\n  }\n  styleEl.textContent = (mode === 'thermal')\n    ? '@page{ size: 80mm auto; margin: 0; }'\n    : '@page{ size: A4; margin: 12mm 10mm 16mm; }';\n}\n\nconst PRINT_AREA_IDS = ['printReport','printMonthReport','printReceipt','printBon','printZReport','printA4'];\nasync function printWithFilename(filenameNoExt, buildFn, targetId, pageMode){\n  PRINT_AREA_IDS.forEach(id=>{\n    const el = document.getElementById(id);\n    el.classList.remove('print-active');\n    if(id !== targetId) el.innerHTML = ''; // نفضّي أي محتوى قديم من المناطق التانية\n  });\n\n  buildFn();\n  document.getElementById(targetId).classList.add('print-active');\n  setPrintPageStyle(pageMode);\n\n  const cleanup = () => {\n    document.getElementById(targetId).classList.remove('print-active');\n  };\n\n  // بننتظر شوية عشان نضمن إن المتصفح خلّص رسم المحتوى فعلياً على الشاشة قبل ما نبعته للطباعة\n  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));\n  await new Promise(r => setTimeout(r, 120));\n\n  // نسخة سطح المكتب (exe): تقارير اليوم/الشهر بتتحفظ كملف PDF حقيقي من غير أي مربع حوار طابعات\n  if(window.electronAPI){\n    const result = await window.electronAPI.exportPDF(filenameNoExt, pageMode);\n    cleanup();\n    if(result && result.ok){\n      showToast('تم حفظ التقرير PDF بنجاح ');\n    } else if(!(result && result.canceled)){\n      showToast('حصلت مشكلة أثناء حفظ التقرير PDF');\n    }\n    return;\n  }\n\n  // نسخة المتصفح العادية (لو اتفتحت من غير نسخة سطح المكتب): برجع لنافذة الطباعة القياسية\n  const prevTitle = document.title;\n  document.title = filenameNoExt;\n  const cleanupBrowser = () => { document.title = prevTitle; cleanup(); };\n  window.addEventListener('afterprint', cleanupBrowser, {once:true});\n  setTimeout(cleanupBrowser, 4000); // fallback لو المتصفح ملعبش afterprint\n  window.print();\n}\n\n// تقارير اليوم/الشهر: بدل ما تتحفظ PDF تلقائي على طول من غير أي اختيار، دلوقتي بتفتح\n// مربع حوار طباعة ويندوز العادي (بالظبط زي تقرير Z بتاع إغلاق الورديه) عشان تختاري\n// منه الطابعة، أو \"Microsoft Print to PDF\" لو عايزة تحفظيه PDF بنفسك من نفس المربع.\nasync function printWithDialog(filenameNoExt, buildFn, targetId){\n  buildFn();\n  const html = document.getElementById(targetId).innerHTML;\n  await printThermal(filenameNoExt, html, targetId);\n}\n\n/* ---------- طباعة البون/الإيصال (حرارية 80مم) في نافذة معزولة صغيرة مخصصة للطباعة بس ----------\n   بدل ما نستخدم حيلة إخفاء/إظهار أجزاء من صفحة الكاشير الكبيرة والمعقدة وقت الطباعة (اللي كانت بتطلع\n   ورق فاضي أحياناً)، بنبني صفحة HTML بسيطة قائمة بذاتها فيها محتوى البون/الإيصال بس، ونطبعها\n   من نافذة مخفية منفصلة، فمفيش أي تعارض مع باقي تصميم البرنامج. */\nfunction buildStandaloneThermalHtml(contentHtml){\n  return `<!DOCTYPE html>\n<html lang=\"en\" dir=\"ltr\"><head><meta charset=\"UTF-8\">\n<style>\n  @page{ size:80mm auto; margin:0; }\n  *{ box-sizing:border-box; }\n  html,body{ margin:0; padding:0; }\n  body{ width:80mm; background:#fff; color:#000; padding:10px 8px; font-family:Arial, Tahoma, sans-serif; }\n  h1{ font-size:16px; margin:0 0 2px; text-align:center; }\n  .sub{ font-size:11px; text-align:center; color:#333; margin-bottom:8px; }\n  .meta{ font-size:11.5px; margin-bottom:8px; border-bottom:1px dashed #000; padding-bottom:6px; }\n  table{ width:100%; border-collapse:collapse; font-size:12.5px; }\n  td, th{ padding:4px 2px; text-align:left; }\n  td:last-child, th:last-child{ text-align:right; }\n  tfoot td{ border-top:1px dashed #000; font-weight:800; padding-top:6px; }\n  .foot-note{ text-align:center; font-size:11px; margin-top:10px; color:#333; }\n  .bon-title{ text-align:center; font-size:19px; font-weight:900; border:2px solid #000; padding:6px; margin-bottom:8px; }\n  .bon-table td, .bon-table th{ font-size:15px; font-weight:700; padding:6px 2px; }\n  .zr{ font-family:'Courier New', Consolas, monospace; }\n  .zr-shop{ text-align:center; font-size:15px; font-weight:900; }\n  .zr-branch{ text-align:center; font-size:12px; margin-top:2px; }\n  .zr-taxline{ text-align:center; font-size:10.5px; color:#333; margin-top:2px; }\n  .zr-hr2{ border-top:3px double #000; margin:8px 0; }\n  .zr-hr1{ border-top:1px dashed #000; margin:8px 0; }\n  .zr-title{ text-align:center; font-size:13px; font-weight:900; margin:2px 0; }\n  .zr-meta-row{ display:flex; justify-content:space-between; font-size:11.5px; margin:2px 0; }\n  .zr-section{ font-weight:900; font-size:12px; margin:6px 0 4px; }\n  .zr-row{ display:flex; justify-content:space-between; gap:6px; font-size:12px; margin:3px 0; }\n  .zr-row .v{ font-weight:700; white-space:nowrap; }\n  .zr-row.total{ font-weight:900; font-size:13px; }\n  .zr-foot{ text-align:center; font-size:12px; font-weight:800; margin-top:2px; }\n<\/style><\/head>\n<body>${contentHtml}<\/body><\/html>`;\n}\n\nasync function printThermal(filenameNoExt, contentHtml, targetId){\n  // نسخة سطح المكتب (exe): بتفتح مربع حوار طباعة ويندوز عشان تختاري الطابعة بنفسك في كل مرة\n  if(window.electronAPI && window.electronAPI.silentPrintHtml){\n    const s = getDrawerSettings();\n    const fullHtml = buildStandaloneThermalHtml(contentHtml);\n    const result = await window.electronAPI.silentPrintHtml(fullHtml, s.printerName);\n    if(!result || !result.ok){\n      showToast('فشلت الطباعة — تم الإلغاء أو حدث خطأ');\n    }\n
