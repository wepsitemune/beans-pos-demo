return;\n  }\n\n  // نسخة المتصفح العادية (لو اتفتحت من غير نسخة سطح المكتب): استخدم حيلة منطقة الطباعة القديمة + window.print()\n  PRINT_AREA_IDS.forEach(id=>{\n    const el = document.getElementById(id);\n    el.classList.remove('print-active');\n    if(id !== targetId) el.innerHTML = '';\n  });\n  document.getElementById(targetId).innerHTML = contentHtml;\n  document.getElementById(targetId).classList.add('print-active');\n  setPrintPageStyle('thermal');\n  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));\n  const prevTitle = document.title;\n  document.title = filenameNoExt;\n  const cleanup = () => { document.title = prevTitle; document.getElementById(targetId).classList.remove('print-active'); };\n  window.addEventListener('afterprint', cleanup, {once:true});\n  setTimeout(cleanup, 4000);\n  window.print();\n}\n\n// سطر ملخص واحد (تسمية: قيمة) بنفس شكل سطور تقرير Z بالظبط — بيتستخدم في ملخصات المبيعات بدل الجداول العريضة\nfunction repRow(label, value, cls){\n  return `<div class=\"rep-row${cls?' '+cls:''}\"><span class=\"k\">${label}<\/span><span class=\"v\">${value}<\/span><\/div>`;\n}\n// هيدر شكل تقرير Z (اسم المحل / الفرع / رقم التسجيل والضريبة لو متسجلين) بيتحط فوق تقارير اليوم والشهر\nfunction reportShopHeaderHtml(titleText){\n  const branchLine = SHOP_BRANCH ? `<div class=\"rep-branch\">${SHOP_BRANCH}<\/div>` : '';\n  const taxParts = [];\n  if(SHOP_COMMERCIAL_REG) taxParts.push(`س.ت: ${SHOP_COMMERCIAL_REG}`);\n  if(shopTaxNumber()) taxParts.push(`ض.ق: ${shopTaxNumber()}`);\n  const taxLine = taxParts.length ? `<div class=\"rep-taxline\">${taxParts.join(' | ')}<\/div>` : '';\n  return `\n    <div class=\"rep-shop\">${SHOP_NAME}<\/div>\n    ${branchLine}\n    ${taxLine}\n    <div class=\"rep-hr2\"><\/div>\n    <div class=\"rep-title\">${titleText}<\/div>\n    <div class=\"rep-hr2\"><\/div>`;\n}\n// جدول الفئات حسب المبيعات (زي: مشروبات ساخنة، منتجات الألبان...) مع نسبة كل فئة من إجمالي المبيعات\nfunction categoryBreakdownTableHtml(orders){\n  const { totals, grandTotal } = categorySalesBreakdown(orders);\n  const rows = Object.entries(totals)\n    .sort((a,b)=> b[1]-a[1])\n    .map(([label, amt])=>{\n      const pct = grandTotal>0 ? (amt/grandTotal*100).toFixed(2) : '0.00';\n      return `<tr><td>${label}<\/td><td>${pct}%<\/td><td>${fmt(amt)}<\/td><\/tr>`;\n    }).join('');\n  return `<div class=\"rep-section-bar\">الفئات حسب المبيعات<\/div>\n    <table>\n      <thead><tr><th>الفئة<\/th><th>النسبة من الإجمالي<\/th><th>الإجمالي (ج.م)<\/th><\/tr><\/thead>\n      <tbody>${rows || '<tr><td colspan=\"3\">لا توجد مبيعات<\/td><\/tr>'}<\/tbody>\n      <tfoot><tr class=\"rep-total-row\"><td colspan=\"2\">إجمالي المبيعات<\/td><td>${fmt(grandTotal)} ج.م<\/td><\/tr><\/tfoot>\n    <\/table>`;\n}\n// جدول الكمية حسب الصنف: كل صنف اتباع كام قطعة وجاب كام، مرتبة من الأكتر مبيعاً للأقل\nfunction quantityByItemTableHtml(orders){\n  const ranking = itemsSoldRanking(orders);\n  const rows = ranking.map(it=> `<tr><td>${it.name}<\/td><td>${fmtQty(it.qty)}<\/td><td>${fmt(it.revenue)}<\/td><\/tr>`).join('');\n  return `<div class=\"rep-section-bar\">الكمية حسب الصنف<\/div>\n    <table>\n      <thead><tr><th>الصنف<\/th><th>الكمية<\/th><th>الإجمالي (ج.م)<\/th><\/tr><\/thead>\n      <tbody>${rows || '<tr><td colspan=\"3\">لا توجد أصناف مباعة<\/td><\/tr>'}<\/tbody>\n    <\/table>`;\n}\nfunction expensesTableHtml(expenses){\n  const total = (expenses||[]).reduce((s,e)=>s+e.amount,0);\n  const rows = (expenses||[]).map((e,idx)=>{\n    const noteStr = e.note ? ` (${e.note})` : '';\n    return `<tr><td>${idx+1}<\/td><td>${expenseCategoryLabel(e.category)}${noteStr}<\/td><td>${e.time}<\/td><td>${e.cashierName||'-'}<\/td><td>${fmt(e.amount)}<\/td><\/tr>`;\n  }).join('');\n  return `<div class=\"rep-section-bar\">المصروفات<\/div>\n    <table>\n      <thead><tr><th>#<\/th><th>التصنيف / ملاحظة<\/th><th>الوقت<\/th><th>الكاشير<\/th><th>المبلغ (ج.م)<\/th><\/tr><\/thead>\n      <tbody>${rows || '<tr><td colspan=\"5\">لا توجد مصروفات مسجلة<\/td><\/tr>'}<\/tbody>\n      <tfoot><tr class=\"rep-total-row\"><td colspan=\"4\">إجمالي المصروفات<\/td><td>${fmt(total)} ج.م<\/td><\/tr><\/tfoot>\n    <\/table>`;\n}\nfunction buildPrintReport(){\n  document.getElementById('printReport').innerHTML = buildZReportHtml(dayData, {\n    titleText: '** تقرير مبيعات اليوم **',\n    footText: 'نهاية التقرير',\n    extraHtml: quantityByItemZStyleHtml(dayData.orders)\n  });\n}\nfunction printReport(){\n  printWithDialog(`تقرير-مبيعات-يوم-${fileStamp()}`, buildPrintReport, 'printReport');\n}\n\n/* ---------- تقرير يوم معين من تقارير الشهر (نفس تصميم تقرير Z بالظبط + الكمية حسب الصنف) PDF ---------- */\nfunction buildPrintDayDetailReport(dateKey){\n  const dObj = mergedDayView(dateKey);\n  document.getElementById('printReport').innerHTML = buildZReportHtml(dObj, {\n    titleText: '** تقرير مبيعات اليوم **',\n    footText: 'نهاية التقرير',\n    dateOverride: new Date(dateKey+'T00:00:00'),\n    extraHtml: quantityByItemZStyleHtml(dObj.orders)\n  });\n}\nfunction printDayDetailReport(){\n  if(!currentDetailDayKey) return;\n  printWithDialog(`تقرير-مبيعات-يوم-${currentDetailDayKey}_${fileStamp()}`, ()=>buildPrintDayDetailReport(currentDetailDayKey), 'printReport');\n}\ndocument.getElementById('printDetailDayBtn').addEventListener('click', printDayDetailReport);\n// حفظ PDF: بيتحفظ مباشرة كملف PDF باسم فيه تاريخ ووقت الحفظ بالثانية، فلو اتحفظ مرتين لنفس اليوم الاسم مش هيتكرر\nfunction savePdfDetailDayReport(){\n  if(!currentDetailDayKey) return;\n  printWithFilename(`تقرير-مبيعات-يوم-${currentDetailDayKey}_${fileStamp()}`, ()=>buildPdfDayDetailReport(currentDetailDayKey), 'printA4', 'a4');\n}\ndocument.getElementById('savePdfDetailDayBtn').addEventListener('click', savePdfDetailDayReport);\n\n/* ---------- تقرير الشهر PDF ---------- */\nfunction buildPrintMonthReport(){\n  const { y, m } = monthCursor;\n  const monthPrefix = `${y}-${pad2(m+1)}`;\n  const daysInMonth = new Date(y, m+1, 0).getDate();\n  let rows = '';\n  let monthTotal = 0, monthOrders = 0, monthCashTotal = 0, monthInstapayTotal = 0, monthExpensesTotal = 0;\n  const monthPaidOrders = [];\n  const itemStats = {}; // اسم الصنف -> {qty: الكمية المباعة, revenue: الإيراد}\n  const expenseCatStats = {}; // تصنيف المصروف -> إجمالي المبلغ\n  const menuCatMap = buildItemCategoryMap(); // اسم الصنف -> اسم قسم المنيو (الفئة)\n  const menuCatStats = {}; // اسم الفئة -> إجمالي المبيعات\n  let menuCatGrandTotal = 0;\n  for(let d=1; d<=daysInMonth; d++){\n    const key = `${monthPrefix}-${pad2(d)}`;\n    const total = dayTotalFor(key);\n    const ordersCount = dayOrdersCountFor(key);\n    const dayExpenses = getBusinessDaysForDate(key).reduce((s,bd)=>s + (bd.expenses||[]).reduce((s2,e)=>s2+e.amount,0), 0);\n    monthTotal += total; monthOrders += ordersCount; monthExpensesTotal += dayExpenses;\n    if(ordersCount>0 || dayExpenses>0){\n      rows += `<tr><td>${d}<\/td><td>${ordersCount}<\/td><td>${fmt(total)}<\/td><td>${fmt(dayExpenses)}<\/td><td>${fmt(total-dayExpenses)}<\/td><\/tr>`;\n    }\n    // نجمع كل الأصناف اللي اتباعت في اليوم ده (مدفوعة وأونر) عشان نطلع أكتر الأصناف مبيعاً في الشهر\n    getBusinessDaysForDate(key).forEach(bd=>{\n      bd.orders.forEach(o=>{\n        if(!o.owner){\n          monthPaidOrders.push(o);\n          if((o.paymentMethod || 'cash') === 'instapay') monthInstapayTotal += o.total;\n          else monthCashTotal += o.total;\n        }\n        o.items.forEach(i=>{\n          if(!itemStats[i.name]) itemStats[i.name] = { qty:0, revenue:0 };\n          itemStats[i.name].qty += i.qty;\n          itemStats[i.name].revenue += i.price * i.qty;\n          const catLabel = menuCatMap[i.name] || 'أخرى';\n          const amt = i.price * i.qty;\n          menuCatStats[catLabel] = (menuCatStats[catLabel]||0) + amt;\n          menuCatGrandTotal += amt;\n        });\n      });\n      (bd.expenses||[]).forEach(e=>{\n        if(!expenseCatStats[e.category]) expenseCatStats[e.category] = 0;\n        expenseCatStats[e.category] += e.amount;\n      });\n    });\n  }\n\n  const itemRows = Object.entries(itemStats)\n    .sort((a,b)=> b[1].qty - a[1].qty)\n    .map(([name, s])=> `<tr><td>${name}<\/td><td>${fmtQty(s.qty)}<\/td><td>${fmt(s.revenue)}<\/td><\/tr>`)\n    .join('');\n\n  const menuCatRows = Object.entries(menuCatStats)\n    .sort((a,b)=> b[1]-a[1])\n    .map(([label, amt])=>{\n      const pct = menuCatGrandTotal>0 ? (amt/menuCatGrandTotal*100).toFixed(2) : '0.00';\n      return `<tr><td>${label}<\/td><td>${pct}%<\/td><td>${fmt(amt)}<\/td><\/tr>`;\n    }).join('');\n\n  const expenseCatRows = Object.entries(expenseCatStats)\n    .sort((a,b)=> b[1]-a[1])\n    .map(([catId, amt])=> `<tr><td>${expenseCategoryLabel(catId)}<\/td><td>${fmt(amt)} ج.م<\/td><\/tr>`)\n    .join('');\n\n  document.getElementById('printMonthReport').innerHTML = `\n    ${reportShopHeaderHtml(`تقرير مبيعات شهر ${AR_MONTHS[m]} ${y}`)}\n    ${repRow('عدد الفواتير:', monthOrders)}\n    ${repRow('تم الحفظ:', new Date().toLocaleString('ar-EG'))}\n    <div class=\"rep-hr1\"><\/div>\n    <div class=\"rep-section-bar\">تفاصيل الأيام<\/div>\n    <table>\n      <thead><tr><th>اليوم<\/th><th>عدد الفواتير<\/th><th>المبيعات (ج.م)<\/th><th>المصروفات (ج.م)<\/th><th>صافي الدخل (ج.م)<\/th><\/tr><\/thead>\n      <tbody>${rows || '<tr><td colspan=\"5\">لا توجد مبيعات في هذا الشهر<\/td><\/tr>'}<\/tbody>\n    <\/table>\n    <div class=\"rep-hr1\"><\/div>\n    <div class=\"rep-section-bar\">ملخص الشهر<\/div>\n    ${repRow('إجمالي تحصيل كاش:', fmt2(monthCashTotal))}\n    ${repRow('إجمالي تحصيل إنستا باي:', fmt2(monthInstapayTotal))}\n    ${typeSummaryRepHtml(monthPaidOrders)}\n    ${repRow('إجمالي المصروفات:', '-'+fmt2(monthExpensesTotal))}\n    <div class=\"rep-hr1\"><\/div>\n    ${repRow('إجمالي مبيعات الشهر:', fmt2(monthTotal), 'total')}\n    ${repRow('صافي الدخل بعد المصروفات:', fmt2(monthTotal-monthExpensesTotal), 'total')}\n    <div class=\"rep-section-bar\">الفئات حسب المبيعات<\/div>\n    <table>\n      <thead><tr><th>الفئة<\/th><th>النسبة من الإجمالي<\/th><th>الإجمالي (ج.م)<\/th><\/tr><\/thead>\n      <tbody>${menuCatRows || '<tr><td colspan=\"3\">لا توجد مبيعات في هذا الشهر<\/td><\/tr>'}<\/tbody>\n      <tfoot><tr class=\"rep-total-row\"><td colspan=\"2\">إجمالي المبيعات<\/td><td>${fmt(menuCatGrandTotal)} ج.م<\/td><\/tr><\/tfoot>\n    <\/table>\n    <div class=\"rep-section-bar\">الكمية حسب الصنف<\/div>\n    <table>\n      <thead><tr><th>الصنف<\/th><th>الكمية<\/th><th>الإجمالي (ج.م)<\/th><\/tr><\/thead>\n      <tbody>${itemRows || '<tr><td colspan=\"3\">لا توجد أصناف مباعة في هذا الشهر<\/td><\/tr>'}<\/tbody>\n    <\/table>\n    <div class=\"rep-section-bar\">المصروفات حسب التصنيف<\/div>\n    <table>\n      <thead><tr><th>التصنيف<\/th><th>الإجمالي (ج.م)<\/th><\/tr><\/thead>\n      <tbody>${expenseCatRows || '<tr><td colspan=\"2\">لا توجد مصروفات مسجلة في هذا الشهر<\/td><\/tr>'}<\/tbody>\n    <\/table>\n    <div class=\"rep-hr2\"><\/div>\n    <div class=\"rep-foot\">نهاية التقرير<\/div>`;\n}\nfunction printMonthReport(){\n  const { y, m } = monthCursor;\n  printWithDialog(`تقرير-مبيعات-شهر-${pad2(m+1)}-${y}_${fileStamp()}`, buildPrintMonthReport, 'printMonthReport');\n}\ndocument.getElementById('printMonthBtn').addEventListener('click', printMonthReport);\nfunction savePdfMonthReport(){\n  const { y, m } = monthCursor;\n  printWithFilename(`تقرير-مبيعات-شهر-${pad2(m+1)}-${y}_${fileStamp()}`, buildPdfMonthReport, 'printA4', 'a4');\n}\ndocument.getElementById('savePdfMonthBtn').addEventListener('click', savePdfMonthReport);\n\n/* ============ تقارير PDF بمقاس A4 (رسمية، زي السيستمات المشهورة) ============\n   دي منفصلة تماماً عن زرار الطباعة: الطباعة بتفضل إيصال حراري 80مم زي ما هي،\n   وزراير \"حفظ PDF\" بتبني تقرير A4 كامل (هيدر + كروت ملخص + جداول + نسب) في منطقة #printA4. */\nfunction a4Esc(s){ return escapeHtmlPos(s); }\nfunction a4N(n){ return `<span class=\"n\">${fmt2(n)}<\/span>`; }\nfunction a4Neg(n){ return n>0 ? `<span class=\"n\">-${fmt2(n)}<\/span>` : a4N(0); }\nfunction a4Money(n){ return `${a4N(n)}<small>ج.م<\/small>`; }\nfunction a4Qty(n){ return (+n||0).toLocaleString('en-US', {maximumFractionDigits:3}); }\nfunction a4Pct(part, total){ return total>0 ? (part/total*100).toFixed(1)+'%' : '0.0%'; }\nfunction a4DateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }\nfunction a4TimeStr(d){ return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }\nfunction a4Weekday(d){ return d.toLocaleDateString('ar-EG', {weekday:'long'}); }\nfunction a4Kpi(label, value, cls){ return `<div class=\"a4-kpi ${cls||''}\"><div class=\"l\">${label}<\/div><div class=\"v\">${value}<\/div><\/div>`; }\nfunction a4Sec(t){ return `<div class=\"a4-sec\">${t}<\/div>`; }\nfunction a4Bar(p){ return `<div class=\"a4-track\"><i style=\"width:${Math.max(0,Math.min(100,p))}%\"><\/i><\/div>`; }\nfunction a4Kv(rows){\n  return `<table class=\"a4-kv\"><tbody>${rows.map(r=>`<tr class=\"${r[2]||''}\"><td>${r[0]}<\/td><td>${r[1]}<\/td><\/tr>`).join('')}<\/tbody><\/table>`;\n}\nfunction a4Table(heads, rowsHtml, footHtml){\n  return `<table class=\"a4-tbl\"><thead><tr>${heads.map(h=>`<th class=\"${h[1]||''}\">${h[0]}<\/th>`).join('')}<\/tr><\/thead>\n    <tbody>${rowsHtml}<\/tbody>${footHtml ? `<tfoot>${footHtml}<\/tfoot>` : ''}<\/table>`;\n}\nfunction a4Empty(cols, msg){ return `<tr><td colspan=\"${cols}\" class=\"a4-empty\">${msg}<\/td><\/tr>`; }\n\nfunction a4Shell(title, periodText, bodyHtml, cashierText){\n  const taxParts = [];\n  if(SHOP_COMMERCIAL_REG) taxParts.push(`س.ت: ${a4Esc(SHOP_COMMERCIAL_REG)}`);\n  if(shopTaxNumber()) taxParts.push(`ض.ق: ${a4Esc(shopTaxNumber())}`);\n  const sub = [SHOP_BRANCH ? a4Esc(SHOP_BRANCH) : '', taxParts.join(' | ')].filter(Boolean).map(t=>`<div class=\"a4-sub\">${t}<\/div>`).join('');\n  const now = new Date();\n  return `<div class=\"a4r\">\n    <div class=\"a4-head\">\n      <div class=\"a4-brand\">\n        <img src=\"beans/icon.png\" alt=\"\">\n        <div><div class=\"a4-shop\">${a4Esc(SHOP_NAME)}<\/div>${sub}<\/div>\n      <\/div>\n      <div class=\"a4-meta\">\n        <div><span>تاريخ الإصدار<\/span><b dir=\"ltr\">${a4DateStr(now)} &nbsp; ${a4TimeStr(now)}<\/b><\/div>\n        ${cashierText ? `<div><span>صدر بواسطة<\/span><b>${a4Esc(cashierText)}<\/b><\/div>` : ''}\n      <\/div>\n    <\/div>\n    <div class=\"a4-title\"><h1>${title}<\/h1><div class=\"a4-period\">${periodText}<\/div><\/div>\n    ${bodyHtml}\n    <div class=\"a4-end\">\n      <div class=\"a4-sign\"><div>توقيع الكاشير<\/div><div>توقيع المدير<\/div><\/div>\n      <div class=\"a4-endtxt\">— نهاية التقرير —<\/div>\n    <\/div>\n  <\/div>`;\n}\n\nfunction a4OrderTypeBlock(orders){\n  const S = orderTypeSummary(orders);\n  if(!S.delCount && !S.fees && !S.tax && !S.ptsEarned && !S.ptsUsed) return '';\n  const rows = [\n    [`صالة (${S.dineCount} فاتورة)`, a4N(S.dineTotal)],\n    [`دليفري (${S.delCount} فاتورة)`, a4N(S.delTotal)]\n  ];\n  if(S.fees) rows.push(['منها رسوم التوصيل', a4N(S.fees)]);\n  if(S.tax) rows.push(['إجمالي الضريبة', a4N(S.tax)]);\n  if(S.ptsEarned || S.ptsUsed) rows.push(['نقاط مكتسبة / مستبدلة', `<span class=\"n\">${S.ptsEarned} / ${S.ptsUsed}<\/span>`]);\n  return `<div class=\"a4-block\">${a4Sec('حسب نوع الطلب')}${a4Kv(rows)}<\/div>`;\n}\nfunction a4ItemsTable(orders, emptyMsg){\n  const ranking = itemsSoldRanking(orders);\n  const totalRev = ranking.reduce((s,i)=>s+i.revenue,0);\n  const totalQty = ranking.reduce((s,i)=>s+i.qty,0);\n  const rows = ranking.map((it,idx)=>`<tr><td class=\"c\">${idx+1}<\/td><td>${a4Esc(it.name)}<\/td><td class=\"c\">${a4Qty(it.qty)}<\/td><td class=\"c\">${a4N(it.revenue)}<\/td><td class=\"pc\"><span>${a4Pct(it.revenue,totalRev)}<\/span>${a4Bar(totalRev>0 ? it.revenue/totalRev*100 : 0)}<\/td><\/tr>`).join('');\n  return a4Table([['#','c'],['الصنف',''],['الكمية','c'],['الإيراد (ج.م)','c'],['النسبة','pc']],\n    rows || a4Empty(5, emptyMsg),\n    ranking.length ? `<tr><td><\/td><td>الإجمالي<\/td><td class=\"c\">${a4Qty(totalQty)}<\/td><td class=\"c\">${a4N(totalRev)}<\/td><td><\/td><\/tr>` : '');\n}\nfunction a4CategoryTable(totals, grand, emptyMsg){\n  const rows = Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([label,amt])=>\n    `<tr><td>${a4Esc(label)}<\/td><td class=\"c\">${a4N(amt)}<\/td><td class=\"pc\"><span>${a4Pct(amt,grand)}<\/span>${a4Bar(grand>0 ? amt/grand*100 : 0)}<\/td><\/tr>`).join('');\n  return a4Table([['الفئة',''],['المبيعات (ج.م)','c'],['النسبة من الإجمالي','pc']],\n    rows || a4Empty(3, emptyMsg),\n    rows ? `<tr><td>الإجمالي<\/td><td class=\"c\">${a4N(grand)}<\/td><td><\/td><\/tr>` : '');\n}\nfunction a4PaymentsTable(cash, wallet){\n  const t = cash + wallet;\n  return a4Table([['طريقة الدفع',''],['المبلغ (ج.م)','c'],['النسبة','c']],\n    `<tr><td>كاش (نقدي)<\/td><td class=\"c\">${a4N(cash)}<\/td><td class=\"c\">${a4Pct(cash,t)}<\/td><\/tr>\n     <tr><td>إنستا باي / محافظ<\/td><td class=\"c\">${a4N(wallet)}<\/td><td class=\"c\">${a4Pct(wallet,t)}<\/td><\/tr>`,\n    `<tr><td>الإجمالي<\/td><td class=\"c\">${a4N(t)}<\/td><td class=\"c\">${t>0?'100%':'0.0%'}<\/td><\/tr>`);\n}\n\n/* ---------- تقرير اليوم (A4) ---------- */\nfunction a4DayStats(bd){\n  const orders = bd.orders || [];\n  const paid = orders.filter(o=>!o.owner);\n  const owner = orders.filter(o=>o.owner);\n  const shifts = bd.shifts || [];\n  const expenses = bd.expenses || [];\n  const sum = (arr, f) => arr.reduce((s,x)=>s+(f(x)||0), 0);\n  const cash = sum(paid.filter(o=>(o.paymentMethod||'cash')==='cash'), o=>o.total);\n  const wallet = sum(paid.filter(o=>o.paymentMethod==='instapay' || o.paymentMethod==='wallet'), o=>o.total);\n  const expTotal = sum(expenses, e=>e.amount);\n  const opening = sum(shifts, s=>s.openingCash);\n  const counted = sum(shifts, s=>s.countedCash);\n  return {\n    orders, paid, expenses, shifts,\n    count: orders.length,\n    gross: sum(orders, o=>o.subTotal),\n    discounts: sum(orders, o=>o.discount) + sum(owner, o=>o.total),\n    net: sum(paid, o=>o.total),\n    cash, wallet, expTotal, opening, counted,\n    expected: opening + cash - expTotal,\n    variance: sum(shifts, s=>s.variance),\n    cashiers: [...new Set(shifts.map(sh=>sh.closedByCashier || sh.cashierName).filter(Boolean))].join('، ') || (typeof currentCashier !== 'undefined' && currentCashier ? currentCashier : '')\n  };\n}\nfunction buildA4DayReportHtml(bd, dateKey){\n  const st = a4DayStats(bd);\n  const d = new Date((dateKey || bd.dateKey || a4DateStr(new Date())) + 'T00:00:00');\n  const period = `${a4Weekday(d)} &nbsp;<span class=\"n\">${a4DateStr(d)}<\/span>`;\n  const avg = st.paid.length ? st.net / st.paid.length : 0;\n  const varSign = (st.variance>=0 ? '+' : '-') + fmt2(Math.abs(st.variance));\n  const kpis = `<div class=\"a4-kpis\">\n      ${a4Kpi('صافي المبيعات', a4Money(st.net), 'gold')}\n      ${a4Kpi('عدد الفواتير', `<span class=\"n\">${st.count}<\/span>`)}\n      ${a4Kpi('المصروفات', a4Money(st.expTotal))}\n      ${a4Kpi('صافي الدخل بعد المصروفات', a4Money(st.net - st.expTotal), 'dark')}\n    <\/div>`;\n  const sales = `<div class=\"a4-block\">${a4Sec('ملخص المبيعات')}${a4Kv([\n      ['إجمالي المبيعات', a4N(st.gross)],\n      ['الخصومات', a4Neg(st.discounts)],\n      ['صافي المبيعات', a4N(st.net), 'tot'],\n      ['متوسط الفاتورة', a4N(avg)]\n    ])}<\/div>`;\n  const pay = `<div class=\"a4-block\">${a4Sec('طرق الدفع')}${a4PaymentsTable(st.cash, st.wallet)}<\/div>`;\n  const drawer = `<div class=\"a4-block\">${a4Sec('حركة الدرج النقدي')}${a4Kv([\n      ['العهدة الافتتاحية', a4N(st.opening)],\n      ['المبيعات النقدية', a4N(st.cash)],\n      ['مسحوبات نقدية (مصروفات)', a4Neg(st.expTotal)],\n      ['النقدية المتوقعة بالدرج', a4N(st.expected), 'tot'],\n      ['النقدية الفعلية (العد)', a4N(st.counted)],\n      ['العجز / الزيادة', `<span class=\"n ${st.variance<0?'neg':(st.variance>0?'pos':'')}\">${varSign}<\/span>`]\n    ])}<\/div>`;\n  const typeBlock = a4OrderTypeBlock(st.orders);\n  const { totals, grandTotal } = categorySalesBreakdown(st.orders);\n  const expRows = st.expenses.map((e,i)=>`<tr><td class=\"c\">${i+1}<\/td><td>${a4Esc(expenseCategoryLabel(e.category))}${e.note ? ` <em>(${a4Esc(e.note)})<\/em>` : ''}<\/td><td class=\"c\">${a4Esc(e.time||'-')}<\/td><td class=\"c\">${a4Esc(e.cashierName||'-')}<\/td><td class=\"c\">${a4N(e.amount)}<\/td><\/tr>`).join('');\n  const body = `${kpis}\n    <div class=\"a4-cols\">${sales}${pay}<\/div>\n    <div class=\"a4-cols ${typeBlock ? '' : 'one'}\">${drawer}${typeBlock}<\/div>\n    ${a4Sec('الأصناف المباعة')}\n    ${a4ItemsTable(st.orders, 'لا توجد أصناف مباعة')}\n    ${a4Sec('الفئات حسب المبيعات')}\n    ${a4CategoryTable(totals, grandTotal, 'لا توجد مبيعات')}\n    ${a4Sec('المصروفات')}\n    ${a4Table([['#','c'],['التصنيف / ملاحظة',''],['الوقت','c'],['الكاشير','c'],['المبلغ (ج.م)','c']],\n      expRows || a4Empty(5, 'لا توجد مصروفات مسجلة'),\n      st.expenses.length ? `<tr><td><\/td><td colspan=\"3\">إجمالي المصروفات<\/td><td class=\"c\">${a4N(st.expTotal)}<\/td><\/tr>` : '')}`;\n  return a4Shell('تقرير مبيعات اليوم', period, body, st.cashiers);\n}\nfunction buildPdfDayReport(){\n  document.getElementById('printA4').innerHTML = buildA4DayReportHtml(dayData, dayData.dateKey);\n}\nfunction buildPdfDayDetailReport(dateKey){\n  document.getElementById('printA4').innerHTML = buildA4DayReportHtml(mergedDayView(dateKey), dateKey);\n}\n\n/* ---------- تقرير الشهر (A4) ---------- */\nfunction buildA4MonthReportHtml(){\n  const { y, m } = monthCursor;\n  const monthPrefix = `${y}-${pad2(m+1)}`;\n  const daysInMonth = new Date(y, m+1, 0).getDate();\n  const menuCatMap = buildItemCategoryMap();\n  const dayRows = [], dailySales = [];\n  const monthOrdersAll = [], monthPaidOrders = [];\n  const catTotals = {}, expCatTotals = {};\n  let monthTotal = 0, monthCount = 0, monthExp = 0, cashTotal = 0, walletTotal = 0, catGrand = 0;\n  let bestDay = null, activeDays = 0;\n  for(let d=1; d<=daysInMonth; d++){\n    const key = `${monthPrefix}-${pad2(d)}`;\n    const bds = getBusinessDaysForDate(key);\n    const total = dayTotalFor(key);\n    const cnt = dayOrdersCountFor(key);\n    const exp = bds.reduce((s,bd)=>s + (bd.expenses||[]).reduce((s2,e)=>s2+e.amount,0), 0);\n    monthTotal += total; monthCount += cnt; monthExp += exp;\n    dailySales.push(total);\n    if(cnt>0 || exp>0){\n      if(cnt>0) activeDays++;\n      if(total>0 && (!bestDay || total>bestDay.total)) bestDay = { d, total };\n      dayRows.push(`<tr><td>${d} &nbsp;<span class=\"dow\">${a4Weekday(new Date(y,m,d))}<\/span><\/td><td class=\"c\">${cnt}<\/td><td class=\"c\">${a4N(total)}<\/td><td class=\"c\">${a4N(exp)}<\/td><td class=\"c\">${a4N(total-exp)}<\/td><\/tr>`);\n    }\n    bds.forEach(bd=>{\n      (bd.orders||[]).forEach(o=>{\n        monthOrdersAll.push(o);\n        if(!o.owner){\n          monthPaidOrders.push(o);\n          if((o.paymentMethod||'cash')==='instapay' || o.paymentMethod==='wallet') walletTotal += o.total; else cashTotal += o.total;\n        }\n        (o.items||[]).forEach(i=>{\n          const label = menuCatMap[i.name] || 'أخرى';\n          const amt = (i.price||0) * i.qty;\n          catTotals[label] = (catTotals[label]||0) + amt; catGrand += amt;\n        });\n      });\n      (bd.expenses||[]).forEach(e=>{ expCatTotals[e.category] = (expCatTotals[e.category]||0) + e.amount; });\n    });\n  }\n  const period = `${AR_MONTHS[m]} <span class=\"n\">${y}<\/span> &nbsp;·&nbsp; من <span class=\"n\">${monthPrefix}-01<\/span> إلى <span class=\"n\">${monthPrefix}-${pad2(daysInMonth)}<\/span>`;\n  const avgDaily = activeDays ? monthTotal/activeDays : 0;\n  const kpis = `<div class=\"a4-kpis\">\n      ${a4Kpi('إجمالي مبيعات الشهر', a4Money(monthTotal), 'gold')}\n      ${a4Kpi('عدد الفواتير', `<span class=\"n\">${monthCount}<\/span>`)}\n      ${a4Kpi('المصروفات', a4Money(monthExp))}\n      ${a4Kpi('صافي الدخل بعد المصروفات', a4Money(monthTotal - monthExp), 'dark')}\n    <\/div>\n    <div class=\"a4-kpis three\">\n      ${a4Kpi('أيام العمل', `<span class=\"n\">${activeDays}<\/span>`, 'sm')}\n      ${a4Kpi('متوسط المبيعات اليومي', a4Money(avgDaily), 'sm')}\n      ${a4Kpi('أعلى يوم مبيعاً', bestDay ? `<span class=\"n\">${bestDay.d}<\/span> ${AR_MONTHS[m]} &nbsp;·&nbsp; ${a4Money(bestDay.total)}` : '-', 'sm')}\n    <\/div>`;\n  const maxDay = Math.max(...dailySales, 1);\n  const chart = monthTotal<=0 ? '' : `<div class=\"a4-block\">${a4Sec('المبيعات اليومية')}\n    <div class=\"a4-chart\">${dailySales.map((v,i)=>`<div class=\"col\"><div class=\"bar\" style=\"height:${v>0 ? Math.max(3, Math.round(v/maxDay*96)) : 0}px\"><\/div><div class=\"d\">${i+1}<\/div><\/div>`).join('')}<\/div><\/div>`;\n  const dayTable = a4Table([['اليوم',''],['عدد الفواتير','c'],['المبيعات (ج.م)','c'],['المصروفات (ج.م)','c'],['صافي الدخل (ج.م)','c']],\n    dayRows.join('') || a4Empty(5, 'لا توجد مبيعات في هذا الشهر'),\n    dayRows.length ? `<tr><td>الإجمالي<\/td><td class=\"c\">${monthCount}<\/td><td class=\"c\">${a4N(monthTotal)}<\/td><td class=\"c\">${a4N(monthExp)}<\/td><td class=\"c\">${a4N(monthTotal-monthExp)}<\/td><\/tr>` : '');\n  const typeBlock = a4OrderTypeBlock(monthPaidOrders);\n  const pay = `<div class=\"a4-block\">${a4Sec('طرق الدفع')}${a4PaymentsTable(cashTotal, walletTotal)}<\/div>`;\n  const expRows = Object.entries(expCatTotals).sort((a,b)=>b[1]-a[1]).map(([id,amt])=>\n    `<tr><td>${a4Esc(expenseCategoryLabel(id))}<\/td><td class=\"c\">${a4N(amt)}<\/td><td class=\"pc\"><span>${a4Pct(amt,monthExp)}<\/span>${a4Bar(monthExp>0 ? amt/monthExp*100 : 0)}<\/td><\/tr>`).join('');\n  const body = `${kpis}\n    ${chart}\n    ${a4Sec('تفاصيل الأيام')}\n    ${dayTable}\n    <div class=\"a4-cols ${typeBlock ? '' : 'one'}\">${pay}${typeBlock}<\/div>\n    ${a4Sec('الفئات حسب المبيعات')}\n    ${a4CategoryTable(catTotals, catGrand, 'لا توجد مبيعات في هذا الشهر')}\n    ${a4Sec('الأصناف المباعة')}\n    ${a4ItemsTable(monthOrdersAll, 'لا توجد أصناف مباعة في هذا الشهر')}\n    ${a4Sec('المصروفات حسب التصنيف')}\n    ${a4Table([['التصنيف',''],['الإجمالي (ج.م)','c'],['النسبة','pc']],\n      expRows || a4Empty(3, 'لا توجد مصروفات مسجلة في هذا الشهر'),\n      expRows ? `<tr><td>الإجمالي<\/td><td class=\"c\">${a4N(monthExp)}<\/td><td><\/td><\/tr>` : '')}`;\n  return a4Shell(`تقرير مبيعات شهر ${AR_MONTHS[m]} ${y}`, period, body, (typeof currentCashier !== 'undefined' && currentCashier) ? currentCashier : '');\n}\nfunction buildPdfMonthReport(){\n  document.getElementById('printA4').innerHTML = buildA4MonthReportHtml();\n}\n\n/* ---------- إيصال العميل (Receipt) — عربي أو English حسب إعدادات الشيك ---------- */\nconst RECEIPT_TEXT = {\n  ar: { invoiceNo:'رقم الفاتورة', delivery:'دليفري', customer:'العميل', address:'العنوان', phone:'ت', taxNo:'الرقم الضريبي',\n        simpleTax:'فاتورة ضريبية مبسطة', receipt:'إيصال العميل', preview:'شيك مبدئي — لم يتم تحصيله بعد',\n        owner:'خصم مالك — دون تحصيل', cash:'تم الدفع نقداً', instapay:'تم الدفع عبر: إنستا باي',\n        item:'الصنف', qty:'الكمية', price:'السعر', sub:'الإجمالي الفرعي', disc:'الخصم', ptsDisc:'خصم نقاط',\n        pts:'نقطة', vat:'ضريبة القيمة المضافة', delFee:'رسوم التوصيل', total:'الإجمالي', incl:'منها ضريبة',\n        notes:'ملاحظات', earned:'اكتسبت', inclNote:'الأسعار شاملة الضريبة', cur:'ج.م' },\n  en: { invoiceNo:'Invoice No', delivery:'Delivery', customer:'Customer', address:'Address', phone:'Tel', taxNo:'Tax No',\n        simpleTax:'Simplified Tax Invoice', receipt:'Customer Receipt', preview:'Open check - not paid yet',\n        owner:'Owner discount - no charge', cash:'Paid in cash', instapay:'Paid via InstaPay',\n        item:'Item', qty:'Qty', price:'Price', sub:'Subtotal', disc:'Discount', ptsDisc:'Points discount',\n        pts:'points', vat:'VAT', delFee:'Delivery fee', total:'Total', incl:'Incl. VAT',\n        notes:'Notes', earned:'You earned', inclNote:'Prices include VAT', cur:'EGP' }\n};\n\nfunction buildReceiptHtml(order){\n  const cs = getCheckSettings();\n  const en = cs.receiptLang === 'en';\n  const T = RECEIPT_TEXT[en ? 'en' : 'ar'];\n  const money = n => en ? (+n || 0).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }) : fmtMoney(n);\n\n  const rows = order.items.map(i=>`<tr><td>${escapeHtmlPos(i.name)}<\/td><td style=\"text-align:center;\">×${i.qty}<\/td><td>${money(i.price*i.qty)}<\/td><\/tr>`).join('');\n  const dateStr = en\n    ? new Date(order.id).toLocaleDateString('en-GB', {year:'numeric', month:'short', day:'2-digit'})\n    : new Date(order.id).toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});\n  const paymentLabel = order.preview ? T.preview : (order.owner ? T.owner : ((order.paymentMethod || 'cash') === 'instapay' ? T.instapay : T.cash));\n  const ptsDisc = order.pointsDiscount || 0;\n  const manualDisc = Math.max(0, (order.discount || 0) - ptsDisc);\n  const hasTax = order.taxRate > 0;\n  const inclusive = hasTax && order.taxMode !== 'exclusive';\n  const isDelivery = order.orderType === 'delivery';\n  const footer = en ? (cs.footerEn || '') : cs.footerText;\n  const header = [cs.address, cs.phone ? T.phone+': '+cs.phone : '', (hasTax && cs.taxNumber) ? T.taxNo+': '+cs.taxNumber : ''].filter(Boolean).map(escapeHtmlPos).join('<br>');\n  return `\n    <h1>${escapeHtmlPos(cs.businessName)}<\/h1>\n    ${header ? `<div class=\"meta\">${header}<\/div>` : ''}\n    <div class=\"sub\">${hasTax && !order.preview ? T.simpleTax : T.receipt}<\/div>\n    <div class=\"meta\">\n      ${order.invoiceNo ? `${T.invoiceNo}: ${order.invoiceNo}<br>` : ''}\n      ${isDelivery ? `<svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2 6h12v10H2zM14 10h4l3 3v3h-7\"/><circle cx=\"6\" cy=\"18\" r=\"2\"/><circle cx=\"17\" cy=\"18\" r=\"2\"/><\/svg> ${T.delivery}` : escapeHtmlPos(order.tableName)}<br>\n      ${order.customerName ? `${T.customer}: ${escapeHtmlPos(order.customerName)}${order.customerPhone ? ' — '+escapeHtmlPos(order.customerPhone) : ''}<br>` : ''}\n      ${isDelivery && order.deliveryAddress ? `${T.address}: ${escapeHtmlPos(order.deliveryAddress)}<br>` : ''}\n      ${dateStr} — ${order.time}<br>\n      ${paymentLabel}\n    <\/div>\n    <table>\n      <thead><tr><th>${T.item}<\/th><th style=\"text-align:center;\">${T.qty}<\/th><th>${T.price}<\/th><\/tr><\/thead>\n      <tbody>${rows}<\/tbody>\n      <tfoot>\n        <tr><td colspan=\"2\">${T.sub}<\/td><td>${money(order.subTotal)} ${T.cur}<\/td><\/tr>\n        ${manualDisc>0 ? `<tr><td colspan=\"2\">${T.disc}<\/td><td>-${money(manualDisc)} ${T.cur}<\/td><\/tr>` : ''}\n        ${ptsDisc>0 ? `<tr><td colspan=\"2\">${T.ptsDisc} (${order.pointsRedeemed} ${T.pts})<\/td><td>-${money(ptsDisc)} ${T.cur}<\/td><\/tr>` : ''}\n        ${hasTax && !inclusive ? `<tr><td colspan=\"2\">${T.vat} ${order.taxRate}%<\/td><td>${money(order.tax)} ${T.cur}<\/td><\/tr>` : ''}\n        ${order.deliveryFee>0 ? `<tr><td colspan=\"2\">${T.delFee}<\/td><td>${money(order.deliveryFee)} ${T.cur}<\/td><\/tr>` : ''}\n        <tr><td colspan=\"2\">${T.total}<\/td><td>${money(order.total)} ${T.cur}<\/td><\/tr>\n        ${inclusive ? `<tr><td colspan=\"2\">${T.incl} ${order.taxRate}%<\/td><td>${money(order.tax)} ${T.cur}<\/td><\/tr>` : ''}\n      <\/tfoot>\n    <\/table>\n    ${order.notes ? `<div class=\"meta\" style=\"margin-top:6px;\">${T.notes}: ${escapeHtmlPos(order.notes)}<\/div>` : ''}\n    ${(order.pointsEarned && cs.showPointsOnReceipt) ? `<div class=\"foot-note\" style=\"margin-top:6px;\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z\"/><\/svg> ${T.earned} ${order.pointsEarned} ${T.pts}<\/div>` : ''}\n    ${(cs.showInstapay && cs.instapayNumber) ? `<div class=\"foot-note\" style=\"margin-top:6px; font-weight:700;\">InstaPay: ${escapeHtmlPos(cs.instapayNumber)}<\/div>` : ''}\n    ${(cs.taxLabelOn && hasTax && inclusive) ? `<div class=\"foot-note\">${T.inclNote}<\/div>` : ''}\n    ${footer ? `<div class=\"foot-note\">${escapeHtmlPos(footer)}<\/div>` : ''}`;\n}\nfunction printReceipt(order){\n  printThermal(`receipt-${order.tableName.replace(/\\s+/g,'-')}-${fileStamp()}`, buildReceiptHtml(order), 'printReceipt');\n}\n\n// طباعة شيك مبدئي للعميل من غير حفظ فاتورة أو خصم مخزون أو إغلاق الترابيزة.\nfunction printOpenCheck(){\n  const tData = tablesCarts[activeHall][activeTable];\n  if(!tData || tData.items.length===0){ showToast('الشيك فارغ'); return; }\n  const T = computeCheckTotals();\n  const draft = {\n    id: Date.now(),\n    tableName: tableDisplayLabel(activeHall, activeTable),\n    time: new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}),\n    items: tData.items.map(i=>({name:i.name, price:i.price, qty:i.qty})),\n    subTotal: T.sub,\n    discount: r2(T.manualDisc + T.ptsDisc),\n    notes: tData.notes || '',\n    total: T.grand,\n    preview: true\n  };\n  Object.assign(draft, orderExtraFields(T));\n  delete draft.pointsEarned;\n  printReceipt(draft);\n  showToast('تمت طباعة شيك مبدئي — لم يُحصّل أو يُغلق');\n}\n\n/* ---------- بون الباريستا (Kitchen Order Ticket) ---------- */\nfunction buildBonHtml(items, tableName, notes, isAddition){\n  const rows = items.map(i=>`<tr><td>${i.name}<\/td><td style=\"text-align:center;\">×${i.qty}<\/td><\/tr>`).join('');\n  return `\n    <div class=\"bon-title\">${isAddition ? 'بون إضافة' : 'بون طلب'}<\/div>\n    <div class=\"meta\">\n      الترابيزة: ${tableName}<br>\n      الوقت: ${new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}\n    <\/div>\n    <table class=\"bon-table\">\n      <tbody>${rows}<\/tbody>\n    <\/table>\n    ${notes ? `<div class=\"meta\" style=\"margin-top:8px;\">ملاحظات: ${notes}<\/div>` : ''}\n    <div class=\"foot-note\">-- نسخة الباريستا فقط --<\/div>`;\n}\nfunction printBon(){\n  const tData = tablesCarts[activeHall][activeTable];\n  if(tData.items.length===0){\n    showToast('الشيك فارغ، لا توجد أصناف لطباعة البون');\n    return;\n  }\n  if(!tData.printedBon) tData.printedBon = {};\n\n  // بنطبع بس الأصناف الجديدة أو Qty الزيادة عن آخر بون اتطبع للترابيزة دي،\n  // عشان الباريستا مايستلمش نفس Item مرتين\n  const isAddition = Object.keys(tData.printedBon).length > 0;\n  const newItems = [];\n  tData.items.forEach(i=>{\n    const already = tData.printedBon[i.name] || 0;\n    const delta = i.qty - already;\n    if(delta > 0) newItems.push({name: i.name, qty: delta});\n  });\n\n  if(newItems.length===0){\n    showToast('تمت طباعة كل الأصناف في بون سابق، لا توجد أصناف جديدة للطباعة');\n    return;\n  }\n\n  let tableName = tableDisplayLabel(activeHall, activeTable);\n  const bonT = computeCheckTotals();\n  if(bonT.isDelivery) tableName += ' —  دليفري' + (bonT.customer ? ' ('+bonT.customer.name+')' : '');\n  printThermal(`ticket-${tableName.replace(/\\s+/g,'-')}-${fileStamp()}`, buildBonHtml(newItems, tableName, tData.notes, isAddition), 'printBon');\n\n  // بعد الطباعة نسجل إن الكميات دي اتطبعت عشان مايتكررش طبعها في بون جاي\n  tData.items.forEach(i=>{ tData.printedBon[i.name] = i.qty; });\n  saveTablesCarts();\n}\ndocument.getElementById('printBonBtnD').addEventListener('click', printBon);\ndocument.getElementById('printBonBtnM').addEventListener('click', printBon);\n\n/* ============ GENERIC CONFIRM MODAL (بديل عن confirm() الأصلي في المتصفح) ============ */\nconst confirmModalOverlay = document.getElementById('confirmModalOverlay');\nlet confirmResolver = null;\nfunction customConfirm(message, title, okLabel){\n  document.getElementById('confirmModalTitle').textContent = title || 'تأكيد';\n  document.getElementById('confirmModalMsg').textContent = message;\n  document.getElementById('confirmModalOk').textContent = okLabel || 'تأكيد';\n  confirmModalOverlay.classList.add('show');\n  return new Promise((resolve)=>{ confirmResolver = resolve; });\n}\ndocument.getElementById('confirmModalOk').addEventListener('click', ()=>{\n  confirmModalOverlay.classList.remove('show');\n  if(confirmResolver){ confirmResolver(true); confirmResolver = null; }\n});\ndocument.getElementById('confirmModalCancel').addEventListener('click', ()=>{\n  confirmModalOverlay.classList.remove('show');\n  if(confirmResolver){ confirmResolver(false); confirmResolver = null; }\n});\n\n/* ============ Z-REPORT (تقرير إغلاق اليوم عند إغلاق الوردية + إنهاء يوم العمل) ============ */\nfunction nextZReportNumber(){\n  const closedCount = Object.values(appData.history).filter(d=>d.closedAt).length;\n  return '#' + String(closedCount + 1).padStart(4,'0');\n}\nfunction zrRow(label, value, cls){\n  return `<div class=\"zr-row${cls?' '+cls:''}\"><span class=\"k\">${label}<\/span><span class=\"v\">${value}<\/span><\/div>`;\n}\nfunction zrExpensesByCategoryHtml(expenses){\n  const list = expenses || [];\n  if(!list.length) return '';\n  const totals = {};\n  list.forEach(e=>{\n    const key = e.category || 'other';\n    totals[key] = (totals[key]||0) + (e.amount||0);\n  });\n  const rows = EXPENSE_CATEGORIES\n    .filter(c => totals[c.id])\n    .map(c => zrRow(c.label + ':', '-'+fmt2(totals[c.id])))\n    .join('');\n  return `\n    <div class=\"zr-section\" style=\"margin-top:8px;\">[المسحوبات حسب النوع]<\/div>\n    ${rows}`;\n}\nfunction zrExpensesHtml(expenses){\n  const list = expenses || [];\n  if(!list.length) return '';\n  const rows = list.map(e=>{\n    const noteStr = e.note ? ` (${e.note})` : '';\n    return zrRow(`${expenseCategoryLabel(e.category)}${noteStr} — ${e.time}`, fmt2(e.amount));\n  }).join('');\n  return `\n    <div class=\"zr-hr1\"><\/div>\n    <div class=\"zr-section\">[تفاصيل المسحوبات]<\/div>\n    ${rows}`;\n}\n// سطر لكل صنف اتباع: اسم الصنف — الكمية × إجمالي إيراده، بنفس شكل سطور الـ Z-Report بالظبط (زي [تفاصيل المسحوبات])\nfunction quantityByItemZStyleHtml(orders){\n  const ranking = itemsSoldRanking(orders);\n  const rows = ranking.map(it=> zrRow(it.name+':', `${fmtQty(it.qty)} × ${fmt2(it.revenue)}`)).join('');\n  return `\n    <div class=\"zr-hr1\"><\/div>\n    <div class=\"zr-section\">[الكمية حسب الصنف]<\/div>\n    ${rows || zrRow('لا توجد أصناف مباعة', '')}`;\n}\nfunction buildZReportHtml(bd, opts){\n  opts = opts || {};\n  const orders = bd.orders || [];\n  const paidOrders = orders.filter(o=>!o.owner);\n  const ownerOrders = orders.filter(o=>o.owner);\n  const shifts = bd.shifts || [];\n\n  const grossSales = orders.reduce((s,o)=>s+o.subTotal, 0);\n  const netAchievedSales = paidOrders.reduce((s,o)=>s+o.total, 0);\n\n  const cashTotal = paidOrders.filter(o=>(o.paymentMethod||'cash')==='cash').reduce((s,o)=>s+o.total,0);\n  const walletTotal = paidOrders.filter(o=>o.paymentMethod==='instapay' || o.paymentMethod==='wallet').reduce((s,o)=>s+o.total,0);\n\n  const invoiceDiscounts = orders.reduce((s,o)=>s+(o.discount||0), 0);\n  const ownerDiscountsTotal = ownerOrders.reduce((s,o)=>s+o.total, 0);\n  const expensesTotal = (bd.expenses||[]).reduce((s,e)=>s+e.amount,0);\n  const invoiceCount = orders.length;\n\n  // حركة الدرج النقدي على مستوى يوم العمل كله (تجميع كل الورديات اللي اتقفلت خلاله)\n  const openingCashTotal = shifts.reduce((s,sh)=>s+(sh.openingCash||0),0);\n  const countedCashTotal = shifts.reduce((s,sh)=>s+(sh.countedCash||0),0);\n  const expectedCashTotal = openingCashTotal + cashTotal - expensesTotal;\n  const varianceTotal = shifts.reduce((s,sh)=>s+(sh.variance||0),0);\n  const varianceLbl = (varianceTotal>=0?'+':'-') + fmt2(Math.abs(varianceTotal));\n\n  const cashierNames = [...new Set(shifts.map(sh=>sh.closedByCashier || sh.cashierName).filter(Boolean))].join('، ') || (currentCashier || '-');\n\n  const now = new Date();\n  const dateStr = (opts.dateOverride || now).toLocaleDateString('en-CA'); // YYYY-MM-DD\n  const timeStr = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});\n\n  const branchLine = SHOP_BRANCH ? `<div class=\"zr-branch\">${SHOP_BRANCH}<\/div>` : '';\n  const taxParts = [];\n  if(SHOP_COMMERCIAL_REG) taxParts.push(`س.ت: ${SHOP_COMMERCIAL_REG}`);\n  if(shopTaxNumber()) taxParts.push(`ض.ق: ${shopTaxNumber()}`);\n  const taxLine = taxParts.length ? `<div class=\"zr-taxline\">${taxParts.join(' | ')}<\/div>` : '';\n\n  return `\n    <div class=\"zr\">\n      <div class=\"zr-shop\">${SHOP_NAME}<\/div>\n      ${branchLine}\n      ${taxLine}\n      <div class=\"zr-hr2\"><\/div>\n      <div class=\"zr-title\">${opts.titleText || '** تقرير إغلاق اليوم (Z-REPORT) **'}<\/div>\n      <div class=\"zr-hr2\"><\/div>\n\n      ${zrRow('رقم التقرير:', nextZReportNumber())}\n      <div class=\"zr-meta-row\"><span>التاريخ: ${dateStr}<\/span><span>الوقت: ${timeStr}<\/span><\/div>\n      ${zrRow('اسم الكاشير:', cashierNames)}\n\n      <div class=\"zr-hr1\"><\/div>\n      <div class=\"zr-section\">[ملخص المبيعات]<\/div>\n      ${zrRow('إجمالي المبيعات:', fmt2(grossSales))}\n      ${zrRow('الخصومات:', '-'+fmt2(invoiceDiscounts+ownerDiscountsTotal))}\n      <div class=\"zr-hr1\"><\/div>\n      ${zrRow('صافي المبيعات:', fmt2(netAchievedSales), 'total')}\n\n      <div class=\"zr-hr1\"><\/div>\n      <div class=\"zr-section\">[طرق الدفع]<\/div>\n      ${zrRow('كاش (نقدي):', fmt2(cashTotal))}\n      ${zrRow('فودافون كاش / محافظ:', fmt2(walletTotal))}\n\n      <div class=\"zr-hr1\"><\/div>\n      <div class=\"zr-section\">[حركة الدرج النقدي]<\/div>\n      ${zrRow('العهدة الافتتاحية:', fmt2(openingCashTotal))}\n      ${zrRow('المبيعات النقدية:', fmt2(cashTotal))}\n      ${zrRow('مسحوبات نقدية (صرف):', '-'+fmt2(expensesTotal))}\n      ${zrExpensesByCategoryHtml(bd.expenses)}\n      <div class=\"zr-hr1\"><\/div>\n      ${zrRow('النقدية المتوقعة بالدرج:', fmt2(expectedCashTotal))}\n      ${zrRow('النقدية الفعلية (العد):', fmt2(countedCashTotal))}\n      ${zrRow('العجز / الزيادة:', varianceLbl)}\n\n      <div class=\"zr-hr1\"><\/div>\n      ${zrRow('عدد الفواتير:', invoiceCount)}\n      ${zrExpensesHtml(bd.expenses)}\n      ${typeSummaryZHtml(orders)}\n      ${opts.extraHtml || ''}\n\n      <div class=\"zr-hr2\"><\/div>\n      <div class=\"zr-foot\">${opts.footText || 'تم إغلاق اليوم بنجاح'}<\/div>\n      <div class=\"zr-hr2\"><\/div>\n    <\/div>`;\n}\nfunction printZReport(bd){\n  return printThermal(`تقرير-Z-اغلاق-اليوم-${fileStamp()}`, buildZReportHtml(bd), 'printZReport');\n}\n\n/* ============ END OF DAY (Close Business Day) ============ */\n// \"يوم العمل\" بيتحدد بوقت فتح أول وردية، وبيفضل مفتوح حتى لو عدى نص الليل.\n// دلوقتي إغلاق يوم العمل مدموج تلقائياً مع زر \"إغلاق الوردية\": بمجرد إغلاق\n// الوردية (ولو مفيش وردية تانية مفتوحة)، بيتقفل يوم العمل تلقائياً وتتطبع\n// تقرير Z، وأول وردية جديدة هتبدأ يوم عمل جديد تلقائياً.\n// Close Business Day مبيمسحش أي بيانات — تفضل محفوظة للأبد في تقارير الشهر.\nasync function resetDay(){\n  const activeShift = getOpenShift();\n  if(activeShift) return; // لسه فيه وردية مفتوحة، متقفلش يوم العمل\n  const bd = getCurrentBusinessDay();\n  if(!bd) return;\n  await printZReport(bd);\n  bd.closedAt = new Date().toISOString();\n  appData.currentBusinessDayKey = null;\n  saveDay();\n  refreshDayDataPointer();\n  updateDayPill();\n  updateShiftPill();\n  renderDayModal();\n  cloudSync('syncBusinessDay', bd);\n}\n\n/* ============ CASH DRAWER (فتح درج الكاشير تلقائياً عبر طابعة الفواتير XP-80) ============ */\nconst DRAWER_SETTINGS_KEY = 'beans_drawer_settings';\nfunction getDrawerSettings(){\n  try{\n    const raw = localStorage.getItem(DRAWER_SETTINGS_KEY);\n    if(raw) return JSON.parse(raw);\n  }catch(e){}\n  return { printerName: 'XP-80', autoOpen: true };\n}\nfunction saveDrawerSettings(settings){\n  localStorage.setItem(DRAWER_SETTINGS_KEY, JSON.stringify(settings));\n}\nfunction loadDrawerSettingsForm(){\n  const s = getDrawerSettings();\n  const nameEl = document.getElementById('drawerPrinterInput');\n  const autoEl = document.getElementById('drawerAutoOpenChk');\n  if(nameEl) nameEl.value = s.printerName || '';\n  if(autoEl) autoEl.checked = s.autoOpen !== false;\n}\nasync function openCashDrawer(silent){\n  const s = getDrawerSettings();\n  if(!s.printerName){\n    if(!silent) showToast('من فضلك سجّلي اسم طابعة الفواتير (XP-80) من لوحة الأدمن الأول');\n    return false;\n  }\n  if(!window.electronAPI || !window.electronAPI.openDrawer){\n    if(!silent) showToast('فتح الدرج بيشتغل بس من نسخة سطح المكتب (exe) مش من المتصفح');\n    return false;\n  }\n  try{\n    const result = await window.electronAPI.openDrawer(s.printerName);\n    if(result && result.ok){\n      if(!silent) showToast('تم فتح الدرج بنجاح ');\n      return true;\n    } else {\n      if(!silent) showToast('تعذر فتح الدرج — تأكدي من اسم الطابعة (XP-80) واسمها بالظبط زي في ويندوز، وإنها متوصلة وشغالة');\n      return false;\n    }\n  }catch(e){\n    if(!silent) showToast('تعذر فتح الدرج — تأكدي من اسم الطابعة (XP-80) واسمها بالظبط زي في ويندوز، وإنها متوصلة وشغالة');\n    return false;\n  }\n}\ndocument.getElementById('saveDrawerSettingsBtn').addEventListener('click', () => {\n  const printerName = document.getElementById('drawerPrinterInput').value.trim();\n  const autoOpen = document.getElementById('drawerAutoOpenChk').checked;\n  if(!printerName){ showToast('من فضلك اكتبي اسم الطابعة'); return; }\n  saveDrawerSettings({ printerName, autoOpen });\n  showToast('تم حفظ إعدادات الدرج بنجاح');\n});\ndocument.getElementById('testDrawerBtn').addEventListener('click', () => openCashDrawer(false));\n\n/* ============ إظهار/إخفاء زر \"تحصيل إنستا باي وإغلاق الشيك\" من شاشة الكاشير ============ */\nconst SHOW_INSTAPAY_BTN_KEY = 'beans_show_instapay_btn';\nfunction getShowInstapayBtnSetting(){\n  const raw = localStorage.getItem(SHOW_INSTAPAY_BTN_KEY);\n  return raw === null ? true : raw === '1'; // افتراضياً ظاهر لحد ما حد يخفيه بنفسه\n}\nfunction applyInstapayBtnVisibility(){\n  const show = getShowInstapayBtnSetting();\n  ['instapayBtnD','instapayBtnM'].forEach(id=>{\n    const btn = document.getElementById(id);\n    if(btn) btn.style.display = show ? '' : 'none';\n  });\n}\nfunction loadInstapayBtnSettingForm(){\n  const chk = document.getElementById('showInstapayBtnChk');\n  if(chk) chk.checked = getShowInstapayBtnSetting();\n}\ndocument.getElementById('showInstapayBtnChk').addEventListener('change', (e) => {\n  localStorage.setItem(SHOW_INSTAPAY_BTN_KEY, e.target.checked ? '1' : '0');\n  applyInstapayBtnVisibility();\n  showToast(e.target.checked ? 'تم إظهار زر تحصيل إنستا باي' : 'تم إخفاء زر تحصيل إنستا باي');\n});\napplyInstapayBtnVisibility();\n\nfunction refreshShiftAmountsBtn(){\n  const btn = document.getElementById('toggleShiftAmountsBtn');\n  if(!btn) return;\n  const on = getShowShiftAmounts();\n  btn.textContent = on ? 'إخفاء مبالغ الوردية (ظاهرة حالياً)' : 'إظهار مبالغ الوردية (مخفية حالياً)';\n  btn.classList.toggle('btn-gold', on);\n  btn.classList.toggle('btn-outline', !on);\n}\ndocument.getElementById('toggleShiftAmountsBtn').addEventListener('click', ()=>{\n  localStorage.setItem('beans_show_shift_amounts', getShowShiftAmounts() ? '0' : '1');\n  refreshShiftAmountsBtn();\n  updateShiftPill();\n  renderShiftModal();\n  showToast(getShowShiftAmounts() ? 'تم إظهار مبالغ الوردية' : 'تم إخفاء مبالغ الوردية');\n});\nrefreshShiftAmountsBtn();\n\n/* ============ BACKUP: EXPORT / IMPORT / WIPE ============ */\n// نسخة احتياطية كاملة: بتاخد كل حاجة محفوظة في البرنامج مش بس المبيعات —\n// المنيو والأسعار، حسابات الكاشير وصلاحياتها، الصالات والترابيزات المفتوحة حالياً،\n// المخزون، وكلمات المرور وإعدادات درج الكاشير.\n// أي حاجة تتضاف تخزينها في localStorage مستقبلاً لازم تتضاف هنا كمان عشان \"نسخة كاملة\" تفضل فعلاً كاملة.\nfunction exportBackup(){\n  const payload = {\n    exportedAt: new Date().toISOString(),\n    app: 'beans-pos',\n    backupVersion: 2,\n    menu: MENU,\n    data: appData,\n    inventory: inventoryData,\n    accounts: ACCOUNTS,\n    staffProfiles: staffProfiles,\n    halls: HALLS,\n    openTables: tablesCarts,\n    adminPassword: getAdminPassword(),\n    decrementPassword: getDecrementPassword(),\n    discountPassword: getDiscountPassword(),\n    drawerSettings: getDrawerSettings(),\n    checkSettings: getCheckSettings(),\n    customers: loadCustomers(),\n    barcodes: loadBarcodes()\n  };\n  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = `beans-pos-backup-${fileStamp()}.json`;\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n  showToast('تم تنزيل النسخة الاحتياطية الكاملة بنجاح');\n}\n\nasync function importBackupFile(file){\n  try{\n    const text = await file.text();\n    const parsed = JSON.parse(text);\n    if(!parsed || !parsed.data || !parsed.data.history){\n      showToast('ملف النسخة الاحتياطية غير صالح');\n      return;\n    }\n    const ok = await customConfirm(\n      'استيراد النسخة الاحتياطية هيستبدل كل البيانات الحالية (المبيعات، الحسابات، المنيو، الصالات، المخزون، وكلمات المرور) بالبيانات اللي في الملف. هل أنت متأكد؟',\n      'استيراد نسخة احتياطية', 'استيراد واستبدال'\n    );\n    if(!ok) return;\n\n    appData = parsed.data;\n    if(appData.currentBusinessDayKey === undefined) appData.currentBusinessDayKey = null;\n\n    if(parsed.menu){\n      MENU = parsed.menu;\n      localStorage.setItem('beans_menu', JSON.stringify(MENU));\n      cloudSync('syncMenu', MENU);\n    }\n\n    if(parsed.inventory && Array.isArray(parsed.inventory.items)){\n      inventoryData = parsed.inventory;\n      if(!inventoryData.recipes) inventoryData.recipes = {};\n      if(!inventoryData.movements) inventoryData.movements = [];\n      if(!inventoryData.audits) inventoryData.audits = [];\n      saveInventory();\n    }\n\n    // حسابات الكاشير وصلاحياتها\n    if(Array.isArray(parsed.accounts)){\n      ACCOUNTS = parsed.accounts;\n      saveAccounts();\n      applyAccountsUpdate(ACCOUNTS);\n    }\n\n    // ملفات موظفين الاستاف\n    if(Array.isArray(parsed.staffProfiles)){\n      staffProfiles = parsed.staffProfiles;\n      saveStaffProfiles();\n    }\n\n    // الصالات والترابيزات (لو موجودين في النسخة الاحتياطية)\n    if(Array.isArray(parsed.halls) && parsed.halls.length > 0){\n      HALLS = parsed.halls;\n      saveHalls();\n    }\n    if(parsed.openTables && typeof parsed.openTables === 'object'){\n      tablesCarts = parsed.openTables;\n    }\n    ensureTablesCartsShape();\n    saveTablesCarts();\n\n    // كلمات المرور وإعدادات الدرج\n    if(typeof parsed.adminPassword === 'string' && parsed.adminPassword) setAdminPassword(parsed.adminPassword);\n    if(typeof parsed.decrementPassword === 'string' && parsed.decrementPassword) setDecrementPassword(parsed.decrementPassword);\n    if(typeof parsed.discountPassword === 'string' && parsed.discountPassword) setDiscountPassword(parsed.discountPassword);\n    if(parsed.drawerSettings && typeof parsed.drawerSettings === 'object') saveDrawerSettings(parsed.drawerSettings);\n    if(parsed.checkSettings && typeof parsed.checkSettings === 'object') saveCheckSettings(Object.assign(checkSettingsDefaults(), parsed.checkSettings));\n    if(Array.isArray(parsed.customers)) saveCustomers(parsed.customers);\n    if(parsed.barcodes && typeof parsed.barcodes === 'object') localStorage.setItem(barcodesStorageKey(), JSON.stringify(parsed.barcodes));\n\n    refreshDayDataPointer();\n    saveDay();\n    updateDayPill();\n    updateShiftPill();\n    // نتأكد إن الصالة والترابيزة النشطة حالياً لسه موجودين فعلاً بعد استيراد صالات النسخة الاحتياطية،\n    // لو مش موجودين (مثلاً كانت الشاشة فاتحة على صالة اتمسحت) نرجع لأول صالة وترابيزة موجودين\n    ensureActiveHall();\n    renderHallTabs();\n    renderTabs();\n    renderAll(); // renderAll() بترندر التاربيزات + المنيو + الشيك المفتوح حالياً (كانت رندر الشيك ناقصة هنا وده كان سبب إن التاربيزات المفتوحة مكنتش بتظهر بعد الاستيراد)\n    showToast('تم استيراد النسخة الاحتياطية الكاملة بنجاح');\n  }catch(e){\n    console.error('Backup import failed', e);\n    showToast('حصل خطأ أثناء قراءة الملف — تأكد إنه ملف نسخة احتياطية صحيح');\n  }\n}\n\ndocument.getElementById('exportBackupBtn').addEventListener('click', exportBackup);\ndocument.getElementById('importBackupBtn').addEventListener('click', ()=>{\n  document.getElementById('importFileInput').click();\n});\ndocument.getElementById('importFileInput').addEventListener('change', (e)=>{\n  const file = e.target.files[0];\n  if(file) importBackupFile(file);\n  e.target.value = '';\n});\ndocument.getElementById('saveAdminPasswordBtn').addEventListener('click', ()=>{\n  const val = document.getElementById('newAdminPasswordInput').value;\n  const confirmVal = document.getElementById('confirmAdminPasswordInput').value;\n  if(!val || val.length < 4){\n    showToast('اكتبي كلمة مرور 4 حروف/أرقام على الأقل');\n    return;\n  }\n  if(val !== confirmVal){\n    showToast('كلمة المرور وتأكيدها مش متطابقين');\n    return;\n  }\n  setAdminPassword(val);\n  document.getElementById('newAdminPasswordInput').value = '';\n  document.getElementById('confirmAdminPasswordInput').value = '';\n  showToast('تم تغيير كلمة مرور الأدمن بنجاح');\n});\n\ndocument.getElementById('saveDecrementPasswordBtn').addEventListener('click', ()=>{\n  const val = document.getElementById('newDecrementPasswordInput').value;\n  const confirmVal = document.getElementById('confirmDecrementPasswordInput').value;\n  if(!val || val.length < 4){\n    showToast('اكتبي كلمة مرور 4 حروف/أرقام على الأقل');\n    return;\n  }\n  if(val !== confirmVal){\n    showToast('كلمة المرور وتأكيدها مش متطابقين');\n    return;\n  }\n  setDecrementPassword(val);\n  document.getElementById('newDecrementPasswordInput').value = '';\n  document.getElementById('confirmDecrementPasswordInput').value = '';\n  showToast('تم تغيير كلمة مرور إنقاص الأصناف بنجاح');\n});\n\ndocument.getElementById('saveDiscountPasswordBtn').addEventListener('click', ()=>{\n  const val = document.getElementById('newDiscountPasswordInput').value;\n  const confirmVal = document.getElementById('confirmDiscountPasswordInput').value;\n  if(!val || val.length < 4){\n    showToast('اكتبي كلمة مرور 4 حروف/أرقام على الأقل');\n    return;\n  }\n  if(val !== confirmVal){\n    showToast('كلمة المرور وتأكيدها مش متطابقين');\n    return;\n  }\n  setDiscountPassword(val);\n  document.getElementById('newDiscountPasswordInput').value = '';\n  document.getElementById('confirmDiscountPasswordInput').value = '';\n  showToast('تم تغيير كلمة مرور الخصم بنجاح');\n});\n\ndocument.getElementById('wipeAllDataBtn').addEventListener('click', async ()=>{\n  const ok = await customConfirm(\n    'هيتم مسح كل المبيعات والورديات والتقارير وبيانات المخزون المحفوظة نهائياً من هذا الجهاز، من غير رجعة. ينصح تنزل نسخة احتياطية الأول.',\n    'مسح كل البيانات', 'مسح نهائياً'\n  );\n  if(!ok) return;\n  appData = { history: {}, currentBusinessDayKey: null };\n  inventoryData = { items: [], recipes: {}, movements: [], audits: [] };\n  saveInventory();\n  refreshDayDataPointer();\n  saveDay();\n  updateDayPill();\n  updateShiftPill();\n  showToast('تم مسح كل البيانات المحفوظة');\n});\n\n/* ============ TOAST ============ */\nlet toastTimer;\nfunction showToast(msg){\n  const t = document.getElementById('toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);\n}\n\n/* ============ SHEET / MODAL WIRING ============ */\nconst sheetOverlay = document.getElementById('sheetOverlay');\nfunction openSheet(){ sheetOverlay.classList.add('show'); }\nfunction closeSheet(){ sheetOverlay.classList.remove('show'); }\ndocument.getElementById('mobileBarInner').addEventListener('click', ()=>{\n  if(cartCount()>0) openSheet();\n});\nsheetOverlay.addEventListener('click', (e)=>{ if(e.target===sheetOverlay) closeSheet(); });\n\nconst dayModalOverlay = document.getElementById('dayModalOverlay');\nfunction openDayModalToDayTab(){\n  document.getElementById('repTabDay').classList.add('active');\n  document.getElementById('repTabMonth').classList.remove('active');\n  document.getElementById('repPaneDay').classList.add('active');\n  document.getElementById('repPaneMonth').classList.remove('active');\n  document.getElementById('repTabAdv').classList.remove('active');\n  document.getElementById('repPaneAdv').classList.remove('active');\n  orderListState.orderList.selectMode = false;\n  orderListState.orderList.selected.clear();\n  renderDayModal();\n  dayModalOverlay.classList.add('show');\n}\nconst salesPinModalOverlay = document.getElementById('salesPinModalOverlay');\ndocument.getElementById('dayPillBtn').addEventListener('click', ()=>{\n  if(!hasPermission('sales')){ notAllowedToast(); return; }\n  openDayModalToDayTab();\n});\ndocument.getElementById('dayModalClose').addEventListener('click', ()=>dayModalOverlay.classList.remove('show'));\ndayModalOverlay.addEventListener('click', (e)=>{ if(e.target===dayModalOverlay) dayModalOverlay.classList.remove('show'); });\n\ndocument.getElementById('checkoutBtnD').addEventListener('click', ()=>checkout('cash'));\ndocument.getElementById('checkoutBtnM').addEventListener('click', ()=>checkout('cash'));\ndocument.getElementById('instapayBtnD').addEventListener('click', ()=>checkout('instapay'));\ndocument.getElementById('instapayBtnM').addEventListener('click', ()=>checkout('instapay'));\ndocument.getElementById('printCheckBtnD').addEventListener('click', printOpenCheck);\ndocument.getElementById('printCheckBtnM').addEventListener('click', printOpenCheck);\ndocument.getElementById('printBtn').addEventListener('click', printReport);\nfunction savePdfDayReport(){\n  printWithFilename(`تقرير-مبيعات-يوم-${fileStamp()}`, buildPdfDayReport, 'printA4', 'a4');\n}\ndocument.getElementById('savePdfDayBtn').addEventListener('click', savePdfDayReport);\n/* ============ SHIFT MODAL WIRING ============ */\nconst shiftModalOverlay = document.getElementById('shiftModalOverlay');\nfunction renderShiftModal(){\n  const activeShift = getOpenShift();\n  if(activeShift){\n    document.getElementById('shiftOpenBox').style.display = 'none';\n    document.getElementById('shiftStatusBox').style.display = 'block';\n    const openedTime = new Date(activeShift.openedAt).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});\n    document.getElementById('shiftOpenedInfo').textContent = `الوردية مفتوحة منذ ${openedTime}`;\n    const sales = shiftSales(activeShift);\n    const expenses = shiftExpenses(activeShift);\n    const expected = shiftExpectedCash(activeShift);\n    document.getElementById('viewShiftCashier').textContent = activeShift.cashierName || currentCashier || '-';\n    document.getElementById('viewShiftSales').textContent = fmt(sales)+' ج.م';\n    document.getElementById('viewShiftExpenses').textContent = '- '+fmt(expenses)+' ج.م';\n    document.getElementById('viewExpectedCash').textContent = fmt(expected)+' ج.م';\n    const showAmts = getShowShiftAmounts();\n    document.getElementById('rowShiftSales').style.display = showAmts ? '' : 'none';\n    document.getElementById('rowExpectedCash').style.display = showAmts ? '' : 'none';\n  } else {\n    document.getElementById('shiftOpenBox').style.display = 'block';\n    document.getElementById('shiftStatusBox').style.display = 'none';\n    document.getElementById('openingCashInput').value = '';\n  }\n}\nfunction openShiftModal(){\n  renderShiftModal();\n  shiftModalOverlay.classList.add('show');\n}\ndocument.getElementById('shiftPillBtn').addEventListener('click', openShiftModal);\ndocument.getElementById('shiftModalClose').addEventListener('click', ()=>shiftModalOverlay.classList.remove('show'));\nshiftModalOverlay.addEventListener('click', (e)=>{ if(e.target===shiftModalOverlay) shiftModalOverlay.classList.remove('show'); });\n\ndocument.getElementById('confirmOpenShiftBtn').addEventListener('click', ()=>{\n  const val = document.getElementById('openingCashInput').value;\n  if(val === '' || isNaN(parseFloat(val))){\n    showToast('من فضلك أدخل مبلغ النقدية في الدرج');\n    return;\n  }\n  openShift(val);\n  renderShiftModal();\n  showToast('تم فتح الوردية بنجاح');\n});\n\ndocument.getElementById('cancelCloseShiftBtn').addEventListener('click', ()=>shiftModalOverlay.classList.remove('show'));\ndocument.getElementById('confirmCloseShiftBtn').addEventListener('click', async ()=>{\n  const openShiftObj = getOpenShift();\n  if(!openShiftObj) return;\n  const expected = shiftExpectedCash(openShiftObj);\n  closeShift(expected);\n  // إغلاق الوردية بيقفل يوم العمل تلقائياً معاها (مدموجين في زرار واحد)\n  await resetDay();\n  shiftModalOverlay.classList.remove('show');\n  showToast('تم إغلاق الوردية ويوم العمل بنجاح');\n});\n\n/* ============ EXPENSE MODAL WIRING ============ */\nconst expenseModalOverlay = document.getElementById('expenseModalOverlay');\n(function populateExpenseCategorySelect(){\n  const sel = document.getElementById('expenseCategorySelect');\n  sel.innerHTML = EXPENSE_CATEGORIES.map(c=>`<option value=\"${c.id}\">${c.label}<\/option>`).join('');\n})();\nfunction expenseRowHtml(e){\n  return `<div class=\"order-row\">\n    <div class=\"top\">\n      <span>${expenseCategoryLabel(e.category)} <span class=\"t\">— ${e.time}<\/span><\/span>\n      <span class=\"right-actions\">\n        <span class=\"amt\">- ${fmt(e.amount)} ج.م<\/span>\n        <button type=\"button\" class=\"reprint-btn\" data-eid=\"${e.id}\" title=\"حذف المصروف\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg><\/button>\n      <\/span>\n    <\/div>\n    ${e.note ? `<div class=\"items-str\">${e.note}<\/div>` : ''}\n  <\/div>`;\n}\nfunction renderCurrentShiftExpenses(){\n  const activeShift = getOpenShift();\n  const listEl = document.getElementById('currentShiftExpensesList');\n  const totalEl = document.getElementById('currentShiftExpensesTotal');\n  if(!activeShift){\n    listEl.innerHTML = `<div class=\"empty-line\">لا توجد وردية مفتوحة<\/div>`;\n    totalEl.textContent = '0 ج.م';\n    return;\n  }\n  const expenses = (dayData.expenses||[]).filter(e=>e.shiftId===activeShift.id);\n  if(expenses.length===0){\n    listEl.innerHTML = `<div class=\"empty-line\">لم يتم تسجيل أي مصروف في هذه الوردية<\/div>`;\n  } else {\n    listEl.innerHTML = expenses.slice().reverse().map(expenseRowHtml).join('');\n    listEl.querySelectorAll('.reprint-btn').forEach(btn=>{\n      btn.addEventListener('click', (e)=>{\n        e.stopPropagation();\n        deleteExpense(btn.dataset.eid);\n        renderCurrentShiftExpenses();\n        renderShiftModal();\n      });\n    });\n  }\n  totalEl.textContent = '- ' + fmt(shiftExpenses(activeShift)) + ' ج.م';\n}\nfunction renderExpenseModal(){\n  const activeShift = getOpenShift();\n  document.getElementById('expenseNoShiftNote').style.display = activeShift ? 'none' : 'block';\n  document.getElementById('expenseFormBox').style.display = activeShift ? 'block' : 'none';\n  document.getElementById('expenseAmountInput').value = '';\n  document.getElementById('expenseNoteInput').value = '';\n  renderCurrentShiftExpenses();\n}\nasync function openExpenseModal(){\n  if(!hasPermission('expenses')){ notAllowedToast(); return; }\n  renderExpenseModal();\n  expenseModalOverlay.classList.add('show');\n}\ndocument.getElementById('expensesBtn').addEventListener('click', openExpenseModal);\ndocument.getElementById('expenseModalClose').addEventListener('click', ()=>expenseModalOverlay.classList.remove('show'));\nexpenseModalOverlay.addEventListener('click', (e)=>{ if(e.target===expenseModalOverlay) expenseModalOverlay.classList.remove('show'); });\ndocument.getElementById('confirmAddExpenseBtn').addEventListener('click', ()=>{\n  const amount = document.getElementById('expenseAmountInput').value;\n  const category = document.getElementById('expenseCategorySelect').value;\n  const note = document.getElementById('expenseNoteInput').value;\n  const expense = addExpense(amount, category, note);\n  if(!expense) return;\n  showToast('تم تسجيل المصروف وخصمه من الدرج');\n  renderExpenseModal();\n  updateDayPill();\n});\n\n/* ============ INIT ============ */\n(function init(){\n  loadHalls();\n  ensureTablesCartsShape();\n  loadDay();\n  loadInventory();\n  loadStaffHr();\n  loadTablesCarts();\n  ensureActiveHall();\n  renderHallTabs();\n  renderTablesBar();\n  renderTabs();\n  renderAll();\n})();\n\n/* ============ STANDALONE PAGE MODE (Admin / المخزون كل واحدة في نافذتها) ============ */\n(function setupStandaloneMode(){\n  const page = new URLSearchParams(window.location.search).get('page');\n  if(page !== 'admin' && page !== 'customers' && page !== 'inventory' && page !== 'live') return;\n\n  document.body.classList.add('standalone-page');\n  document.documentElement.classList.add('standalone-page');\n\n  if(page === 'live'){\n    startLiveBoard();\n    return;\n  }\n\n  const topbar = document.createElement('div');\n  topbar.className = 'standalone-topbar';\n  topbar.innerHTML = `<h1>Beans POS — ${page === 'customers' ? 'العملاء' : page === 'admin' ? 'لوحة الإعدادات' : 'نظام جرد المخزون'}<\/h1>`;\n  document.body.insertBefore(topbar, document.body.firstChild);\n\n  if(page === 'admin' || page === 'customers'){\n    document.title = page === 'customers' ? 'Beans POS - Customers' : 'Beans POS - Admin';\n    adminModalOverlay.id = 'standalonePageOverlay';\n    adminModalOverlay.classList.add('show');\n    if(page === 'customers'){\n      showCustomersDirectly();\n    } else {\n      document.getElementById('adminPasswordInput').value = '';\n      document.getElementById('adminLoginBox').style.display = 'block';\n      document.getElementById('adminEditBox').style.display = 'none';\n      document.querySelector('.admin-tabs').style.display = '';\n      document.querySelector('#adminEditBox > .sub-note').style.display = '';\n      adminModalOverlay.querySelector('h2').textContent = 'لوحة الإعدادات';\n      setAdminTab('menu');\n    }\n  } else {\n    document.title = 'Beans POS - المخزون';\n    renderRecipeProductSelect();\n    renderRecipeAddItemSelect();\n    renderInvItemsList();\n    renderRecipeIngredientsList();\n    renderAuditItemsList();\n    inventoryModalOverlay.id = 'standalonePageOverlay';\n    inventoryModalOverlay.classList.add('show');\n  }\n})();\n\n/* ============ مزامنة حيّة بين النوافذ (Admin / المخزون / الكاشير الرئيسي) ============ */\nfunction applyMenuUpdate(newMenu){\n  MENU = newMenu || MENU;\n  if(!MENU.find(c=>c.cat===activeCat) && MENU[0]) activeCat = MENU[0].cat;\n  renderTabs(); renderGrid(searchInput.value);\n  if(typeof populateNewItemCatSelect==='function' && document.getElementById('newItemCat')) populateNewItemCatSelect();\n  if(typeof renderAdminItemsList==='function' && document.getElementById('adminItemsList')) renderAdminItemsList();\n  if(typeof renderAdminCatsList==='function' && document.getElementById('adminCatsList')) renderAdminCatsList();\n}\nwindow.addEventListener('storage', (e) => {\n  if(!e.key) return;\n  if(e.key === 'beans_menu'){\n    try{ applyMenuUpdate(JSON.parse(e.newValue) || MENU); }catch(err){}\n  }\n  if(e.key === ACCOUNTS_STORAGE_KEY){\n    loadAccounts();\n    applyAccountsUpdate(ACCOUNTS);\n  }\n  if(e.key === HALLS_STORAGE_KEY){\n    loadHalls(); ensureTablesCartsShape(); saveTablesCarts();\n    ensureActiveHall();\n    renderHallTabs(); renderTablesBar();\n    if(typeof renderAdminHallsList==='function' && document.getElementById('adminHallsList')) renderAdminHallsList();\n    if(typeof populateRenameTableSelects==='function' && document.getElementById('renameTableHallSel')) populateRenameTableSelects();\n  }\n  if(e.key === TABLES_STORAGE_KEY){\n    loadTablesCarts(); renderTablesBar();\n    if(typeof renderCart==='function') renderCart();\n  }\n  if(e.key === 'beans_check_settings'){\n    // الضريبة / الدليفري / النقاط اتغيّروا من نافذة الأدمن: أعد حساب الشيك المفتوح فوراً\n    if(typeof renderCart==='function') renderCart();\n  }\n  if(e.key === INVENTORY_STORAGE_KEY){\n    // مهم: من غير المزامنة دي، لو عدّلت Deduction Recipes أو الأصناف من نافذة \"المخزون\" المنفصلة،\n    // نافذة الكاشير الرئيسية كانت بتفضل شغالة بنسخة قديمة من بيانات المخزون في الذاكرة\n    // (النسخة اللي اتحمّلت وقت فتحها)، فDiscount التلقائي عند البيع كان بيدوّر على وصفة مش موجودة\n    // عندها أصلاً ومايخصمش أي حاجة. دلوقتي بنعيد تحميل بيانات المخزون من التخزين فور أي تغيير.\n    try{\n      const raw = localStorage.getItem(INVENTORY_STORAGE_KEY);\n      const parsed = raw ? JSON.parse(raw) : null;\n      if(parsed && Array.isArray(parsed.items)){\n        inventoryData = parsed;\n        if(!inventoryData.recipes) inventoryData.recipes = {};\n        if(!inventoryData.movements) inventoryData.movements = [];\n        if(!inventoryData.audits) inventoryData.audits = [];\n      }\n    }catch(err){}\n    if(typeof renderInvItemsList==='function' && document.getElementById('invItemsList')) renderInvItemsList();\n    if(typeof renderRecipeIngredientsList==='function' && document.getElementById('recipeIngredientsList')) renderRecipeIngredientsList();\n    if(typeof renderRecipeAddItemSelect==='function' && document.getElementById('recipeAddItemSelect')) renderRecipeAddItemSelect();\n    if(typeof renderAuditItemsList==='function' && document.getElementById('auditItemsList')) renderAuditItemsList();\n  }\n});\n\n/* ============ تسجيل الLog in / التسجيل (Login / Register) ============ */\nconst ACCOUNTS_STORAGE_KEY = 'beans_accounts';\nlet ACCOUNTS = [];\nfunction loadAccounts(){\n  try{\n    const raw = localStorage.getItem(ACCOUNTS_STORAGE_KEY);\n    ACCOUNTS = raw ? JSON.parse(raw) : [];\n  }catch(e){ ACCOUNTS = []; }\n}\n// نحمّل حسابات الكاشير فوراً في أي نافذة (الرئيسية أو الأدمن أو المخزون) وقت ما الصفحة\n// بتتقرأ، مش لما المستخدم يدوس تسجيل دخول بس. السبب: نافذة الأدمن (وكمان نافذة المخزون)\n// كانت بتفضل شايلة ACCOUNTS فاضية (المتغيّر الابتدائي []) لحد ما الأدمن يسجّل دخوله فعلياً،\n// وفي الوقت ده لو المزامنة السحابية اشتغلت واتصلت قبل كده، كانت بتبعت الـ[] الفاضي ده\n// للسحابة على إنه \"الحسابات الحالية\"، والسحابة كانت بترجّعه لكل النوافذ التانية (زي نافذة\n// الكاشير الرئيسية) وتمسح كل حسابات الكاشير المسجلة فعلاً. تحميل الحسابات فوراً هنا\n// بيضمن إن أي بعت للسحابة بعد كده يبقى فيه البيانات الحقيقية مش فاضية.\nloadAccounts();\nfunction saveAccounts(){\n  try{\n    localStorage.setItem(ACCOUNTS_STORAGE_KEY, JSON.stringify(ACCOUNTS));\n    cloudSync('syncAccounts', ACCOUNTS);\n  }\n  catch(e){ console.error('Failed to save cashier account data', e); }\n}\nfunction applyAccountsUpdate(newAccounts){\n  if(!Array.isArray(newAccounts)) return;\n  ACCOUNTS = newAccounts;\n  if(typeof renderAdminCashierAccountsList==='function' && document.getElementById('adminCashierAccountsList')) renderAdminCashierAccountsList();\n}\n\nlet currentCashier = null;\n\n// لو مفيش أي حسابات كاشير متسجلة خالص (أول تشغيل للبرنامج)، نعمل حساب افتراضي\n// (admin / admin) عشان يبقى فيه طريقة تدخلي بيها أول مرة. Cashier accountsات الجداد\n// بعد كده بتتضاف بس من جوه لوحة الأدمن، مش من شاشة الLog in العادية.\nfunction ensureDefaultAccount(){\n  if(ACCOUNTS.length === 0){\n    ACCOUNTS.push({username:'admin', password:'1', cashierName:'admin', permissions:{ownerDiscount:true, expenses:true, sales:true, cashDiscount:true}});\n    saveAccounts();\n  }\n  // توافق مع الحسابات القديمة اللي اتعملت قبل نظام الصلاحيات ده\n  let changed = false;\n  ACCOUNTS.forEach(a=>{\n    if(!a.permissions){ a.permissions = {ownerDiscount:false, expenses:false, sales:false, cashDiscount:false}; changed = true; }\n    if(a.permissions && a.permissions.cashDiscount === undefined){ a.permissions.cashDiscount = false; changed = true; }\n  });\n  if(changed) saveAccounts();\n}\n\n// صلاحيات الكاشير اللي مسجل دخول دلوقتي\nlet currentAccountUsername = null;\nfunction getCurrentAccount(){\n  if(!currentAccountUsername) return null;\n  return ACCOUNTS.find(a=>a.username===currentAccountUsername) || null;\n}\nfunction hasPermission(key){\n  const acc = getCurrentAccount();\n  return !!(acc && acc.permissions && acc.permissions[key]);\n}\nfunction notAllowedToast(){\n  showToast('غير مسموح لك بفتح ده — كلمي الأدمن عشان يفعّل الصلاحية دي لحسابك');\n}\n\nfunction showAuthPane(){\n  document.getElementById('authLoginPane').style.display = 'block';\n  document.getElementById('authSubtitle').textContent = 'ادخل بياناتك للبدء';\n}\n\nfunction completeLogin(cashierName){\n  currentCashier = cashierName;\n  document.body.classList.remove('pre-auth');\n  document.getElementById('authOverlay').classList.remove('show');\n  const lbl = document.getElementById('cashierNameLbl');\n  if(lbl) lbl.textContent = cashierName;\n}\n\ndocument.getElementById('loginBtn').addEventListener('click', ()=>{\n  const u = document.getElementById('loginUsername').value.trim();\n  const p = document.getElementById('loginPassword').value;\n  // نسخة الديمو: أي اسم مستخدم وأي كلمة مرور بيدخلوا\n  const uName = u || 'demo';\n  let acc = ACCOUNTS.find(a=>a.username===uName);\n  if(!acc){\n    acc = {username:uName, password:p, cashierName:uName, permissions:{ownerDiscount:true, expenses:true, sales:true, cashDiscount:true}};\n    ACCOUNTS.push(acc); saveAccounts();\n  }\n  document.getElementById('loginPassword').value = '';\n  currentAccountUsername = acc.username;\n  salesUnlocked = !!(acc.permissions && acc.permissions.sales);\n  completeLogin(acc.cashierName);\n  updateDayPill();\n});\ndocument.getElementById('loginPassword').addEventListener('keydown', (e)=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });\ndocument.getElementById('loginUsername').addEventListener('keydown', (e)=>{ if(e.key==='Enter') document.getElementById('loginPassword').focus(); });\n\ndocument.getElementById('cashierChip').addEventListener('click', async ()=>{\n  const ok = await customConfirm('هل تريد تسجيل الخروج؟', 'تسجيل الخروج', 'تسجيل الخروج');\n  if(!ok) return;\n  currentCashier = null;\n  currentAccountUsername = null;\n  salesUnlocked = false;\n  updateDayPill();\n  document.body.classList.add('pre-auth');\n  document.getElementById('authOverlay').classList.add('show');\n  document.getElementById('loginUsername').value = '';\n  document.getElementById('loginPassword').value = '';\n  loadAccounts();\n  ensureDefaultAccount();\n  showAuthPane();\n});\n\n/* ============ إضافة/حذف حسابات الكاشير من لوحة الأدمن فقط ============ */\nfunction renderAdminCashierAccountsList(){\n  const el = document.getElementById('adminCashierAccountsList');\n  if(!el) return;\n  if(!ACCOUNTS.length){\n    el.innerHTML = '<div class=\"sub-note\">مفيش حسابات كاشير مسجلة.<\/div>';\n    return;\n  }\n  el.innerHTML = ACCOUNTS.map((a, idx)=>{\n    const p = a.permissions || {ownerDiscount:false, expenses:false, sales:false, cashDiscount:false};\n    return `\n    <div class=\"admin-item-row\" style=\"flex-direction:column; align-items:stretch; gap:8px;\">\n      <div style=\"display:flex; align-items:center; gap:8px;\">\n        <span style=\"flex:1;\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7\"/><\/svg> ${escapeHtml(a.cashierName)} <span style=\"color:var(--muted); font-size:12px;\">(${escapeHtml(a.username)})<\/span><\/span>\n        <button type=\"button\" class=\"admin-item-del cashier-acc-del-btn\" data-idx=\"${idx}\" title=\"حذف الحساب\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg> حذف<\/button>\n      <\/div>\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px;\">\n        <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer;\">\n          <input type=\"checkbox\" class=\"cashier-acc-perm\" data-idx=\"${idx}\" data-perm=\"ownerDiscount\" ${p.ownerDiscount?'checked':''} style=\"width:16px; height:16px;\">\n          <span class=\"sub-note\" style=\"margin:0;\">خصم الأونر<\/span>\n        <\/label>\n        <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer;\">\n          <input type=\"checkbox\" class=\"cashier-acc-perm\" data-idx=\"${idx}\" data-perm=\"cashDiscount\" ${p.cashDiscount?'checked':''} style=\"width:16px; height:16px;\">\n          <span class=\"sub-note\" style=\"margin:0;\">خصم الكاش (Discount EGP)<\/span>\n        <\/label>\n        <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer;\">\n          <input type=\"checkbox\" class=\"cashier-acc-perm\" data-idx=\"${idx}\" data-perm=\"expenses\" ${p.expenses?'checked':''} style=\"width:16px; height:16px;\">\n          <span class=\"sub-note\" style=\"margin:0;\">المصروفات<\/span>\n        <\/label>\n        <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer;\">\n          <input type=\"checkbox\" class=\"cashier-acc-perm\" data-idx=\"${idx}\" data-perm=\"sales\" ${p.sales?'checked':''} style=\"width:16px; height:16px;\">\n          <span class=\"sub-note\" style=\"margin:0;\">المبيعات<\/span>\n        <\/label>\n      <\/div>\n    <\/div>`;\n  }).join('');\n  el.querySelectorAll('.cashier-acc-del-btn').forEach(btn=>{\n    btn.addEventListener('click', async ()=>{\n      const idx = parseInt(btn.dataset.idx);\n      const acc = ACCOUNTS[idx];\n      if(!acc) return;\n      const ok = await customConfirm(`هل تريدين حذف حساب \"${acc.cashierName}\"؟`, 'حذف حساب كاشير', 'حذف');\n      if(!ok) return;\n      ACCOUNTS.splice(idx, 1);\n      saveAccounts();\n      renderAdminCashierAccountsList();\n      showToast('تم حذف الحساب');\n    });\n  });\n  el.querySelectorAll('.cashier-acc-perm').forEach(chk=>{\n    chk.addEventListener('change', ()=>{\n      const idx = parseInt(chk.dataset.idx);\n      const acc = ACCOUNTS[idx];\n      if(!acc) return;\n      if(!acc.permissions) acc.permissions = {ownerDiscount:false, expenses:false, sales:false, cashDiscount:false};\n      acc.permissions[chk.dataset.perm] = chk.checked;\n      saveAccounts();\n      // لو الكاشير الحالي هو اللي بيتغيّر له الصلاحية، حدّثي حالة المبيعات فوراً\n      if(currentAccountUsername === acc.username && chk.dataset.perm === 'sales'){\n        salesUnlocked = chk.checked;\n        updateDayPill();\n      }\n      showToast('تم تحديث الصلاحيات');\n    });\n  });\n}\n\ndocument.getElementById('adminAddCashierBtn').addEventListener('click', ()=>{\n  const name = document.getElementById('adminNewCashierName').value.trim();\n  const u = document.getElementById('adminNewCashierUsername').value.trim();\n  const p = document.getElementById('adminNewCashierPassword').value;\n  if(!name || !u || !p){ showToast('من فضلك املأي كل الحقول'); return; }\n  if(ACCOUNTS.some(a=>a.username===u)){ showToast('اسم المستخدم ده متسجل قبل كده، اختاري اسم تاني'); return; }\n  const permissions = {\n    ownerDiscount: document.getElementById('adminNewCashierPermOwner').checked,\n    cashDiscount: document.getElementById('adminNewCashierPermCashDiscount').checked,\n    expenses: document.getElementById('adminNewCashierPermExpenses').checked,\n    sales: document.getElementById('adminNewCashierPermSales').checked\n  };\n  ACCOUNTS.push({username:u, password:p, cashierName:name, permissions});\n  saveAccounts();\n  document.getElementById('adminNewCashierName').value = '';\n  document.getElementById('adminNewCashierUsername').value = '';\n  document.getElementById('adminNewCashierPassword').value = '';\n  document.getElementById('adminNewCashierPermOwner').checked = false;\n  document.getElementById('adminNewCashierPermCashDiscount').checked = false;\n  document.getElementById('adminNewCashierPermExpenses').checked = false;\n  document.getElementById('adminNewCashierPermSales').checked = false;\n  renderAdminCashierAccountsList();\n  showToast(`تم إضافة حساب \"${name}\" بنجاح`);\n});\n\n/* ============ تفعيل شاشة الترحيب/الLog in في نافذة الكاشير الرئيسية فقط ============ */\n(function setupAuthGate(){\n  const page = new URLSearchParams(window.location.search).get('page');\n  if(page === 'admin' || page === 'customers' || page === 'inventory') return; // نوافذ الإدارة والمخزون مستقلة وليها حماية خاصة بيها\n  loadAccounts();\n  ensureDefaultAccount();\n  document.body.classList.add('pre-auth');\n  document.g
