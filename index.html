         }\n//        }\n// سيب القيم كلها فاضية '' لو لسه مش عايز تفعّل الموقع دلوقتي.\nwindow.FIREBASE_CONFIG = {apiKey: \"demo-key\", authDomain: \"beans-demo.local\", projectId: \"beans-demo\", storageBucket: \"beans-demo.local\", messagingSenderId: \"0\", appId: \"demo\"};\n\n// طابور بسيط: لو المزامنة السحابية لسه بتبدأ (أو الإنترنت مقطوع)، بنأجل عمليات\n// المزامنة وبنرجع نجربها تاني أول ما تتفعل. البرنامج نفسه بيفضل شغال عادي 100%\n// بشكل محلي زي ما هو حتى لو المزامنة فشلت أو مش مفعّلة أصلاً.\nlet _cloudReady = false;\nlet _cloudQueue = [];\nlet _applyingRemoteMenuUpdate = false; // علشان نمنع لوب لانهائي لما المنيو يتحدث من الداشبورد عن بعد\nlet _applyingRemoteAccountsUpdate = false; // نفس الفكرة لحسابات الموظفين وصلاحياتهم\nlet _applyingRemoteInventoryUpdate = false; // نفس الفكرة لتوريد المخزون الجاي من الداشبورد\nlet _applyingRemoteStaffProfilesUpdate = false; // نفس الفكرة لملفات موظفين الاستاف الجاية من الداشبورد\nwindow.addEventListener('cloudsync-ready', ()=>{\n  _cloudReady = true;\n  const q = _cloudQueue; _cloudQueue = [];\n  q.forEach(fn=>{ try{ fn(); }catch(e){ console.warn('cloud sync failed', e); } });\n  try{ cloudSync('syncMenu', MENU); }catch(e){} // مزامنة المنيو مرة أول ما الاتصال بالسحابة يجهز\n  // نفس الحاجة لحسابات الموظفين، لكن من غير ما نبعت قايمة فاضية للسحابة (لو لأي سبب البيانات\n  // لسه مش محمّلة في اللحظة دي)، عشان مايتمسحش كل حسابات الكاشير بالغلط في كل الأجهزة التانية.\n  try{ if(ACCOUNTS.length > 0) cloudSync('syncAccounts', ACCOUNTS); }catch(e){}\n  try{ if(staffProfiles.length > 0) cloudSync('syncStaffProfiles', staffProfiles); }catch(e){}\n  try{ cloudSync('syncTables', HALLS, tablesCarts); }catch(e){} // مزامنة حالة الترابيزات الحالية أول ما الاتصال بالسحابة يجهز (لشاشة البث المباشر في الداشبورد)\n});\n// شارة بسيطة (Read-only، مش بتبعت أو تعيد إرسال حاجة بنفسها) بتوريك بعينك لو فيه\n// عمليات لسه مستنية تتبعت للسحابة (يعني النت مقطوع أو لسه بيحاول). لما النت يرجع\n// وFirestore يبعتها لوحده، الشارة تختفي تلقائي. مفيش هنا أي \"طابور\" أو \"إعادة إرسال\"\n// من عندنا — ده فقط عرض لحالة الطابور الداخلي بتاع Firestore نفسه.\nlet _pendingCloudWrites = 0;\nfunction _updateSyncBadge(){\n  let el = document.getElementById('cloudSyncBadge');\n  if(!el){\n    el = document.createElement('div');\n    el.id = 'cloudSyncBadge';\n    el.style.cssText = 'position:fixed;bottom:12px;left:12px;z-index:99999;background:#fff3cd;color:#7a5b00;border:1px solid #ffe08a;border-radius:20px;padding:6px 14px;font-size:13px;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;direction:rtl;';\n    document.body.appendChild(el);\n  }\n  if(_pendingCloudWrites > 0){\n    el.textContent = ' ' + _pendingCloudWrites + ' Loading ';\n    el.style.display = 'block';\n  } else {\n    el.style.display = 'none';\n  }\n}\nfunction cloudSync(fnName, ...args){\n  if(fnName === 'syncMenu' && _applyingRemoteMenuUpdate) return; // منع اللوب: مش بنبعت تاني حاجة جاية أصلاً من السحابة\n  if(fnName === 'syncAccounts' && _applyingRemoteAccountsUpdate) return;\n  if(fnName === 'syncInventory' && _applyingRemoteInventoryUpdate) return;\n  if(fnName === 'syncStaffProfiles' && _applyingRemoteStaffProfilesUpdate) return;\n  const run = () => {\n    try{\n      if(window.CloudSync && window.CloudSync[fnName]){\n        _pendingCloudWrites++; _updateSyncBadge();\n        Promise.resolve(window.CloudSync[fnName](...args))\n          .catch(e=>console.warn('cloud sync write pending/failed', e))\n          .finally(()=>{ _pendingCloudWrites = Math.max(0, _pendingCloudWrites-1); _updateSyncBadge(); });\n      }\n    }catch(e){ console.warn('cloud sync failed', e); }\n  };\n  if(_cloudReady) run(); else _cloudQueue.push(run);\n}\n// سجل عمليات (Audit Log): بيسجل مين عمل عملية حذف حساسة (فاتورة/مصروف) وإمتى،\n// عشان يظهر في موقع المتابعة ويمنع أي تلاعب أو إنكار للمسؤولية.\n/* ============ سجل الإلغاءات (للتقارير) ============\n   كل إلغاء فاتورة أو صنف قبل الدفع بيتسجل في collection اسمها voids:\n   مين عمل الإلغاء (الكاشير + اليوزر)، إمتى، إيه اللي اتلغى، وفين (الترابيزة). */\nfunction voidActor(){\n  return { by: currentCashier || '-', byUsername: currentAccountUsername || '-', at: new Date().toISOString() };\n}\nfunction recordVoid(rec){\n  const actor = voidActor();\n  const id = 'v' + Date.now() + Math.random().toString(36).slice(2,7);\n  cloudSync('syncVoid', {\n    id, ts: Date.now(), ...actor,\n    dateKey: (dayData && dayData.dateKey) || dayKeyStr(),\n    ...rec\n  });\n}\n\nfunction logAudit(type, summary){\n  cloudSync('logAudit', {\n    type, summary,\n    byCashier: currentCashier || '-',\n    byUsername: currentAccountUsername || '-',\n    dateKey: (dayData && dayData.dateKey) || dayKeyStr(),\n    at: new Date().toISOString()\n  });\n}\n// لو حد عدّل المنيو أو الأسعار من موقع المتابعة (الداشبورد)، التعديل ده بينزل هنا لحظياً\n// فواتير اتحذفت من الداشبورد (الحذف مسموح من هناك بس) — نشيلها من الكاشير لحظياً\nwindow.addEventListener('remote-orders-deleted', (e)=>{\n  const ids = new Set((e.detail||[]).map(String));\n  if(!ids.size) return;\n  const days = Object.values((appData && appData.history) || {});\n  if(typeof dayData !== 'undefined' && dayData && !days.includes(dayData)) days.push(dayData);\n  let changed = false;\n  days.forEach(bd=>{\n    if(!bd || !Array.isArray(bd.orders)) return;\n    const removed = bd.orders.filter(o=>ids.has(String(o.id)));\n    if(!removed.length) return;\n    bd.orders = bd.orders.filter(o=>!ids.has(String(o.id)));\n    adjustClosedShiftsForRemovedOrders(bd, removed);\n    changed = true;\n  });\n  if(!changed) return;\n  saveDay();\n  const safe = fn => { try{ fn(); }catch(_){} };\n  safe(updateDayPill); safe(updateShiftPill); safe(renderDayModal);\n  safe(refreshOrderListUI); safe(renderMonthCalendar);\n  safe(()=>{ if(currentDetailDayKey) refreshDetailOrderListUI(); });\n  showToast('تم حذف فاتورة من الداشبورد');\n});\nwindow.addEventListener('remote-menu-update', (e)=>{\n  const incoming = e.detail;\n  if(!incoming || !Array.isArray(incoming)) return;\n  if(JSON.stringify(incoming) === JSON.stringify(MENU)) return; // مفيش فرق حقيقي، متعملش حاجة\n  _applyingRemoteMenuUpdate = true;\n  try{\n    localStorage.setItem('beans_menu', JSON.stringify(incoming));\n    applyMenuUpdate(incoming);\n    showToast('تم تحديث المنيو من لوحة التحكم عن بعد');\n  }catch(err){\n    console.warn('فشل تطبيق تحديث المنيو الجاي عن بعد', err);\n  }finally{\n    _applyingRemoteMenuUpdate = false; // يترجع false مهما حصل، عشان مايوقفش المزامنة للأبد\n  }\n});\n// لو حد عدّل حسابات الموظفين أو صلاحياتهم من موقع المتابعة (الداشبورد)\nwindow.addEventListener('remote-accounts-update', (e)=>{\n  const incoming = e.detail;\n  if(!incoming || !Array.isArray(incoming)) return;\n  // حماية إضافية: لو اللي جاي من السحابة قايمة فاضية بينما عندنا حسابات مسجلة فعلاً،\n  // متطبقهاش. قايمة فاضية غالبًا معناها تحديث ناقص/سباق توقيت (نافذة لسه بتحمّل بياناتها)\n  // مش قرار حقيقي إن كل الحسابات اتمسحت، فمينفعش نمسح بيها الحسابات المحلية.\n  if(incoming.length === 0 && ACCOUNTS.length > 0){\n    console.warn('تجاهلنا تحديث حسابات فاضي جاي من السحابة عشان مايمسحش الحسابات المحلية');\n    return;\n  }\n  if(JSON.stringify(incoming) === JSON.stringify(ACCOUNTS)) return;\n  _applyingRemoteAccountsUpdate = true;\n  try{\n    localStorage.setItem('beans_accounts', JSON.stringify(incoming));\n    applyAccountsUpdate(incoming);\n    showToast('تم تحديث حسابات الموظفين من لوحة التحكم عن بعد');\n  }catch(err){\n    console.warn('فشل تطبيق تحديث حسابات الموظفين الجاي عن بعد', err);\n  }finally{\n    _applyingRemoteAccountsUpdate = false;\n  }\n});\nwindow.addEventListener('remote-inventory-audits-update', (e)=>{\n  const incoming = Array.isArray(e.detail) ? e.detail : [];\n  const known = new Set((inventoryData.audits||[]).map(a=>String(a.id)));\n  const fresh = incoming.filter(a=>a && !known.has(String(a.id)));\n  if(!fresh.length) return;\n  inventoryData.audits = [...(inventoryData.audits||[]), ...fresh];\n  localStorage.setItem(INVENTORY_STORAGE_KEY, JSON.stringify(inventoryData));\n});\n// لو حد وَرَّد كمية جديدة (أو عدّل رصيد صنف) من موقع المتابعة (الداشبورد)، التوريد ده بيتطبّق هنا لحظياً\nwindow.addEventListener('remote-inventory-update', (e)=>{\n  const incoming = e.detail;\n  if(!incoming || !Array.isArray(incoming) || !incoming.length) return;\n  _applyingRemoteInventoryUpdate = true;\n  try{\n    let changed = false;\n    incoming.forEach(remoteItem=>{\n      const localItem = inventoryData.items.find(i=>i.id===remoteItem.id);\n      if(!localItem) return; // الداشبورد بتورّد بس أصناف موجودة أصلاً، مبتضيفش أصناف جديدة\n      const remoteQty = parseFloat(remoteItem.currentQty) || 0;\n      const localQty = parseFloat(localItem.currentQty) || 0;\n      const delta = remoteQty - localQty;\n      if(Math.abs(delta) > 0.0001){\n        localItem.currentQty = remoteQty;\n        inventoryData.movements.push({\n          id: Date.now()+Math.random(), itemId: localItem.id,\n          type: delta > 0 ? 'supply' : 'audit_adjust', qty: delta,\n          date: new Date().toISOString(),\n          note: delta > 0 ? 'توريد بضاعة من لوحة التحكم (الداشبورد)' : 'تعديل رصيد من لوحة التحكم (الداشبورد)'\n        });\n        changed = true;\n      }\n    });\n    if(changed){\n      // بنحفظ في localStorage مباشرة (مش عن طريق saveInventory) عشان منبعتش تحديث تاني للسحابة بلا داعي\n      localStorage.setItem(INVENTORY_STORAGE_KEY, JSON.stringify(inventoryData));\n      if(typeof renderInvItemsList==='function' && document.getElementById('invItemsList')) renderInvItemsList();\n      if(typeof renderAuditItemsList==='function' && document.getElementById('auditItemsList')) renderAuditItemsList();\n      showToast('تم توريد بضاعة جديدة للمخزون من لوحة التحكم');\n    }\n  }catch(err){\n    console.warn('فشل تطبيق توريد المخزون الجاي عن بعد', err);\n  }finally{\n    _applyingRemoteInventoryUpdate = false;\n  }\n});\n// لو حد عدّل/ضاف/حذف موظف في الاستاف من موقع المتابعة (الداشبورد)\nwindow.addEventListener('remote-staffprofiles-update', (e)=>{\n  const incoming = e.detail;\n  if(!incoming || !Array.isArray(incoming)) return;\n  if(JSON.stringify(incoming) === JSON.stringify(staffProfiles)) return;\n  _applyingRemoteStaffProfilesUpdate = true;\n  try{\n    staffProfiles = incoming;\n    localStorage.setItem(STAFF_HR_STORAGE_KEY, JSON.stringify(staffProfiles));\n    if(document.getElementById('hrPosAttEmployee')) renderHrPosEmployeeSelect();\n    showToast('تم تحديث قائمة الموظفين من لوحة التحكم');\n  }catch(err){\n    console.warn('فشل تطبيق تحديث ملفات الموظفين الجاي عن بعد', err);\n  }finally{\n    _applyingRemoteStaffProfilesUpdate = false;\n  }\n});\n\n/* ============ APP DATA (LocalStorage) ============ */\n// appData.history[\"bd_<id>\"] = يوم عمل واحد (Business Day):\n//   { id, dateKey (تاريخ فتح أول وردية فيه), openedAt, closedAt, orders:[...], shifts:[...] }\n// \"يوم العمل\" بيتحدد بوقت فتح أول وردية، وبيفضل مفتوح (حتى لو عدى نص الليل)\n// لحد ما تقفل كل الورديات وتضغط \"Close Business Day\" يدوياً.\nconst APP_STORAGE_KEY = 'beans_app_data';\nlet appData = { history: {}, currentBusinessDayKey: null };\nlet dayData = null; // يوم العمل المعروض حالياً في الواجهة (النشط، أو فاضي لو مفيش)\n\nfunction emptyBizDayStub(){\n  return { id:null, dateKey: dayKeyStr(), openedAt: null, closedAt: null, orders: [], shifts: [], expenses: [] };\n}\nfunction getCurrentBusinessDay(){\n  const key = appData.currentBusinessDayKey;\n  if(key && appData.history[key] && !appData.history[key].closedAt){\n    return appData.history[key];\n  }\n  return null;\n}\nfunction refreshDayDataPointer(){\n  dayData = getCurrentBusinessDay() || emptyBizDayStub();\n}\n\nfunction loadDay(){\n  try{\n    const raw = localStorage.getItem(APP_STORAGE_KEY);\n    if(raw){\n      const parsed = JSON.parse(raw);\n      if(parsed && parsed.history){\n        appData = parsed;\n        if(appData.currentBusinessDayKey === undefined) appData.currentBusinessDayKey = null;\n      }\n    }\n  }catch(e){\n    appData = { history: {}, currentBusinessDayKey: null };\n  }\n  // توافق مع بيانات قديمة اتحفظت قبل إضافة ميزة المصروفات\n  Object.values(appData.history).forEach(bd=>{ if(!bd.expenses) bd.expenses = []; });\n  refreshDayDataPointer();\n  updateDayPill();\n  updateShiftPill();\n}\n\nfunction saveDay(){\n  try{\n    localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(appData));\n  }catch(e){\n    console.error('Failed to save locally', e);\n    showToast('تعذر حفظ البيانات — تحقق من مساحة التخزين');\n  }\n}\n\n/* ============ INVENTORY MANAGEMENT SYSTEM (Inventory System) ============ */\n// inventoryData.items:    [{id, name, unit, openingQty, currentQty, costPerUnit}]\n// inventoryData.recipes:  { \"اسم Item في المنيو\": [{itemId, qty}, ...] }  — Qty المخصومة من كل مادة عند بيع وحدة واحدة\n// inventoryData.movements:[{id, itemId, type:'opening'|'supply'|'sale'|'audit_adjust', qty, date, note, orderId?}]\n// inventoryData.audits:   [{id, date, entries:[{itemId, name, unit, expected, counted, variance, value}]}]\nconst INVENTORY_STORAGE_KEY = 'beans_inventory';\nlet inventoryData = { items: [], recipes: {}, movements: [], audits: [] };\n\nfunction loadInventory(){\n  try{\n    const raw = localStorage.getItem(INVENTORY_STORAGE_KEY);\n    if(raw){\n      const parsed = JSON.parse(raw);\n      if(parsed && Array.isArray(parsed.items)){\n        inventoryData = parsed;\n        if(!inventoryData.recipes) inventoryData.recipes = {};\n        if(!inventoryData.movements) inventoryData.movements = [];\n        if(!inventoryData.audits) inventoryData.audits = [];\n      }\n    }\n  }catch(e){\n    inventoryData = { items: [], recipes: {}, movements: [], audits: [] };\n  }\n}\nfunction saveInventory(){\n  try{\n    localStorage.setItem(INVENTORY_STORAGE_KEY, JSON.stringify(inventoryData));\n    cloudSync('syncInventory', inventoryData.items);\n  }catch(e){\n    console.error('تعذر حفظ بيانات المخزون', e);\n    showToast('تعذر حفظ بيانات المخزون — تأكد من مساحة التخزين');\n  }\n}\n\n/* ============ الاستاف: الحضور والانصراف (شيت يومي متزامن لحظياً مع الداشبورد) ============ */\nconst STAFF_HR_STORAGE_KEY = 'beans_staff_profiles';\nlet staffProfiles = [];\nlet _hrPosAttendance = [];   // تسجيلات اليوم المختار (بتيجي لحظي من فايرستور)\nlet _hrPosAttUnsub = null;\n\nfunction loadStaffHr(){\n  try{\n    const raw = localStorage.getItem(STAFF_HR_STORAGE_KEY);\n    staffProfiles = raw ? (JSON.parse(raw) || []) : [];\n  }catch(e){ staffProfiles = []; }\n}\nfunction saveStaffProfiles(){\n  try{\n    localStorage.setItem(STAFF_HR_STORAGE_KEY, JSON.stringify(staffProfiles));\n    cloudSync('syncStaffProfiles', staffProfiles);\n  }catch(e){\n    console.error('تعذر حفظ ملفات الموظفين', e);\n  }\n}\nfunction todayDateKeyHr(){\n  const d = new Date();\n  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\n}\nfunction calcHrHours(checkIn, checkOut){\n  if(!checkIn || !checkOut) return 0;\n  const [h1,m1] = checkIn.split(':').map(Number);\n  const [h2,m2] = checkOut.split(':').map(Number);\n  let mins = (h2*60+m2) - (h1*60+m1);\n  if(mins < 0) mins += 24*60;\n  return Math.round((mins/60)*100)/100;\n}\nlet _hrWatchQueued = null;\nfunction watchHrPosAttendance(dateKey){\n  const start = ()=>{\n    if(_hrPosAttUnsub){ _hrPosAttUnsub(); _hrPosAttUnsub = null; }\n    if(window.CloudSync && window.CloudSync.watchAttendanceByDate){\n      _hrPosAttUnsub = window.CloudSync.watchAttendanceByDate(dateKey, (rows)=>{\n        // بس نحدّث الجدول — ومنرجعش خانات الفورم اللي الكاشير بيكتب فيها (كان ده بيعمل تهنيج/قفلة)\n        _hrPosAttendance = rows;\n        renderHrPosAttendanceTable();\n      });\n    }\n  };\n  if(_cloudReady){ start(); return; }\n  // ما نكدسش نسخ كتير في الطابور لو الفتح اتكرر قبل ما السحابة تجهز\n  if(_hrWatchQueued) _cloudQueue = _cloudQueue.filter(f=>f!==_hrWatchQueued);\n  _hrWatchQueued = start;\n  _cloudQueue.push(start);\n}\nfunction setHrPosStatus(v){\n  const inp = document.getElementById('hrPosAttStatus');\n  if(inp) inp.value = v;\n  document.querySelectorAll('#hrPosAttStatusGroup .hr-status-btn').forEach(b=>{\n    b.classList.toggle('active', b.getAttribute('data-status') === v);\n  });\n}\nfunction updateHrPosEmployeeBtnLabel(){\n  const sel = document.getElementById('hrPosAttEmployee');\n  const lbl = document.getElementById('hrPosAttEmployeeBtnLabel');\n  if(!sel || !lbl) return;\n  const emp = staffProfiles.find(e=>e.id===sel.value);\n  lbl.textContent = emp ? emp.name : 'اختار الموظف';\n}\nfunction openHrPosEmployeePicker(){\n  if(!staffProfiles.length){ showToast('لا يوجد موظفين'); return; }\n  const sel = document.getElementById('hrPosAttEmployee');\n  const overlay = document.createElement('div');\n  overlay.className = 'modal-overlay show';\n  overlay.style.zIndex = '9999';\n  overlay.innerHTML = `\n    <div class=\"modal\" style=\"max-width:360px;\">\n      <h2 style=\"margin-bottom:12px; text-align:center;\">اختار الموظف<\/h2>\n      <div style=\"max-height:55vh; overflow-y:auto;\">\n        ${staffProfiles.map(e=>`<button type=\"button\" class=\"hr-emp-option${e.id===sel.value?' active':''}\" data-id=\"${e.id}\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7\"/><\/svg> ${escapeHtmlPos(e.name)}<\/button>`).join('')}\n      <\/div>\n      <button type=\"button\" class=\"btn-outline\" id=\"hrEmpPickerCancel\" style=\"width:100%; padding:11px; border-radius:11px; cursor:pointer; margin-top:6px;\">إلغاء<\/button>\n    <\/div>`;\n  document.body.appendChild(overlay);\n  const close = ()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };\n  overlay.querySelectorAll('.hr-emp-option').forEach(b=>{\n    b.addEventListener('click', ()=>{\n      sel.value = b.getAttribute('data-id');\n      sel.dispatchEvent(new Event('change'));\n      updateHrPosEmployeeBtnLabel();\n      close();\n    });\n  });\n  overlay.querySelector('#hrEmpPickerCancel').addEventListener('click', close);\n  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });\n}\nfunction prefillHrPosFormForSelection(){\n  const empId = document.getElementById('hrPosAttEmployee').value;\n  if(!empId) return;\n  const rec = _hrPosAttendance.find(r=>r.employeeId===empId);\n  if(rec){\n    setHrPosStatus(rec.status || 'present');\n    document.getElementById('hrPosAttIn').value = rec.checkIn || '';\n    document.getElementById('hrPosAttOut').value = rec.checkOut || '';\n    document.getElementById('hrPosAttDeduction').value = rec.deduction || '';\n    document.getElementById('hrPosAttAdvance').value = rec.advance || '';\n    _hrPosPermissionHours = rec.permissionHours || 0;\n    _hrPosUnauthDays = rec.unauthorizedDays || 0;\n  } else {\n    setHrPosStatus('present');\n    document.getElementById('hrPosAttIn').value = '';\n    document.getElementById('hrPosAttOut').value = '';\n    document.getElementById('hrPosAttDeduction').value = '';\n    document.getElementById('hrPosAttAdvance').value = '';\n    _hrPosPermissionHours = 0;\n    _hrPosUnauthDays = 0;\n  }\n  updateHrPosPermissionBtnLabel();\n  updateHrPosUnauthBtnLabel();\n  updateHrPosHoursPreview();\n}\nfunction renderHrPosEmployeeSelect(){\n  const sel = document.getElementById('hrPosAttEmployee');\n  if(!sel) return;\n  const prev = sel.value;\n  sel.innerHTML = '<option value=\"\">اختار الموظف<\/option>' + staffProfiles.map(e=>`<option value=\"${e.id}\">${escapeHtmlPos(e.name)}<\/option>`).join('');\n  if(staffProfiles.find(e=>e.id===prev)) sel.value = prev;\n  updateHrPosEmployeeBtnLabel();\n}\nfunction renderHrPosAttendanceTable(){\n  const body = document.getElementById('hrPosAttendanceBody');\n  const empty = document.getElementById('hrPosAttendanceEmpty');\n  if(!body) return;\n  if(!_hrPosAttendance.length){\n    body.innerHTML = '';\n    empty.style.display = 'block';\n    document.getElementById('hrPosTotalHours').textContent = '٠';\n    document.getElementById('hrPosTotalDeduction').textContent = '٠ ج';\n    document.getElementById('hrPosTotalAdvance').textContent = '٠ ج';\n    return;\n  }\n  empty.style.display = 'none';\n  let totalHours = 0, totalDed = 0, totalAdv = 0;\n  body.innerHTML = _hrPosAttendance.map(r=>{\n    totalHours += r.hours||0; totalDed += r.deduction||0; totalAdv += r.advance||0;\n    return `<tr>\n      <td>${escapeHtmlPos(r.employeeName||'-')}<\/td>\n      <td>${r.checkIn||'-'}<\/td>\n      <td>${r.checkOut||'-'}<\/td>\n      <td>${fmtQty(r.hours||0)}<\/td>\n      <td>${fmtQty(r.deduction||0)}<\/td>\n      <td>${fmtQty(r.advance||0)}<\/td>\n    <\/tr>`;\n  }).join('');\n  document.getElementById('hrPosTotalHours').textContent = fmtQty(totalHours);\n  document.getElementById('hrPosTotalDeduction').textContent = fmtQty(totalDed) + ' ج';\n  document.getElementById('hrPosTotalAdvance').textContent = fmtQty(totalAdv) + ' ج';\n}\nlet _hrPosPermissionHours = 0;\nfunction updateHrPosPermissionBtnLabel(){\n  const btn = document.getElementById('hrPosAttPermissionBtn');\n  if(!btn) return;\n  btn.textContent = _hrPosPermissionHours > 0 ? `استئذان ساعات (${fmtQty(_hrPosPermissionHours)}س)` : 'استئذان ساعات';\n  btn.classList.toggle('active', _hrPosPermissionHours > 0);\n}\nfunction updateHrPosAmountBtns(){\n  const d = parseFloat(document.getElementById('hrPosAttDeduction').value) || 0;\n  const a = parseFloat(document.getElementById('hrPosAttAdvance').value) || 0;\n  const db = document.getElementById('hrPosAttDeductionBtn');\n  const ab = document.getElementById('hrPosAttAdvanceBtn');\n  if(db){ db.textContent = d > 0 ? `الخصم (${fmtQty(d)} ج)` : 'الخصم'; db.classList.toggle('active', d > 0); }\n  if(ab){ ab.textContent = a > 0 ? `السلفة (${fmtQty(a)} ج)` : 'السلفة'; ab.classList.toggle('active', a > 0); }\n}\n\nlet _hrPosUnauthDays = 0;\nfunction updateHrPosUnauthBtnLabel(){\n  const btn = document.getElementById('hrPosAttUnauthBtn');\n  if(!btn) return;\n  updateHrPosAmountBtns();\n  btn.textContent = _hrPosUnauthDays > 0 ? `غياب غير مصرح (خصم ${fmtQty(_hrPosUnauthDays)} يوم)` : 'غياب غير مصرح';\n}\n\n// حوار اختيار عدد أيام الخصم عند تسجيل غياب غير مصرح (زي لو حد ضرب اليوم)\nfunction askUnauthorizedAbsenceDays(callback){\n  const overlay = document.createElement('div');\n  overlay.className = 'modal-overlay show';\n  overlay.style.zIndex = '9999';\n  overlay.innerHTML = `\n    <div class=\"modal\" style=\"max-width:340px; text-align:center;\">\n      <h2 style=\"margin-bottom:4px;\">غياب غير مصرح<\/h2>\n      <div class=\"sub-note\" style=\"margin-bottom:16px;\">اختار عدد أيام الخصم بسبب الغياب<\/div>\n      <div style=\"display:flex; gap:10px; margin-bottom:14px;\">\n        <button type=\"button\" class=\"btn-gold\" data-days=\"1\" style=\"flex:1; padding:14px 0; font-size:15px; border-radius:11px;\">يوم واحد<\/button>\n        <button type=\"button\" class=\"btn-gold\" data-days=\"2\" style=\"flex:1; padding:14px 0; font-size:15px; border-radius:11px;\">يومين<\/button>\n        <button type=\"button\" class=\"btn-gold\" data-days=\"3\" style=\"flex:1; padding:14px 0; font-size:15px; border-radius:11px;\">3 أيام<\/button>\n      <\/div>\n      <div style=\"display:flex; gap:8px; margin-bottom:14px;\">\n        <input type=\"number\" min=\"1\" step=\"1\" id=\"unauthCustomDaysInput\" placeholder=\"عدد أيام تاني\" style=\"flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--gold-bright); padding:9px 10px; font-family:inherit; font-weight:800; text-align:center; outline:none;\">\n        <button type=\"button\" class=\"btn-outline\" id=\"unauthCustomConfirmBtn\" style=\"flex:0 0 auto; padding:0 16px; border-radius:11px; cursor:pointer;\">تأكيد<\/button>\n      <\/div>\n      <button type=\"button\" class=\"btn-outline\" id=\"unauthCancelBtn\" style=\"width:100%; padding:11px; border-radius:11px; cursor:pointer;\">إلغاء<\/button>\n    <\/div>`;\n  document.body.appendChild(overlay);\n  const close = ()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };\n  overlay.querySelectorAll('[data-days]').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      const n = parseInt(btn.getAttribute('data-days'), 10);\n      close();\n      callback(n);\n    });\n  });\n  overlay.querySelector('#unauthCustomConfirmBtn').addEventListener('click', ()=>{\n    const n = parseInt(document.getElementById('unauthCustomDaysInput').value, 10);\n    if(!n || n<1){ showToast('اكتب عدد أيام صحيح'); return; }\n    close();\n    callback(n);\n  });\n  overlay.querySelector('#unauthCancelBtn').addEventListener('click', ()=>{ close(); callback(null); });\n  overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ close(); callback(null); } });\n}\nfunction updateHrPosHoursPreview(){\n  const checkIn = document.getElementById('hrPosAttIn').value;\n  const checkOut = document.getElementById('hrPosAttOut').value;\n  const preview = document.getElementById('hrPosAttHoursPreview');\n  const permissionHours = _hrPosPermissionHours || 0;\n  if(!checkIn || !checkOut){\n    if(permissionHours > 0){\n      preview.style.display = 'block';\n      preview.textContent = ` استئذان ${fmtQty(permissionHours)} ساعة هيتضاف على ساعات الشغل`;\n    } else {\n      preview.style.display = 'none';\n    }\n    return;\n  }\n  const worked = calcHrHours(checkIn, checkOut);\n  const hours = worked + permissionHours;\n  preview.style.display = 'block';\n  const permTxt = permissionHours > 0 ? ` (${fmtQty(worked)} فعلي + ${fmtQty(permissionHours)} استئذان)` : '';\n  preview.textContent = ` الساعات المحسوبة: ${fmtQty(hours)} ساعة${permTxt}`;\n}\nfunction escapeHtmlPos(s){ return String(s==null?'':s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction fmtQty(n){\n  n = parseFloat(n) || 0;\n  return n.toLocaleString('ar-EG', {maximumFractionDigits:3});\n}\n\n// كل أسماء الأصناف الموجودة في المنيو (من غير تكرار) — تستخدم في اختيار \"وصفة الخصم\"\nfunction getAllMenuProductNames(){\n  const names = [];\n  MENU.forEach(cat=>{\n    cat.groups.forEach(g=>{\n      g.items.forEach(([name])=>{ if(!names.includes(name)) names.push(name); });\n    });\n  });\n  return names;\n}\n\nfunction addInventoryItem(name, unit, opening, cost, minQty){\n  const item = {\n    id: 'inv_' + Date.now() + Math.floor(Math.random()*1000),\n    name, unit, openingQty: opening, currentQty: opening, costPerUnit: cost || 0, minQty: minQty || 0\n  };\n  inventoryData.items.push(item);\n  inventoryData.movements.push({id:Date.now()+Math.random(), itemId:item.id, type:'opening', qty:opening, date:new Date().toISOString(), note:'رصيد أول المدة'});\n  saveInventory();\n  return item;\n}\n\nfunction supplyInventoryItem(itemId, qty){\n  const item = inventoryData.items.find(i=>i.id===itemId);\n  if(!item) return;\n  item.currentQty = (parseFloat(item.currentQty)||0) + qty;\n  inventoryData.movements.push({id:Date.now()+Math.random(), itemId, type:'supply', qty, date:new Date().toISOString(), note:'توريد بضاعة جديدة'});\n  saveInventory();\n}\n\nfunction deleteInventoryItem(itemId){\n  inventoryData.items = inventoryData.items.filter(i=>i.id!==itemId);\n  // شيل أي مادة بتستخدم الصنف ده من كل وصفات الخصم المرتبطة\n  Object.keys(inventoryData.recipes).forEach(pName=>{\n    inventoryData.recipes[pName] = inventoryData.recipes[pName].filter(r=>r.itemId!==itemId);\n    if(inventoryData.recipes[pName].length===0) delete inventoryData.recipes[pName];\n  });\n  saveInventory();\n}\n\n// الخصم التلقائي من المخزون بعد تحصيل شيك: بيدور على وصفة كل صنف مباع، ويخصم المواد الخام المرتبطة بيه\nfunction deductInventoryForOrder(order){\n  let changed = false;\n  order.items.forEach(line=>{\n    const recipe = inventoryData.recipes[line.name];\n    if(!recipe || recipe.length===0) return;\n    recipe.forEach(ing=>{\n      const item = inventoryData.items.find(i=>i.id===ing.itemId);\n      if(!item) return;\n      const usedQty = (parseFloat(ing.qty)||0) * line.qty;\n      item.currentQty = (parseFloat(item.currentQty)||0) - usedQty;\n      inventoryData.movements.push({id:Date.now()+Math.random(), itemId:item.id, type:'sale', qty:-usedQty, date:new Date().toISOString(), note:`بيع: ${line.name} × ${line.qty}`, orderId:order.id});\n      changed = true;\n    });\n  });\n  if(changed) saveInventory();\n}\n\n/* ---- عرض تبويب: الأصناف والتوريد ---- */\nfunction renderInvItemsList(){\n  const listEl = document.getElementById('invItemsList');\n  if(inventoryData.items.length===0){\n    listEl.innerHTML = beansEmpty('stock','لا يوجد مخزون','أضف أصناف المخزون لتجنب نفادها');\n    return;\n  }\n  let html = '';\n  inventoryData.items.forEach(item=>{\n    const qtyClass = item.currentQty <= (item.minQty||0) ? 'low' : '';\n    html += `\n      <div class=\"inv-item-card\" data-id=\"${item.id}\">\n        <div class=\"iv-top\">\n          <div>\n            <div class=\"iv-name\">${item.name}<\/div>\n            <div class=\"iv-sub\">تكلفة الوحدة: ${fmtQty(item.costPerUnit||0)} ج.م<\/div>\n          <\/div>\n          <div class=\"iv-qty ${qtyClass}\">${fmtQty(item.currentQty)} ${item.unit}<\/div>\n        <\/div>\n        <div class=\"iv-actions\">\n          <input type=\"number\" step=\"any\" inputmode=\"decimal\" class=\"inv-supply-input\" placeholder=\"كمية التوريد الجديدة\">\n          <button type=\"button\" class=\"inv-supply-btn\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/><\/svg> توريد<\/button>\n          <button type=\"button\" class=\"iv-del inv-del-btn\" title=\"حذف الصنف\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg><\/button>\n        <\/div>\n        <div class=\"iv-actions\" style=\"margin-top:6px;\">\n          <label style=\"font-size:12px; color:var(--ink-dim,#7d745f); white-space:nowrap;\">الحد الأدنى للتنبيه:<\/label>\n          <input type=\"number\" step=\"any\" inputmode=\"decimal\" class=\"inv-minqty-input\" value=\"${item.minQty||0}\" style=\"max-width:110px;\">\n        <\/div>\n      <\/div>`;\n  });\n  listEl.innerHTML = html;\n\n  listEl.querySelectorAll('.inv-item-card').forEach(card=>{\n    const id = card.dataset.id;\n    card.querySelector('.inv-supply-btn').addEventListener('click', ()=>{\n      const input = card.querySelector('.inv-supply-input');\n      const qty = parseFloat(input.value);\n      if(isNaN(qty) || qty<=0){ showToast('من فضلك اكتب كمية توريد صحيحة'); return; }\n      supplyInventoryItem(id, qty);\n      input.value = '';\n      renderInvItemsList();\n      renderAuditItemsList();\n      showToast('تم توريد الكمية للمخزون بنجاح');\n    });\n    card.querySelector('.inv-minqty-input').addEventListener('change', (e)=>{\n      const item = inventoryData.items.find(i=>i.id===id);\n      if(!item) return;\n      const val = parseFloat(e.target.value);\n      item.minQty = isNaN(val) || val<0 ? 0 : val;\n      saveInventory();\n      renderInvItemsList();\n    });\n    card.querySelector('.inv-del-btn').addEventListener('click', async ()=>{\n      const item = inventoryData.items.find(i=>i.id===id);\n      if(!item) return;\n      const ok = await customConfirm(`هل أنت متأكد من حذف صنف \"${item.name}\" نهائياً من المخزون؟ هيتشال من أي وصفات خصم مرتبطة بيه.`, 'حذف صنف مخزون', 'حذف');\n      if(!ok) return;\n      deleteInventoryItem(id);\n      renderInvItemsList();\n      renderRecipeAddItemSelect();\n      renderRecipeIngredientsList();\n      renderAuditItemsList();\n      showToast('تم حذف الصنف من المخزون');\n    });\n  });\n}\n\ndocument.getElementById('addInvItemBtn').addEventListener('click', ()=>{\n  const name = document.getElementById('invNewName').value.trim();\n  const unit = document.getElementById('invNewUnit').value.trim();\n  const opening = parseFloat(document.getElementById('invNewOpening').value);\n  const cost = parseFloat(document.getElementById('invNewCost').value);\n  const minQty = parseFloat(document.getElementById('invNewMinQty').value);\n\n  if(!name){ showToast('من فضلك اكتب اسم صنف المخزون'); return; }\n  if(!unit){ showToast('من فضلك اكتب وحدة القياس'); return; }\n  if(isNaN(opening) || opening<0){ showToast('من فضلك اكتب رصيد أول مدة صحيح'); return; }\n\n  addInventoryItem(name, unit, opening, isNaN(cost)||cost<0 ? 0 : cost, isNaN(minQty)||minQty<0 ? 0 : minQty);\n\n  document.getElementById('invNewName').value = '';\n  document.getElementById('invNewUnit').value = '';\n  document.getElementById('invNewOpening').value = '';\n  document.getElementById('invNewCost').value = '';\n  document.getElementById('invNewMinQty').value = '';\n\n  renderInvItemsList();\n  renderRecipeAddItemSelect();\n  renderAuditItemsList();\n  showToast('تم إضافة صنف المخزون بنجاح');\n});\n\n/* ---- عرض تبويب: وصفات الخصم ---- */\nfunction renderRecipeProductSelect(){\n  const sel = document.getElementById('recipeProductSelect');\n  const prevVal = sel.value;\n  const names = getAllMenuProductNames();\n  sel.innerHTML = names.map(n=>`<option value=\"${escapeHtml(n)}\">${n}<\/option>`).join('');\n  if(names.includes(prevVal)) sel.value = prevVal;\n  filterRecipeProductSelect();\n}\nfunction filterRecipeProductSelect(){\n  const searchEl = document.getElementById('recipeProductSearch');\n  const sel = document.getElementById('recipeProductSelect');\n  if(!searchEl || !sel) return;\n  const term = searchEl.value.trim().toLowerCase();\n  let firstVisible = null;\n  Array.from(sel.options).forEach(opt=>{\n    const match = !term || opt.textContent.toLowerCase().includes(term);\n    opt.style.display = match ? '' : 'none';\n    if(match && !firstVisible) firstVisible = opt;\n  });\n  // لو الصنف المختار حالياً اتخفى بسبب البحث، انتقل تلقائياً لأول نتيجة ظاهرة\n  const selectedOpt = sel.options[sel.selectedIndex];\n  if(term && selectedOpt && selectedOpt.style.display === 'none' && firstVisible){\n    sel.value = firstVisible.value;\n    renderRecipeIngredientsList();\n  }\n}\ndocument.getElementById('recipeProductSearch').addEventListener('input', filterRecipeProductSelect);\nfunction renderRecipeAddItemSelect(){\n  const sel = document.getElementById('recipeAddItemSelect');\n  if(inventoryData.items.length===0){\n    sel.innerHTML = `<option value=\"\">لا يوجد أصناف مخزون — أضف أصناف أولاً من التبويب الأول<\/option>`;\n    return;\n  }\n  sel.innerHTML = inventoryData.items.map(i=>`<option value=\"${i.id}\">${i.name} (${i.unit})<\/option>`).join('');\n  filterRecipeAddItemSelect();\n}\nfunction filterRecipeAddItemSelect(){\n  const searchEl = document.getElementById('recipeAddItemSearch');\n  const sel = document.getElementById('recipeAddItemSelect');\n  if(!searchEl || !sel) return;\n  const term = searchEl.value.trim().toLowerCase();\n  let firstVisible = null;\n  Array.from(sel.options).forEach(opt=>{\n    const match = !term || opt.textContent.toLowerCase().includes(term);\n    opt.style.display = match ? '' : 'none';\n    if(match && !firstVisible) firstVisible = opt;\n  });\n  const selectedOpt = sel.options[sel.selectedIndex];\n  if(term && selectedOpt && selectedOpt.style.display === 'none' && firstVisible){\n    sel.value = firstVisible.value;\n  }\n}\ndocument.getElementById('recipeAddItemSearch').addEventListener('input', filterRecipeAddItemSelect);\nfunction currentRecipeProduct(){\n  return document.getElementById('recipeProductSelect').value;\n}\nfunction renderRecipeIngredientsList(){\n  const listEl = document.getElementById('recipeIngredientsList');\n  const productName = currentRecipeProduct();\n  const recipe = inventoryData.recipes[productName] || [];\n  if(recipe.length===0){\n    listEl.innerHTML = `<div class=\"empty-line\">لا توجد مواد خام مرتبطة بهذا الصنف بعد<\/div>`;\n    return;\n  }\n  let html = '';\n  recipe.forEach((ing, idx)=>{\n    const item = inventoryData.items.find(i=>i.id===ing.itemId);\n    if(!item) return;\n    html += `\n      <div class=\"recipe-ing-row\" data-idx=\"${idx}\">\n        <div class=\"ri-txt\">${item.name}: ${fmtQty(ing.qty)} ${item.unit} / وحدة مباعة<\/div>\n        <button type=\"button\" class=\"iv-del recipe-ing-del\" title=\"حذف من الوصفة\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg><\/button>\n      <\/div>`;\n  });\n  listEl.innerHTML = html || `<div class=\"empty-line\">لا توجد مواد خام مرتبطة بهذا الصنف بعد<\/div>`;\n  listEl.querySelectorAll('.recipe-ing-del').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      const idx = parseInt(btn.closest('.recipe-ing-row').dataset.idx);\n      inventoryData.recipes[productName].splice(idx, 1);\n      if(inventoryData.recipes[productName].length===0) delete inventoryData.recipes[productName];\n      saveInventory();\n      renderRecipeIngredientsList();\n      showToast('تم حذف المادة من الوصفة');\n    });\n  });\n}\ndocument.getElementById('recipeProductSelect').addEventListener('change', renderRecipeIngredientsList);\ndocument.getElementById('addRecipeIngredientBtn').addEventListener('click', ()=>{\n  const productName = currentRecipeProduct();\n  const itemId = document.getElementById('recipeAddItemSelect').value;\n  const qty = parseFloat(document.getElementById('recipeAddQty').value);\n\n  if(!productName){ showToast('اختر صنف من المنيو أولاً'); return; }\n  if(!itemId){ showToast('اختر مادة خام من المخزون'); return; }\n  if(isNaN(qty) || qty<=0){ showToast('اكتب كمية صحيحة تُخصم من المخزون'); return; }\n\n  if(!inventoryData.recipes[productName]) inventoryData.recipes[productName] = [];\n  const existing = inventoryData.recipes[productName].find(r=>r.itemId===itemId);\n  if(existing){ existing.qty = qty; }\n  else{ inventoryData.recipes[productName].push({itemId, qty}); }\n  saveInventory();\n\n  document.getElementById('recipeAddQty').value = '';\n  renderRecipeIngredientsList();\n  showToast('تم حفظ المادة في وصفة الخصم');\n});\n\n/* ---- عرض تبويب: الجرد اليومي ---- */\nfunction renderAuditItemsList(){\n  const listEl = document.getElementById('auditItemsList');\n  document.getElementById('auditResultBox').style.display = 'none';\n  if(inventoryData.items.length===0){\n    listEl.innerHTML = `<div class=\"empty-line\">لا يوجد أصناف مخزون لعمل جرد لها<\/div>`;\n    return;\n  }\n  let html = '';\n  inventoryData.items.forEach(item=>{\n    html += `\n      <div class=\"audit-item-row\" data-id=\"${item.id}\" data-name=\"${escapeHtml(item.name.toLowerCase())}\">\n        <div class=\"ai-name\">${item.name}<br><span class=\"ai-expected\">مفترض: ${fmtQty(item.currentQty)} ${item.unit}<\/span><\/div>\n        <input type=\"number\" step=\"any\" inputmode=\"decimal\" class=\"audit-count-input\" placeholder=\"العدد الفعلي\">\n      <\/div>`;\n  });\n  listEl.innerHTML = html;\n  filterAuditItemsList();\n}\nfunction filterAuditItemsList(){\n  const searchEl = document.getElementById('auditItemsSearch');\n  if(!searchEl) return;\n  const term = searchEl.value.trim().toLowerCase();\n  document.querySelectorAll('#auditItemsList .audit-item-row').forEach(row=>{\n    const name = row.dataset.name || '';\n    row.style.display = (!term || name.includes(term)) ? '' : 'none';\n  });\n}\ndocument.getElementById('auditItemsSearch').addEventListener('input', filterAuditItemsList);\n\nfunction runAudit(){\n  const rows = document.querySelectorAll('#auditItemsList .audit-item-row');\n  const entries = [];\n  rows.forEach(row=>{\n    const id = row.dataset.id;\n    const item = inventoryData.items.find(i=>i.id===id);\n    if(!item) return;\n    const val = row.querySelector('.audit-count-input').value;\n    if(val === '') return;\n    const counted = parseFloat(val) || 0;\n    const expected = parseFloat(item.currentQty) || 0;\n    const variance = counted - expected;\n    const value = variance * (parseFloat(item.costPerUnit)||0);\n    entries.push({itemId:id, name:item.name, unit:item.unit, expected, counted, variance, value});\n  });\n  if(entries.length===0){ showToast('اكتب العدد الفعلي لصنف واحد على الأقل'); return; }\n\n  const matchCount = entries.filter(e=>Math.abs(e.variance) < 0.0001).length;\n  const diffCount = entries.length - matchCount;\n  const totalValue = entries.reduce((s,e)=>s+e.value, 0);\n\n  document.getElementById('auditMatchCount').textContent = matchCount;\n  document.getElementById('auditDiffCount').textContent = diffCount;\n  const totalEl = document.getElementById('auditTotalValue');\n  totalEl.textContent = (totalValue>0?'+':'') + fmtQty(totalValue) + ' ج.م';\n  totalEl.style.color = totalValue < 0 ? 'var(--danger)' : (totalValue > 0 ? 'var(--ok)' : 'var(--cream)');\n\n  document.getElementById('auditResultDetails').innerHTML = entries.map(e=>{\n    const isMatch = Math.abs(e.variance) < 0.0001;\n    const cls = isMatch ? 'ok' : 'bad';\n    const sign = e.variance > 0 ? '+' : '';\n    const statusTxt = isMatch ? ' مطابق' : (e.variance>0 ? 'فائض' : 'عجز');\n    return `<div class=\"audit-result-row\"><span>${e.name}<\/span><span class=\"${cls}\">${statusTxt} ${sign}${fmtQty(e.variance)} ${e.unit} (${sign}${fmtQty(e.value)} ج.م)<\/span><\/div>`;\n  }).join('');\n\n  const box = document.getElementById('auditResultBox');\n  box.style.display = 'block';\n  box.dataset.entries = JSON.stringify(entries);\n}\ndocument.getElementById('runAuditBtn').addEventListener('click', runAudit);\n\ndocument.getElementById('applyAuditBtn').addEventListener('click', async ()=>{\n  const raw = document.getElementById('auditResultBox').dataset.entries;\n  if(!raw) return;\n  const entries = JSON.parse(raw);\n  const ok = await customConfirm('هيتم تحديث رصيد المخزون ليطابق العدد الفعلي اللي دخلته دلوقتي، وهيتسجل الفرق في سجل الحركات. هل تريد الاستمرار؟', 'تحديث الرصيد حسب الجرد', 'تحديث الرصيد');\n  if(!ok) return;\n  entries.forEach(e=>{\n    const item = inventoryData.items.find(i=>i.id===e.itemId);\n    if(!item) return;\n    item.currentQty = e.counted;\n    inventoryData.movements.push({id:Date.now()+Math.random(), itemId:item.id, type:'audit_adjust', qty:e.variance, date:new Date().toISOString(), note:'تسوية جرد يومي'});\n  });\n  inventoryData.audits.push({id:Date.now(), date:new Date().toISOString(), entries});\n  saveInventory();\n  cloudSync('syncInventoryAudits', inventoryData.audits);\n  renderInvItemsList();\n  renderAuditItemsList();\n  document.getElementById('auditResultBox').style.display = 'none';\n  showToast('تم تحديث رصيد المخزون حسب الجرد الفعلي');\n});\n\n/* ---- فتح/قفل المودال وتبويباته ---- */\nconst inventoryModalOverlay = document.getElementById('inventoryModalOverlay');\ndocument.getElementById('inventoryBtn').addEventListener('click', ()=>{\n  if(window.electronAPI){ window.electronAPI.openWindow('inventory'); return; }\n  renderRecipeProductSelect();\n  renderRecipeAddItemSelect();\n  renderInvItemsList();\n  renderRecipeIngredientsList();\n  renderAuditItemsList();\n  inventoryModalOverlay.classList.add('show');\n});\ndocument.getElementById('inventoryModalClose').addEventListener('click', ()=>inventoryModalOverlay.classList.remove('show'));\ninventoryModalOverlay.addEventListener('click', (e)=>{ if(e.target===inventoryModalOverlay && !document.body.classList.contains('standalone-page')) inventoryModalOverlay.classList.remove('show'); });\n\n/* ---- مودال الاستاف: فتح/قفل وتبويباته ---- */\nconst staffHrModalOverlay = document.getElementById('staffHrModalOverlay');\ndocument.getElementById('staffHrBtn').addEventListener('click', ()=>{\n  const dateInput = document.getElementById('hrPosAttDate');\n  if(!dateInput.value) dateInput.value = todayDateKeyHr();\n  renderHrPosEmployeeSelect();\n  watchHrPosAttendance(dateInput.value);\n  _hrPosPermissionHours = 0;\n  updateHrPosPermissionBtnLabel();\n  updateHrPosHoursPreview();\n  staffHrModalOverlay.classList.add('show');\n});\ndocument.getElementById('staffHrModalClose').addEventListener('click', ()=>{\n  staffHrModalOverlay.classList.remove('show');\n  if(_hrPosAttUnsub){ _hrPosAttUnsub(); _hrPosAttUnsub = null; }\n});\nstaffHrModalOverlay.addEventListener('click', (e)=>{\n  if(e.target===staffHrModalOverlay){\n    staffHrModalOverlay.classList.remove('show');\n    if(_hrPosAttUnsub){ _hrPosAttUnsub(); _hrPosAttUnsub = null; }\n  }\n});\ndocument.getElementById('hrPosAttDate').addEventListener('change', (e)=> watchHrPosAttendance(e.target.value || todayDateKeyHr()));\ndocument.getElementById('hrPosAttEmployee').addEventListener('change', prefillHrPosFormForSelection);\ndocument.getElementById('hrPosAttIn').addEventListener('input', updateHrPosHoursPreview);\ndocument.getElementById('hrPosAttOut').addEventListener('input', updateHrPosHoursPreview);\n\n// حوار إدخال رقم بديل عن window.prompt (اللي مش شغال جوه تطبيق Electron)\nfunction askNumberPrompt(title, message, defaultValue, callback){\n  const overlay = document.createElement('div');\n  overlay.className = 'modal-overlay show';\n  overlay.style.zIndex = '9999';\n  overlay.innerHTML = `\n    <div class=\"modal\" style=\"max-width:340px; text-align:center;\">\n      <h2 style=\"margin-bottom:4px;\">${title}<\/h2>\n      <div class=\"sub-note\" style=\"margin-bottom:16px;\">${message}<\/div>\n      <input type=\"number\" step=\"any\" id=\"numberPromptInput\" value=\"${defaultValue!=null && defaultValue!=='' ? defaultValue : ''}\" style=\"width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--gold-bright); padding:10px; font-family:inherit; font-weight:800; text-align:center; outline:none; margin-bottom:14px; box-sizing:border-box;\">\n      <div style=\"display:flex; gap:10px;\">\n        <button type=\"button\" class=\"btn-outline\" id=\"numberPromptCancelBtn\" style=\"flex:1; padding:11px; border-radius:11px; cursor:pointer;\">إلغاء<\/button>\n        <button type=\"button\" class=\"btn-gold\" id=\"numberPromptConfirmBtn\" style=\"flex:1; padding:11px; border-radius:11px; cursor:pointer;\">تأكيد<\/button>\n      <\/div>\n    <\/div>`;\n  document.body.appendChild(overlay);\n  const input = overlay.querySelector('#numberPromptInput');\n  setTimeout(()=>{ input.focus(); input.select(); }, 50);\n  const close = ()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };\n  const confirmVal = ()=>{ const v = input.value; close(); callback(v); };\n  overlay.querySelector('#numberPromptConfirmBtn').addEventListener('click', confirmVal);\n  overlay.querySelector('#numberPromptCancelBtn').addEventListener('click', ()=>{ close(); callback(null); });\n  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') confirmVal(); });\n  overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ close(); callback(null); } });\n}\n\ndocument.getElementById('hrPosAttPermissionBtn').addEventListener('click', ()=>{\n  askNumberPrompt('استئذان ساعات', 'استئذان ساعات: كام ساعة؟ (هتتضاف على ساعات الشغل بتاعته — اكتب 0 عشان تلغيه)', _hrPosPermissionHours || '', (v)=>{\n    if(v===null) return;\n    const n = parseFloat(v);\n    if(isNaN(n) || n<0){ showToast('اكتب رقم ساعات صحيح'); return; }\n    _hrPosPermissionHours = n;\n    updateHrPosPermissionBtnLabel();\n    updateHrPosHoursPreview();\n  });\n});\n\ndocument.getElementById('hrPosAttEmployeeBtn').addEventListener('click', openHrPosEmployeePicker);\n\nfunction bindHrAmountBtn(btnId, inputId, title, msg){\n  document.getElementById(btnId).addEventListener('click', ()=>{\n    const inp = document.getElementById(inputId);\n    askNumberPrompt(title, msg, inp.value || '', (v)=>{\n      if(v===null) return;\n      const n = parseFloat(v);\n      if(v!=='' && (isNaN(n) || n<0)){ showToast('اكتب رقم صحيح'); return; }\n      inp.value = (!n || n<=0) ? '' : n;\n      updateHrPosAmountBtns();\n    });\n  });\n}\nbindHrAmountBtn('hrPosAttDeductionBtn', 'hrPosAttDeduction', 'الخصم', 'اكتب مبلغ الخصم بالجنيه (اكتب 0 عشان تلغيه)');\nbindHrAmountBtn('hrPosAttAdvanceBtn', 'hrPosAttAdvance', 'السلفة', 'اكتب مبلغ السلفة بالجنيه (اكتب 0 عشان تلغيها)');\n\ndocument.querySelectorAll('#hrPosAttStatusGroup .hr-status-btn').forEach(btn=>{\n  btn.addEventListener('click', ()=>{\n    const st = btn.getAttribute('data-status');\n    if(st === 'absent_unauth'){\n      askUnauthorizedAbsenceDays((n)=>{\n        if(!n) return;\n        _hrPosUnauthDays = n;\n        setHrPosStatus('absent_unauth');\n        updateHrPosUnauthBtnLabel();\n      });\n      return;\n    }\n    _hrPosUnauthDays = 0;\n    setHrPosStatus(st);\n    updateHrPosUnauthBtnLabel();\n  });\n});\n\n/* ============ الاستاف: قسم الموظفين (محمي بكلمة مرور) ============ */\nconst STAFF_PASSWORD_KEY = 'beans_staff_password';\nfunction getStaffPassword(){ return localStorage.getItem(STAFF_PASSWORD_KEY) || '1'; }\nfunction setStaffPassword(v){ localStorage.setItem(STAFF_PASSWORD_KEY, v); }\n\nfunction showStaffAttView(){\n  document.getElementById('staffAttView').style.display = '';\n  document.getElementById('staffEmpView').style.display = 'none';\n  document.getElementById('staffTabAtt').classList.add('active');\n  document.getElementById('staffTabEmp').classList.remove('active');\n}\nfunction showStaffEmpView(){\n  document.getElementById('staffAttView').style.display = 'none';\n  document.getElementById('staffEmpView').style.display = '';\n  document.getElementById('staffTabEmp').classList.add('active');\n  document.getElementById('staffTabAtt').classList.remove('active');\n  renderEmployeesList();\n}\nfunction resetEmployeeForm(){\n  document.getElementById('empEditId').value = '';\n  ['empNewName','empNewPhone','empNewSalary','empNewStartDate'].forEach(id=>{ document.getElementById(id).value = ''; });\n  document.getElementById('empNewAgreedHours').value = '8';\n  document.getElementById('empNewJob').value = 'باريستا';\n  document.getElementById('saveEmployeeBtn').textContent = 'حفظ الموظف';\n  document.getElementById('cancelEmployeeEditBtn').style.display = 'none';\n}\nfunction renderEmployeesList(){\n  const box = document.getElementById('empListBox');\n  if(!box) return;\n  if(!staffProfiles.length){\n    box.innerHTML = '<div class=\"hr-att-empty\" style=\"padding:14px;\">لا يوجد موظفين بعد<\/div>';\n    return;\n  }\n  box.innerHTML = staffProfiles.map((e, idx)=>`\n    <div style=\"background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px;\">\n        <b style=\"font-size:14px;\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7\"/><\/svg> ${escapeHtmlPos(e.name)}<\/b>\n        <span style=\"font-size:12px; color:var(--muted);\">${escapeHtmlPos(e.job||'-')}<\/span>\n      <\/div>\n      <div style=\"font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.8;\">\n         ${escapeHtmlPos(e.phone||'-')} &nbsp;|&nbsp;  ${fmtQty(e.salary||0)} ج &nbsp;|&nbsp;  ${fmtQty(e.agreedHours||8)} س &nbsp;|&nbsp;  ${escapeHtmlPos(e.startDate||'-')}\n      <\/div>\n      <div style=\"display:flex; gap:8px;\">\n        <button type=\"button\" class=\"btn-outline\" data-emp-edit=\"${idx}\" style=\"flex:1; padding:8px; border-radius:9px; cursor:pointer;\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13.5 6.5l4 4\"/><\/svg> تعديل<\/button>\n        <button type=\"button\" class=\"btn-outline\" data-emp-del=\"${idx}\" style=\"flex:1; padding:8px; border-radius:9px; cursor:pointer; color:var(--danger);\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg> حذف<\/button>\n      <\/div>\n    <\/div>`).join('');\n  box.querySelectorAll('[data-emp-edit]').forEach(b=>b.addEventListener('click', ()=>{\n    const e = staffProfiles[Number(b.getAttribute('data-emp-edit'))];\n    if(!e) return;\n    document.getElementById('empEditId').value = e.id;\n    document.getElementById('empNewName').value = e.name || '';\n    document.getElementById('empNewJob').value = e.job || 'باريستا';\n    document.getElementById('empNewPhone').value = e.phone || '';\n    document.getElementById('empNewSalary').value = e.salary || '';\n    document.getElementById('empNewAgreedHours').value = e.agreedHours || 8;\n    document.getElementById('empNewStartDate').value = e.startDate || '';\n    document.getElementById('saveEmployeeBtn').textContent = 'حفظ التعديل';\n    document.getElementById('cancelEmployeeEditBtn').style.display = '';\n    document.getElementById('empNewName').focus();\n  }));\n  box.querySelectorAll('[data-emp-del]').forEach(b=>b.addEventListener('click', async ()=>{\n    const e = staffProfiles[Number(b.getAttribute('data-emp-del'))];\n    if(!e) return;\n    const ok = await customConfirm('هيتم حذف الموظف ' + e.name + ' من القائمة. متأكد؟', 'حذف موظف');\n    if(!ok) return;\n    staffProfiles = staffProfiles.filter(x=>x.id !== e.id);\n    saveStaffProfiles();\n    renderEmployeesList();\n    renderHrPosEmployeeSelect();\n    showToast('تم حذف الموظف');\n  }));\n}\ndocument.getElementById('staffTabAtt').addEventListener('click', showStaffAttView);\ndocument.getElementById('staffTabEmp').addEventListener('click', ()=>{\n  document.getElementById('staffPassInput').value = '';\n  document.getElementById('staffPassModalOverlay').classList.add('show');\n  setTimeout(()=>document.getElementById('staffPassInput').focus(), 50);\n});\nfunction closeStaffPass(){ document.getElementById('staffPassModalOverlay').classList.remove('show'); }\ndocument.getElementById('staffPassCancel').addEventListener('click', closeStaffPass);\ndocument.getElementById('staffPassModalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='staffPassModalOverlay') closeStaffPass(); });\nfunction checkStaffPass(){\n  const v = document.getElementById('staffPassInput').value;\n  if(!window.__BEANS_DEMO_ANY_PW && v !== getStaffPassword()){\n    showToast('كلمة المرور غلط');\n    document.getElementById('staffPassInput').value = '';\n    return;\n  }\n  closeStaffPass();\n  resetEmployeeForm();\n  showStaffEmpView();\n}\ndocument.getElementById('staffPassOk').addEventListener('click', checkStaffPass);\ndocument.getElementById('staffPassInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') checkStaffPass(); });\ndocument.getElementById('staffHrBtn').addEventListener('click', showStaffAttView);\ndocument.getElementById('staffHrModalClose').addEventListener('click', showStaffAttView);\nstaffHrModalOverlay.addEventListener('click', (e)=>{ if(e.target===staffHrModalOverlay) showStaffAttView(); });\ndocument.getElementById('cancelEmployeeEditBtn').addEventListener('click', resetEmployeeForm);\ndocument.getElementById('saveEmployeeBtn').addEventListener('click', ()=>{\n  const name = document.getElementById('empNewName').value.trim();\n  if(!name){ showToast('اكتب اسم الموظف'); return; }\n  const editId = document.getElementById('empEditId').value;\n  const data = {\n    name,\n    job: document.getElementById('empNewJob').value,\n    phone: document.getElementById('empNewPhone').value.trim(),\n    salary: parseFloat(document.getElementById('empNewSalary').value) || 0,\n    agreedHours: parseFloat(document.getElementById('empNewAgreedHours').value) || 8,\n    startDate: document.getElementById('empNewStartDate').value || todayDateKeyHr()\n  };\n  if(editId){\n    staffProfiles = staffProfiles.map(e=> e.id===editId ? { ...e, ...data } : e);\n    showToast('تم تعديل بيانات الموظف');\n  } else {\n    staffProfiles.push({ id: 'emp_' + Date.now(), ...data });\n    showToast('تم حفظ الموظف');\n  }\n  saveStaffProfiles();\n  resetEmployeeForm();\n  renderEmployeesList();\n  renderHrPosEmployeeSelect();\n});\n\ndocument.getElementById('saveStaffPasswordBtn').addEventListener('click', ()=>{\n  const val = document.getElementById('newStaffPasswordInput').value;\n  const confirmVal = document.getElementById('confirmStaffPasswordInput').value;\n  if(!val || val.length < 4){ showToast('اكتبي كلمة مرور 4 حروف/أرقام على الأقل'); return; }\n  if(val !== confirmVal){ showToast('كلمة المرور وتأكيدها مش متطابقين'); return; }\n  setStaffPassword(val);\n  document.getElementById('newStaffPasswordInput').value = '';\n  document.getElementById('confirmStaffPasswordInput').value = '';\n  showToast('تم تغيير كلمة مرور قسم الموظفين بنجاح');\n});\n\ndocument.getElementById('addHrPosAttBtn').addEventListener('click', ()=>{\n  const empId = document.getElementById('hrPosAttEmployee').value;\n  const emp = staffProfiles.find(e=>e.id===empId);\n  if(!emp){ showToast('اختاري الموظف الأول'); return; }\n  const dateKey = document.getElementById('hrPosAttDate').value || todayDateKeyHr();\n  const checkIn = document.getElementById('hrPosAttIn').value;\n  const checkOut = document.getElementById('hrPosAttOut').value;\n  const deduction = parseFloat(document.getElementById('hrPosAttDeduction').value) || 0;\n  const advance = parseFloat(document.getElementById('hrPosAttAdvance').value) || 0;\n  const permissionHours = _hrPosPermissionHours || 0;\n  const status = document.getElementById('hrPosAttStatus').value || 'present';\n  const unauthorizedDays = status === 'absent_unauth' ? (_hrPosUnauthDays || 1) : 0;\n  const hours = calcHrHours(checkIn, checkOut) + permissionHours;\n  const id = `att_${dateKey}_${empId}`;\n  cloudSync('syncAttendance', { id, dateKey, employeeId: empId, employeeName: emp.name, checkIn, checkOut, hours, deduction, advance, permissionHours, status, unauthorizedDays });\n  document.getElementById('hrPosAttIn').value = '';\n  document.getElementById('hrPosAttOut').value = '';\n  document.getElementById('hrPosAttDeduction').value = '';\n  document.getElementById('hrPosAttAdvance').value = '';\n  _hrPosPermissionHours = 0;\n  _hrPosUnauthDays = 0;\n  updateHrPosPermissionBtnLabel();\n  updateHrPosUnauthBtnLabel();\n  setHrPosStatus('present');\n  updateHrPosHoursPreview();\n  showToast('تم تسجيل الحضور بنجاح');\n});\n\nfunction setInvTab(activeId){\n  ['invTabItems','invTabRecipes','invTabAudit'].forEach(id=>{\n    document.getElementById(id).classList.toggle('active', id===activeId);\n  });\n  const paneMap = {invTabItems:'invPaneItems', invTabRecipes:'invPaneRecipes', invTabAudit:'invPaneAudit'};\n  Object.values(paneMap).forEach(pid=>document.getElementById(pid).classList.remove('active'));\n  document.getElementById(paneMap[activeId]).classList.add('active');\n}\ndocument.getElementById('invTabItems').addEventListener('click', ()=>setInvTab('invTabItems'));\ndocument.getElementById('invTabRecipes').addEventListener('click', ()=>setInvTab('invTabRecipes'));\ndocument.getElementById('invTabAudit').addEventListener('click', ()=>{ setInvTab('invTabAudit'); renderAuditItemsList(); });\n\n/* ============ SHIFTS (Open &amp; Close Shift / العهدة) ============ */\nfunction getOpenShift(){\n  if(!dayData || !dayData.id) return null;\n  return dayData.shifts.find(s => s.status === 'open') || null;\n}\nfunction shiftSales(shift){\n  // إنستا باي لا يدخل درج الكاش؛ الفواتير القديمة من قبل التحديث تُعامل كاش.\n  return dayData.orders\n    .filter(o => o.shiftId === shift.id && !o.owner && (o.paymentMethod || 'cash') === 'cash')\n    .reduce((s,o)=>s+o.total, 0);\n}\nfunction shiftExpenses(shift){\n  return (dayData.expenses||[])\n    .filter(e => e.shiftId === shift.id)\n    .reduce((s,e)=>s+e.amount, 0);\n}\nfunction shiftExpectedCash(shift){\n  // النقدية المتوقعة في الدرج = عهدة البداية + مبيعات الكاش - المصروفات المسجلة على الوردية\n  return (shift.openingCash||0) + shiftSales(shift) - shiftExpenses(shift);\n}\nfunction openShift(openingCash){\n  // لو مفيش يوم عمل نشط حالياً، ده معناه إننا بندأ يوم عمل جديد دلوقتي\n  let bd = getCurrentBusinessDay();\n  let isNewDay = false;\n  if(!bd){\n    const id = 'bd_' + Date.now();\n    bd = { id, dateKey: dayKeyStr(), openedAt: new Date().toISOString(), closedAt: null, orders: [], shifts: [], expenses: [] };\n    appData.history[id] = bd;\n    appData.currentBusinessDayKey = id;\n    isNewDay = true;\n  }\n  const shift = {\n    id: Date.now(),\n    openedAt: new Date().toISOString(),\n    closedAt: null,\n    openingCash: parseFloat(openingCash) || 0,\n    countedCash: null,\n    expectedCash: null,\n    variance: null,\n    status: 'open',\n    cashierName: currentCashier || '-',\n    closedByCashier: null\n  };\n  bd.shifts.push(shift);\n  saveDay();\n  refreshDayDataPointer();\n  updateShiftPill();\n  updateDayPill();\n  if(isNewDay) cloudSync('syncBusinessDay', bd);\n  cloudSync('syncShift', shift, bd.id);\n  return shift;\n}\nfunction closeShift(countedCash){\n  const shift = getOpenShift();\n  if(!shift) return;\n  const expected = shiftExpectedCash(shift);\n  const counted = parseFloat(countedCash) || 0;\n  shift.closedAt = new Date().toISOString();\n  shift.expectedCash = expected;\n  shift.countedCash = counted;\n  shift.variance = counted - expected;\n  shift.status = 'closed';\n  shift.closedByCashier = currentCashier || '-';\n  saveDay();\n  updateShiftPill();\n  const bd = getCurrentBusinessDay();\n  cloudSync('syncShift', shift, bd ? bd.id : null);\n  return shift;\n}\n// إظهار مبالغ الوردية (النقدية المتوقعة ومبيعات الكاش): مخفية افتراضياً، وبترجع من الإعدادات\nfunction getShowShiftAmounts(){\n  return localStorage.getItem('beans_show_shift_amounts') === '1';\n}\nfunction updateShiftPill(){\n  const pill = document.getElementById('shiftPillBtn');\n  const dotLbl = document.getElementById('shiftAmtLbl');\n  const activeShift = getOpenShift();\n  if(activeShift){\n    pill.className = 'shift-pill open';\n    dotLbl.textContent = getShowShiftAmounts() ? (fmt(shiftExpectedCash(activeShift)) + ' ج.م') : 'مفتوحة';\n  } else {\n    pill.className = 'shift-pill closed';\n    dotLbl.textContent = 'مغلقة';\n  }\n}\n\n/* ============ EXPENSES (خصم من الخزنة/الدرج تلقائياً) ============ */\n// كل مصروف بيتخصم فورًا من النقدية المتوقعة في درج الوردية (shiftExpectedCash)\n// عشان يسهّل جرد الشفت أو اليوم ويضمن مطابقة الأرقام.\nconst EXPENSE_CATEGORIES = [\n  { id:'cleaning',  label:'مستلزمات نظافة' },\n  { id:'hospitality', label:'ضيافة' },\n  { id:'emergency', label:'مستلزمات طارئة' },\n  { id:'quick_purchase', label:'مشتريات نقدية سريعة' },\n  { id:'maintenance', label:'صيانة' },\n  { id:'bills', label:'فواتير (كهرباء / مياه / نت)' },\n  { id:'delivery', label:'توصيل ونقل' },\n  { id:'salary_advance', label:'سلفة / مرتبات' },\n  { id:'marketing', label:'تسويق وإعلانات' },\n  { id:'other', label:'أخرى' }\n];\nfunction expenseCategoryLabel(id){\n  return (EXPENSE_CATEGORIES.find(c=>c.id===id) || EXPENSE_CATEGORIES[EXPENSE_CATEGORIES.length-1]).label;\n}\nfunction dayExpensesTotal(){\n  return (dayData.expenses||[]).reduce((s,e)=>s+e.amount, 0);\n}\nfunction addExpense(amount, categoryId, note){\n  const activeShift = getOpenShift();\n  if(!activeShift){\n    showToast('لازم تفتح وردية الأول عشان تسجل مصروف');\n    return null;\n  }\n  const amt = parseFloat(amount);\n  if(!amt || amt <= 0){\n    showToast('من فضلك أدخل مبلغ صحيح');\n    return null;\n  }\n  if(!dayData.expenses) dayData.expenses = [];\n  const expense = {\n    id: 'exp_' + Date.now(),\n    shiftId: activeShift.id,\n    amount: amt,\n    category: categoryId || 'other',\n    note: (note || '').trim(),\n    time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}),\n    createdAt: new Date().toISOString(),\n    cashierName: currentCashier || '-'\n  };\n  dayData.expenses.push(expense);\n  saveDay();\n  updateShiftPill();\n  cloudSync('syncExpense', expense, dayData.id, dayData.dateKey);\n  return expense;\n}\nfunction deleteExpense(expenseId){\n  if(!dayData.expenses) return;\n  const exp = dayData.expenses.find(e=>e.id===expenseId);\n  dayData.expenses = dayData.expenses.filter(e => e.id !== expenseId);\n  saveDay();\n  updateShiftPill();\n  cloudSync('deleteExpense', expenseId);\n  if(exp) logAudit('حذف مصروف', `${expenseCategoryLabel(exp.category)} — ${fmt(exp.amount)} ج.م`);\n}\n\n/* ============ RENDER HALLS TABS + TABLES BAR ============ */\nfunction renderHallTabs(){\n  const wrap = document.getElementById('hallsContainer');\n  wrap.innerHTML = HALLS.map(h => `<div class=\"hall-tab ${h.id===activeHall?'active':''}\" data-hall=\"${h.id}\">${h.name}<\/div>`).join('');\n  wrap.querySelectorAll('.hall-tab').forEach(tab => {\n    tab.addEventListener('click', () => {\n      activeHall = tab.dataset.hall;\n      activeTable = 1; // الرجوع للترابيزة الأولى عند تبديل الصالة\n      renderHallTabs();\n      renderAll();\n    });\n  });\n}\n\nfunction renderTablesBar(){\n  const bar = document.getElementById('tablesBar');\n  const hall = getHall(activeHall);\n  if(!hall){ bar.innerHTML=''; return; }\n  const countTables = hall.tableCount;\n\n  let html = '';\n  for(let i=1; i<=countTables; i++){\n    const tData = tablesCarts[activeHall][i];\n    if(!tData) continue;\n    const count = tData.items.reduce((s,it)=>s+it.qty, 0);\n    const hasItems = count > 0;\n    const isActive = activeTable === i;\n    html += `\n      <div class=\"table-btn ${isActive?'active':''} ${hasItems?'has-items':''}\" data-table=\"${i}\">\n        <div class=\"t-name\">${tableDisplayLabel(activeHall, i)}<\/div>\n        <div class=\"t-status\">${hasItems ? count + ' صنف مفتوح' : 'فارغة'}<\/div>\n      <\/div>`;\n  }\n  bar.innerHTML = html;\n  bar.querySelectorAll('.table-btn').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      activeTable = parseInt(btn.dataset.table);\n      renderAll();\n    });\n  });\n}\n\n/* ============ LIVE BOARD (شاشة بث مباشر لحالة الترابيزات) ============ */\nfunction elapsedSince(ts){\n  if(!ts) return '';\n  const mins = Math.max(0, Math.floor((Date.now()-ts)/60000));\n  if(mins<1) return 'من دلوقتي';\n  if(mins<60) return `من ${mins} دقيقة`;\n  const h = Math.floor(mins/60), m = mins%60;\n  return `من ${h} س${m>0?' و'+m+' د':''}`;\n}\nfunction renderLiveBoard(){\n  const body = document.getElementById('liveBoardBody');\n  if(!body) return;\n  if(!HALLS.length){ body.innerHTML = '<div class=\"live-board-empty\">مفيش صالات متسجلة<\/div>'; return; }\n  let html = '';\n  HALLS.forEach(hall=>{\n    html += `<div class=\"live-hall\"><div class=\"live-hall-title\">${escapeHtml(hall.name)} (${hall.tableCount} ترابيزة)<\/div><div class=\"live-tables-grid\">`;\n    for(let i=1;i<=hall.tableCount;i++){\n      const tData = tablesCarts[hall.id] && tablesCarts[hall.id][i];\n      const count = tData ? tData.items.reduce((s,it)=>s+it.qty,0) : 0;\n      const hasItems = count>0;\n      const total = tData ? tData.items.reduce((s,it)=>s+it.price*it.qty,0) : 0;\n      html += `\n        <div class=\"live-table-card ${hasItems?'occupied':''}\">\n          <div class=\"lt-dot\"><\/div>\n          <div class=\"lt-name\">${escapeHtml(tableDisplayLabel(hall.id, i))}<\/div>\n          <div class=\"lt-status\">${hasItems? count+' صنف مفتوح' : 'فاضية'}<\/div>\n          ${hasItems? `<div class=\"lt-total\">${fmt(total)} ج.م<\/div><div class=\"lt-time\">${elapsedSince(tData.openedAt)}<\/div>` : ''}\n        <\/div>`;\n    }\n    html += `<\/div><\/div>`;\n  });\n  body.innerHTML = html;\n}\nfunction tickLiveBoardClock(){\n  const clockEl = document.getElementById('liveBoardClock');\n  const dateEl = document.getElementById('liveBoardDate');\n  if(!clockEl) return;\n  const now = new Date();\n  clockEl.textContent = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', second:'2-digit'});\n  if(dateEl) dateEl.textContent = now.toLocaleDateString('ar-EG', {weekday:'long', year:'numeric', month:'long', day:'numeric'});\n}\nlet _liveBoardInterval = null;\nfunction startLiveBoard(){\n  document.getElementById('liveBoardPage').style.display = 'block';\n  document.title = 'Beans POS - شاشة الترابيزات';\n  renderLiveBoard();\n  tickLiveBoardClock();\n  if(_liveBoardInterval) clearInterval(_liveBoardInterval);\n  _liveBoardInterval = setInterval(()=>{ tickLiveBoardClock(); renderLiveBoard(); }, 1000);\n}\nif(document.getElementById('liveBoardBtn')){\n  document.getElementById('liveBoardBtn').addEventListener('click', ()=>{\n    if(window.electronAPI){ window.electronAPI.openWindow('live'); return; }\n    showToast('شاشة البث المباشر شغالة بس في نسخة سطح المكتب');\n  });\n}\n\n/* ============ TABLES OVERVIEW MODAL (نفس شكل التربيزات في الداشبورد، جوه السيستم) ============ */\nfunction renderTablesOverviewModal(){\n  const body = document.getElementById('tablesOverviewBody');\n  if(!body) return;\n  if(!HALLS.length){ body.innerHTML = '<div class=\"live-board-empty\">مفيش صالات متسجلة<\/div>'; return; }\n  let html = '';\n  HALLS.forEach(hall=>{\n    html += `<div class=\"live-hall\"><div class=\"live-hall-title\">${escapeHtml(hall.name)} (${hall.tableCount} ترابيزة)<\/div><div class=\"live-tables-grid\">`;\n    for(let i=1;i<=hall.tableCount;i++){\n      const tData = tablesCarts[hall.id] && tablesCarts[hall.id][i];\n      const count = tData ? tData.items.reduce((s,it)=>s+it.qty,0) : 0;\n      const hasItems = count>0;\n      const total = tData ? tData.items.reduce((s,it)=>s+it.price*it.qty,0) : 0;\n      const isActive = (hall.id===activeHall && i===activeTable);\n      html += `\n        <div class=\"live-table-card ${hasItems?'occupied':''}\" data-hall=\"${escapeHtml(hall.id)}\" data-num=\"${i}\" style=\"cursor:pointer;${isActive?' outline:2px solid var(--gold-bright); outline-offset:2px;':''}\">\n          <div class=\"lt-dot\"><\/div>\n          <div class=\"lt-name\">${escapeHtml(tableDisplayLabel(hall.id, i))}<\/div>\n          <div class=\"lt-status\">${hasItems? count+' صنف مفتوح' : 'فاضية'}<\/div>\n          ${hasItems? `<div class=\"lt-total\">${fmt(total)} ج.م<\/div><div class=\"lt-time\">${elapsedSince(tData.openedAt)}<\/div>` : ''}\n        <\/div>`;\n    }\n    html += `<\/div><\/div>`;\n  });\n  body.innerHTML = html;\n  body.querySelectorAll('.live-table-card').forEach(card=>{\n    card.addEventListener('click', ()=>{\n      activeHall = card.dataset.hall;\n      activeTable = parseInt(card.dataset.num, 10);\n      renderHallTabs();\n      renderAll();\n      closeTablesOverviewModal();\n    });\n  });\n}\nlet _tablesOverviewInterval = null;\nfunction openTablesOverviewModal(){\n  document.getElementById('tablesOverviewModalOverlay').classList.add('show');\n  renderTablesOverviewModal();\n  if(_tablesOverviewInterval) clearInterval(_tablesOverviewInterval);\n  _tablesOverviewInterval = setInterval(renderTablesOverviewModal, 1000);\n}\nfunction closeTablesOverviewModal(){\n  document.getElementById('tablesOverviewModalOverlay').classList.remove('show');\n  if(_tablesOverviewInterval){ clearInterval(_tablesOverviewInterval); _tablesOverviewInterval = null; }\n}\ndocument.getElementById('tablesOverviewBtn').addEventListener('click', openTablesOverviewModal);\ndocument.getElementById('tablesOverviewModalClose').addEventListener('click', closeTablesOverviewModal);\ndocument.getElementById('tablesOverviewModalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='tablesOverviewModalOverlay') closeTablesOverviewModal(); });\n\n/* ============ RENDER: TABS + GRID ============ */\nconst tabsEl = document.getElementById('tabs');\nconst gridWrap = document.getElementById('gridWrap');\nconst searchInput = document.getElementById('searchInput');\n\nfunction renderTabs(){\n  tabsEl.innerHTML = MENU.map(c => `\n    <div class=\"tab ${c.cat===activeCat?'active':''}\" data-cat=\"${c.cat}\">\n      <span class=\"em\">${bnIcon(c.emoji)}<\/span>${c.label}\n    <\/div>`).join('');\n  tabsEl.querySelectorAll('.tab').forEach(t=>{\n    t.addEventListener('click', ()=>{ \n      activeCat = t.dataset.cat; \n      searchInput.value = ''; \n      renderTabs(); \n      renderGrid(); \n    });\n  });\n  // تمرير القسم النشط لمنطقة العرض لو كان مخفي جزئياً\n  const activeTabEl = tabsEl.querySelector('.tab.active');\n  if(activeTabEl) activeTabEl.scrollIntoView({block:'nearest', inline:'nearest'});\n  updateTabsArrows();\n}\n\n/* أسهم التمرير الجانبية لشريط الأقسام (تظهر لو الأقسام أكتر من المساحة المتاحة) */\nconst tabsArrowRight = document.getElementById('tabsArrowRight');\nconst tabsArrowLeft = document.getElementById('tabsArrowLeft');\nfunction updateTabsArrows(){\n  if(!tabsArrowRight || !tabsArrowLeft) return;\n  const canScroll = tabsEl.scrollWidth - tabsEl.clientWidth > 4;\n  tabsArrowRight.style.display = canScroll ? 'flex' : 'none';\n  tabsArrowLeft.style.display = canScroll ? 'flex' : 'none';\n  if(!canScroll) return;\n  const sl = tabsEl.scrollLeft;\n  // في وضع RTL بمتصفحات Chromium: 0 = بداية القائمة (أقصى اليمين)، والقيم السالبة تكشف الأقسام الإضافية (أقصى اليسار)\n  const atStart = sl >= -1;\n  const atEnd = Math.abs(sl) >= (tabsEl.scrollWidth - tabsEl.clientWidth - 1);\n  tabsArrowRight.disabled = atStart;\n  tabsArrowLeft.disabled = atEnd;\n}\nif(tabsArrowRight) tabsArrowRight.addEventListener('click', ()=> tabsEl.scrollBy({left:220, behavior:'smooth'}));\nif(tabsArrowLeft) tabsArrowLeft.addEventListener('click', ()=> tabsEl.scrollBy({left:-220, behavior:'smooth'}));\nif(tabsEl) tabsEl.addEventListener('scroll', updateTabsArrows);\nwindow.addEventListener('resize', updateTabsArrows);\n\nfunction qtyInCart(name, price){\n  const currentCart = tablesCarts[activeHall][activeTable].items;\n  const line = currentCart.find(i=>i.name===name);\n  return line ? line.qty : 0;\n}\n\nfunction renderGrid(filterText = ''){\n  let html = '';\n  const searchKey = filterText.trim().toLowerCase();\n\n  if(searchKey !== ''){\n    let foundItems = [];\n    MENU.forEach(cat => {\n      cat.groups.forEach(g => {\n        g.items.forEach(([name, price, img]) => {\n          if(name.toLowerCase().includes(searchKey)){\n            foundItems.push({name, price, img});\n          }\n        });\n      });\n    });\n\n    if(foundItems.length === 0){\n      html = beansEmpty('search','لا توجد نتائج تطابق بحثك','جرّب استخدام كلمات مختلفة');\n    } else {\n      html = `<div class=\"subhead\">نتائج البحث عن: \"${filterText}\"<\/div><div class=\"grid\">`;\n      foundItems.forEach(({name, price, img}) => {\n        const q = qtyInCart(name, price);\n        html += `\n          <div class=\"item-card ${img?'has-img':''}\" data-name=\"${escapeHtml(name)}\" data-price=\"${price}\">\n            ${q>0?`<div class=\"qty-badge\">${q}<\/div>`:''}\n            ${img?`<div class=\"item-thumb\"><img src=\"${img}\" alt=\"\"><\/div>`:''}\n            <div class=\"name\">${name}<\/div>\n            <div class=\"row-bottom\">\n              <div class=\"dots\"><\/div>\n              <div class=\"price\">${price}<span>ج.م<\/span><\/div>\n            <\/div>\n          <\/div>`;\n      });\n      html += `<\/div>`;\n    }\n  } else {\n    const cat = MENU.find(c=>c.cat===activeCat);\n    cat.groups.forEach(g=>{\n      html += `<div class=\"subhead\">${g.g}<\/div><div class=\"grid\">`;\n      g.items.forEach(([name,price,img])=>{\n        const q = qtyInCart(name, price);\n        html += `\n          <div class=\"item-card ${img?'has-img':''}\" data-name=\"${escapeHtml(name)}\" data-price=\"${price}\">\n            ${q>0?`<div class=\"qty-badge\">${q}<\/div>`:''}\n            ${img?`<div class=\"item-thumb\"><img src=\"${img}\" alt=\"\"><\/div>`:''}\n            <div class=\"name\">${name}<\/div>\n            <div class=\"row-bottom\">\n              <div class=\"dots\"><\/div>\n              <div class=\"price\">${price}<span>ج.م<\/span><\/div>\n            <\/div>\n          <\/div>`;\n      });\n      html += `<\/div>`;\n    });\n  }\n\n  gridWrap.innerHTML = html;\n  gridWrap.querySelectorAll('.item-card').forEach(card=>{\n    card.addEventListener('click', ()=>{\n      addToCart(card.dataset.name, parseFloat(card.dataset.price));\n    });\n  });\n}\nfunction escapeHtml(s){ return s.replace(/\"/g,'&quot;'); }\n\nsearchInput.addEventListener('input', (e) => {\n  renderGrid(e.target.value);\n});\n\n/* ============ CART / TABLE LOGIC ============ */\nfunction addToCart(name, price){\n  const tData = tablesCarts[activeHall][activeTable];\n  let currentCart = tData.items;\n  if(currentCart.length===0 && !tData.openedAt) tData.openedAt = Date.now();\n  let line = currentCart.find(i=>i.name===name);\n  if(line){ line.qty++; line.price = price; }\n  else{ currentCart.push({id: Date.now()+Math.random(), name, price, qty:1}); }\n  saveTablesCarts();\n  renderAll();\n  showToast(`تمت إضافة ${name} إلى ${tableDisplayLabel(activeHall, activeTable)}`);\n}\nfunction changeQty(id, delta){\n  const tData = tablesCarts[activeHall][activeTable];\n  let currentCart = tData.items;\n  const line = currentCart.find(i=>i.id===id);\n  if(!line) return;\n  if(delta < 0){\n    const removed = Math.min(-delta, line.qty);\n    if(removed > 0) recordVoid({ type:'item', tableName: tableDisplayLabel(activeHall, activeTable), name: line.name, qty: removed, price: line.price, value: r2(removed * line.price) });\n  }\n  line.qty += delta;\n  if(line.qty<=0){\n    tData.items = currentCart.filter(i=>i.id!==id);\n    // لو Item اتشال خالص من الشيك، نصفّر عداد البون بتاعه عشان لو اتضاف تاني يتحسب جديد\n    if(tData.printedBon) delete tData.printedBon[line.name];\n    if(tData.items.length===0) tData.openedAt = null;\n  }\n  saveTablesCarts();\n  renderAll();\n}\n\n/* ============ DECREMENT PASSWORD PROTECTION ============ */\nconst DECREMENT_PASSWORD_KEY = 'beans_decrement_password';\nconst DISCOUNT_PASSWORD_KEY = 'beans_discount_password';\nfunction getDecrementPassword(){\n  return localStorage.getItem(DECREMENT_PASSWORD_KEY) || '1';\n}\nfunction setDecrementPassword(pass){\n  localStorage.setItem(DECREMENT_PASSWORD_KEY, pass);\n}\nfunction getDiscountPassword(){\n  return localStorage.getItem(DISCOUNT_PASSWORD_KEY) || getDecrementPassword();\n}\nfunction setDiscountPassword(pass){\n  localStorage.setItem(DISCOUNT_PASSWORD_KEY, pass);\n}\nconst decrementPasswordModalOverlay = document.getElementById('decrementPasswordModalOverlay');\nlet pendingDecrementAction = null;\n\nfunction openDecrementPasswordModal(action){\n  // بيقبل إما رقم (id) لصنف عايزين ننقص كميته (توافقاً مع الاستخدام القديم)، أو object زي {type:'emptyTable'}\n  pendingDecrementAction = (typeof action === 'object' && action !== null) ? action : { type:'decrement', id: action };\n  const subNote = document.getElementById('decrementPasswordSubNote');\n  document.getElementById('decrementPasswordTitle').textContent = 'كلمة المرور مطلوبة ';\n  subNote.textContent = pendingDecrementAction.type === 'emptyTable'\n    ? 'أدخل كلمة المرور لإفراغ الترابيزة وحذف كل الأوردر اللي عليها'\n    : 'أدخل كلمة المرور لتقليل كمية الصنف';\n  document.getElementById('decrementPasswordInput').value = '';\n  decrementPasswordModalOverlay.classList.add('show');\n  setTimeout(()=>document.getElementById('decrementPasswordInput').focus(), 50);\n}\nfunction openDiscountPasswordModal(action){\n  pendingDecrementAction = action;\n  const isOwnerDiscount = action.type === 'ownerDiscount';\n  document.getElementById('decrementPasswordTitle').textContent = isOwnerDiscount ? 'كلمة مرور خصم المالك مطلوبة' : 'كلمة مرور الخصم مطلوبة';\n  document.getElementById('decrementPasswordSubNote').textContent = isOwnerDiscount\n    ? 'أدخل كلمة المرور لتفعيل خصم المالك مرة واحدة'\n    : 'أدخل كلمة المرور لفتح تعديل الخصم مرة واحدة';\n  document.getElementById('decrementPasswordInput').value = '';\n  decrementPasswordModalOverlay.classList.add('show');\n  setTimeout(()=>document.getElementById('decrementPasswordInput').focus(), 50);\n}\nfunction closeDecrementPasswordModal(){\n  decrementPasswordModalOverlay.classList.remove('show');\n  pendingDecrementAction = null;\n  document.getElementById('decrementPasswordInput').value = '';\n  document.getElementById('decrementPasswordTitle').textContent = 'كلمة المرور مطلوبة ';\n  document.getElementById('decrementPasswordSubNote').textContent = 'أدخل كلمة المرور لتقليل كمية الصنف';\n}\nfunction confirmDecrementPassword(){\n  const pass = docum
