new Date(o.ts).getHours(); cnt[h]++; rev[h]+= (o.total||0); } });\n  const active = []; for(let h=0;h<24;h++) if(cnt[h]>0) active.push(h);\n  const first = active[0], last = active[active.length-1];\n  const top3 = active.slice().sort((a,b)=>cnt[b]-cnt[a]).slice(0,3);\n  const dead = []; for(let h=first;h<=last;h++) if(cnt[h]===0) dead.push(String(h).padStart(2,'0')+':00');\n  const bars = repBars(active.map(h=>({ label:String(h).padStart(2,'0')+':00', value:cnt[h], display:`${cnt[h]} فاتورة`, hot:top3.includes(h) })));\n  return repStats(repStat('أزحم ساعة', String(top3[0]).padStart(2,'0')+':00', 'ok') + repStat('ساعات هادية وسط اليوم', dead.length||0))\n    + `<div class=\"rep-block\"><div class=\"rep-sub\">عدد الفواتير حسب الساعة (الأعمدة الغامقة = أعلى 3 ساعات)<\/div>${bars}<\/div>`\n    + (dead.length ? repNote(`الساعات الهادية وسط النشاط: ${dead.join('، ')} — ممكن تقلل فيها عدد الباريستا.`) : '');\n}\n\n/* 5) أيام الأسبوع */\nfunction repDowReport(){\n  const paid = _repOrders||[];\n  if(!paid.length) return repEmpty('مفيش فواتير في الفترة دي');\n  const days = {}; // dow -> {dates:Set, count, rev}\n  paid.forEach(o=>{\n    if(!o.dateKey) return;\n    const [y,m,d] = o.dateKey.split('-').map(Number);\n    const dow = new Date(y,m-1,d).getDay();\n    if(!days[dow]) days[dow] = { dates:new Set(), count:0, rev:0 };\n    days[dow].dates.add(o.dateKey); days[dow].count++; days[dow].rev += (o.total||0);\n  });\n  const rows = REP_DOW_ORDER.filter(d=>days[d]).map(d=>{\n    const g = days[d], nDays = g.dates.size;\n    return { dow:d, name:REP_DOW[d], avgRev: g.rev/nDays, avgCount: g.count/nDays, nDays };\n  });\n  if(!rows.length) return repEmpty('مفيش بيانات تواريخ كفاية');\n  const maxRev = Math.max(...rows.map(r=>r.avgRev));\n  const bars = repBars(rows.map(r=>({ label:r.name, value:r.avgRev, display:`${fmt2(r.avgRev)} ج.م`, hot:r.avgRev===maxRev })));\n  return `<div class=\"rep-block\"><div class=\"rep-sub\">متوسط المبيعات لكل يوم من نفس الاسم<\/div>${bars}<\/div>`\n    + repTable(['اليوم','عدد الأيام','متوسط الفواتير','متوسط المبيعات'], rows.map(r=>[r.name, r.nDays, r.avgCount.toFixed(1), fmt2(r.avgRev)]))\n    + repNote('أعلى يوم ضغط: <b>'+rows.find(r=>r.avgRev===maxRev).name+'<\/b>. التقرير بيحسب بعد ما نقسم على عدد الأيام الفعلية، عشان أسبوع واحد ميقلبش الصورة.');\n}\n\n/* 6) متوسط قيمة الفاتورة */\nfunction repAovReport(){\n  const paid = repPaid();\n  if(!paid.length) return repEmpty('مفيش فواتير في الفترة دي');\n  const avg = a => a.length ? a.reduce((s,o)=>s+(o.total||0),0)/a.length : 0;\n  const itemsPer = a => a.length ? a.reduce((s,o)=>s+(o.items||[]).reduce((x,i)=>x+(i.qty||1),0),0)/a.length : 0;\n  const del = paid.filter(o=>o.orderType==='delivery'), hall = paid.filter(o=>o.orderType!=='delivery');\n  return repStats(\n      repStat('متوسط الفاتورة', fmt2(avg(paid)), 'ok')\n    + repStat('أصناف في الفاتورة', itemsPer(paid).toFixed(1))\n    + repStat('فواتير الصالة', hall.length) + repStat('فواتير الدليفري', del.length))\n    + repTable(['النوع','عدد الفواتير','متوسط الفاتورة','متوسط الأصناف'], [\n        ['صالة / تيك أواي', hall.length, fmt2(avg(hall)), itemsPer(hall).toFixed(1)],\n        ['دليفري', del.length, fmt2(avg(del)), itemsPer(del).toFixed(1)] ])\n    + repNote('بيحسب بس الفواتير المدفوعة (من غير خصم المالك).');\n}\n\n/* 7) ولاء العملاء */\nfunction repLoyalReport(){\n  const paid = repPaid().filter(o=>o.customerId);\n  if(!paid.length) return repEmpty('مفيش فواتير مرتبطة بعملاء في الفترة دي. العميل بيتسجل لما تختاره في الشيك.');\n  const map = {};\n  paid.forEach(o=>{\n    const k = String(o.customerId);\n    if(!map[k]) map[k] = { name:o.customerName||'—', phone:o.customerPhone||'', visits:0, spent:0, pts:0 };\n    map[k].visits++; map[k].spent += (o.total||0); map[k].pts += (o.pointsEarned||0);\n  });\n  const list = Object.values(map).sort((a,b)=>b.visits-a.visits || b.spent-a.spent).slice(0,10);\n  const totalRev = repPaid().reduce((s,o)=>s+(o.total||0),0);\n  const custRev = paid.reduce((s,o)=>s+(o.total||0),0);\n  return repStats(repStat('عملاء مسجلين بالفترة', Object.keys(map).length) + repStat('نسبة مبيعاتهم', repPct(custRev,totalRev), 'ok'))\n    + repTable(['#','العميل','الموبايل','زيارات','إجمالي الإنفاق','نقاط مكتسبة'], list.map((c,i)=>[\n        i+1, repEsc(c.name), repEsc(c.phone||'—'), c.visits, fmt2(c.spent), c.pts ]))\n    + repNote('الترتيب لأعلى زيارات في الفترة المختارة. للمقارنة بين شهور، اختار \"شهر كامل\" وقارن.');\n}\n\n/* 8) طرق الدفع */\nfunction repPayReport(){\n  const paid = repPaid();\n  if(!paid.length) return repEmpty('مفيش فواتير في الفترة دي');\n  const labels = { cash:'كاش', instapay:'إنستا باي', owner:'خصم مالك' };\n  const g = {};\n  paid.forEach(o=>{ const k = o.paymentMethod||'cash'; if(!g[k]) g[k]={count:0, amt:0}; g[k].count++; g[k].amt += (o.total||0); });\n  const totalAmt = Object.values(g).reduce((s,x)=>s+x.amt,0);\n  const totalCount = paid.length;\n  const keys = Object.keys(g).sort((a,b)=>g[b].amt-g[a].amt);\n  const bars = repBars(keys.map(k=>({ label:labels[k]||repEsc(k), value:g[k].amt, display:`${repPct(g[k].amt,totalAmt)} · ${fmt2(g[k].amt)} ج.م` })));\n  return `<div class=\"rep-block\"><div class=\"rep-sub\">نسبة المبيعات لكل طريقة دفع<\/div>${bars}<\/div>`\n    + repTable(['طريقة الدفع','عدد الفواتير','نسبة الفواتير','المبلغ','نسبة المبلغ'], keys.map(k=>[\n        labels[k]||repEsc(k), g[k].count, repPct(g[k].count,totalCount), fmt2(g[k].amt), repPct(g[k].amt,totalAmt) ]))\n    + repNote('الموجود دلوقتي: كاش وإنستا باي. فودافون كاش ومحافظ تانية لسه مش متسجلة بشكل منفصل — هنضيفها في الكاشير لو عايز.');\n}\n\nconst REP_RENDERERS = {\n  hourly:repHourlyReport, dow:repDowReport,\n  aov:repAovReport, loyal:repLoyalReport,\n  pay:repPayReport\n};\n\n/* ============ مركز التقارير: Beans بيفكر ============ */\nconst REP_CAT_SHORT = { time:'الأوقات والشفتات', cust:'العملاء والولاء', pay:'طرق الدفع' };\nconst REP_BUBBLE_POS = {\n  1: [[50,86]],\n  2: [[20,50],[80,50]],\n  3: [[20,22],[80,22],[50,84]],\n  4: [[20,22],[80,22],[20,80],[80,80]]\n};\n\nfunction repBubbleHTML(items){\n  return items.map(it=>`<button type=\"button\" class=\"rh-tile\" ${it.kind==='cat'?`data-cat=\"${it.id}\"`:`data-rep=\"${it.id}\"${it.cat?` data-rcat=\"${it.cat}\"`:''}`}>\n    ${it.icon?`<span class=\"rh-tile-ic\"><i data-lucide=\"${it.icon}\"><\/i><\/span>`:''}\n    <span class=\"rh-tile-txt\"><b>${it.label}<\/b>${it.sub?`<small>${it.sub}<\/small>`:''}<\/span>\n    <span class=\"rh-tile-arrow\" aria-hidden=\"true\">›<\/span>\n  <\/button>`).join('');\n}\n\nfunction renderRepHub(){\n  const stage = document.getElementById('rhStage');\n  const bubbles = document.getElementById('rhBubbles');\n  const report = document.getElementById('rhReport');\n  const back = document.getElementById('repHubBack');\n  const title = document.getElementById('repHubTitle');\n  const tip = document.getElementById('repHubTip');\n  const { cat, rep } = _repView;\n  const c = REP_CATS.find(x=>x.id===cat);\n  const r = c && c.reports.find(x=>x.id===rep);\n  back.style.display = cat ? '' : 'none';\n  if(!c){\n    stage.dataset.mode = 'home';\n    title.textContent = 'مركز التقارير المتقدمة';\n    tip.textContent = 'اختار التقرير اللي عايز تشوفه';\n    report.innerHTML = '';\n    bubbles.innerHTML = repBubbleHTML(REP_CATS.flatMap(x=>x.reports.map(y=>({ kind:'rep', id:y.id, cat:x.id, icon:x.icon, label:y.title, sub:y.desc }))));\n  } else if(!r){\n    stage.dataset.mode = 'cat';\n    title.textContent = c.title;\n    tip.textContent = c.tip;\n    report.innerHTML = '';\n    bubbles.innerHTML = repBubbleHTML(c.reports.map(x=>({ kind:'rep', id:x.id, label:x.title, sub:x.desc })));\n  } else {\n    stage.dataset.mode = 'rep';\n    title.textContent = r.title;\n    tip.textContent = `${c.title} · ${repPeriodLabel()}`;\n    bubbles.innerHTML = '';\n    report.innerHTML = `<div class=\"rep-body\">${REP_RENDERERS[r.id]()}<\/div>`;\n  }\n  if(window.lucide) window.lucide.createIcons();\n}\n\nfunction repPeriodLabel(){\n  return _reportPeriodMode==='day'\n    ? (document.getElementById('periodDateInput').value || todayIso())\n    : ((document.getElementById('periodMonthInput').value || currentMonthIso()) + ' (شهر كامل)');\n}\n\nfunction openRepHub(){\n  _repView = { cat:null, rep:null };\n  renderRepHub();\n  document.getElementById('repHubOverlay').classList.add('open');\n}\nfunction closeRepHub(){ document.getElementById('repHubOverlay').classList.remove('open'); }\n\nfunction initRepHub(){\n  document.getElementById('repHubOpen').addEventListener('click', openRepHub);\n  document.getElementById('repHubClose').addEventListener('click', closeRepHub);\n  document.getElementById('repHubOverlay').addEventListener('click', e=>{ if(e.target.id==='repHubOverlay') closeRepHub(); });\n  document.getElementById('repHubBack').addEventListener('click', ()=>{\n    _repView = { cat:null, rep:null };\n    renderRepHub();\n  });\n  const bubbles = document.getElementById('rhBubbles');\n  bubbles.addEventListener('click', e=>{\n    const cb = e.target.closest('[data-cat]'); if(cb){ _repView = { cat:cb.dataset.cat, rep:null }; renderRepHub(); return; }\n    const rb = e.target.closest('[data-rep]'); if(rb){ _repView = { cat:rb.dataset.rcat || _repView.cat, rep:rb.dataset.rep }; renderRepHub(); }\n  });\n}\ninitRepHub();\n\n\n/* ============ تبويب المخزون ============ */\nlet _invDb = null, _invFns = null, _invItems = [], _invAudits = [];\nlet _ahCursor = null, _ahOpen = false;\nconst INV_AUDIT_LIMIT = 200;\nconst INV_EPS = 0.0001;\nconst AH_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];\nconst AH_DOW = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];\nconst invEsc = s => String(s==null?'':s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst p2 = n => String(n).padStart(2,'0');\n\nfunction startInventory(db, fns){\n  const { doc, onSnapshot } = fns;\n  _invDb = db; _invFns = fns;\n  initInventoryTabs();\n  onSnapshot(doc(db, 'settings', 'inventory'), (snap)=>{\n    _invItems = snap.exists() ? (snap.data().items || []) : [];\n    renderInventory(_invItems);\n  }, (err)=>{ console.warn('تعذر تحميل المخزون', err); });\n  onSnapshot(doc(db, 'settings', 'inventoryAudits'), (snap)=>{\n    _invAudits = snap.exists() ? (snap.data().audits || []) : [];\n    if(_ahOpen) renderCalendar();\n  }, (err)=>{ console.warn('تعذر تحميل سجل الجرد', err); });\n}\n\n// كتابة قايمة الأصناف كلها للسحابة، والكاشير بيسمع التحديث لحظياً\nfunction writeInventoryItems(updatedItems){\n  if(!_invDb || !_invFns) return Promise.resolve(false);\n  const { doc, setDoc, serverTimestamp } = _invFns;\n  return setDoc(doc(_invDb, 'settings', 'inventory'), {\n    items: updatedItems, updatedAt: serverTimestamp(), updatedBy: 'dashboard'\n  }).then(()=>{\n    _invItems = updatedItems;\n    renderInventory(_invItems);\n    return true;\n  }).catch(err=>{\n    console.warn('فشل تحديث المخزون', err);\n    alert('حصل خطأ أثناء تحديث المخزون، تأكد من الاتصال بالإنترنت وحاول تاني.');\n    return false;\n  });\n}\n\n// توريد: بتضيف الكمية على الرصيد الحالي\nfunction supplyInventoryFromDashboard(itemId, qty){\n  const updatedItems = (_invItems||[]).map(i=>\n    String(i.id) !== String(itemId) ? i : { ...i, currentQty: (parseFloat(i.currentQty)||0) + qty }\n  );\n  return writeInventoryItems(updatedItems);\n}\n\nfunction stockStatus(item){\n  const qty = parseFloat(item.currentQty) || 0;\n  const min = parseFloat(item.minQty) || 0;\n  if(qty <= 0) return { cls:'stock-out', label:'خلص خالص' };\n  if(min > 0 && qty <= min) return { cls:'stock-low', label:'قرب يخلص' };\n  return { cls:'stock-ok', label:'متوفر' };\n}\n\nfunction renderInventory(items){\n  const body = document.getElementById('inventoryBody');\n  const empty = document.getElementById('inventoryEmpty');\n  const banner = document.getElementById('lowStockBanner');\n  const lowList = document.getElementById('lowStockList');\n\n  if(!items.length){\n    body.innerHTML = '';\n    empty.style.display = 'block';\n    banner.style.display = 'none';\n    return;\n  }\n  empty.style.display = 'none';\n\n  // الأصناف اللي قربت تخلص تطلع فوق\n  const sorted = [...items].sort((a,b)=>{\n    const sa = stockStatus(a).cls === 'stock-ok' ? 1 : 0;\n    const sb = stockStatus(b).cls === 'stock-ok' ? 1 : 0;\n    return sa - sb;\n  });\n\n  body.innerHTML = sorted.map(item=>{\n    const st = stockStatus(item);\n    return `<tr data-id=\"${invEsc(item.id)}\">\n      <td>${invEsc(item.name)}<\/td>\n      <td>${fmt2(item.currentQty)} ${invEsc(item.unit||'')}<\/td>\n      <td>${fmt2(item.minQty||0)} ${invEsc(item.unit||'')}<\/td>\n      <td><span class=\"pill ${st.cls}\">${st.label}<\/span><\/td>\n      <td>\n        <div class=\"supply-row\">\n          <input type=\"number\" step=\"any\" inputmode=\"decimal\" class=\"supply-input\" placeholder=\"الكمية\">\n          <button type=\"button\" class=\"icon-btn supply-btn\"><i data-lucide=\"plus\"><\/i> توريد<\/button>\n        <\/div>\n      <\/td>\n    <\/tr>`;\n  }).join('');\n\n  body.querySelectorAll('tr[data-id]').forEach(row=>{\n    const id = row.dataset.id;\n    const input = row.querySelector('.supply-input');\n    const btn = row.querySelector('.supply-btn');\n    const doSupply = ()=>{\n      const qty = parseFloat(input.value);\n      if(isNaN(qty) || qty<=0){ alert('من فضلك اكتب كمية توريد صحيحة أكبر من صفر'); return; }\n      btn.disabled = true;\n      Promise.resolve(supplyInventoryFromDashboard(id, qty)).finally(()=>{ btn.disabled = false; });\n      input.value = '';\n    };\n    btn.addEventListener('click', doSupply);\n    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSupply(); });\n  });\n\n  const lowItems = items.filter(i => stockStatus(i).cls !== 'stock-ok');\n  if(lowItems.length){\n    banner.style.display = 'block';\n    lowList.innerHTML = lowItems.map(i=>{\n      const st = stockStatus(i);\n      const c = st.cls==='stock-out' ? '#c0392b' : '#6B3A1F';\n      return `<span class=\"slow-chip\" style=\"border-color:${c}; color:${c};\">${invEsc(i.name)} (${fmt2(i.currentQty)} ${invEsc(i.unit||'')})<\/span>`;\n    }).join('');\n  } else {\n    banner.style.display = 'none';\n  }\n}\n\n/* ---- التبويبات الداخلية: الأصناف / الجرد اليومي / سجل الجرد ---- */\nfunction initInventoryTabs(){\n  const paneIds = { items:'invPaneItems', history:'invPaneHistory' };\n  document.querySelectorAll('.inv-subtab').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      const pane = btn.dataset.pane;\n      document.querySelectorAll('.inv-subtab').forEach(b=>b.classList.toggle('active', b===btn));\n      Object.entries(paneIds).forEach(([k,id])=>document.getElementById(id).classList.toggle('active', k===pane));\n      _ahOpen = pane === 'history';\n      if(pane === 'history') showCalendar();\n    });\n  });\n  document.getElementById('ahPrevBtn').addEventListener('click', ()=>{\n    _ahCursor.m--; if(_ahCursor.m < 0){ _ahCursor.m = 11; _ahCursor.y--; }\n    renderCalendar();\n  });\n  document.getElementById('ahNextBtn').addEventListener('click', ()=>{\n    _ahCursor.m++; if(_ahCursor.m > 11){ _ahCursor.m = 0; _ahCursor.y++; }\n    renderCalendar();\n  });\n  document.getElementById('ahBackBtn').addEventListener('click', showCalendar);\n}\n\n/* ---- سجل الجرد: تقويم + تفاصيل كل يوم ---- */\nfunction dayKeyOf(iso){\n  const d = new Date(iso);\n  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;\n}\n\n// كل جرد مع صفوفه: \"من آخر جرد\" = العدد الفعلي في الجرد اللي قبله للصنف نفسه\nfunction auditsWithRows(){\n  const sorted = (_invAudits||[]).filter(a=>a && a.date)\n    .slice().sort((a,b)=>new Date(a.date) - new Date(b.date));\n  const lastCounted = new Map();\n  return sorted.map(a=>{\n    const rows = (a.entries||[]).map(e=>{\n      const key = String(e.itemId);\n      const prev = lastCounted.has(key) ? lastCounted.get(key) : null;\n      const counted = parseFloat(e.counted) || 0;\n      lastCounted.set(key, counted);\n      return {\n        name: e.name, unit: e.unit || '', prev,\n        expected: parseFloat(e.expected) || 0, counted,\n        variance: parseFloat(e.variance) || 0, value: parseFloat(e.value) || 0\n      };\n    });\n    const shortage = rows.filter(r=>r.variance < -INV_EPS).reduce((s,r)=>s+r.value, 0);\n    const surplus  = rows.filter(r=>r.variance >  INV_EPS).reduce((s,r)=>s+r.value, 0);\n    return { audit:a, rows, shortage, surplus, dayKey: dayKeyOf(a.date) };\n  });\n}\n\nfunction showCalendar(){\n  document.getElementById('ahDayView').style.display = 'none';\n  document.getElementById('ahCalView').style.display = 'block';\n  renderCalendar();\n}\n\nfunction renderCalendar(){\n  const all = auditsWithRows();\n  const byDay = {};\n  all.forEach(x=>{ (byDay[x.dayKey] = byDay[x.dayKey] || []).push(x); });\n\n  if(!_ahCursor){ const n = new Date(); _ahCursor = { y: n.getFullYear(), m: n.getMonth() }; }\n  const { y, m } = _ahCursor;\n  document.getElementById('ahMonthLbl').textContent = `${AH_MONTHS[m]} ${y}`;\n  document.getElementById('ahDowRow').innerHTML = AH_DOW.map(d=>`<div class=\"cal-dow\">${d}<\/div>`).join('');\n\n  const firstDow = (new Date(y, m, 1).getDay() + 1) % 7;   // الأسبوع بيبدأ السبت\n  const daysInMonth = new Date(y, m+1, 0).getDate();\n  const todayKey = dayKeyOf(new Date().toISOString());\n  const monthPrefix = `${y}-${p2(m+1)}`;\n\n  let cells = '';\n  for(let i=0; i<firstDow; i++) cells += `<div class=\"cal-day empty\"><\/div>`;\n\n  let monthCount = 0, monthShort = 0, monthSurplus = 0;\n  for(let d=1; d<=daysInMonth; d++){\n    const key = `${monthPrefix}-${p2(d)}`;\n    const list = byDay[key] || [];\n    monthCount += list.length;\n    list.forEach(x=>{ monthShort += x.shortage; monthSurplus += x.surplus; });\n    const hasShort = list.some(x=>x.shortage < -INV_EPS);\n    const cls = [\n      list.length ? 'has-audit' : '',\n      hasShort ? 'short' : '',\n      key === todayKey ? 'today' : ''\n    ].join(' ');\n    cells += `<div class=\"cal-day ${cls}\" data-key=\"${key}\">\n      <div class=\"d-num\">${d}<\/div>\n      ${list.length ? `<div class=\"d-amt\">${list.length > 1 ? list.length + ' جرد' : 'جرد'}<\/div>` : ''}\n    <\/div>`;\n  }\n  document.getElementById('ahGrid').innerHTML = cells;\n\n  document.getElementById('ahMonthSummary').innerHTML = monthCount\n    ? `عدد الجرد: <b>${monthCount}<\/b> · إجمالي العجز: <b style=\"color:var(--danger)\">${fmt2(monthShort)} ج.م<\/b> · إجمالي الزيادة: <b style=\"color:var(--ok)\">+${fmt2(monthSurplus)} ج.م<\/b>`\n    : 'مفيش جرد متسجل في الشهر ده';\n\n  document.querySelectorAll('#ahGrid .cal-day[data-key]').forEach(cell=>{\n    cell.addEventListener('click', ()=>showDay(cell.dataset.key));\n  });\n}\n\nfunction showDay(key){\n  const list = auditsWithRows().filter(x=>x.dayKey === key);\n  const d = new Date(key + 'T00:00:00');\n  document.getElementById('ahDayTitle').textContent = d.toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' });\n  const body = document.getElementById('ahDayBody');\n\n  if(!list.length){\n    body.innerHTML = '<div class=\"empty-note\">مفيش جرد في اليوم ده<\/div>';\n  } else {\n    body.innerHTML = list.map(x=>{\n      const t = new Date(x.audit.date).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });\n      const rowsHtml = x.rows.map(r=>{\n        const isShort = r.variance < -INV_EPS, isOver = r.variance > INV_EPS;\n        const cls = isShort ? 'bad' : (isOver ? 'okc' : '');\n        const sign = r.variance > 0 ? '+' : '';\n        const status = isShort ? 'عجز' : (isOver ? 'زيادة' : 'مطابق');\n        return `<tr>\n          <td>${invEsc(r.name)}<\/td>\n          <td>${r.prev == null ? '—' : fmt2(r.prev)} ${invEsc(r.unit)}<\/td>\n          <td>${fmt2(r.expected)}<\/td>\n          <td>${fmt2(r.counted)}<\/td>\n          <td class=\"${cls}\">${status} ${sign}${fmt2(r.variance)}<\/td>\n          <td class=\"${cls}\">${sign}${fmt2(r.value)}<\/td>\n        <\/tr>`;\n      }).join('');\n      return `\n        <div class=\"audit-block\">\n          <div class=\"ab-head\">جرد الساعة ${t}<\/div>\n          <div class=\"ab-note\">${x.audit.updatedBy === 'dashboard' ? 'اتعمل من لوحة التحكم' : 'اتعمل من الكاشير'}<\/div>\n          <div style=\"overflow-x:auto;\">\n            <table class=\"cal-day-tbl\">\n              <thead><tr><th>الصنف<\/th><th>من آخر جرد<\/th><th>المفترض<\/th><th>الفعلي<\/th><th>الفرق<\/th><th>القيمة<\/th><\/tr><\/thead>\n              <tbody>${rowsHtml}<\/tbody>\n            <\/table>\n          <\/div>\n          <div class=\"variance-line\"><span>إجمالي العجز<\/span><b style=\"color:var(--danger)\">${fmt2(x.shortage)} ج.م<\/b><\/div>\n          <div class=\"variance-line\"><span>إجمالي الزيادة<\/span><b style=\"color:var(--ok)\">+${fmt2(x.surplus)} ج.م<\/b><\/div>\n        <\/div>`;\n    }).join('');\n  }\n\n  document.getElementById('ahCalView').style.display = 'none';\n  document.getElementById('ahDayView').style.display = 'block';\n}\n\n/* ============ تبويب المنيو والأسعار ============ */\nlet _menuDb = null, _menuFns = null;\nlet _menuNested = []; \nlet _suppressMenuRender = false; \n\nfunction flattenMenu(menu){\n  const flat = [];\n  (menu||[]).forEach(catObj=>{\n    (catObj.groups||[]).forEach(grp=>{\n      (grp.items||[]).forEach(it=>{\n        flat.push({ name: it[0], price: it[1], cat: catObj.label, group: grp.g });\n      });\n    });\n  });\n  return flat;\n}\n\nfunction startMenuSync(db, fns){\n  _menuDb = db; _menuFns = fns;\n  const { doc, onSnapshot } = fns;\n  onSnapshot(doc(db, 'settings', 'menu'), (snap)=>{\n    if(!snap.exists()) return;\n    const raw = snap.data().menu || [];\n    const menu = raw.map(cat => ({\n      ...cat,\n      groups: (cat.groups||[]).map(g => ({\n        ...g,\n        items: (g.items||[]).map(it => Array.isArray(it) ? it : [it.name, it.price])\n      }))\n    }));\n    _menuCatalog = flattenMenu(menu);\n    if(!_suppressMenuRender){\n      _menuNested = menu;\n      renderMenuEditor();\n    }\n  }, (err)=> console.warn('تعذر تحميل المنيو', err));\n\n  // ربط حدث البحث في المنيو\n  document.getElementById('menuSearchInput').addEventListener('input', ()=> {\n    renderMenuEditor();\n  });\n}\n\nfunction pushMenuToCloud(){\n  if(!_menuDb || !_menuFns) return;\n  const { doc, setDoc, serverTimestamp } = _menuFns;\n  _suppressMenuRender = true;\n  const safeMenu = (_menuNested||[]).map(cat => ({\n    ...cat,\n    groups: (cat.groups||[]).map(g => ({\n      ...g,\n      items: (g.items||[]).map(it => Array.isArray(it) ? { name: it[0], price: it[1] } : it)\n    }))\n  }));\n  setDoc(doc(_menuDb, 'settings', 'menu'), {\n    menu: safeMenu, updatedAt: serverTimestamp(), updatedBy: 'dashboard'\n  }).finally(()=>{ setTimeout(()=>{ _suppressMenuRender = false; }, 800); });\n}\n\nfunction renderMenuEditor(){\n  const box = document.getElementById('menuEditorBox');\n  if(!_menuNested.length){\n    box.innerHTML = '<div class=\"panel\"><div class=\"empty-note\">لسه المنيو معملوش مزامنة من الكاشير. افتح الكاشير وسيبه شغال وهيتزامن أوتوماتيك.<\/div><\/div>';\n    return;\n  }\n\n  const searchTerm = (document.getElementById('menuSearchInput')?.value || '').trim().toLowerCase();\n\n  // فلترة الأقسام والمجموعات والأصناف بناءً على نص البحث\n  let filteredCategories = _menuNested.map((catObj, cIdx) => {\n    let filteredGroups = (catObj.groups || []).map((grp, gIdx) => {\n      let filteredItems = (grp.items || []).map((it, iIdx) => {\n        return { item: it, originalIndex: iIdx };\n      }).filter(itemObj => {\n        if (!searchTerm) return true;\n        return itemObj.item[0].toLowerCase().includes(searchTerm);\n      });\n\n      return { group: grp, originalGroupIndex: gIdx, items: filteredItems };\n    }).filter(grpObj => {\n      if (!searchTerm) return true;\n      // إذا كانت المجموعة نفسها مطابقة للبحث أو بها أصناف مطابقة\n      const groupMatches = grpObj.group.g.toLowerCase().includes(searchTerm);\n      return groupMatches || grpObj.items.length > 0;\n    });\n\n    return { cat: catObj, originalCatIndex: cIdx, groups: filteredGroups };\n  }).filter(catObj => {\n    if (!searchTerm) return true;\n    const catMatches = catObj.cat.label.toLowerCase().includes(searchTerm);\n    return catMatches || catObj.groups.length > 0;\n  });\n\n  if(filteredCategories.length === 0){\n    box.innerHTML = '<div class=\"panel\"><div class=\"empty-note\">لا توجد نتائج مطابقة للبحث<\/div><\/div>';\n    return;\n  }\n\n  box.innerHTML = filteredCategories.map(catWrapper => {\n    const catObj = catWrapper.cat;\n    const cIdx = catWrapper.originalCatIndex;\n\n    return `\n    <div class=\"menu-cat-card\" data-cat=\"${cIdx}\">\n      <div class=\"menu-cat-top\">\n        <span class=\"menu-cat-symbol\"><i data-lucide=\"utensils\"><\/i><\/span>\n        <input type=\"text\" class=\"cat-name\" value=\"${catObj.label}\" data-role=\"cat-name\">\n        <button class=\"icon-btn danger\" data-role=\"del-cat\" title=\"حذف القسم\"><i data-lucide=\"trash-2\"><\/i> حذف القسم<\/button>\n      <\/div>\n      ${catWrapper.groups.map(grpWrapper => {\n        const grp = grpWrapper.group;\n        const gIdx = grpWrapper.originalGroupIndex;\n\n        return `\n        <div class=\"menu-group-box\" data-group=\"${gIdx}\">\n          <div class=\"menu-group-top\">\n            <input type=\"text\" class=\"grp-name\" value=\"${grp.g}\" data-role=\"grp-name\">\n            <button class=\"icon-btn danger\" data-role=\"del-grp\" title=\"حذف المجموعة\"><i data-lucide=\"trash-2\"><\/i><\/button>\n          <\/div>\n          ${grpWrapper.items.map(itemObj => {\n            const it = itemObj.item;\n            const iIdx = itemObj.originalIndex;\n\n            return `\n            <div class=\"menu-item-row\" data-item=\"${iIdx}\">\n              <input type=\"text\" class=\"item-name\" value=\"${it[0]}\" data-role=\"item-name\">\n              <input type=\"number\" step=\"any\" class=\"item-price\" value=\"${it[1]}\" data-role=\"item-price\">\n              <button class=\"icon-btn danger\" data-role=\"del-item\" title=\"حذف الصنف\"><i data-lucide=\"trash-2\"><\/i><\/button>\n            <\/div>`;\n          }).join('')}\n          <div class=\"add-item-row\">\n            <input type=\"text\" placeholder=\"اسم صنف جديد\" data-role=\"new-item-name\">\n            <input type=\"number\" step=\"any\" placeholder=\"السعر\" class=\"price-mini\" data-role=\"new-item-price\">\n            <button class=\"icon-btn\" data-role=\"add-item\"><i data-lucide=\"plus\"><\/i> إضافة صنف<\/button>\n          <\/div>\n        <\/div>`;\n      }).join('')}\n      <div class=\"add-item-row\">\n        <input type=\"text\" placeholder=\"اسم مجموعة جديدة\" data-role=\"new-grp-name\">\n        <button class=\"icon-btn\" data-role=\"add-grp\"><i data-lucide=\"plus\"><\/i> إضافة مجموعة<\/button>\n      <\/div>\n    <\/div>`;\n  }).join('');\n\n  // ربط الأحداث\n  box.querySelectorAll('.menu-cat-card').forEach(catEl=>{\n    const cIdx = parseInt(catEl.dataset.cat);\n\n    catEl.querySelector('[data-role=\"cat-name\"]').addEventListener('change', (e)=>{\n      _menuNested[cIdx].label = e.target.value.trim() || _menuNested[cIdx].label;\n      pushMenuToCloud();\n    });\n    catEl.querySelector('[data-role=\"del-cat\"]').addEventListener('click', ()=>{\n      if(_menuNested.length<=1){ alert('لازم يفضل قسم واحد على الأقل'); return; }\n      if(!confirm(`متأكد من حذف قسم \"${_menuNested[cIdx].label}\" بكل مجموعاته وأصنافه؟`)) return;\n      _menuNested.splice(cIdx,1);\n      pushMenuToCloud();\n      renderMenuEditor();\n    });\n    catEl.querySelector('[data-role=\"add-grp\"]').addEventListener('click', ()=>{\n      const inp = catEl.querySelector('[data-role=\"new-grp-name\"]');\n      const name = inp.value.trim();\n      if(!name) return;\n      if(!_menuNested[cIdx].groups) _menuNested[cIdx].groups = [];\n      _menuNested[cIdx].groups.push({ g:name, items:[] });\n      pushMenuToCloud();\n      renderMenuEditor();\n    });\n\n    catEl.querySelectorAll('.menu-group-box').forEach(grpEl=>{\n      const gIdx = parseInt(grpEl.dataset.group);\n\n      grpEl.querySelector('[data-role=\"grp-name\"]').addEventListener('change', (e)=>{\n        _menuNested[cIdx].groups[gIdx].g = e.target.value.trim() || _menuNested[cIdx].groups[gIdx].g;\n        pushMenuToCloud();\n      });\n      grpEl.querySelector('[data-role=\"del-grp\"]').addEventListener('click', ()=>{\n        if(!confirm('متأكد من حذف المجموعة دي بكل أصنافها؟')) return;\n        _menuNested[cIdx].groups.splice(gIdx,1);\n        pushMenuToCloud();\n        renderMenuEditor();\n      });\n      grpEl.querySelector('[data-role=\"add-item\"]').addEventListener('click', ()=>{\n        const nameInp = grpEl.querySelector('[data-role=\"new-item-name\"]');\n        const priceInp = grpEl.querySelector('[data-role=\"new-item-price\"]');\n        const name = nameInp.value.trim();\n        const price = parseFloat(priceInp.value);\n        if(!name || isNaN(price)){ alert('اكتب اسم الصنف والسعر'); return; }\n        _menuNested[cIdx].groups[gIdx].items.push([name, price]);\n        pushMenuToCloud();\n        renderMenuEditor();\n      });\n\n      grpEl.querySelectorAll('.menu-item-row').forEach(itemEl=>{\n        const iIdx = parseInt(itemEl.dataset.item);\n        itemEl.querySelector('[data-role=\"item-name\"]').addEventListener('change', (e)=>{\n          _menuNested[cIdx].groups[gIdx].items[iIdx][0] = e.target.value.trim();\n          pushMenuToCloud();\n        });\n        itemEl.querySelector('[data-role=\"item-price\"]').addEventListener('change', (e)=>{\n          const val = parseFloat(e.target.value);\n          _menuNested[cIdx].groups[gIdx].items[iIdx][1] = isNaN(val) ? 0 : val;\n          pushMenuToCloud();\n        });\n        itemEl.querySelector('[data-role=\"del-item\"]').addEventListener('click', ()=>{\n          _menuNested[cIdx].groups[gIdx].items.splice(iIdx,1);\n          pushMenuToCloud();\n          renderMenuEditor();\n        });\n      });\n    });\n  });\n}\n\ndocument.getElementById('addCatDashBtn').addEventListener('click', ()=>{\n  const nameInp = document.getElementById('newCatNameInput');\n  const name = nameInp.value.trim();\n  if(!name){ alert('اكتب اسم القسم'); return; }\n  _menuNested.push({ cat: 'cat_' + Date.now(), label:name, emoji:'', groups:[] });\n  pushMenuToCloud();\n  renderMenuEditor();\n  nameInp.value = '';\n});\n\n/* ============ تبويب حسابات الموظفين ============ */\nlet _staffDb = null, _staffFns = null;\nlet _accounts = [];\nlet _suppressAccountsRender = false;\n\nfunction startStaff(db, fns){\n  _staffDb = db; _staffFns = fns;\n  const { doc, onSnapshot } = fns;\n\n  onSnapshot(doc(db, 'settings', 'accounts'), (snap)=>{\n    if(!snap.exists()) return;\n    if(_suppressAccountsRender) return;\n    _accounts = snap.data().accounts || [];\n    renderStaffList();\n  }, (err)=> console.warn('تعذر تحميل حسابات الموظفين', err));\n\n  document.getElementById('addStaffBtn').addEventListener('click', ()=>{\n    const username = document.getElementById('newStaffUsername').value.trim();\n    const password = document.getElementById('newStaffPassword').value;\n    const cashierName = document.getElementById('newStaffName').value.trim();\n    if(!username || !password || !cashierName){ alert('اكتب اسم المستخدم وكلمة المرور واسم الموظف'); return; }\n    if(_accounts.find(a=>a.username===username)){ alert('اسم المستخدم ده موجود بالفعل'); return; }\n    _accounts.push({\n      username, password, cashierName,\n      permissions: {\n        sales: document.getElementById('newStaffPermSales').checked,\n        expenses: document.getElementById('newStaffPermExpenses').checked,\n        cashDiscount: document.getElementById('newStaffPermCashDiscount').checked,\n        ownerDiscount: document.getElementById('newStaffPermOwnerDiscount').checked\n      }\n    });\n    pushAccountsToCloud();\n    renderStaffList();\n    document.getElementById('newStaffUsername').value = '';\n    document.getElementById('newStaffPassword').value = '';\n    document.getElementById('newStaffName').value = '';\n    ['newStaffPermSales','newStaffPermExpenses','newStaffPermCashDiscount','newStaffPermOwnerDiscount'].forEach(id=> document.getElementById(id).checked=false);\n  });\n}\n\nlet _auditRows = [], _voidRows = [];\nlet _sensMode = 'day';\n\n// فلتر الفترة: نفس منطق تبويب التقارير (يوم معيّن / شهر كامل)\nfunction inSensPeriod(ts, fallback){\n  const dayEl = document.getElementById('sensDateInput');\n  if(!dayEl) return true;\n  const key = ts ? dayKeyOf(new Date(ts)) : String(fallback || '');\n  if(_sensMode === 'month') return key.slice(0,7) === (document.getElementById('sensMonthInput').value || '');\n  return key === dayEl.value;\n}\n\n// تبويبات الحذف (داشبورد / كاشير) + اختيار الفترة\nfunction initSensitiveTabs(){\n  const dayEl = document.getElementById('sensDateInput');\n  const monthEl = document.getElementById('sensMonthInput');\n  if(!dayEl.value) dayEl.value = todayIso();\n  if(!monthEl.value) monthEl.value = currentMonthIso();\n\n  document.querySelectorAll('.sens-subtab').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      const pane = btn.dataset.spane;\n      document.querySelectorAll('.sens-subtab').forEach(b=>b.classList.toggle('active', b===btn));\n      document.getElementById('sensPaneDash').classList.toggle('active', pane==='dash');\n      document.getElementById('sensPaneCashier').classList.toggle('active', pane==='cashier');\n    });\n  });\n  const setMode = (mode)=>{\n    _sensMode = mode;\n    document.getElementById('sensDayBtn').classList.toggle('active', mode==='day');\n    document.getElementById('sensMonthBtn').classList.toggle('active', mode==='month');\n    dayEl.style.display = mode==='day' ? '' : 'none';\n    monthEl.style.display = mode==='month' ? '' : 'none';\n    renderSensitiveLog();\n  };\n  document.getElementById('sensDayBtn').addEventListener('click', ()=> setMode('day'));\n  document.getElementById('sensMonthBtn').addEventListener('click', ()=> setMode('month'));\n  dayEl.addEventListener('change', renderSensitiveLog);\n  monthEl.addEventListener('change', renderSensitiveLog);\n}\n\nlet _sensInited = false;\nfunction startSensitiveOps(db, fns){\n  const { onSnapshot, collection, query, orderBy, limit } = fns;\n  if(!_sensInited){ _sensInited = true; initSensitiveTabs(); }\n  const auditQ = query(collection(db,'auditLog'), orderBy('ts','desc'), limit(100));\n  onSnapshot(auditQ, (snap)=>{\n    _auditRows = [];\n    snap.forEach(d=> _auditRows.push(d.data()));\n    renderSensitiveLog();\n  }, (err)=> console.warn('تعذر تحميل سجل العمليات', err));\n\n  const voidsQ = query(collection(db,'voids'), orderBy('ts','desc'), limit(100));\n  onSnapshot(voidsQ, (snap)=>{\n    _voidRows = [];\n    snap.forEach(d=> _voidRows.push(d.data()));\n    renderSensitiveLog();\n  }, (err)=> console.warn('تعذر تحميل سجل المرتجعات والإلغاءات', err));\n}\n\nfunction pushAccountsToCloud(){\n  if(!_staffDb || !_staffFns) return;\n  const { doc, setDoc, serverTimestamp } = _staffFns;\n  _suppressAccountsRender = true;\n  setDoc(doc(_staffDb, 'settings', 'accounts'), {\n    accounts: _accounts, updatedAt: serverTimestamp(), updatedBy: 'dashboard'\n  }).finally(()=>{ setTimeout(()=>{ _suppressAccountsRender = false; }, 800); });\n}\n\nfunction renderStaffList(){\n  const box = document.getElementById('staffListBox');\n  if(!_accounts.length){\n    box.innerHTML = '<div class=\"panel\"><div class=\"empty-note\">لسه حسابات الموظفين معملهاش مزامنة من الكاشير.<\/div><\/div>';\n    return;\n  }\n  const permLabels = [\n    ['sales','المبيعات'], ['expenses','المصروفات'],\n    ['cashDiscount','خصم الكاش'], ['ownerDiscount','خصم الأونر']\n  ];\n  box.innerHTML = _accounts.map((a, idx)=>{\n    const p = a.permissions || {};\n    return `\n    <div class=\"staff-card\" data-idx=\"${idx}\">\n      <div class=\"top\">\n        <div><b><i data-lucide=\"user-round\"><\/i> ${a.cashierName}<\/b> <span>(${a.username})<\/span><\/div>\n        <button class=\"icon-btn danger\" data-role=\"del-staff\"><i data-lucide=\"trash-2\"><\/i> حذف الحساب<\/button>\n      <\/div>\n      <div class=\"staff-perms\">\n        ${permLabels.map(([key,label])=>`\n          <label>\n            <input type=\"checkbox\" data-perm=\"${key}\" ${p[key]?'checked':''}>\n            ${label}\n          <\/label>\n        `).join('')}\n      <\/div>\n    <\/div>`;\n  }).join('');\n\n  box.querySelectorAll('.staff-card').forEach(card=>{\n    const idx = parseInt(card.dataset.idx);\n    card.querySelector('[data-role=\"del-staff\"]').addEventListener('click', ()=>{\n      if(_accounts.length<=1){ alert('لازم يفضل حساب واحد على الأقل'); return; }\n      if(!confirm(`متأكد من حذف حساب \"${_accounts[idx].cashierName}\"؟`)) return;\n      _accounts.splice(idx,1);\n      pushAccountsToCloud();\n      renderStaffList();\n    });\n    card.querySelectorAll('[data-perm]').forEach(chk=>{\n      chk.addEventListener('change', (e)=>{\n        if(!_accounts[idx].permissions) _accounts[idx].permissions = {};\n        _accounts[idx].permissions[e.target.dataset.perm] = e.target.checked;\n        pushAccountsToCloud();\n      });\n    });\n  });\n}\n\n// سجل واحد للحذف والإلغاء: بيدمج auditLog (حذف المصروفات) مع voids (الفواتير والأصناف والترابيزات).\n// حذف الفاتورة القديم كان بيتسجل في الاتنين، فبنخفي نسخة auditLog لو ليها سجل مقابل في voids.\nfunction renderSensitiveLog(){\n  const typeLabels = { order:'حذف فاتورة', item:'إلغاء صنف', table_emptied:'تفريغ الترابيزة' };\n  const tsOf = r => Number(r.ts) || (r.at ? Date.parse(r.at) : 0) || 0;\n  const fmtTime = (ts, fallback) => {\n    const d = ts ? new Date(ts) : null;\n    return d && !Number.isNaN(d.getTime())\n      ? d.toLocaleString('ar-EG', {dateStyle:'short', timeStyle:'short'})\n      : escapeHtmlD(fallback||'-');\n  };\n  const itemsStr = r => Array.isArray(r.items)\n    ? r.items.map(i=>`${Number(i.qty)||0} × ${escapeHtmlD(i.name||'صنف')}`).join('، ') : '';\n  const valueOf = r => {\n    const raw = r.value != null ? r.value : (r.subTotal != null ? r.subTotal : r.total);\n    const v = Number(raw);\n    return Number.isFinite(v) ? fmt2(v)+' ج.م' : '—';\n  };\n  const orderVoids = _voidRows.filter(r=> r.type==='order');\n  const isInvoiceAudit = t => /^حذف (فاتورة|فواتير)/.test(t||'');\n\n  // الخانة 1: فواتير اتحذفت من الداشبورد\n  const dashRows = _voidRows.filter(r=> r.source==='dashboard' && inSensPeriod(tsOf(r), r.dateKey)).sort((x,y)=> tsOf(y)-tsOf(x));\n  document.getElementById('sensDashCount').textContent = `${dashRows.length} عملية`;\n  const dBody = document.getElementById('sensitiveDashBody');\n  const dEmpty = document.getElementById('sensitiveDashEmpty');\n  if(!dashRows.length){ dBody.innerHTML=''; dEmpty.style.display='block'; }\n  else {\n    dEmpty.style.display='none';\n    dBody.innerHTML = dashRows.map(r=>`<tr>\n      <td>${fmtTime(tsOf(r), r.dateKey)}<\/td>\n      <td>${escapeHtmlD(r.tableName||'-')}<\/td>\n      <td>${itemsStr(r) || '—'}<\/td>\n      <td>${valueOf(r)}<\/td>\n      <td>${escapeHtmlD(r.by||'-')}<\/td>\n    <\/tr>`).join('');\n  }\n\n  // الخانة 2: كل اللي جاي من الكاشير (مصروفات + أصناف + ترابيزات + فواتير القديمة)\n  // حذف الفاتورة القديم كان بيتسجل في auditLog و voids، فبنخفي نسخة auditLog لو ليها مقابل.\n  const rows = [];\n  _voidRows.filter(r=> r.source!=='dashboard').forEach(r=>{\n    const what = r.type==='item' ? `${Number(r.qty)||0} × ${escapeHtmlD(r.name||'صنف')}` : (itemsStr(r) || '—');\n    rows.push({\n      ts: tsOf(r), fallback: r.dateKey,\n      type: typeLabels[r.type] || r.type || '-',\n      details: (r.tableName ? `<b>${escapeHtmlD(r.tableName)}<\/b> — ` : '') + what,\n      value: valueOf(r), who: escapeHtmlD(r.by||'-')\n    });\n  });\n  _auditRows.forEach(a=>{\n    const t = tsOf(a);\n    if(isInvoiceAudit(a.type) && orderVoids.some(v=> (v.by||'-')===(a.byCashier||'-') && Math.abs(tsOf(v)-t) < 120000)) return;\n    rows.push({\n      ts: t, type: a.type||'-', details: escapeHtmlD(a.summary||'-'), value: '—',\n      who: `${escapeHtmlD(a.byCashier||'-')} <span style=\"color:var(--muted); font-size:11px;\">(${escapeHtmlD(a.byUsername||'-')})<\/span>`\n    });\n  });\n  rows.sort((x,y)=> y.ts - x.ts);\n  const periodRows = rows.filter(r=> inSensPeriod(r.ts, r.fallback));\n  document.getElementById('sensCashierCount').textContent = `${periodRows.length} عملية`;\n  const body = document.getElementById('sensitiveLogBody');\n  const empty = document.getElementById('sensitiveLogEmpty');\n  if(!periodRows.length){ body.innerHTML=''; empty.style.display='block'; return; }\n  empty.style.display = 'none';\n  body.innerHTML = periodRows.map(r=>`<tr>\n      <td>${fmtTime(r.ts, r.fallback)}<\/td>\n      <td>${escapeHtmlD(r.type)}<\/td>\n      <td>${r.details}<\/td>\n      <td>${r.value}<\/td>\n      <td>${r.who}<\/td>\n    <\/tr>`).join('');\n}\n\n/* ============ تبويب الاستاف (ملفات الموظفين + الحضور والانصراف) ============\n   نفس نمط المزامنة المستخدم بالظبط مع حسابات الكاشير والمخزون والمنيو:\n   ملفات الموظفين بتتخزن في مستند واحد settings/staffProfiles، وتسجيلات الحضور\n   بتتخزن كل واحدة في مستند مستقل في كولكشن attendance (زي الفواتير والمصروفات)\n   عشان تقدر تتصفّى بسهولة حسب اليوم (dateKey). ================================= */\nlet _hrDb = null, _hrFns = null;\nlet _hrProfiles = [];\nlet _hrAttendance = [];\nlet _hrAttUnsub = null;\nlet _suppressHrProfilesRender = false;\n\nfunction startStaffHR(db, fns){\n  _hrDb = db; _hrFns = fns;\n  const { doc, onSnapshot } = fns;\n  const dateInput = document.getElementById('hrAttendanceDate');\n  dateInput.value = todayIso();\n\n  onSnapshot(doc(db, 'settings', 'staffProfiles'), (snap)=>{\n    if(_suppressHrProfilesRender) return;\n    _hrProfiles = snap.exists() ? (snap.data().employees || []) : [];\n    renderHrStaffList();\n    renderHrEmployeeSelect();\n  }, (err)=> console.warn('تعذر تحميل ملفات الموظفين', err));\n\n  dateInput.addEventListener('change', ()=> loadHrAttendance(dateInput.value));\n  loadHrAttendance(dateInput.value);\n\n  document.getElementById('addHrStaffBtn').addEventListener('click', ()=>{\n    const name = document.getElementById('hrNewName').value.trim();\n    const job = document.getElementById('hrNewJob').value;\n    const phone = document.getElementById('hrNewPhone').value.trim();\n    const salary = parseFloat(document.getElementById('hrNewSalary').value) || 0;\n    const agreedHours = parseFloat(document.getElementById('hrNewAgreedHours').value) || 8;\n    const startDate = document.getElementById('hrNewStartDate').value || todayIso();\n    if(!name){ alert('اكتب اسم الموظف'); return; }\n    _hrProfiles.push({ id: 'emp_' + Date.now(), name, job, phone, salary, agreedHours, startDate });\n    pushHrProfilesToCloud();\n    renderHrStaffList();\n    renderHrEmployeeSelect();\n    document.getElementById('hrNewName').value = '';\n    document.getElementById('hrNewPhone').value = '';\n    document.getElementById('hrNewSalary').value = '';\n    document.getElementById('hrNewAgreedHours').value = '8';\n    document.getElementById('hrNewStartDate').value = '';\n  });\n\n  ['hrAttIn', 'hrAttOut'].forEach(id=>{\n    const input = document.getElementById(id);\n    input.addEventListener('input', ()=>{\n      input.parentElement.classList.toggle('has-value', Boolean(input.value));\n      updateHrAttHoursPreview();\n    });\n  });\n\n  document.getElementById('hrAttPermissionBtn').addEventListener('click', ()=>{\n    const v = prompt('استئذان كام ساعة؟ (هتتضاف على ساعات الشغل بتاعته — اكتب 0 عشان تلغيه)', _hrAttPermissionHours || '');\n    if(v===null) return;\n    const n = parseFloat(v);\n    if(isNaN(n) || n<0){ alert('اكتب رقم ساعات صحيح'); return; }\n    _hrAttPermissionHours = n;\n    updateHrAttPermissionBtnLabel();\n    updateHrAttHoursPreview();\n  });\n\n  document.getElementById('hrAttUnauthBtn').addEventListener('click', ()=>{\n    askUnauthorizedAbsenceDays((n)=>{\n      if(!n) return;\n      _hrAttUnauthDays = n;\n      document.getElementById('hrAttStatus').value = 'absent_unauth';\n      updateHrAttUnauthBtnLabel();\n    });\n  });\n\n  document.getElementById('addHrAttBtn').addEventListener('click', ()=>{\n    const empId = document.getElementById('hrAttEmployee').value;\n    const emp = _hrProfiles.find(e=>e.id===empId);\n    if(!emp){ alert('اختار الموظف الأول'); return; }\n    const checkIn = document.getElementById('hrAttIn').value;\n    const checkOut = document.getElementById('hrAttOut').value;\n    const deduction = parseFloat(document.getElementById('hrAttDeduction').value) || 0;\n    const advance = parseFloat(document.getElementById('hrAttAdvance').value) || 0;\n    const permissionHours = _hrAttPermissionHours || 0;\n    const status = document.getElementById('hrAttStatus').value || 'present';\n    const unauthorizedDays = status === 'absent_unauth' ? (_hrAttUnauthDays || 1) : 0;\n    const dateKey = dateInput.value || todayIso();\n    const hours = calcHours(checkIn, checkOut) + permissionHours;\n    const id = `att_${dateKey}_${empId}`;\n    pushHrAttendance({ id, dateKey, employeeId: empId, employeeName: emp.name, checkIn, checkOut, hours, deduction, advance, permissionHours, status, unauthorizedDays });\n    document.getElementById('hrAttIn').value = '';\n    document.getElementById('hrAttOut').value = '';\n    document.getElementById('hrAttIn').parentElement.classList.remove('has-value');\n    document.getElementById('hrAttOut').parentElement.classList.remove('has-value');\n    document.getElementById('hrAttDeduction').value = '';\n    document.getElementById('hrAttAdvance').value = '';\n    _hrAttPermissionHours = 0;\n    _hrAttUnauthDays = 0;\n    updateHrAttPermissionBtnLabel();\n    updateHrAttUnauthBtnLabel();\n    document.getElementById('hrAttStatus').value = 'present';\n    updateHrAttHoursPreview();\n  });\n}\n\nlet _hrAttPermissionHours = 0;\nfunction updateHrAttPermissionBtnLabel(){\n  const btn = document.getElementById('hrAttPermissionBtn');\n  if(!btn) return;\n  if(_hrAttPermissionHours > 0){\n    btn.textContent = `استئذان (${fmt2(_hrAttPermissionHours)}س)`;\n    btn.style.background = 'var(--gold)';\n    btn.style.color = '#fff';\n    btn.style.borderColor = 'var(--gold)';\n  } else {\n    btn.textContent = 'استئذان';\n    btn.style.background = 'var(--surface-2)';\n    btn.style.color = 'var(--cream)';\n    btn.style.borderColor = 'var(--line)';\n  }\n}\n\nlet _hrAttUnauthDays = 0;\nfunction updateHrAttUnauthBtnLabel(){\n  const btn = document.getElementById('hrAttUnauthBtn');\n  if(!btn) return;\n  if(_hrAttUnauthDays > 0){\n    btn.textContent = `غياب غير مصرح (خصم ${fmt2(_hrAttUnauthDays)} يوم)`;\n    btn.style.background = 'var(--danger)';\n    btn.style.color = '#fff';\n    btn.style.borderColor = 'var(--danger)';\n  } else {\n    btn.textContent = 'غياب غير مصرح';\n    btn.style.background = 'var(--surface-2)';\n    btn.style.color = 'var(--danger)';\n    btn.style.borderColor = 'var(--danger)';\n  }\n}\n\n// حوار اختيار عدد أيام الخصم عند تسجيل غياب غير مصرح (زي لو حد ضرب اليوم)\nfunction askUnauthorizedAbsenceDays(callback){\n  const overlay = document.createElement('div');\n  overlay.className = 'table-modal-overlay show';\n  overlay.style.zIndex = '9999';\n  overlay.innerHTML = `\n    <div class=\"table-modal\" style=\"max-width:340px; padding:18px; text-align:center;\">\n      <h3 style=\"margin:0 0 4px; font-size:16px; color:var(--gold-bright);\">غياب غير مصرح<\/h3>\n      <div style=\"font-size:12px; color:var(--muted); margin-bottom:16px;\">اختار عدد أيام الخصم بسبب الغياب<\/div>\n      <div style=\"display:flex; gap:10px; margin-bottom:14px;\">\n        <button type=\"button\" class=\"btn\" data-days=\"1\" style=\"flex:1; padding:14px 0; font-size:15px; border-radius:11px; width:auto;\">يوم واحد<\/button>\n        <button type=\"button\" class=\"btn\" data-days=\"2\" style=\"flex:1; padding:14px 0; font-size:15px; border-radius:11px; width:auto;\">يومين<\/button>\n        <button type=\"button\" class=\"btn\" data-days=\"3\" style=\"flex:1; padding:14px 0; font-size:15px; border-radius:11px; width:auto;\">3 أيام<\/button>\n      <\/div>\n      <div style=\"display:flex; gap:8px; margin-bottom:14px;\">\n        <input type=\"number\" min=\"1\" step=\"1\" id=\"unauthCustomDaysInput\" placeholder=\"عدد أيام تاني\" style=\"flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--gold-bright); padding:9px 10px; font-family:inherit; font-weight:800; text-align:center; outline:none;\">\n        <button type=\"button\" class=\"btn\" id=\"unauthCustomConfirmBtn\" style=\"flex:0 0 auto; width:auto; padding:0 16px; border-radius:11px; background:var(--surface-2); color:var(--cream); border:1px solid var(--line);\">تأكيد<\/button>\n      <\/div>\n      <button type=\"button\" class=\"btn\" id=\"unauthCancelBtn\" style=\"width:100%; padding:11px; border-radius:11px; background:var(--surface-2); color:var(--cream); border:1px solid var(--line);\">إلغاء<\/button>\n    <\/div>`;\n  document.body.appendChild(overlay);\n  const close = ()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); };\n  overlay.querySelectorAll('[data-days]').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      const n = parseInt(btn.getAttribute('data-days'), 10);\n      close();\n      callback(n);\n    });\n  });\n  overlay.querySelector('#unauthCustomConfirmBtn').addEventListener('click', ()=>{\n    const n = parseInt(document.getElementById('unauthCustomDaysInput').value, 10);\n    if(!n || n<1){ alert('اكتب عدد أيام صحيح'); return; }\n    close();\n    callback(n);\n  });\n  overlay.querySelector('#unauthCancelBtn').addEventListener('click', ()=>{ close(); callback(null); });\n  overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ close(); callback(null); } });\n}\nfunction updateHrAttHoursPreview(){\n  const checkIn = document.getElementById('hrAttIn').value;\n  const checkOut = document.getElementById('hrAttOut').value;\n  const preview = document.getElementById('hrAttHoursPreview');\n  const permissionHours = _hrAttPermissionHours || 0;\n  if(!checkIn || !checkOut){\n    if(permissionHours > 0){\n      preview.style.display = 'block';\n      preview.textContent = `استئذان ${fmt2(permissionHours)} ساعة هيتضاف على ساعات الشغل`;\n    } else {\n      preview.style.display = 'none';\n    }\n    return;\n  }\n  const worked = calcHours(checkIn, checkOut);\n  const hours = worked + permissionHours;\n  const overnight = (()=>{\n    const [h1,m1] = checkIn.split(':').map(Number);\n    const [h2,m2] = checkOut.split(':').map(Number);\n    return (h2*60+m2) < (h1*60+m1);\n  })();\n  preview.style.display = 'block';\n  const permTxt = permissionHours > 0 ? ` (${fmt2(worked)} فعلي + ${fmt2(permissionHours)} استئذان)` : '';\n  preview.textContent = overnight\n    ? `الساعات المحسوبة: ${fmt2(hours)} ساعة${permTxt} — الشيفت عدّى منتصف الليل، هيتسجل تحت تاريخ يوم الحضور`\n    : `الساعات المحسوبة: ${fmt2(hours)} ساعة${permTxt}`;\n}\n\nfunction calcHours(checkIn, checkOut){\n  if(!checkIn || !checkOut) return 0;\n  const [h1,m1] = checkIn.split(':').map(Number);\n  const [h2,m2] = checkOut.split(':').map(Number);\n  let mins = (h2*60+m2) - (h1*60+m1);\n  if(mins < 0) mins += 24*60; // عدّى نص الليل\n  return Math.round((mins/60)*100)/100;\n}\n\nfunction pushHrProfilesToCloud(){\n  if(!_hrDb || !_hrFns) return;\n  const { doc, setDoc, serverTimestamp } = _hrFns;\n  _suppressHrProfilesRender = true;\n  setDoc(doc(_hrDb, 'settings', 'staffProfiles'), {\n    employees: _hrProfiles, updatedAt: serverTimestamp(), updatedBy: 'dashboard'\n  }).finally(()=>{ setTimeout(()=>{ _suppressHrProfilesRender = false; }, 800); });\n}\n\nfunction pushHrAttendance(rec){\n  if(!_hrDb || !_hrFns) return;\n  const { doc, setDoc, serverTimestamp } = _hrFns;\n  return setDoc(doc(_hrDb, 'attendance', rec.id), {\n    ...rec, updatedAt: serverTimestamp(), updatedBy: 'dashboard'\n  }).catch(err=>{\n    console.warn('فشل تسجيل الحضور', err);\n    alert('حصل خطأ أثناء الحفظ، تأكد من الاتصال بالإنترنت.');\n  });\n}\n\nfunction deleteHrAttendance(id){\n  if(!_hrDb || !_hrFns) return;\n  const { doc, deleteDoc } = _hrFns;\n  if(typeof deleteDoc !== 'function') return;\n  deleteDoc(doc(_hrDb, 'attendance', id)).catch(err=> console.warn('فشل حذف التسجيل', err));\n}\n\nfunction loadHrAttendance(dateKey){\n  if(!_hrDb || !_hrFns) return;\n  const { collection, query, where, onSnapshot } = _hrFns;\n  if(_hrAttUnsub) _hrAttUnsub();\n  const q = query(collection(_hrDb,'attendance'), where('dateKey','==', dateKey || todayIso()));\n  _hrAttUnsub = onSnapshot(q, (snap)=>{\n    _hrAttendance = [];\n    snap.forEach(d=> _hrAttendance.push(d.data()));\n    renderHrAttendance();\n  }, (err)=> console.warn('تعذر تحميل تسجيلات الحضور', err));\n}\n\nfunction renderHrEmployeeSelect(){\n  const sel = document.getElementById('hrAttEmployee');\n  if(!sel) return;\n  const prev = sel.value;\n  sel.innerHTML = _hrProfiles.map(e=>`<option value=\"${e.id}\">${escapeHtmlD(e.name)}<\/option>`).join('') || '<option value=\"\">لا يوجد موظفين بعد<\/option>';\n  if(_hrProfiles.find(e=>e.id===prev)) sel.value = prev;\n}\n\nfunction renderHrStaffList(){\n  const box = document.getElementById('hrStaffListBox');\n  if(!box) return;\n  if(!_hrProfiles.length){\n    box.innerHTML = '<div class=\"panel\"><div class=\"empty-note\">لسه مفيش موظفين متسجلين. ضيفي أول موظف من الفورم اللي فوق.<\/div><\/div>';\n    return;\n  }\n  box.innerHTML = _hrProfiles.map((e, idx)=>`\n    <div class=\"staff-card\" data-idx=\"${idx}\">\n      <div class=\"top\">\n        <div><b class=\"hr-emp-name-link\" data-emp=\"${e.id}\" data-name=\"${escapeHtmlD(e.name)}\"><i data-lucide=\"user-round\"><\/i> ${escapeHtmlD(e.name)}<\/b> <span>(${escapeHtmlD(e.job||'-')})<\/span><\/div>\n        <button class=\"icon-btn danger\" data-role=\"del-hr-staff\"><i data-lucide=\"trash-2\"><\/i> حذف<\/button>\n      <\/div>\n      <div class=\"staff-perms\" style=\"color:var(--cream-dim); font-size:12.5px;\">\n        <span><i data-lucide=\"phone\"><\/i> ${escapeHtmlD(e.phone||'-')}<\/span>\n        <span><i data-lucide=\"banknote\"><\/i> ${fmt2(e.salary||0)} ج راتب أساسي<\/span>\n        <span><i data-lucide=\"clock-3\"><\/i> ${fmt2(e.agreedHours||8)} ساعة/شيفت<\/span>\n        <span><i data-lucide=\"calendar-days\"><\/i> ${escapeHtmlD(e.startDate||'-')}<\/span>\n        <button class=\"icon-btn\" data-role=\"edit-salary\"><i data-lucide=\"pencil\"><\/i> تعديل الراتب<\/button>\n      <\/div>\n    <\/div>`).join('');\n\n  box.querySelectorAll('.hr-emp-name-link').forEach(el=>{\n    el.addEventListener('click', ()=> openEmployeeStats(el.dataset.emp, el.dataset.name));\n  });\n  box.querySelectorAll('[data-role=\"edit-salary\"]').forEach(btn=>{\n    const idx = parseInt(btn.closest('.staff-card').dataset.idx);\n    btn.addEventListener('click', (e)=>{\n      e.stopPropagation();\n      const v = prompt('الراتب الأساسي الجديد لـ ' + _hrProfiles[idx].name, _hrProfiles[idx].salary||0);\n      if(v===null) return;\n      const n = parseFloat(v);\n      if(isNaN(n) || n<0){ alert('اكتب رقم صحيح'); return; }\n      _hrProfiles[idx].salary = n;\n      pushHrProfilesToCloud();\n      renderHrStaffList();\n    });\n  });\n  box.querySelectorAll('[data-role=\"del-hr-staff\"]').forEach(btn=>{\n    const idx = parseInt(btn.closest('.staff-card').dataset.idx);\n    btn.addEventListener('click', ()=>{\n      if(!confirm(`متأكد من حذف \"${_hrProfiles[idx].name}\" من قائمة الموظفين؟`)) return;\n      _hrProfiles.splice(idx,1);\n      pushHrProfilesToCloud();\n      renderHrStaffList();\n      renderHrEmployeeSelect();\n    });\n  });\n}\n\nfunction hrStatusPillHtml(r){\n  const status = r && r.status;\n  if(status === 'leave') return '<span class=\"pill\" style=\"background:rgba(74,174,53,.15); color:var(--ok);\">إجازة<\/span>';\n  if(status === 'absent') return '<span class=\"pill\" style=\"background:rgba(224,100,90,.15); color:#e0645a;\">غياب مصرح<\/span>';\n  if(status === 'absent_unauth') return `<span class=\"pill\" style=\"background:rgba(224,84,74,.22); color:var(--danger);\">غياب غير مصرح (خصم ${fmt2(r.unauthorizedDays||1)} يوم)<\/span>`;\n  return '';\n}\n\nfunction renderHrAttendance(){\n  const body = document.getElementById('hrAttendanceBody');\n  const empty = document.getElementById('hrAttendanceEmpty');\n  if(!body) return;\n  if(!_hrAttendance.length){\n    body.innerHTML = '';\n    empty.style.display = 'block';\n    document.getElementById('hrTotalHours').textContent = '٠';\n    document.getElementById('hrTotalDeduction').textContent = '٠ ج';\n    document.getElementById('hrTotalAdvance').textContent = '٠ ج';\n    updateHomeStaffCards(0);\n    return;\n  }\n  empty.style.display = 'none';\n  let totalHours = 0, totalDed = 0, totalAdv = 0;\n  body.innerHTML = _hrAttendance.map(r=>{\n    totalHours += r.hours||0; totalDed += r.deduction||0; totalAdv += r.advance||0;\n    return `<tr>\n      <td><span class=\"hr-emp-name-link\" data-emp=\"${r.employeeId}\" data-name=\"${escapeHtmlD(r.employeeName||'-')}\">${escapeHtmlD(r.employeeName||'-')}<\/span> ${hrStatusPillHtml(r)}<\/td>\n      <td>${r.checkIn||'-'}<\/td>\n      <td>${r.checkOut||'-'}<\/td>\n      <td>${fmt2(r.hours||0)}<\/td>\n      <td>${fmt2(r.deduction||0)}<\/td>\n      <td>${fmt2(r.advance||0)}<\/td>\n      <td style=\"white-space:nowrap;\"><button class=\"icon-btn\" data-id=\"${r.id}\" data-role=\"edit-att\"><i data-lucide=\"pencil\"><\/i><\/button> <button class=\"icon-btn danger\" data-id=\"${r.id}\" data-role=\"del-att\"><i data-lucide=\"trash-2\"><\/i><\/button><\/td>\n    <\/tr>`;\n  }).join('');\n  document.getElementById('hrTotalHours').textContent = fmt2(totalHours);\n  document.getElementById('hrTotalDeduction').textContent = fmt2(totalDed) + ' ج';\n  document.getElementById('hrTotalAdvance').textContent = fmt2(totalAdv) + ' ج';\n  updateHomeStaffCards(totalHours);\n\n  body.querySelectorAll('[data-role=\"edit-att\"]').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      const rec = _hrAttendance.find(x=>x.id===btn.dataset.id);\n      if(rec) editHrAttendance(rec);\n    });\n  });\n  body.querySelectorAll('[data-role=\"del-att\"]').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      if(!confirm('متأكد من حذف تسجيل الحضور ده؟')) return;\n      deleteHrAttendance(btn.dataset.id);\n    });\n  });\n  body.querySelectorAll('.hr-emp-name-link').forEach(el=>{\n    el.addEventListener('click', ()=> openEmployeeStats(el.dataset.emp, el.dataset.name));\n  });\n}\n\n/* ============ مودال ملف الموظف الإحصائي ============ */\nconst OVERTIME_HOURLY_RATE = 15; // سعر ساعة الأوفرتايم الثابت (ج.م/ساعة)\nlet _empStatsUnsub = null;\nlet _empStatsRecords = [];\nlet _empStatsCurrentId = null;\n\nfunction openEmployeeStats(employeeId, employeeName){\n  if(!employeeId) return;\n  _empStatsCurrentId = employeeId;\n  document.getElementById('employeeStatsTitle').textContent = employeeName || 'موظف';\n  const monthInput = document.getElementById('employeeStatsMonth');\n  if(!monthInput.value) monthInput.value = currentMonthIso();\n  document.getElementById('employeeStatsOverlay').classList.add('show');\n  document.getElementById('employeeStatsCards').innerHTML = '<div class=\"empty-note\">جاري التحميل...<\/div>';\n  document.getElementById('employeeStatsSalaryBox').innerHTML = '';\n\n  if(_empStatsUnsub){ _empStatsUnsub(); _empStatsUnsub = null; }\n  if(!_hrDb || !_hrFns) return;\n  const { collection, query, where, onSnapshot } = _hrFns;\n  const q = query(collection(_hrDb,'attendance'), where('employeeId','==', employeeId));\n  _empStatsUnsub = onSnapshot(q, (snap)=>{\n    _empStatsRecords = [];\n    snap.forEach(d=> _empStatsRecords.push(d.data()));\n    renderEmployeeStats();\n  }, (err)=> {\n    console.warn('تعذر تحميل إحصائيات الموظف', err);\n    document.getElementById('employeeStatsCards').innerHTML = '<div class=\"empty-note\">تعذر تحميل البيانات<\/div>';\n  });\n}\n\nfunction closeEmployeeStats(){\n  document.getElementById('employeeStatsOverlay').classList.remove('show');\n  if(_empStatsUnsub){ _empStatsUnsub(); _empStatsUnsub = null; }\n  _empStatsCurrentId = null;\n}\n\ndocument.getElementById('employeeStatsClose').addEventListener('click', closeEmployeeStats);\ndocument.getElementById('employeeStatsOverlay').addEventListener('click', (e)=>{\n  if(e.target.id === 'employeeStatsOverlay') closeEmployeeStats();\n});\ndocument.getElementById('employeeStatsMonth').addEventListener('change', renderEmployeeStats);\n\n/* تحميل تسجيل في فورم التسجيل للتعديل (نفس الـ id بيعمل overwrite للتسجيل القديم) */\nfunction editHrAttendance(rec){\n  const dateInput = document.getElementById('hrAttendanceDate');\n  const needReload = dateInput.value !== rec.dateKey;\n  dateInput.value = rec.dateKey;\n  if(needReload) loadHrAttendance(rec.dateKey);\n  renderHrEmployeeSelect();\n  document.getElementById('hrAttEmployee').value = rec.employeeId;\n  document.getElementById('hrAttStatus').value = rec.status || 'present';\n  document.getElementById('hrAttIn').value = rec.checkIn || '';\n  document.getElementById('hrAttOut').value = rec.checkOut || '';\n  document.getElementById('hrAttIn').parentElement.classList.toggle('has-value', Boolean(rec.checkIn));\n  document.getElementById('hrAttOut').parentElement.classList.toggle('has-value', Boolean(rec.checkOut));\n  document.getElementById('hrAttDeduction').value = rec.deduction || '';\n  document.getElementById('hrAttAdvance').value = rec.advance || '';\n  _hrAttPermissionHours = rec.permissionHours || 0;\n  _hrAttUnauthDays = rec.unauthorizedDays || 0;\n  updateHrAttPermissionBtnLabel();\n  updateHrAttUnauthBtnLabel();\n  updateHrAttHoursPreview();\n  document.getElementById('addHrAttBtn').scrollIntoView({behavior:'smooth', block:'center'});\n}\n\nfunction renderEmployeeStats(){\n  const monthStr = document.getElementById('employeeStatsMonth').value; // yyyy-mm\n  if(!monthStr) return;\n  const emp = _hrProfiles.find(e=>e.id===_empStatsCurrentId);\n  const agreedHours = (emp && emp.agreedHours) || 8;\n  const baseSalary = (emp && emp.salary) || 0;\n  const PAY_DAYS_IN_MONTH = 30;                          // الشهر 30 يوم ثابت\n  const dailyRate = baseSalary / PAY_DAYS_IN_MONTH;\n  const [y, m] = monthStr.split('-').map(Number);\n  const monthStart = `${monthStr}-01`;\n  const lastDay = new Date(y, m, 0).getDate();\n  const monthEnd = `${monthStr}-${String(lastDay).padStart(2,'0')}`;\n  const inRange = _empStatsRecords.filter(r => r.dateKey >= monthStart && r.dateKey <= monthEnd);\n\n  let totalHours = 0, totalAdv = 0, totalDed = 0, presentDays = 0, leaveDays = 0, absentDays = 0, unauthAbsentDays = 0, unauthDeductionDays = 0, totalPermissionHours = 0, overtimeHours = 0;\n  inRange.forEach(r=>{\n    totalHours += r.hours||0;\n    totalAdv += r.advance||0;\n    totalDed += r.deduction||0;\n    if(r.status === 'leave') leaveDays++;\n    else if(r.status === 'absent') absentDays++;\n    else if(r.status === 'absent_unauth'){\n      unauthAbsentDays++;\n      unauthDeductionDays += r.unauthorizedDays||1;\n    }\n    else if(r.checkIn || r.checkOut || (r.hours||0)>0){\n      presentDays++;\n      overtimeHours += Math.max(0, (r.hours||0) - agreedHours);\n    }\n    totalPermissionHours += r.permissionHours||0;\n  });\n\n  // المرتب = أيام الحضور + أيام الإجازة (المسجلة) × سعر اليوم. أي يوم مفيهوش تسجيل أو مسجل غياب (مصرح أو غير مصرح) مش بيتدفع.\n  // بالإضافة لكده، الغياب الغير مصرح بياخد خصم إضافي بعدد الأيام المختارة وقت التسجيل.\n  const paidDays = Math.min(presentDays + leaveDays, PAY_DAYS_IN_MONTH);\n  const daysPay = Math.round(paidDays * dailyRate * 100) / 100;\n  const overtimePay = overtimeHours * OVERTIME_HOURLY_RATE;\n  const unauthDeductionPay = Math.round(unauthDeductionDays * dailyRate * 100) / 100;\n  const netPay = daysPay - totalDed - totalAdv - unauthDeductionPay + overtimePay;\n\n  document.getElementById('employeeStatsCards').innerHTML = `\n    <div class=\"card c-teal\"><div class=\"lbl\">إجمالي ساعات العمل<\/div><div class=\"val\">${fmt2(totalHours)}<\/div><\/div>\n    <div class=\"card c-green\"><div class=\"lbl\">أيام الحضور<\/div><div class=\"val\">${presentDays}<\/div><\/div>\n    <div class=\"card c-red\"><div class=\"lbl\">أيام الغياب المصرح<\/div><div class=\"val\">${absentDays}<\/div><\/div>\n    <div class=\"card c-red\"><div class=\"lbl\">أيام الغياب الغير مصرح<\/div><div class=\"val\">${unauthAbsentDays}<\/div><\/div>\n    <div class=\"card plain\"><div class=\"lbl\">أيام الإجازة<\/div><div class=\"val\">${leaveDays}<\/div><\/div>\n    <div class=\"card c-orange\"><div class=\"lbl\">إجمالي السلف<\/div><div class=\"val\">${fmt2(totalAdv)}<\/div><\/div>\n    <div class=\"card c-purple\"><div class=\"lbl\">إجمالي الخصومات اليدوية<\/div><div class=\"val\">${fmt2(totalDed)}<\/div><\/div>\n    <div class=\"card c-blue\"><div class=\"lbl\">إجمالي ساعات الاستئذان<\/div><div class=\"val\">${fmt2(totalPermissionHours)}<\/div><\/div>\n    <div class=\"card plain\"><div class=\"lbl\">ساعات الأوفرتايم (فوق ${fmt2(agreedHours)} س/شيفت)<\/div><div class=\"val\">${fmt2(overtimeHours)}<\/div><\/div>\n    <div class=\"card c-blue\"><div class=\"lbl\">مقابل الأوفرتايم (${fmt2(OVERTIME_HOURLY_RATE)} ج/س)<\/div><div class=\"val\">${fmt2(overtimePay)}<\/div><\/div>\n  `;\n  document.getElementById('employeeStatsSalaryBox').innerHTML = `\n    <div class=\"summary-row\" style=\"opacity:.7;\"><span>الراتب الأساسي (شهر كامل)<\/span><b>${fmt2(baseSalary)} ج<\/b><\/div>\n    <div class=\"summary-row\"><span>مستحق الأيام (${paidDays} يوم × ${fmt2(dailyRate)})<\/span><b>${fmt2(daysPay)} ج<\/b><\/div>\n    <div class=\"summary-row\"><span>+ مقابل الأوفرتايم<\/span><b>${fmt2(overtimePay)} ج<\/b><\/div>\n    <div class=\"summary-row\"><span>- إجمالي الخصومات اليدوية<\/span><b>${fmt2(totalDed)} ج<\/b><\/div>\n    <div class=\"summary-row\"><span>- خصم الغياب الغير مصرح (${unauthDeductionDays} يوم × ${fmt2(dailyRate)})<\/span><b>${fmt2(unauthDeductionPay)} ج<\/b><\/div>\n    <div class=\"summary-row\"><span>- إجمالي السلف المسحوبة<\/span><b>${fmt2(totalAdv)} ج<\/b><\/div>\n    <div class=\"summary-row\" style=\"border-top:2px solid var(--line); margin-top:6px; padding-top:10px; font-size:15px;\"><span>الصافي المستحق للموظف<\/span><b style=\"color:var(--gold-bright);\">${fmt2(netPay)} ج<\/b><\/div>\n  `;\n}\n\nfunction updateHomeStaffCards(totalHours){\n  const dateInput = document.getElementById('hrAttendanceDate');\n  if(!dateInput || dateInput.value !== todayIso()) return; // الكروت في الرئيسية بتعكس اليوم الحالي بس\n  document.getElementById('cAttendance').textContent = _hrAttendance.length;\n  document.getElementById('cWorkHours').textContent = fmt2(totalHours||0);\n}\n\n/* ============ الإعدادات: تنزيل نسخة احتياطية كاملة من Firebase ============\n   بتسحب كل البيانات اللي الكاشير رفعها على السحابة وبتبنيها بنفس صيغة ملف\n   \"تنزيل نسخة احتياطية\" بتاع الكاشير (backupVersion 2)، عشان تتستورد في الكاشير\n   من زرار \"استيراد نسخة احتياطية\" من غير أي تعديل. القراءة بس — مفيش حاجة بتتكتب على Firebase. */\nlet _setDb = null, _setFns = null;\n\nfunction startSettings(db, fns){\n  _setDb = db; _setFns = fns;\n  const btn = document.getElementById('backupDownloadBtn');\n  if(btn && !btn.dataset.bound){\n    btn.dataset.bound = '1';\n    btn.addEventListener('click', downloadFullBackupFromFirebase);\n  }\n}\n\n// الحقول اللي الداشبورد/السحابة بتضيفها على السجلات وماكانتش موجودة في بيانات الكاشير الأصلية\nfunction stripCloudFields(rec){\n  const out = { ...rec };\n  ['bdId','dateKey','ts','updatedAt','updatedBy','deleted'].forEach(k=> delete out[k]);\n  return out;\n}\nfunction recIdNum(rec){ return Number(String(rec && rec.id).replace(/\\D/g,'')) || 0; }\n\nasync function downloadFullBackupFromFirebase(){\n  if(!_setDb || !_setFns) return;\n  const { collection, doc, getDoc, getDocs } = _setFns;\n  const btn = document.getElementById('backupDownloadBtn');\n  const st = document.getElementById('backupStatus');\n  const setSt = (t, isErr)=>{ st.textContent = t; st.style.color = isErr ? 'var(--danger)' : 'var(--gold-bright)'; };\n  btn.disabled = true;\n  try{\n    setSt('⏳ جاري سحب الأيام والورديات والفواتير والمصروفات من Firebase...');\n    const [daysSnap, shiftsSnap, ordersSnap, expSnap] = await Promise.all([\n      getDocs(collection(_setDb,'businessDays')),\n      getDocs(collection(_setDb,'shifts')),\n      getDocs(collection(_setDb,'orders')),\n      getDocs(collection(_setDb,'expenses'))\n    ]);\n    setSt('⏳ جاري سحب المنيو والحسابات والاستاف والصالات...');\n    const [menuSnap, invSnap, accSnap, profSnap, tablesSnap] = await Promise.all([\n      getDoc(doc(_setDb,'settings','menu')),\n      getDoc(doc(_setDb,'settings','inventory')),\n      getDoc(doc(_setDb,'settings','accounts')),\n      getDoc(doc(_setDb,'settings','staffProfiles')),\n      getDoc(doc(_setDb,'settings','tables'))\n    ]);\n\n    /* ---- أيام العمل (appData.history) ---- */\n    const history = {};\n    daysSnap.forEach(d=>{\n      const v = d.data();\n      history[d.id] = {\n        id: d.id, dateKey: v.dateKey || null, openedAt: v.openedAt || null, closedAt: v.closedAt || null,\n        orders: [], shifts: [], expenses: []\n      };\n    });\n    // لو سجل اتربط بيوم مش موجود في businessDays بنعمله يوم مقفول مؤقت عشان السجل مايضيعش\n    const ensureDay = (bdId, ts)=>{\n      if(!history[bdId]){\n        const iso = new Date(ts || Date.now()).toISOString();\n        history[bdId] = { id: bdId, dateKey: iso.slice(0,10), openedAt: iso, closedAt: iso, orders: [], shifts: [], expenses: [] };\n      }\n      return history[bdId];\n    };\n    let nOrders = 0, nShifts = 0, nExpenses = 0, nSkipped = 0;\n    shiftsSnap.forEach(d=>{\n      const v = d.data();\n      if(!v.bdId){ nSkipped++; return; }\n      ensureDay(v.bdId, v.ts).shifts.push(stripCloudFields(v)); nShifts++;\n    });\n    ordersSnap.forEach(d=>{\n      const v = d.data();\n      if(v.deleted) return;\n      if(!v.bdId){ nSkipped++; return; }\n      ensureDay(v.bdId, v.ts).orders.push(stripCloudFields(v)); nOrders++;\n    });\n    expSnap.forEach(d=>{\n      const v = d.data();\n      if(v.deleted) return;\n      if(!v.bdId){ nSkipped++; return; }\n      ensureDay(v.bdId, v.ts).expenses.push(stripCloudFields(v)); nExpenses++;\n    });\n    Object.values(history).forEach(bd=>{\n      bd.orders.sort((a,b)=> recIdNum(a) - recIdNum(b));\n      bd.shifts.sort((a,b)=> recIdNum(a) - recIdNum(b));\n      bd.expenses.sort((a,b)=> recIdNum(a) - recIdNum(b));\n    });\n    // اليوم المفتوح (لو فيه) بيبقى هو يوم العمل الحالي في الكاشير\n    const openDays = Object.values(history).filter(bd=> !bd.closedAt).sort((a,b)=> recIdNum(b) - recIdNum(a));\n    const currentBusinessDayKey = openDays.length ? openDays[0].id : null;\n\n    /* ---- باقي البيانات ---- */\n    const payload = {\n      exportedAt: new Date().toISOString(),\n      app: 'coex-cashier',\n      backupVersion: 2,\n      source: 'firebase-dashboard',\n      data: { history, currentBusinessDayKey }\n    };\n\n    const rawMenu = menuSnap.exists() ? (menuSnap.data().menu || []) : [];\n    const menu = rawMenu.map(cat => ({\n      ...cat,\n      groups: (cat.groups||[]).map(g => ({\n        ...g,\n        items: (g.items||[]).map(it => Array.isArray(it) ? it : [it.name, it.price])\n      }))\n    }));\n    if(menu.length) payload.menu = menu;\n\n    const accounts = accSnap.exists() ? (accSnap.data().accounts || []) : [];\n    if(accounts.length) payload.accounts = accounts;\n\n    const employees = profSnap.exists() ? (profSnap.data().employees || []) : [];\n    if(employees.length) payload.staffProfiles = employees;\n\n    const halls = tablesSnap.exists() ? (tablesSnap.data().halls || []) : [];\n    if(halls.length) payload.halls = halls.map(h=>({ id: h.id, name: h.name, tableCount: h.tableCount || 0 }));\n\n    const includeInv = document.getElementById('backupIncludeInventory').checked;\n    let invCount = 0;\n    if(includeInv && invSnap.exists()){\n      const items = invSnap.data().items || [];\n      invCount = items.length;\n      payload.inventory = { items, recipes: {}, movements: [], audits: [] };\n    }\n\n    const stamp = new Date();\n    const p = n => String(n).padStart(2,'0');\n    const fname = `coex-backup-firebase-${stamp.getFullYear()}-${p(stamp.getMonth()+1)}-${p(stamp.getDate())}_${p(stamp.getHours())}-${p(stamp.getMinutes())}.json`;\n    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = fname;\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    setTimeout(()=> URL.revokeObjectURL(url), 2000);\n\n    setSt(`تم تنزيل الملف (${fname}) — ${Object.keys(history).length} يوم عمل، ${nShifts} وردية، ${nOrders} فاتورة، ${nExpenses} مصروف`\n      + (menu.length ? '، المنيو' : '') + (accounts.length ? '، الحسابات' : '') + (employees.length ? '، الاستاف' : '')\n      + (halls.length ? '، الصالات' : '') + (includeInv ? `، المخزون (${invCount} صنف)` : '')\n      + (nSkipped ? ` — تم تجاهل ${nSkipped} سجل غير مرتبط بيوم عمل` : '') + '.');\n  }catch(err){\n    console.warn('فشل تنزيل النسخة الاحتياطية من Firebase', err);\n    setSt('حصل خطأ أثناء سحب البيانات من Firebase — تأكد من الإنترنت وإن حسابك مسموح له بالقراءة وحاول تاني.', true);\n  }finally{\n    btn.disabled = false;\n  }\n}\n<\/script>\n\n<\/body>\n<\/html>\n";
  var frSys = document.getElementById('frSys');
  var frDash = document.getElementById('frDash');
  // Cashier is laid out like a desktop screen (1280px wide) and scaled down to fit small screens
  var DESKTOP_W = 1280;
  function fitSys() {
    var box = document.querySelector('.frames');
    var W = box.clientWidth, H = box.clientHeight;
    if (W >= DESKTOP_W) {
      frSys.style.width = '100%';
      frSys.style.height = '100%';
      frSys.style.transform = 'none';
      frSys.style.left = '';
      frSys.style.right = '';
      return;
    }
    var s = W / DESKTOP_W;
    frSys.style.left = '0';
    frSys.style.right = 'auto';
    frSys.style.width = DESKTOP_W + 'px';
    frSys.style.height = (H / s) + 'px';
    frSys.style.transformOrigin = '0 0';
    frSys.style.transform = 'scale(' + s + ')';
  }
  frSys.addEventListener('load', fitSys);
  window.addEventListener('resize', fitSys);
  window.addEventListener('orientationchange', fitSys);
  fitSys();
  frSys.srcdoc = CASHIER_HTML;
  frDash.srcdoc = DASH_HTML;

  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var view = btn.getAttribute('data-view');
      tabs.forEach(function (b) { b.classList.toggle('active', b === btn); });
      frSys.classList.toggle('show', view === 'sys');
      frDash.classList.toggle('show', view === 'dash');
      document.body.classList.toggle('view-sys', view === 'sys');
      document.body.classList.toggle('view-dash', view === 'dash');
    });
  });

  document.getElementById('dashHintOk').addEventListener('click', function () {
    document.body.classList.add('hint-off');
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('هيتم مسح كل بيانات الديمو وإعادة التحميل. متأكد؟')) return;
    try { sessionStorage.clear(); } catch (e) {}
    frSys.srcdoc = CASHIER_HTML;
    frDash.srcdoc = DASH_HTML;
  });
})();
</script>
