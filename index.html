<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beans POS - نسخة ديمو</title>
<link rel="icon" href="beans/icon.png">
<style>
  html, body { margin:0; height:100%; background:#140f0c; font-family: Tajawal, Cairo, Tahoma, Arial, sans-serif; overflow:hidden; }
  .bar { height:56px; display:flex; align-items:center; gap:10px; padding:0 14px; box-sizing:border-box;
         background:#1d1612; border-bottom:1px solid #3a2b22; color:#f3e7d6; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:17px; margin-inline-end:8px; white-space:nowrap; }
  .brand img { width:30px; height:30px; border-radius:8px; object-fit:cover; }
  .badge { font-size:11px; padding:3px 8px; border-radius:20px; background:#3a2b22; color:#d9b679; white-space:nowrap; }
  .tabs { display:flex; gap:6px; background:#120d0a; padding:4px; border-radius:12px; border:1px solid #3a2b22; }
  .tab { appearance:none; border:0; cursor:pointer; padding:8px 18px; border-radius:9px; background:transparent;
         color:#bfae98; font-weight:700; font-size:14px; font-family:inherit; }
  .tab.active { background:#c8973e; color:#1d1207; }
  .tab:hover:not(.active) { color:#f3e7d6; }
  .spacer { flex:1; }
  .reset { appearance:none; border:1px solid #5a4536; background:transparent; color:#d9b679; cursor:pointer;
           padding:7px 12px; border-radius:9px; font-family:inherit; font-size:13px; }
  .reset:hover { background:#2a1f18; }
  .frames { position:absolute; top:56px; left:0; right:0; bottom:0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; display:none; }
  iframe.show { display:block; }
  #rotateHint { position:fixed; inset:0; z-index:9999; display:none; flex-direction:column; align-items:center;
                justify-content:center; gap:18px; padding:24px; box-sizing:border-box; text-align:center;
                background:#140f0c; color:#f3e7d6; font-family: Tajawal, Cairo, Tahoma, Arial, sans-serif; }
  #rotateHint svg { width:72px; height:72px; color:#c8973e; animation: rotPhone 2.4s ease-in-out infinite; }
  #rotateHint h2 { margin:0; font-size:22px; font-weight:900; color:#d9b679; }
  #rotateHint p { margin:0; font-size:16px; line-height:1.8; color:#bfae98; max-width:320px; }
  @keyframes rotPhone { 0%,20% { transform:rotate(0deg); } 50%,70% { transform:rotate(-90deg); } 100% { transform:rotate(0deg); } }
  @media (orientation: portrait) and (max-width: 900px) { body.view-sys #rotateHint { display:flex; } }
  body.hint-off #dashHint { display:none !important; }
  .tab, .reset { white-space:nowrap; }
  #dashHint { position:fixed; inset:0; z-index:9998; display:none; flex-direction:column; align-items:center;
              justify-content:center; gap:16px; padding:24px; box-sizing:border-box; text-align:center;
              background:#140f0c; color:#f3e7d6; font-family: Tajawal, Cairo, Tahoma, Arial, sans-serif; }
  #dashHint svg { width:72px; height:72px; color:#c8973e; animation: rotPhoneBack 2.4s ease-in-out infinite; }
  #dashHint h2 { margin:0; font-size:22px; font-weight:900; color:#d9b679; }
  #dashHint p { margin:0; font-size:16px; line-height:1.8; color:#bfae98; max-width:320px; }
  #dashHint button { appearance:none; border:1px solid #5a4536; background:transparent; color:#d9b679; cursor:pointer;
                     padding:10px 18px; border-radius:10px; font-family:inherit; font-size:14px; }
  @keyframes rotPhoneBack { 0%,20% { transform:rotate(-90deg); } 50%,70% { transform:rotate(0deg); } 100% { transform:rotate(-90deg); } }
  @media (orientation: landscape) and (max-height: 600px) {
    body.view-dash #dashHint { display:flex; }
    .badge { display:none; }
    .brand span { display:none; }
    .tab { padding:6px 12px; font-size:13px; }
    .reset { padding:6px 10px; font-size:12px; }
  }
  @media (max-width: 640px) {
    .badge { display:none; }
    .brand span { display:none; }
    .tab { padding:7px 12px; font-size:13px; }
  }
</style>
</head>
<body class="view-sys">
<div class="bar">
  <div class="brand"><img src="beans/icon.png" alt=""><span>Beans POS</span></div>
  <span class="badge">نسخة ديمو · البيانات بتتمسح لما تقفل المتصفح</span>
  <div class="tabs">
    <button class="tab active" data-view="sys" type="button">النظام</button>
    <button class="tab" data-view="dash" type="button">الداش بورد</button>
  </div>
  <div class="spacer"></div>
  <button class="reset" id="resetBtn" type="button">تصفير الديمو</button>
</div>
<div class="frames">
  <iframe id="frSys" class="show" title="Beans POS - النظام"></iframe>
  <iframe id="frDash" title="Beans POS - الداش بورد"></iframe>
</div>
<div id="rotateHint" role="alert">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/>
  </svg>
  <h2>لف الموبايل بالعرض</h2>
  <p>السيستم بيتعرض كامل على الشاشة بالعرض بس. من فضلك لف الموبايل عشان تكمل.</p>
</div>
<div id="dashHint" role="alert">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/>
  </svg>
  <h2>لف الموبايل بالطول</h2>
  <p>الداش بورد بيتعرض أحسن بالطول. لو عايز تكمل بالعرض اضغط الزرار تحت.</p>
  <button id="dashHintOk" type="button">كمل بالعرض</button>
</div>

entation layer only (no JS / markup changes)\n   Cafe design system: warm orange accent, dark brown sidebar, white cards\n   ========================================================================== */\n@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');\n\n:root{\n  --bg:#F5F1EB; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#FBF7F1;\n  --line:#E8E1D7; --line-soft:#F1ECE4;\n  --gold:#6B3A1F; --gold-bright:#4E2A14; --gold-dim:#5C3219;\n  --cream:#2A2420; --cream-dim:#5B524A; --muted:#8C8378;\n  --ember-1:#5C3219; --ember-2:#DD4A0A;\n  --ok:#2F9E44; --danger:#D64545; --warn:#F59F00;\n  --radius:16px; --radius-sm:12px;\n  --side:#2B1F1A; --side-2:#3A2B24;\n  --shadow-card:0 1px 2px rgba(43,31,26,.06), 0 4px 12px rgba(43,31,26,.05);\n  --shadow-card-hover:0 8px 22px rgba(43,31,26,.12), 0 0 0 1.5px rgba(107,58,31,.45);\n  --shadow-pop:0 24px 60px rgba(43,31,26,.28);\n  --gold-grad:linear-gradient(135deg,#7A4425,#6B3A1F);\n  --glass:rgba(255,255,255,.9);\n  --ease:cubic-bezier(.2,.7,.2,1);\n}\nbody{\n  background:var(--bg) !important;\n  font-family:'Inter','Tajawal',sans-serif; color:var(--cream);\n}\nh1,h2,h3,.brand-text h1{font-family:'Cairo','Inter',sans-serif;}\n::selection{background:#FFD8BF; color:var(--cream);}\n\n/* ---------- Buttons (one system) ---------- */\nbutton{font-family:inherit;}\n.btn-gold,.checkout-btn,.print-action-btn,.checkout-print-btn,.btn-outline,.btn-danger-sm,.img-upload-btn{\n  min-height:44px; border-radius:12px; font-weight:800; letter-spacing:0;\n  transition:transform .12s var(--ease), box-shadow .15s, background .15s, border-color .15s, filter .15s;\n}\n.btn-gold{background:var(--gold) !important; color:#fff !important; border:none; box-shadow:0 4px 12px rgba(107,58,31,.28);}\n.btn-gold:hover{background:var(--gold-dim) !important; filter:none; transform:translateY(-1px); box-shadow:0 8px 18px rgba(107,58,31,.32);}\n.btn-gold:active{transform:scale(.98);}\n.btn-outline{background:#fff !important; border:1px solid var(--line) !important; color:var(--cream-dim);}\n.btn-outline:hover{border-color:var(--gold) !important; color:var(--gold-bright);}\n.btn-danger-sm{background:#FDECEC; color:var(--danger); border:1px solid #F6CACA;}\n.btn-danger-sm:hover{background:var(--danger); color:#fff;}\nbutton:disabled{opacity:.45; cursor:not-allowed;}\nbutton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(107,58,31,.28); outline-offset:1px;}\n\n/* ---------- Inputs ---------- */\ninput[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=search],input[type=tel],input[type=email],select,textarea,.admin-select,.search-input,.field-box input,.field-box textarea{\n  background:#fff; border:1.5px solid var(--line); border-radius:12px; color:var(--cream);\n  font-family:inherit; min-height:44px; transition:border-color .15s, box-shadow .15s;\n}\ntextarea{min-height:64px;}\ninput:focus,select:focus,textarea:focus,.search-input:focus{border-color:var(--gold) !important; box-shadow:0 0 0 4px rgba(107,58,31,.14); outline:none;}\ninput[type=checkbox],input[type=radio]{accent-color:var(--gold); width:18px; height:18px;}\n.field-box label{color:var(--cream-dim); font-weight:700;}\n\n/* ---------- Product cards ---------- */\n.subhead{font-family:'Cairo','Inter'; font-weight:800; font-size:15px; color:var(--cream); margin:18px 0 10px;}\n.grid{display:grid !important; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)) !important; gap:14px !important;}\n.item-card{\n  position:relative; background:#fff; border:1px solid var(--line-soft); border-radius:16px;\n  box-shadow:var(--shadow-card); overflow:hidden; cursor:pointer; user-select:none;\n  transition:transform .14s var(--ease), box-shadow .18s, border-color .18s;\n}\n.item-card:hover{transform:translateY(-3px); border-color:transparent; box-shadow:var(--shadow-card-hover);}\n.item-card:active{transform:scale(.97);}\n.item-card .item-thumb{aspect-ratio:4/3; height:auto !important; background:var(--surface-2);}\n.item-card .name{font-weight:700; font-size:14px; line-height:1.35; color:var(--cream);}\n.item-card .price{color:var(--gold-bright) !important; font-weight:800; font-size:15px;}\n.item-card .price span{font-size:11px; color:var(--muted); margin-inline-start:3px; font-weight:600;}\n.qty-badge{\n  background:var(--gold) !important; color:#fff !important; border-radius:999px !important;\n  min-width:26px; height:26px; font-weight:800; box-shadow:0 3px 8px rgba(107,58,31,.4);\n  animation:qtyPop .22s var(--ease);\n}\n@keyframes qtyPop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}\n\n/* ---------- Category / hall / table chips ---------- */\n.tab,.hall-tab{\n  min-height:42px; border-radius:12px !important; background:#fff; border:1px solid var(--line);\n  color:var(--cream-dim); font-weight:700; transition:all .15s var(--ease);\n}\n.tab:hover,.hall-tab:hover{border-color:var(--gold); color:var(--gold-bright);}\n.tab.active,.hall-tab.active{background:var(--gold) !important; border-color:var(--gold) !important; color:#fff !important; box-shadow:0 4px 12px rgba(107,58,31,.3);}\n.tabs{align-items:stretch; gap:5px; padding-bottom:0;}\n.tab{\n  position:relative; min-height:46px; padding:9px 14px 8px; border:1px solid transparent !important;\n  border-bottom:3px solid transparent !important; border-radius:10px 10px 0 0 !important;\n  background:transparent !important; color:var(--cream-dim); scroll-snap-align:center;\n}\n.tab:hover{border-color:transparent !important; background:#fff8f2 !important; color:var(--gold-bright);}\n.tab.active{\n  border:1px solid var(--line-soft) !important; border-bottom:3px solid var(--gold) !important;\n  background:#fff !important; color:var(--gold-bright) !important; box-shadow:none !important;\n}\n.tab .em{font-size:17px;}\n.tabs-arrow{border-radius:12px; background:#fff; border:1px solid var(--line); color:var(--cream-dim);}\n.tabs-arrow:hover{background:#FFF1E6; border-color:var(--gold);}\n.table-btn{border-radius:12px; background:#fff; border:1.5px solid var(--line); min-height:52px; transition:all .15s var(--ease);}\n.table-btn:hover{border-color:var(--gold);}\n.table-btn.active{background:#FFF1E6; border-color:var(--gold); box-shadow:0 0 0 3px rgba(107,58,31,.15);}\n.table-btn.has-items{border-color:var(--gold); background:#FFF8F2;}\n.search-input{padding-inline:16px; font-size:15px; box-shadow:var(--shadow-card);}\n\n/* ---------- Cart panel ---------- */\n.cart-col{background:var(--surface-2) !important; border-inline-start:1px solid var(--line) !important;}\n.cart-head{padding-bottom:12px; border-bottom:1px solid var(--line);}\n.cart-head h2{font-size:18px; color:var(--cream) !important;}\n.cart-head .clear{width:40px; height:40px; border-radius:12px; background:#fff; border:1px solid var(--line); font-size:16px; transition:all .15s;}\n.cart-head .clear:hover{border-color:var(--gold); background:#FFF1E6;}\n.cart-items{flex:1; overflow-y:auto; min-height:0;}\n.cart-line{\n  display:flex; align-items:center; gap:10px; padding:12px 4px;\n  border-bottom:1px solid var(--line); animation:lineIn .18s var(--ease);\n}\n@keyframes lineIn{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}\n.cart-line .info{flex:1; min-width:0;}\n.cart-line .nm{font-weight:700; font-size:14.5px; color:var(--cream);}\n.cart-line .pr{font-size:12px; color:var(--muted); margin-top:2px;}\n.cart-line .line-total{font-weight:800; color:var(--cream); min-width:64px; text-align:end;}\n.stepper{gap:4px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:3px;}\n.stepper button{width:34px; height:34px; border-radius:9px; border:none; background:var(--surface-2); font-size:18px; font-weight:800; color:var(--cream-dim);}\n.stepper button:hover{background:var(--gold); color:#fff;}\n.stepper .q{width:24px; font-size:14px;}\n.cart-empty{color:var(--muted);}\n.cart-footer{border-top:1px solid var(--line); padding-top:12px;}\n.sum-row{color:var(--cream-dim); font-weight:600;}\n.sum-row.total{\n  font-family:'Cairo'; font-size:24px; font-weight:900; color:var(--gold-bright);\n  border-top:2px dashed var(--line); margin-top:8px; padding-top:10px;\n}\n.discount-box,.notes-box,.owner-toggle{background:#fff; border:1px solid var(--line); border-radius:12px;}\n.checkout-actions{display:flex; gap:8px; margin-top:12px;}\n.checkout-actions .checkout-btn{margin-top:0; flex:1;}\n.checkout-btn{\n  min-height:54px; font-size:15.5px; color:#fff !important; border:none;\n  background:var(--ok) !important; box-shadow:0 6px 16px rgba(47,158,68,.3) !important;\n}\n.checkout-btn:not(:disabled):hover{filter:brightness(1.06);}\n.checkout-btn:disabled{background:#CFC8BE !important; box-shadow:none !important; color:#fff !important; opacity:1;}\n.instapay-btn{background:#6D3FA0 !important; box-shadow:0 6px 16px rgba(109,63,160,.3) !important;}\n.checkout-btn.owner-mode{background:#8A6D3B !important; box-shadow:0 6px 16px rgba(138,109,59,.3) !important;}\n.checkout-print-btn,.print-action-btn{background:#fff !important; border:1.5px solid var(--line) !important; color:var(--cream-dim) !important;}\n.checkout-print-btn{min-width:54px;}\n.checkout-print-btn:hover,.print-action-btn:hover{border-color:var(--gold) !important; color:var(--gold-bright) !important; background:#FFF8F2 !important;}\n.owner-toggle .switch{accent-color:var(--gold);}\n\n/* ---------- Modals ---------- */\n.modal-overlay{background:rgba(43,31,26,.55) !important; backdrop-filter:blur(4px);}\n.modal{\n  background:#fff !important; border:1px solid var(--line) !important; border-radius:20px !important;\n  padding:24px !important; box-shadow:var(--shadow-pop) !important;\n}\n.modal h2,.modal h3{font-family:'Cairo'; color:var(--cream);}\n.modal h2{font-size:20px; font-weight:800;}\n.close-x{\n  width:38px; height:38px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line);\n  color:var(--cream-dim); transition:all .15s;\n}\n.close-x:hover{background:var(--danger); border-color:var(--danger); color:#fff;}\n.modal-actions{gap:10px;}\n.modal-actions > button{flex:1; min-height:46px;}\n@keyframes modalPop{from{opacity:0; transform:translateY(10px) scale(.97)}to{opacity:1; transform:none}}\n\n/* ---------- Lists / tables / cards inside screens ---------- */\n.order-row,.inv-item-card,.admin-item-row,.shift-card,.stat-box,.audit-item-row,.audit-result-row,.live-table-card,.live-hall,.recipe-ing-row,.variance-row{\n  background:#fff; border:1px solid var(--line-soft); border-radius:14px; box-shadow:var(--shadow-card);\n}\n.order-row{padding:14px; transition:box-shadow .15s, border-color .15s;}\n.order-row:hover{border-color:var(--gold);}\n.stat-box{padding:14px;}\n.report-tabs,.report-tab{font-family:inherit;}\n.report-tab{border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--cream-dim); font-weight:700; min-height:42px; transition:all .15s;}\n.report-tab.active{background:var(--gold); border-color:var(--gold); color:#fff;}\n.month-nav button{border-radius:12px;}\ntable{border-collapse:collapse;}\nth{background:var(--surface-2); color:var(--cream-dim); font-weight:700; font-size:12.5px;}\ntd,th{border-bottom:1px solid var(--line-soft);}\ntr:hover td{background:#FFFAF5;}\n.owner-badge{border-radius:999px;}\n.toast{border-radius:14px; box-shadow:var(--shadow-pop);}\n::-webkit-scrollbar-thumb{background:#D9D0C4;}\n\n/* ==========================================================================\n   DESKTOP POS LAYOUT: sidebar | workspace | order panel\n   (RTL: sidebar sits on the right, order panel on the left)\n   ========================================================================== */\n@media(min-width:960px){\n  html,body{height:100%; overflow:hidden !important;}\n  .app-shell{\n    display:grid !important; max-width:none !important; margin:0 !important; height:100vh; height:100dvh;\n    grid-template-columns: 0px 12px 8px;}\n  .login-side h2{font-size:24px !important;}\n  .login-quote{width:min(260px,72%); margin-top:14px;}\n}\n@media(max-height:640px) and (min-width:821px){ .login-art{min-height:0;} .login-quote{display:none;} }\n\n/* login: never clip the card; let the overlay scroll on very short screens */\n#authOverlay{overflow-y:auto; align-items:safe center !important;}\n#authOverlay .modal.login-split{max-height:none !important; overflow:visible !important; margin:auto;}\n.login-side{padding-block:16px;}\n.login-side #authSubtitle{margin-bottom:16px;}\n.login-quote{margin-top:14px;}\n@media(max-height:760px) and (min-width:821px){ .login-quote{width:min(280px,70%);} }\n\n/* ==================== Extra options button + modal ==================== */\n.extra-opts-btn{\n  position:relative; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:48px; margin:10px 0 2px;\n  background:#fff; border:1.5px dashed #D9C7B5; border-radius:12px; color:var(--cream-dim); font-weight:800; font-size:14.5px; cursor:pointer;\n  transition:all .15s var(--ease);\n}\n.extra-opts-btn:hover{border-color:var(--gold); color:var(--gold-bright); background:#FFF8F2;}\n.extra-opts-btn:active{transform:scale(.98);}\n.extra-opts-btn .eo-dot{display:none; width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px rgba(107,58,31,.2);}\n.extra-opts-btn.has-opts{border-style:solid; border-color:var(--gold); color:var(--gold-bright); background:#FFF3E9;}\n.extra-opts-btn.has-opts .eo-dot{display:inline-block;}\n.extra-opts-modal{max-width:480px !important; display:flex; flex-direction:column;}\n.extra-opts-modal .eo-context{\n  display:flex; align-items:center; gap:8px; width:max-content; max-width:100%; margin-top:6px;\n  padding:6px 10px; border-radius:999px; background:#fff3e7; color:var(--gold-bright); font-size:12px; font-weight:800;\n}\n.eo-context-dot{width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--gold);} ia-expanded')==='true';\n        toggle.setAttribute('aria-expanded',String(!expanded));\n        panel.hidden=expanded;\n      });\n    });\n    document.getElementById('extraOptsBtn'+X).addEventListener('click',open);\n    document.getElementById('extraOptsClose'+X).addEventListener('click',close);\n    document.getElementById('extraOptsDone'+X).addEventListener('click',close);\n    ov.addEventListener('mousedown',function(e){ if(e.target===ov) close(); });\n    ['swapTableBtn','emptyTableBtn'].forEach(function(id){ document.getElementById(id+X).addEventListener('click',close); });\n    // small dot on the button when something inside is active\n    var btn=document.getElementById('extraOptsBtn'+X);\n    setInterval(function(){\n      var d=parseFloat(document.getElementById('discountInput'+X).value)||0;\n      var n=(document.getElementById('notesInput'+X).value||'').trim();\n      var o=document.getElementById('ownerToggle'+X).classList.contains('active');\n      btn.classList.toggle('has-opts', d>0 || !!n || o);\n      var ds=document.getElementById('discountShow'+X); if(ds){ ds.textContent=d+' ج.م'; ds.parentNode.classList.toggle('has-discount', d>0); }\n    },400);\n  });\n})();\n<\/script>\n<!-- Welcome / Login / Register Overlay -->\n<div class=\"modal-overlay\" id=\"authOverlay\" style=\"z-index:200;\">\n  <div class=\"modal login-split\">\n    <div class=\"login-art\" aria-hidden=\"true\"><\/div>\n    <div class=\"login-side\">\n    <img class=\"bn-login-logo\" src=\"beans/login-logo.png\" alt=\"Beans POS\">\n    <h2 style=\"margin-bottom:2px;\">أهلاً بك في نظام الكاشير<\/h2>\n    <div class=\"sub-note\" id=\"authSubtitle\">ادخل بياناتك للبدء<\/div>\n\n    <div id=\"authLoginPane\">\n      <div class=\"field-box\" style=\"text-align:right;\">\n        <label>اسم المستخدم<\/label>\n        <div class=\"login-input\"><span class=\"li-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke- rd'?'text':'password';});<\/script>\n\n\n<!-- Sales PIN Lock Modal -->\n<div class=\"modal-overlay\" id=\"salesPinModalOverlay\">\n  <div class=\"modal\" style=\"max-width:340px;\">\n    <button type=\"button\" class=\"close-x\" id=\"salesPinModalClose\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg><\/button>\n    <h2>مبيعات اليوم مقفلة <svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"/><\/svg><\/h2>\n    <div class=\"sub-note\">أدخل الرمز لعرض مبيعات اليوم<\/div>\n    <div class=\"discount-box\" style=\"width:100%; margin:14px 0;\">\n      <label>الرمز:<\/label>\n      <input type=\"password\" id=\"salesPinInput\" placeholder=\"أدخل الرمز\" style=\"width:150px;\">\n    <\/div>\n    <button type=\"button\" class=\"btn-gold\" id=\"salesPinBtn\" style=\"width:100%; padding:10px; border-radius:8px; border:none; font-weight:800; cursor:pointer;\">فتح<\/button>\n  <\/div>\n<\/div>\n\n<!-- Decrement Password Modal -->\n<div class=\"modal-overlay\" id=\"decrementPasswordModalOverlay\">\n  <div class=\"modal\" style=\"max-width:340px;\">\n    <button type=\"button\" class=\"close-x\" id=\"decrementPasswordModalClose\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg><\/button>\n    <h2 id=\"decrementPasswordTitle\">كلمة المرور مطلوبة <svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"/><\/svg><\/h2>\n    <div class=\"sub-note\" id=\"decrementPasswordSubNote\">أدخل كلمة المرور لتقليل كمية الصنف<\/div>\n    <div class=\"discount-box\" style=\"width:100%; margin:14px 0;\">\n      <label>كلمة المرور:<\/label>\n      <input type=\"password\" id=\"decrementPasswordInput\" placeholder=\"أدخل كلمة المرور\" style=\"width:150px;\">\n    <\/div>\n    <button ty unction(a,it){return a+it.qty;},0):0, has=count>0;\n      var total=t?t.items.reduce(function(a,it){return a+it.price*it.qty;},0):0;\n      var cur=(hid===activeHall&&i===activeTable);\n      html+='<div class=\"live-table-card swap-table-card'+(has?' occupied':'')+(cur?' is-current':'')+'\" data-num=\"'+i+'\">'\n        +'<div class=\"lt-dot\"><\/div>'\n        +'<div class=\"lt-name\">'+escapeHtml(tableDisplayLabel(hid,i))+'<\/div>'\n        +'<div class=\"lt-status\">'+(cur?'الترابيزة الحالية':(has?count+' صنف مفتوح':'فاضية'))+'<\/div>'\n        +(has&&!cur?'<div class=\"lt-total\">'+fmt(total)+' ج.م<\/div>':'')\n        +'<\/div>';\n    }\n    var grid=document.getElementById('swapTablesGrid');\n    grid.innerHTML=html;\n    grid.querySelectorAll('.swap-table-card:not(.is-current)').forEach(function(c){\n      c.addEventListener('click',function(){\n        grid.querySelectorAll('.swap-table-card').forEach(function(x){x.classList.remove('is-picked');});\n        c.classList.add('is-picked');\n        numSel.value=c.dataset.num; fire(numSel);\n        confirmBtn.disabled=false;\n      });\n    });\n    stepH.style.display='none'; stepT.style.display='';\n  }\n  document.getElementById('swapBackBtn').addEventListener('click',showHalls);\n  ['swapTableBtnD','swapTableBtnM'].forEach(function(id){ document.getElementById(id).addEventListener('click',showHalls); });\n})();\n<\/script>\n\n<!-- Reports modal (Day / Month) -->\n<div class=\"modal-overlay\" id=\"dayModalOverlay\">\n  <div class=\"modal\">\n    <button type=\"button\" class=\"close-x\" id=\"dayModalClose\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg><\/button>\n    <h2>التقارير<\/h2>\n    <div class=\"report-tabs\">\n      <div class=\"report-tab active\" id=\"repTabDay\">تقرير اليوم<\/div>\n      <div class=\"report-tab\" id=\"repTabMonth\">تقارير الشهر<\/div>\n      <div class=\"report-tab\" id=\"repTabAdv\">تقارير متقدمة<\/div>\n    <\/div>\n\n 8px;\">الفواتير<\/div>\n        <div class=\"select-toolbar\" id=\"detailOrderSelectBar\">\n          <button type=\"button\" class=\"btn-outline\" id=\"detailOrderSelectToggleBtn\" style=\"display:none;\">تحديد متعدد<\/button>\n          <span class=\"sel-count\" id=\"detailOrderSelectCountLbl\" style=\"display:none;\">محدد: 0<\/span>\n          <button type=\"button\" class=\"btn-danger-sm\" id=\"detailOrderDeleteSelectedBtn\" style=\"display:none;\">حذف المحدد<\/button>\n          <button type=\"button\" class=\"btn-outline\" id=\"detailOrderSelectCancelBtn\" style=\"display:none;\">إلغاء<\/button>\n        <\/div>\n        <div class=\"order-list\" id=\"detailOrderList\"><\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Advanced reports pane -->\n    <div class=\"report-pane\" id=\"repPaneAdv\">\n      <div class=\"adv-period\">\n        <label>الفترة:<\/label>\n        <div class=\"adv-toggle\">\n          <button type=\"button\" class=\"active\" id=\"advPeriodDayBtn\">يوم معيّن<\/button>\n          <button type=\"button\" id=\"advPeriodMonthBtn\">شهر كامل<\/button>\n        <\/div>\n        <input type=\"date\" id=\"advDateInput\">\n        <input type=\"month\" id=\"advMonthInput\" style=\"display:none;\">\n      <\/div>\n      <div class=\"adv-head\">\n        <button type=\"button\" class=\"btn-outline\" id=\"advBackBtn\" style=\"display:none;\">رجوع ›<\/button>\n        <div class=\"subhead\" id=\"advTitle\" style=\"margin:0;\">اختار التقرير اللي عايز تشوفه<\/div>\n      <\/div>\n      <div class=\"adv-tiles\" id=\"advTiles\"><\/div>\n      <div class=\"adv-body\" id=\"advBody\"><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- Shift open/close modal -->\n<div class=\"modal-overlay\" id=\"shiftModalOverlay\">\n  <div class=\"modal\">\n    <button type=\"button\" class=\"close-x\" id=\"shiftModalClose\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg><\/button>\n    <h2>فتح وإغلاق الوردية<\/h2>\n\n    <!-- No open shift: open form -->\n    <div id=\"shiftOpenBox\">\n      <div class=\"sub-note\">أدخل النقدية الموجودة حالياً في الدرج لبدء الوردية<\/div>\n      <div class=\"field-box\">\n        <label>النقدية الموجودة في الدرج الآن (ج.م)<\/label>\n        <input type=\"number\" id=\"openingCashInput\" placeholder=\"0\" inputmode=\"decimal\">\n      <\/div>\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn-gold\" id=\"confirmOpenShiftBtn\" style=\"flex:1;\">فتح الوردية<\/button>\n      <\/div>\n    <\/div>\n\n    <!-- Open shift exists: status + close -->\n    <div id=\"shiftStatusBox\" style=\"display:none;\">\n      <div class=\"sub-note\" id=\"shiftOpenedInfo\"><\/div>\n      <div class=\"field-box\" style=\"background:var(--surface);\">\n        <div class=\"variance-row\"><span class=\"k\">الكاشير في الوردية<\/span><span class=\"v\" id=\"viewShiftCashier\">-<\/span><\/div>\n        <div class=\"variance-row\" id=\"rowShiftSales\"><span class=\"k\">مبيعات الكاش في الوردية<\/span><span class=\"v\" id=\"viewShiftSales\">٠ ج.م<\/span><\/div>\n        <div class=\"variance-row\"><span class=\"k\">مصروفات الوردية<\/span><span class=\"v neg\" id=\"viewShiftExpenses\">٠ ج.م<\/span><\/div>\n        <div class=\"variance-row\" id=\"rowExpectedCash\"><span class=\"k\">النقدية المتوقعة في الدرج الآن<\/span><span class=\"v\" id=\"viewExpectedCash\">٠ ج.م<\/span><\/div>\n      <\/div>\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn-outline\" id=\"cancelCloseShiftBtn\">إلغاء<\/button>\n        <button type=\"button\" class=\"btn-gold\" id=\"confirmCloseShiftBtn\">إغلاق الوردية<\/button>\n      <\/div>\n    <\/div>\n\n  <\/div>\n<\/div>\n\n<!-- Expenses Modal -->\n<div class=\"modal-overlay\" id=\"expenseModalOverlay\">\n  <div class=\"modal\">\n    <button type=\"button\" class=\"close-x\" id=\"expenseModalClose\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg><\/button>\n    <h2>المصروفات<\/h2>\n    <div class=\"sub-note\">أي مبلغ يتم تسجيله هنا يُخصم فورًا من النقدية المتوقعة في درج الوردية الحالية<\/div>\n\n    <div id=\"expenseNoShiftNote\" class=\"field-box\" style=\"display:none; text-align:center; color:var(--danger);\">\n      لازم تفتح وردية الأول عشان تقدر تسجل مصروف\n    <\/div>\n\n    <div id=\"expenseFormBox\">\n      <div class=\"field-box\">\n        <label>التصنيف<\/label>\n        <select class=\"admin-select\" id=\"expenseCategorySelect\"><\/select>\n      <\/div>\n      <div class=\"field-box\">\n        <label>المبلغ (ج.م)<\/label>\n        <input type=\"number\" id=\"expenseAmountInput\" placeholder=\"0\" inputmode=\"decimal\">\n      <\/div>\n      <div class=\"field-box\">\n        <label>ملاحظة (اختياري)<\/label>\n        <input type=\"text\" id=\"expenseNoteInput\" placeholder=\"مثال: شراء منظفات\">\n      <\/div>\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn-gold\" id=\"confirmAddExpenseBtn\" style=\"flex:1;\">تسجيل المصروف<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"subhead\" style=\"margin:16px 2px 8px;\">مصروفات الوردية الحالية<\/div>\n    <div id=\"currentShiftExpensesList\" style=\"margin-bottom:8px;\"><\/div>\n    <div class=\"variance-row\"><span class=\"k\">إجمالي مصروفات الوردية<\/span><span class=\"v neg\" id=\"currentShiftExpensesTotal\">0 ج.م<\/span><\/div>\n  <\/div>\n<\/div>\n\n<!-- Admin Login / Edit Prices Modal -->\n<div class=\"modal-overlay\" id=\"adminModalOverlay\">\n  <div class=\"modal\">\n    <button type=\"button\" class=\"close-x\" id=\"adminModalClose\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg><\/button>\n    <h2>لوحة الإعدادات<\/h2>\n    <div class=\"sub-note\">أدخلي كلمة المرور لإدارة المنيو والصالات والحسابات وإعدادات النظام.<\/div>\n    \n    <div id=\"adminLoginBox\" style=\"margin-bottom:15px;\">\n      <div class=\"discount-box\" style=\"width:100%; margin-bottom:10px;\">\n        <label>كلمة المرور:<\/label>\n        <input type=\"password\" id=\"adminPasswordInput\" placeholder=\"أدخل كلمة المرور\" style=\"width:150px;\">\n      <\/div>\n      <button type=\"button\" class=\"btn-gold\" id=\"adminLoginBtn\" style=\"width:100%; padding:10px; border-radius:8px; border:none; font-weight:800; cursor:pointer;\">تسجيل الدخول<\/button>\n    <\/div>\n\n    <div id=\"adminEditBox\" style=\"display:none;\">\n      <div class=\"sub-note\" style=\"color:var(--gold-bright);\">تم تسجيل الدخول بنجاح. أي تغيير في السعر يحفظ تلقائياً:<\/div>\n\n      <div class=\"report-tabs admin-tabs\" role=\"tablist\" aria-label=\"أقسام لوحة الإعدادات\">\n        <button type=\"button\" class=\"report-tab active\" data-admin-tab=\"menu\" role=\"tab\" aria-selected=\"true\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 10h18M9 5v14\"/><\/svg> المنيو<\/button>\n        <button type=\"button\" class=\"report-tab\" data-admin-tab=\"halls\" role=\"tab\" aria-selected=\"false\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 10h18M9 5v14\"/><\/svg> الصالات<\/button>\n        <button type=\"button\" class=\"report-tab\" data-admin-tab=\"accounts\" role=\"tab\" aria-selected=\"false\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7\"/><\/svg> حسابات وصلاحيات<\/button>\n        <button type=\"button\" class=\"report-tab\" data-admin-tab=\"settings\" role=\"tab\" aria-selected=\"false\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8\"/><circle cx=\"12\" cy=\"12\" r=\"7\"/><\/svg> إعدادات<\/button>\n        <button type=\"button\" class=\"report-tab\" data-admin-tab=\"check\" role=\"tab\" aria-selected=\"false\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 3h12v18l-3-2-3 2-3-2-3 2z\"/><path d=\"M9 8h6M9 12h6\"/><\/svg> إعدادات الشيك<\/button>\n      <\/div>\n\n      <section class=\"admin-tab-panel\" data-admin-panel=\"menu\" role=\"tabpanel\">\n      <div class=\"subhead\" style=\"margin:4px 2px 8px;\">إضافة صنف جديد للمنيو<\/div>\n      <div class=\"field-box\">\n        <label>القسم<\/label>\n        <select class=\"admin-select\" id=\"newItemCat\"><\/select>\n      <\/div>\n      <div class=\"field-box\">\n        <label>المجموعة الفرعية (اختياري — سيبها فاضية لو مش عارف)<\/label>\n        <select class=\"admin-select\" id=\"newItemGroup\">\n          <option value=\"\">اختاري مجموعة فرعية (اختياري)<\/option>\n        <\/select>\n        <input type=\"text\" id=\"newItemCustomGroup\" placeholder=\"اكتبي اسم المجموعة الجديدة\" style=\"display:none; margin-top:8px;\">\n      <\/div>\n      <div class=\"field-box\">\n        <label>اسم الصنف<\/label>\n        <input type=\"text\" id=\"newItemName\" placeholder=\"اسم المشروب أو الصنف\">\n      <\/div>\n      <div class=\"field-box\">\n        <label>السعر (ج.م)<\/label>\n        <input type=\"number\" id=\"newItemPrice\" placeholder=\"0\">\n      <\/div>\n      <div class=\"field-box\">\n        <label>الباركود (اختياري — امسح الباركود بالقارئ هنا)<\/label>\n        <input type=\"text\" id=\"newItemBarcode\" placeholder=\"باركود الصنف\">\n      <\/div>\n      <div class=\"field-box\">\n        <label>صورة الصنف (اختياري)<\/label>\n        <div class=\"img-upload-row\">\n          <img id=\"newItemImgPreview\" class=\"img-upload-preview\" style=\"display:none;\">\n          <label for=\"newItemImgInput\" class=\"img-upload-btn\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h3l2-3h6l2 3h3v12H4z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/><\/svg> اختر صورة<\/label>\n          <input type=\"file\" id=\"newItemImgInput\" accept=\"image/*\" style=\"display:none;\">\n          <button type=\"button\" id=\"newItemImgClear\" class=\"img-upload-clear\" style=\"display:none;\">إزالة<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:18px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"addNewItemBtn\" style=\"flex:1;\">إضافة الصنف للمنيو<\/button>\n      <\/div>\n\n      <div class=\"subhead\" style=\"margin:4px 2px 8px;\">الأصناف الحالية (تعديل السعر أو الصورة أو حذف)<\/div>\n      <input type=\"text\" id=\"adminItemsSearch\" class=\"search-input\" placeholder=\" ابحث عن صنف بالاسم...\" style=\"margin-bottom:10px;\">\n      <div class=\"admin-items-list\" id=\"adminItemsList\"><\/div>\n      <input type=\"file\" id=\"adminItemImgInput\" accept=\"image/*\" style=\"display:none;\">\n      <\/section>\n\n      <section class=\"admin-tab-panel\" data-admin-panel=\"halls\" role=\"tabpanel\" hidden>\n      <div class=\"subhead\" style=\"margin:18px 2px 10px;\">إدارة الصالات والترابيزات<\/div>\n      <div class=\"sub-note\" style=\"margin-bottom:10px;\">أضيفي صالة جديدة، احذفي صالة، زوّدي أو قلّلي عدد الترابيزات، أو غيّري اسم أي ترابيزة.<\/div>\n      <div class=\"field-box\">\n        <label>إضافة صالة جديدة<\/label>\n        <div style=\"display:flex; gap:8px;\">\n          <input type=\"text\" id=\"newHallName\" placeholder=\"اسم الصالة (مثال: صالة أ)\" style=\"flex:2;\">\n          <input type=\"number\" id=\"newHallTables\" placeholder=\"عدد الترابيزات\" min=\"1\" value=\"5\" style=\"flex:1;\">\n        <\/div>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:14px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"addHallBtn\" style=\"flex:1;\">إضافة الصالة<\/button>\n      <\/div>\n      <div class=\"admin-items-list\" id=\"adminHallsList\"><\/div>\n\n      <div class=\"field-box\" style=\"margin-top:14px;\">\n        <label>تغيير اسم ترابيزة معينة (سيبي الاسم فاضي للرجوع للاسم الافتراضي)<\/label>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n          <select class=\"admin-select\" id=\"renameTableHallSel\" style=\"flex:1; min-width:110px;\"><\/select>\n          <select class=\"admin-select\" id=\"renameTableNumSel\" style=\"flex:1; min-width:90px;\"><\/select>\n          <input type=\"text\" id=\"renameTableInput\" placeholder=\"اسم جديد للترابيزة\" style=\"flex:2; min-width:160px;\">\n        <\/div>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:18px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"renameTableBtn\" style=\"flex:1;\">حفظ اسم الترابيزة<\/button>\n      <\/div>\n      <\/section>\n\n      <section class=\"admin-tab-panel\" data-admin-panel=\"menu\" role=\"tabpanel\">\n      <div class=\"subhead\" style=\"margin:18px 2px 10px;\">إدارة أقسام ومجموعات المنيو<\/div>\n      <div class=\"sub-note\" style=\"margin-bottom:10px;\">غيّري اسم أي قسم (زي \"مشروبات ساخنة\")، احذفيه، أو أضيفي قسم جديد. وكمان تقدري تغيّري اسم أي مجموعة فرعية داخل القسم أو تحذفيها.<\/div>\n      <div class=\"field-box\">\n        <label>إضافة قسم جديد للمنيو<\/label>\n        <div style=\"display:flex; gap:8px;\">\n          <button type=\"button\" id=\"newCatEmoji\" class=\"bn-ic-btn\" data-icon=\"ic:plate\" title=\"اضغط لاختيار أيقونة\"><svg class=\"bn-ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><\/svg><\/button>\n          <input type=\"text\" id=\"newCatName\" placeholder=\"اسم القسم (مثال: حلويات)\" style=\"flex:1;\">\n        <\/div>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:14px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"addCatBtn\" style=\"flex:1;\">إضافة القسم<\/button>\n      <\/div>\n      <div class=\"admin-items-list\" id=\"adminCatsList\"><\/div>\n      <\/section>\n\n      <section class=\"admin-tab-panel\" data-admin-panel=\"settings\" role=\"tabpanel\" hidden>\n      <div class=\"subhead\" style=\"margin:18px 2px 10px;\">درج الكاشير (فتح تلقائي عند التحصيل)<\/div>\n      <div class=\"sub-note\" style=\"margin-bottom:10px;\">درج الكاشير عندك متوصل بكابل مباشر في طابعة الفواتير (زي XP-80)، والطابعة هي اللي بتبعت إشارة الفتح للدرج. نفس اسم الطابعة ده بيتم استخدامه كمان لطباعة الإيصالات والبونات مباشرة وبصمت من غير ما يظهر أي مربع حوار طباعة. اكتبي هنا اسم الطابعة بالظبط زي ما هو مسجل في ويندوز (لوحة التحكم  الطابعات والماسحات الضوئية). عادةً بيبقى اسمها \"XP-80\" أو حاجة قريبة منها.<\/div>\n      <div class=\"field-box\">\n        <label>اسم الطابعة كما هو مسجل في ويندوز<\/label>\n        <input type=\"text\" id=\"drawerPrinterInput\" placeholder=\"مثال: XP-80\">\n      <\/div>\n      <label class=\"toggle-row\" style=\"display:flex; align-items:center; gap:8px; margin:6px 2px 12px; cursor:pointer;\">\n        <input type=\"checkbox\" id=\"drawerAutoOpenChk\" checked style=\"width:18px; height:18px;\">\n        <span class=\"sub-note\" style=\"margin:0;\">افتحي الدرج تلقائياً مع كل عملية تحصيل<\/span>\n      <\/label>\n      <div class=\"modal-actions\" style=\"margin-bottom:18px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"saveDrawerSettingsBtn\" style=\"flex:1;\">حفظ إعدادات الدرج<\/button>\n        <button type=\"button\" class=\"btn-outline\" id=\"testDrawerBtn\">تجربة فتح الدرج الآن<\/button>\n      <\/div>\n\n      <div class=\"subhead\" style=\"margin:18px 2px 10px;\">أزرار شاشة الكاشير<\/div>\n      <div class=\"sub-note\" style=\"margin-bottom:10px;\">تقدري تخفي زر \"تحصيل إنستا باي وإغلاق الشيك\" من شاشة البيع لو مش بتستخدميه، وتظهريه تاني وقت ما تحتاجيه.<\/div>\n      <label class=\"toggle-row\" style=\"display:flex; align-items:center; gap:8px; margin:6px 2px 18px; cursor:pointer;\">\n        <input type=\"checkbox\" id=\"showInstapayBtnChk\" checked style=\"width:18px; height:18px;\">\n        <span class=\"sub-note\" style=\"margin:0;\">إظهار زر تحصيل إنستا باي وإغلاق الشيك<\/span>\n      <\/label>\n\n      <div class=\"subhead\" style=\"margin:18px 2px 10px;\">مبالغ الوردية<\/div>\n      <div class=\"sub-note\" style=\"margin-bottom:10px;\">لما تكون مخفية، زر الوردية بيظهر «مفتوحة» أو «مغلقة» بس، وبتتشال «مبيعات الكاش في الوردية» و«النقدية المتوقعة في الدرج الآن» من شاشة الوردية.<\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:18px;\">\n        <button type=\"button\" class=\"btn-outline\" id=\"toggleShiftAmountsBtn\" style=\"flex:1;\">إظهار مبالغ الوردية<\/button>\n      <\/div>\n      <\/section>\n\n      <section class=\"admin-tab-panel\" data-admin-panel=\"check\" role=\"tabpanel\" hidden>\n        <div class=\"subhead\" style=\"margin:18px 2px 10px;\">بيانات المنشأة على الإيصال<\/div>\n        <div class=\"chk-grid\">\n          <div class=\"field-box\"><label>اسم المنشأة<\/label><input type=\"text\" id=\"chkBusinessName\"><\/div>\n          <div class=\"field-box\"><label>رقم التليفون<\/label><input type=\"text\" id=\"chkPhone\"><\/div>\n        <\/div>\n        <div class=\"field-box\"><label>العنوان<\/label><input type=\"text\" id=\"chkAddress\"><\/div>\n        <div class=\"field-box\"><label>رسالة أسفل الإيصال<\/label><input type=\"text\" id=\"chkFooter\"><\/div>\n\n        <div class=\"subhead\" style=\"margin:18px 2px 10px;\">لغة الإيصال المطبوع<\/div>\n        <div class=\"field-box\"><label>لغة الإيصال<\/label>\n          <select id=\"chkReceiptLang\">\n            <option value=\"ar\">عربي<\/option>\n            <option value=\"en\">English<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field-box\"><label>رسالة أسفل الإيصال بالإنجليزي<\/label><input type=\"text\" id=\"chkFooterEn\"><\/div>\n\n        <div class=\"subhead\" style=\"margin:18px 2px 10px;\">إنستا باي<\/div>\n        <div class=\"field-box\"><label>رقم إنستا باي الظاهر على الإيصال<\/label><input type=\"text\" id=\"chkInstapayNumber\" inputmode=\"tel\" placeholder=\"01xxxxxxxxx\"><\/div>\n        <label class=\"toggle-row\" style=\"display:flex; align-items:center; gap:8px; margin:6px 2px 12px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"chkShowInstapayOnReceipt\" style=\"width:18px; height:18px;\"><span class=\"sub-note\" style=\"margin:0;\">إظهار رقم إنستا باي على الإيصال<\/span>\n        <\/label>\n\n        <div class=\"subhead\" style=\"margin:18px 2px 10px;\">الضريبة<\/div>\n        <label class=\"toggle-row\" style=\"display:flex; align-items:center; gap:8px; margin:6px 2px 12px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"chkTaxEnabled\" style=\"width:18px; height:18px;\"><span class=\"sub-note\" style=\"margin:0;\">تفعيل الضريبة على الشيكات<\/span>\n        <\/label>\n        <div class=\"chk-grid\">\n          <div class=\"field-box\"><label>نسبة الضريبة %<\/label><input type=\"number\" id=\"chkTaxRate\" min=\"0\" max=\"100\" step=\"0.01\"><\/div>\n          <div class=\"field-box\"><label>طريقة الحساب<\/label>\n            <select class=\"admin-select\" id=\"chkTaxMode\">\n              <option value=\"exclusive\">الضريبة تُضاف فوق الأسعار (الإجمالي يزيد)<\/option>\n              <option value=\"inclusive\">الأسعار شاملة الضريبة (الإجمالي لا يتغير)<\/option>\n            <\/select>\n          <\/div>\n        <\/div>\n        <div class=\"sub-note\" id=\"chkTaxHint\" style=\"margin:0 2px 10px;\"><\/div>\n        <label class=\"toggle-row\" style=\"display:flex; align-items:center; gap:8px; margin:6px 2px 12px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"chkTaxLabel\" style=\"width:18px; height:18px;\"><span class=\"sub-note\" style=\"margin:0;\">إظهار كلمة \"شامل الضريبة\" على الإيصال<\/span>\n        <\/label>\n        <div class=\"field-box\"><label>رقم التسجيل الضريبي<\/label><input type=\"text\" id=\"chkTaxNumber\" inputmode=\"numeric\"><\/div>\n\n        <div class=\"subhead\" style=\"margin:18px 2px 10px;\">الفاتورة الإلكترونية (ترقيم وتصدير)<\/div>\n        <div class=\"sub-note\" style=\"margin-bottom:10px;\">ده بيرقّم الفواتير تسلسلياً ويطبع رقم الفاتورة والرقم الضريبي ويصدّر الفواتير لملف CSV للمحاسب. الإرسال المباشر لمصلحة الضرائب (ETA) غير مفعّل ويحتاج ربط منفصل.<\/div>\n        <label class=\"toggle-row\" style=\"display:flex; align-items:center; gap:8px; margin:6px 2px 12px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"chkInvNumbering\" style=\"width:18px; height:18px;\"><span class=\"sub-note\" style=\"margin:0;\">ترقيم الفواتير تسلسلياً وإظهار الرقم على الإيصال<\/span>\n        <\/label>\n        <div class=\"chk-grid\">\n          <div class=\"field-box\"><label>بادئة رقم الفاتورة<\/label><input type=\"text\" id=\"chkInvPrefix\"><\/div>\n          <div class=\"field-box\"><label>رقم الفاتورة القادم<\/label><input type=\"number\" id=\"chkInvNext\" min=\"1\"><\/div>\n        <\/div>\n        <div class=\"modal-actions\" style=\"margin-bottom:6px;\"><button type=\"button\" class=\"btn-outline\" id=\"chkExportInvoicesBtn\">تصدير فواتير اليوم (CSV)<\/button><\/div>\n\n        <div class=\"subhead\" style=\"margin:18px 2px 10px;\">الدليفري<\/div>\n        <label class=\"toggle-row\" style=\"display:flex; align-items:center; gap:8px; margin:6px 2px 12px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"chkDeliveryEnabled\" style=\"width:18px; height:18px;\"><span class=\"sub-note\" style=\"margin:0;\">تفعيل الدليفري كنوع طلب<\/span>\n        <\/label>\n        <div class=\"field-box\"><label>رسوم التوصيل الافتراضية (ج.م)<\/label><input type=\"number\" id=\"chkDeliveryFee\" min=\"0\"><\/div>\n\n        <div class=\"subhead\" style=\"margin:18px 2px 10px;\">النقاط والولاء<\/div>\n        <label class=\"toggle-row\" style=\"display:flex; align-items:center; gap:8px; margin:6px 2px 12px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"chkLoyaltyEnabled\" style=\"width:18px; height:18px;\"><span class=\"sub-note\" style=\"margin:0;\">تفعيل نقاط الولاء<\/span>\n        <\/label>\n        <div class=\"chk-grid\">\n          <div class=\"field-box\"><label>كل كم جنيه = نقطة؟<\/label><input type=\"number\" id=\"chkEarnEgp\" min=\"1\"><\/div>\n          <div class=\"field-box\"><label>قيمة النقطة عند الاستبدال (ج.م)<\/label><input type=\"number\" id=\"chkPointValue\" min=\"0\" step=\"0.05\"><\/div>\n        <\/div>\n        <label class=\"toggle-row\" style=\"display:flex; align-items:center; gap:8px; margin:6px 2px 12px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"chkShowPoints\" style=\"width:18px; height:18px;\"><span class=\"sub-note\" style=\"margin:0;\">إظهار سطر \"اكتسبت ... نقطة\" على الإيصال<\/span>\n        <\/label>\n        <div class=\"modal-actions\" style=\"margin:12px 0 18px;\"><button type=\"button\" class=\"btn-gold\" id=\"chkSaveBtn\" style=\"flex:1;\">حفظ إعدادات الشيك<\/button><\/div>\n      <\/section>\n\n      <section class=\"admin-tab-panel\" data-admin-panel=\"customers\" role=\"tabpanel\" hidden>\n        <div class=\"subhead\" style=\"margin:18px 2px 10px;\">العملاء <small id=\"custCount\" style=\"color:var(--muted)\"><\/small><\/div>\n        <div style=\"display:flex; gap:8px; margin-bottom:10px;\">\n          <input type=\"text\" id=\"custSearch\" class=\"search-input\" placeholder=\" ابحث بالاسم أو الموبايل...\" style=\"flex:1;\">\n          <button type=\"button\" class=\"btn-gold\" id=\"custAddBtn\">+ عميل<\/button>\n        <\/div>\n        <div id=\"custForm\" hidden style=\"margin-bottom:14px;\">\n          <div class=\"chk-grid\">\n            <div class=\"field-box\"><label>الاسم<\/label><input type=\"text\" id=\"custName\"><\/div>\n            <div class=\"field-box\"><label>الموبايل<\/label><input type=\"text\" id=\"custPhone\" inputmode=\"tel\"><\/div>\n          <\/div>\n          <div class=\"field-box\"><label>العنوان<\/label><input type=\"text\" id=\"custAddress\"><\/div>\n          <div class=\"field-box\"><label>رصيد النقاط<\/label><input type=\"number\" id=\"custPoints\" min=\"0\"><\/div>\n          <div class=\"modal-actions\"><button type=\"button\" class=\"btn-gold\" id=\"custSaveBtn\" style=\"flex:1;\">حفظ<\/button><button type=\"button\" class=\"btn-outline\" id=\"custCancelBtn\">إلغاء<\/button><\/div>\n        <\/div>\n        <div class=\"admin-items-list\" id=\"custList\"><\/div>\n      <\/section>\n\n      <section class=\"admin-tab-panel\" data-admin-panel=\"accounts\" role=\"tabpanel\" hidden>\n      <div class=\"subhead\" style=\"margin:18px 2px 10px;\">حسابات الكاشير<\/div>\n      <div class=\"sub-note\" style=\"margin-bottom:10px;\">إضافة أو حذف حسابات دخول الكاشيرات. الحساب الافتراضي الأول (admin / admin) اتعمل تلقائي عشان تقدر تدخلي أول مرة — يفضل تغيّري كلمة سره أو تعملي حساب جديد وتمسحيه.<\/div>\n      <div class=\"field-box\">\n        <label>اسم الكاشير<\/label>\n        <input type=\"text\" id=\"adminNewCashierName\" placeholder=\"الاسم اللي هيظهر في الشيفتات\">\n      <\/div>\n      <div style=\"display:flex; gap:8px;\">\n        <div class=\"field-box\" style=\"flex:1;\">\n          <label>اسم المستخدم<\/label>\n          <input type=\"text\" id=\"adminNewCashierUsername\" placeholder=\"اسم مستخدم\">\n        <\/div>\n        <div class=\"field-box\" style=\"flex:1;\">\n          <label>كلمة المرور<\/label>\n          <input type=\"password\" id=\"adminNewCashierPassword\" placeholder=\"كلمة مرور\">\n        <\/div>\n      <\/div>\n      <div class=\"sub-note\" style=\"margin:6px 2px 4px; font-weight:700;\">الصلاحيات (اختاري اللي هيقدر الكاشير ده يفتحه):<\/div>\n      <div style=\"display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px;\">\n        <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"adminNewCashierPermOwner\" style=\"width:18px; height:18px;\">\n          <span class=\"sub-note\" style=\"margin:0;\">خصم الأونر (Owner Discount)<\/span>\n        <\/label>\n        <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"adminNewCashierPermCashDiscount\" style=\"width:18px; height:18px;\">\n          <span class=\"sub-note\" style=\"margin:0;\">خصم الكاش (Discount EGP)<\/span>\n        <\/label>\n        <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"adminNewCashierPermExpenses\" style=\"width:18px; height:18px;\">\n          <span class=\"sub-note\" style=\"margin:0;\">المصروفات (Expenses)<\/span>\n        <\/label>\n        <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer;\">\n          <input type=\"checkbox\" id=\"adminNewCashierPermSales\" style=\"width:18px; height:18px;\">\n          <span class=\"sub-note\" style=\"margin:0;\">المبيعات (Sales)<\/span>\n        <\/label>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:14px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"adminAddCashierBtn\" style=\"flex:1;\">إضافة حساب كاشير<\/button>\n      <\/div>\n      <div class=\"admin-items-list\" id=\"adminCashierAccountsList\"><\/div>\n      <\/section>\n\n      <section class=\"admin-tab-panel\" data-admin-panel=\"settings\" role=\"tabpanel\" hidden>\n      <div class=\"subhead\" style=\"margin:18px 2px 10px;\">الأمان وكلمات المرور<\/div>\n      <div class=\"sub-note\" style=\"margin-bottom:10px;\">غيّري كلمات مرور الدخول على لوحة الأدمن، وتأكيد إنقاص الأصناف أو إفراغ الترابيزة، وفتح الخصم للكاشير غير المسموح له.<\/div>\n      <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n        <div class=\"field-box\" style=\"flex:1; min-width:180px;\">\n          <label>كلمة مرور دخول الأدمن الجديدة<\/label>\n          <input type=\"password\" id=\"newAdminPasswordInput\" placeholder=\"كلمة مرور جديدة\">\n        <\/div>\n        <div class=\"field-box\" style=\"flex:1; min-width:180px;\">\n          <label>تأكيد كلمة المرور<\/label>\n          <input type=\"password\" id=\"confirmAdminPasswordInput\" placeholder=\"أعيدي كتابة كلمة المرور\">\n        <\/div>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:16px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"saveAdminPasswordBtn\" style=\"flex:1;\">حفظ كلمة مرور الأدمن<\/button>\n      <\/div>\n      <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n        <div class=\"field-box\" style=\"flex:1; min-width:180px;\">\n          <label>كلمة مرور إنقاص الأصناف / إفراغ الترابيزة الجديدة<\/label>\n          <input type=\"password\" id=\"newDecrementPasswordInput\" placeholder=\"كلمة مرور جديدة\">\n        <\/div>\n        <div class=\"field-box\" style=\"flex:1; min-width:180px;\">\n          <label>تأكيد كلمة المرور<\/label>\n          <input type=\"password\" id=\"confirmDecrementPasswordInput\" placeholder=\"أعيدي كتابة كلمة المرور\">\n        <\/div>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:16px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"saveDecrementPasswordBtn\" style=\"flex:1;\">حفظ كلمة مرور إنقاص الأصناف<\/button>\n      <\/div>\n      <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n        <div class=\"field-box\" style=\"flex:1; min-width:180px;\">\n          <label>كلمة مرور فتح الخصم الجديدة<\/label>\n          <input type=\"password\" id=\"newDiscountPasswordInput\" placeholder=\"كلمة مرور جديدة\">\n        <\/div>\n        <div class=\"field-box\" style=\"flex:1; min-width:180px;\">\n          <label>تأكيد كلمة المرور<\/label>\n          <input type=\"password\" id=\"confirmDiscountPasswordInput\" placeholder=\"أعيدي كتابة كلمة المرور\">\n        <\/div>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:16px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"saveDiscountPasswordBtn\" style=\"flex:1;\">حفظ كلمة مرور الخصم<\/button>\n      <\/div>\n      <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;\">\n        <div class=\"field-box\" style=\"flex:1; min-width:180px;\">\n          <label>كلمة مرور قسم الموظفين الجديدة<\/label>\n          <input type=\"password\" id=\"newStaffPasswordInput\" placeholder=\"كلمة مرور جديدة\">\n        <\/div>\n        <div class=\"field-box\" style=\"flex:1; min-width:180px;\">\n          <label>تأكيد كلمة المرور<\/label>\n          <input type=\"password\" id=\"confirmStaffPasswordInput\" placeholder=\"أعيدي كتابة كلمة المرور\">\n        <\/div>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:16px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"saveStaffPasswordBtn\" style=\"flex:1;\">حفظ كلمة مرور قسم الموظفين<\/button>\n      <\/div>\n\n      <div class=\"subhead\" style=\"margin:18px 2px 10px;\">النسخ الاحتياطي للبيانات<\/div>\n      <div class=\"sub-note\" style=\"margin-bottom:10px;\">نزّل نسخة احتياطية كاملة (كل المبيعات والورديات، حسابات الكاشير وصلاحياتها، المنيو والأسعار، الصالات والترابيزات، المخزون، وكلمات المرور) بشكل دوري كملف، عشان تقدر ترجعها كاملة لو حصل أي مشكلة.<\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:10px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"exportBackupBtn\">تنزيل نسخة احتياطية (ملف)<\/button>\n        <button type=\"button\" class=\"btn-outline\" id=\"importBackupBtn\">استيراد نسخة احتياطية<\/button>\n      <\/div>\n      <input type=\"file\" id=\"importFileInput\" accept=\"application/json\" style=\"display:none;\">\n\n      <div class=\"subhead\" style=\"margin:18px 2px 10px; color:var(--danger);\">منطقة خطر<\/div>\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn-outline\" id=\"wipeAllDataBtn\" style=\"border-color:var(--danger) !important; color:var(--danger);\">مسح كل البيانات المحفوظة نهائياً<\/button>\n      <\/div>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- Inventory Management Modal (نظام جرد المخزون) -->\n<div class=\"modal-overlay\" id=\"inventoryModalOverlay\">\n  <div class=\"modal\" style=\"max-width:560px;\">\n    <button type=\"button\" class=\"close-x\" id=\"inventoryModalClose\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg><\/button>\n    <h2>نظام جرد المخزون<\/h2>\n    <div class=\"sub-note\">تابع رصيد المواد الخام والمنتجات الجاهزة، اربط كل صنف في المنيو بالمواد اللي بتتخصم منه تلقائياً عند البيع، واعمل جرد يومي لمقارنة الفعلي بالمفترض.<\/div>\n\n    <div class=\"report-tabs\">\n      <div class=\"report-tab active\" id=\"invTabItems\">الأصناف والتوريد<\/div>\n      <div class=\"report-tab\" id=\"invTabRecipes\">وصفات الخصم<\/div>\n      <div class=\"report-tab\" id=\"invTabAudit\">الجرد اليومي<\/div>\n      <div class=\"report-tab\" id=\"invTabHistory\">سجل الجرد<\/div>\n    <\/div>\n\n    <!-- Items & Supply pane -->\n    <div class=\"report-pane active\" id=\"invPaneItems\">\n      <div class=\"subhead\" style=\"margin:4px 2px 8px;\">إضافة صنف مخزون جديد<\/div>\n      <div class=\"field-box\">\n        <label>اسم الصنف (مثال: بن، حليب، كنز كوكاكولا)<\/label>\n        <input type=\"text\" id=\"invNewName\" placeholder=\"اسم صنف المخزون\">\n      <\/div>\n      <div class=\"field-box\">\n        <label>وحدة القياس (مثال: جرام، كيلو، مل، لتر، قطعة، كنز)<\/label>\n        <input type=\"text\" id=\"invNewUnit\" placeholder=\"الوحدة\">\n      <\/div>\n      <div class=\"field-box\">\n        <label>رصيد أول المدة (الكمية الحالية الموجودة فعلاً)<\/label>\n        <input type=\"number\" id=\"invNewOpening\" placeholder=\"0\" step=\"any\" inputmode=\"decimal\">\n      <\/div>\n      <div class=\"field-box\">\n        <label>تكلفة الوحدة الواحدة (ج.م) — اختياري، لحساب قيمة العجز في الجرد<\/label>\n        <input type=\"number\" id=\"invNewCost\" placeholder=\"0\" step=\"any\" inputmode=\"decimal\">\n      <\/div>\n      <div class=\"field-box\">\n        <label>الحد الأدنى للتنبيه (اختياري) — لو الرصيد وصله، هيظهرلك تنبيه في موقع المتابعة<\/label>\n        <input type=\"number\" id=\"invNewMinQty\" placeholder=\"0\" step=\"any\" inputmode=\"decimal\">\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:18px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"addInvItemBtn\" style=\"flex:1;\">إضافة الصنف للمخزون<\/button>\n      <\/div>\n\n      <div class=\"subhead\" style=\"margin:4px 2px 8px;\">أصناف المخزون الحالية (توريد بضاعة جديدة)<\/div>\n      <div id=\"invItemsList\"><\/div>\n    <\/div>\n\n    <!-- Recipes pane -->\n    <div class=\"report-pane\" id=\"invPaneRecipes\">\n      <div class=\"sub-note\">اختار صنف من المنيو وحدد المواد الخام اللي بتتخصم من المخزون تلقائياً عند بيعه (مثال: كوباية قهوة  10 جرام بن). لو الصنف جاهز زي الكانز، اربطه مباشرة بصنف مخزون بكمية 1.<\/div>\n      <div class=\"field-box\">\n        <label>اختر صنف من المنيو<\/label>\n        <input type=\"text\" id=\"recipeProductSearch\" class=\"search-input\" placeholder=\" دور على صنف بالاسم...\" style=\"margin-bottom:8px;\">\n        <select class=\"admin-select\" id=\"recipeProductSelect\"><\/select>\n      <\/div>\n      <div class=\"subhead\" style=\"margin:14px 2px 8px;\">المواد الخام المرتبطة بهذا الصنف<\/div>\n      <div id=\"recipeIngredientsList\"><\/div>\n      <div class=\"field-box\" style=\"margin-top:12px;\">\n        <label>إضافة مادة خام للوصفة<\/label>\n        <input type=\"text\" id=\"recipeAddItemSearch\" class=\"search-input\" placeholder=\" دور على مادة خام بالاسم...\" style=\"margin-bottom:8px;\">\n        <div style=\"display:flex; gap:8px;\">\n          <select class=\"admin-select\" id=\"recipeAddItemSelect\" style=\"flex:2;\"><\/select>\n          <input type=\"number\" id=\"recipeAddQty\" placeholder=\"الكمية\" step=\"any\" inputmode=\"decimal\" style=\"flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--gold-bright); padding:9px 10px; font-family:inherit; font-weight:800; text-align:center; outline:none;\">\n        <\/div>\n      <\/div>\n      <div class=\"modal-actions\" style=\"margin-bottom:10px;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"addRecipeIngredientBtn\" style=\"flex:1;\">إضافة/تحديث في الوصفة<\/button>\n      <\/div>\n    <\/div>\n\n    <!-- Daily audit pane -->\n    <div class=\"report-pane\" id=\"invPaneAudit\">\n      <div class=\"sub-note\">اكتب العدد الفعلي الموجود دلوقتي في الثلاجة أو المخزن على أرض الواقع لكل صنف، والسيستم هيقارنه بالمفترض يكون موجود حسب بيانات البيع والتوريد.<\/div>\n      <input type=\"text\" id=\"auditItemsSearch\" class=\"search-input\" placeholder=\" ابحث عن صنف بالاسم...\" style=\"margin-bottom:10px;\">\n      <div id=\"auditItemsList\"><\/div>\n      <div class=\"modal-actions\" style=\"margin:14px 0;\">\n        <button type=\"button\" class=\"btn-gold\" id=\"runAuditBtn\" style=\"flex:1;\">حساب نتيجة الجرد<\/button>\n      <\/div>\n      <div id=\"auditResultBox\" style=\"display:none;\">\n        <div class=\"subhead\" style=\"margin:4px 2px 8px;\">نتيجة الجرد<\/div>\n        <div class=\"stat-row\">\n          <div class=\"stat-box\"><div class=\"v\" id=\"auditMatchCount\">0<\/div><div class=\"l\">أصناف مطابقة<\/div><\/div>\n          <div class=\"stat-box\"><div class=\"v\" id=\"auditDiffCount\">0<\/div><div class=\"l\">أصناف بها فرق<\/div><\/div>\n        <\/div>\n        <div id=\"auditResultDetails\" style=\"margin-top:6px;\"><\/div>\n        <div class=\"field-box\" style=\"margin-top:10px;\">\n          <div class=\"variance-row\"><span class=\"k\">إجمالي قيمة العجز/الفائض<\/span><span class=\"v\" id=\"auditTotalValue\">0 ج.م<\/span><\/div>\n        <\/div>\n        <div class=\"modal-actions\" style=\"margin-top:12px;\">\n          <button type=\"button\" class=\"btn-outline\" id=\"applyAuditBtn\" style=\"flex:1;\">تحديث رصيد المخزون بالعدد الفعلي<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n    <!-- Stocktake history pane (سجل الجرد) — logic in audit-history.js -->\n    <div class=\"report-pane\" id=\"invPaneHistory\">\n      <div class=\"sub-note\">كل جرد اتحفظ (بزرار \"تحديث رصيد المخزون\") بيظهر هنا بتاريخه. اضغط على الي اريستا\">باريستا<\/option>\n          <option value=\"كاشير\">كاشير<\/option>\n          <option value=\"شيف\">شيف<\/option>\n          <option value=\"ويتر\">ويتر<\/option>\n          <option value=\"سيكيورتي\">سيكيورتي<\/option>\n          <option value=\"أخرى\">أخرى<\/option>\n        <\/select>\n      <\/div>\n      <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n        <div class=\"field-box\" style=\"flex:1; min-width:140px;\"><label>رقم الهاتف<\/label><input type=\"text\" id=\"empNewPhone\" placeholder=\"رقم الهاتف\"><\/div>\n        <div class=\"field-box\" style=\"flex:1; min-width:140px;\"><label>الراتب الأساسي<\/label><input type=\"number\" step=\"any\" id=\"empNewSalary\" placeholder=\"0\"><\/div>\n        <div class=\"field-box\" style=\"flex:1; min-width:140px;\"><label>ساعات الشيفت<\/label><input type=\"number\" step=\"any\" id=\"empNewAgreedHours\" value=\"8\"><\/div>\n      <\/div>\n      <div class=\"field-box\"><label>تاريخ البداية<\/label><input type=\"date\" id=\"empNewStartDate\"><\/div>\n      <input type=\"hidden\" id=\"empEditId\" value=\"\">\n      <div class=\"modal-actions\" style=\"margin-bottom:16px;\">\n        <button type=\"button\" class=\"btn-outline\" id=\"cancelEmployeeEditBtn\" style=\"flex:1; display:none;\">إلغاء التعديل<\/button>\n        <button type=\"button\" class=\"btn-gold\" id=\"saveEmployeeBtn\" style=\"flex:1;\">حفظ الموظف<\/button>\n      <\/div>\n      <div class=\"subhead\" style=\"margin:4px 2px 8px;\">قائمة الموظفين<\/div>\n      <div id=\"empListBox\"><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- بوابة كلمة مرور قسم الموظفين -->\n<div class=\"modal-overlay\" id=\"staffPassModalOverlay\">\n  <div class=\"modal\" style=\"max-width:360px; text-align:center;\">\n    <h2>كلمة المرور مطلوبة <svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"/><\/svg><\/h2>\n    <div class=\"sub-note\" style=\"margin- id #eadfca; font-size:11px;}\n#printA4 .a4-kv td:last-child{text-align:end; font-weight:700;}\n#printA4 .a4-kv tr.tot td{background:#f6ecd6; font-weight:900; border-top:2px solid #b07d1e;}\n#printA4 .neg{color:#b3261e;} #printA4 .pos{color:#1b7a3a;}\n#printA4 .a4-chart{display:flex; align-items:flex-end; gap:2px; height:122px; padding:0 4px; border-bottom:1.5px solid #cdbf9f; background:linear-gradient(#eadfca 1px, transparent 1px) 0 0/100% 24px;}\n#printA4 .a4-chart .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%;}\n#printA4 .a4-chart .bar{width:70%; background:#b07d1e; border-radius:2px 2px 0 0;}\n#printA4 .a4-chart .d{font-size:7.5px; color:#6b5a48; margin-top:2px; height:11px; direction:ltr;}\n#printA4 .a4-end{margin-top:26px; break-inside:avoid;}\n#printA4 .a4-sign{display:flex; justify-content:space-around; gap:30px;}\n#printA4 .a4-sign div{flex:1; text-align:center; border-top:1px solid #8a7a66; padding-top:4px; font-size:10.5px; color:#6b5a48; margin-top:34px;}\n#printA4 .a4-endtxt{text-align:center; margin-top:16px; font-weight:800; color:#6b5a48; font-size:11px;}\n<\/style>\n\n\n<script>\n/* ============ INITIAL MENU DATA ============ */\nconst INITIAL_MENU = [\n{cat:\"hot\", label:\"مشروبات ساخنة\", emoji:\"☕\", groups:[\n  {g:\"شاي ومشروبات\", items:[\n    [\"شاي\",25],[\"شاي نكهات\",30],[\"شاي حليب\",45],[\"ليمون سخن\",35],[\"عناب\",35],\n    [\"سحلب\",45],[\"سحلب مكسرات\",65],[\"سحلب فواكه\",70],[\"هوت أوريو\",65],[\"هوت شوكلت\",65],\n    [\"حمص شام\",45],[\"فشار\",15],[\"فشار نكهات\",20],[\"اندومي\",30]\n  ]},\n  {g:\"إسبريسو وقهوة\", items:[\n    [\"اسبريسو سنجل\",45],[\"اسبريسو دابل\",55],[\"اسبريسو أفوجاتو\",75],[\"ريستريتو\",55],\n    [\"ماكياتو سنجل\",55],[\"ماكياتو دبل\",65],[\"ماكياتو نكهات\",70],[\"موكا كراميل\",70],\n    [\"كورتو كافي\",70],[\"فلات وايت\",70],[\"آيس أمريكانو\",70],[\"هوت موكا\",70],\n    [\"كابتشينو\",70],[\"كابتشينو نكهات\",80],[\"لاتية\",70],[\"سبانش لاتية\",80],\n    [\"سبانش لاتية فليفر\",90],[\"نسكافيه جولد\",55],[\"نسكافيه حليب\",65],[\"كوفي باكيت\",40],\n    [\"آيس كوفي\",70],[\"موكا تشينو\",70],[\"قهوة تركي\",25],[\"قهوة دبل\",45],\n    [\"قهوة بن ونوتيلا\",50],[\"قهوة بندق\",60],[\"قهوة بن مخصوص\",45]\n  ]}\n]},\n{cat:\"cold\", label:\"باردة ومشروبات غازية\", emoji:\"🧊\", groups:[\n  {g:\"مشروبات باردة\", items:[\n    [\"بلو باشون\",70],[\"بلو سكاي\",75],[\"صن رايز\",75],[\"صودا مينت\",70],[\"شيري كولا\",65],\n    [\"كوكاكولا فانيليا\",70],[\"إلكتريك بيري\",75],[\"إلكتريك صودا\",70],[\"موهيتو سفن\",65],\n    [\"موهيتو فليفر\",75],[\"موهيتو ريد بول\",120],[\"موهيتو ريد بول كيوي\",140],\n    [\"موهيتو مانجو\",85],[\"موهيتو هيد (اسبريسو + ريد بول)\",140],[\"صودا فواكه\",120]\n  ]},\n  {g:\"مشروبات غازية\", items:[\n    [\"كانز ساقع\",35],[\"ريد بول\",85],[\"فيروز\",40],[\"بريل\",45],[\"شوبيس\",40],\n    [\"تويست\",40],[\"سفن أب\",40],[\"ستينج\",40],[\"مياه معدنية\",10],[\"تلج\",5]\n  ]}\n]},\n{cat:\"juice\", label:\"عصائر وكوكتيل وسموذي\", emoji:\"🍹\", groups:[\n  {g:\"فرش وكوكتيل\", items:[\n    [\"كوكتيل فواكه\",120],[\"كوكتيل سوبيت\",95],[\"كوكتيل آيس\",110],[\"كوكتيل آيس فواكه\",110],\n    [\"مانجو\",75],[\"مانجو كيوي\",95],[\"جوافة\",75],[\"فراولة\",75],[\"موز\",75],\n    [\"ليمون نعناع\",70],[\"خوخ\",75],[\"أناناس\",75],[\"كيوي\",85],[\"كيوي نعناع\",90],\n    [\"كيوي بالحليب\",90],[\"بطيخ\",75],[\"بطيخ نعناع\",80],[\"أفوكادو\",110],\n    [\"أفوكادو بالمكسرات\",130],[\"برتقال\",75],[\"بلح\",75],[\"إضافة حليب\",20]\n  ]},\n  {g:\"سموذي\", items:[[\"سموذي نكهة واحدة\",65],[\"سموذي أكثر من نكهة\",75]]},\n  {g:\"إضافات وزيادي\", items:[\n    [\"زيادي فراولة\",65],[\"زيادي عسل\",65],[\"زيادي مانجو\",65],[\"زيادي خلاط\",65],\n    [\"زيادي موز\",65],[\"زيادي بلو بيري\",70],[\"زيادي باشن فروت\",85],[\"كوكتيل زيادي فواكه\",90]\n  ]}\n]},\n{cat:\"shakes\", label:\"ميلك شيك وفرابيه ومثلجات\", emoji:\"🥤\", groups:[\n  {g:\"ميلك شيك\", items:[\n    [\"ميلك شيك فواكه (فراولة/مانجو/بطيخ/خوخ)\",80],\n    [\"ميلك شيك كلاسيك (فانيليا/شوكولاتة/كراميل/موكا/بلوبيري/أوريو/لوتس/فستق)\",80],\n    [\"ميلك شيك سبيشيال (مولتن كيك/تشيز كيك)\",100],\n    [\"إضافة صوص\",15]\n  ]},\n  {g:\"فرابيه\", items:[\n    [\"فرابيه فانيليا\",75],[\"فرابيه شوكولاتة\",75],[\"فرابيه نوتيلا\",75],\n    [\"فرابيه نوتيلا أوريو\",85],[\"فرابيه فستق\",75],[\"فرابيه لوتس\",75],\n    [\"فرابيه موز\",75],[\"فرابيه إسبريسو\",75]\n  ]},\n  {g:\"آيس كريم\", items:[\n    [\"آيس كريم كلاسيك\",75],[\"آيس كريم شوكولاتة بار\",85],[\"آيس كريم شوكولاتة لوفرز\",85],\n    [\"فروت سالاد بالآيس\",95],[\"تروبيكال فروت سالاد بالآيس\",95],[\"سيبشيال آيس\",95],\n    [\"بولة آيس كريم إضافية\",30],[\"2 بولة آيس كريم إضافية\",60]\n  ]},\n  {g:\"بوبا ومادنس\", items:[\n    [\"بوبا (تشوز فلايفر)\",130],\n    [\"أوريو مادنس\",85],[\"بلو بيري مادنس\",85],[\"أوريو كيك مادنس\",90],[\"تشيز مادنس\",85],\n    [\"براونيز مادنس\",90],[\"بانا كيك مادنس\",90],[\"تروبيكال مادنس\",85],\n    [\"سنيكرز مادنس\",90],[\"لوتس مادنس\",95]\n  ]}\n]},\n{cat:\"dessert\", label:\"حلويات ووافل وكريب\", emoji:\"🍰\", groups:[\n  {g:\"ديزرت الحلو\", items:[\n    [\"شوكولاتة كيك سادة\",75],[\"مولتن كيك سادة\",85],[\"مولتن نوتيلا\",95],\n    [\"براونيز سادة\",70],[\"براونيز أوريو\",85],[\"ديسباسيتو\",90],[\"كاب كيك\",55],\n    [\"سويس رول\",90],[\"ريد فيلفيت\",75],[\"ميني تورتة\",150],[\"تشيز كيك سادة\",70],\n    [\"إضافة صوص\",15]\n  ]},\n  {g:\"وافل\", items:[\n    [\"وافل سادة\",60],[\"وافل فواكه\",85],[\"وافل آيس كريم\",90],[\"طاجن وافل مكس\",100],[\"إضافة صوص\",15]\n  ]},\n  {g:\"سينابون\", items:[\n    [\"سينابون طعم واحد (كراميل/شوكولاتة/نوتيلا/لوتس)\",85],[\"سينابون سنيكرز\",95],\n    [\"سينابون مكسرات\",95],[\"سينابون فستق\",95],[\"سينابون مكس\",110]\n  ]},\n  {g:\"كريب\", items:[\n    [\"كريب طعم واحد (لوتس/نوتيلا)\",70],[\"كريب (فستق/أوريو/هوهوز)\",85],\n    [\"كريب أوريو نوتيلا\",90],[\"كريب سنيكرز\",95],[\"كريب براونيز\",95],\n    [\"كريب فواكه\",95],[\"كريب مكس\",110]\n  ]},\n  {g:\"بان كيك\", items:[\n    [\"بان كيك (عسل/لوتس/نوتيلا/أوريو)\",70],[\"بان كيك فستق\",80],\n    [\"بان كيك فواكه\",85],[\"بان كيك مكس (شوكولاتة/تروبيكال)\",110],[\"إضافة صوص\",15]\n  ]}\n]},\n{cat:\"food\", label:\"سندوتشات وبرجر\", emoji:\"🍔\", groups:[\n  {g:\"ركن سندوتش\", items:[[\"ساندوتش بانية\",45],[\"ساندوتش استريس\",50]]},\n  {g:\"البطاطس\", items:[\n    [\"بطاطس سادة\",20],[\"بطاطس شيدر\",30],[\"بطاطس كيري\",30],[\"بطاطس رومي\",30],\n    [\"بطاطس بيف\",45],[\"بطاطس صوص\",30]\n  ]},\n  {g:\"ركن البرجر\", items:[\n    [\"برجر بيض\",75],[\"كلاسيك برجر\",60],[\"برجر إيكو\",70],[\"برجر تشيز\",80]\n  ]},\n  {g:\"رغيف سوري\", items:[[\"رغيف بانية\",55],[\"رغيف استريس\",60],[\"بطاطس رغيف\",35]]},\n  {g:\"وجبات\", items:[[\"وجبة (صوص + قطع استريس + بطاطس)\",80]]},\n  {g:\"بيض وجبنة\", items:[\n    [\"بيض مقلي\",25],[\"بيض مسلوق\",20],[\"جبنة بيضا\",20],[\"بيض برجر\",40],\n    [\"جبنة رومي\",20],[\"حلاوة\",20]\n  ]}\n]},\n{cat:\"shisha\", label:\"الشيشة\", emoji:\"🌫️\", groups:[\n  {g:\"الشيشة\", items:[\n    [\"شيشة معسل\",15],[\"ليّ طبي\",15],[\"شيشة فواكه\",80],[\"شيشة مكس\",95],\n    [\"شيشة إسكندراني\",50],[\"الولعة الثالثة\",15]\n  ]}\n]}\n];\n\n// المنيو الافتراضي: بيتحفظ نسخة منه مرة واحدة، مع الاحتفاظ بأي تعديلات لاحقة من الأدمن.\nconst MENU_VERSION = '3';\nif(localStorage.getItem('beans_menu_version') !== MENU_VERSION){\n  const savedMenu = JSON.parse(localStorage.getItem('beans_menu') || 'null');\n  localStorage.setItem('beans_menu', JSON.stringify(savedMenu || INITIAL_MENU));\n  localStorage.setItem('beans_menu_version', MENU_VERSION);\n}\nlet MENU = JSON.parse(localStorage.getItem('beans_menu')) || INITIAL_MENU;\n\n/* ============ STATE ============ */\nlet activeCat = MENU[0].cat;\n/* ============ HALLS & TABLES (ديناميكي - قابل للتعديل من الأدمن) ============ */\nconst HALLS_STORAGE_KEY = 'beans_halls';\nfunction defaultHalls(){\n  return [\n    {id:'A', name:'صالة أ', tableCount:5},\n    {id:'B', name:'صالة ب', tableCount:15}\n  ];\n}\nlet HALLS = defaultHalls();\nfunction saveHalls(){\n  try{ localStorage.setItem(HALLS_STORAGE_KEY, JSON.stringify(HALLS)); }\n  catch(e){ console.error('Failed to save hall data', e); }\n  try{ cloudSync('syncTables', HALLS, tablesCarts); }catch(e){}\n}\nfunction loadHalls(){\n  try{\n    const raw = localStorage.getItem(HALLS_STORAGE_KEY);\n    if(raw){\n      const parsed = JSON.parse(raw);\n      if(Array.isArray(parsed) && parsed.length>0) {\n        HALLS = parsed.map(h => ({...h, name: h.name === 'Hall A' ? 'صالة أ' : h.name === 'Hall B' ? 'صالة ب' : h.name}));\n        saveHalls();\n      }\n    } else {\n      saveHalls();\n    }\n  }catch(e){ console.error('Failed to load hall data', e); }\n}\nfunction getHall(id){ return HALLS.find(h=>h.id===id) || HALLS[0]; }\n// getHall بترجّع أول صالة لو مش لاقية id المطلوب، فمينفعش نستخدمها للتأكد إن الصالة موجودة فعلاً\nfunction hallExists(id){ return HALLS.some(h=>h.id===id); }\n// نتأكد إن الصالة والترابيزة النشطة موجودين فعلاً، ولو لأ نرجع لأول صالة وترابيزة 1\nfunction ensureActiveHall(){\n  if(!hallExists(activeHall) || !tablesCarts[activeHall]){\n    activeHall = HALLS[0].id;\n    activeTable = 1;\n  } else if(!tablesCarts[activeHall][activeTable]){\n    activeTable = 1;\n  }\n}\nfunction hallShortName(hallId){ const h = getHall(hallId); return h ? h.name : hallId; }\nfunction tableDisplayLabel(hallId, tableNum){\n  const t = tablesCarts[hallId] && tablesCarts[hallId][tableNum];\n  if(t && t.label) return t.label;\n  return `${hallShortName(hallId)} - ترابيزة ${tableNum}`;\n}\nfunction nextHallId(){\n  let n = 1;\n  while(HALLS.some(h=>h.id==='H'+n)) n++;\n  return 'H'+n;\n}\nfunction ensureTablesCartsShape(){\n  HALLS.forEach(h=>{\n    if(!tablesCarts[h.id]) tablesCarts[h.id] = {};\n    for(let i=1;i<=h.tableCount;i++){\n      if(!tablesCarts[h.id][i]) tablesCarts[h.id][i] = {items:[], discount:0, notes:\"\", ownerMode:false, printedBon:{}, label:null, openedAt:null};\n    }\n  });\n  // شيل أي صالات محذوفة من الشيكات المحفوظة\n  Object.keys(tablesCarts).forEach(hId=>{\n    if(!HALLS.some(h=>h.id===hId)) delete tablesCarts[hId];\n  });\n}\n\nlet activeHall = 'A'; // معرّف الصالة النشطة حالياً\nlet activeTable = 1; \n\n// الشيكات لكل صالة وترابيزة\nlet tablesCarts = {};\n// printedBon: بيسجل آخر كمية اتطبعت في بون لكل صنف في كل ترابيزة،\n// عشان لو زودت صنف وطبعت بون تاني، يطبع بس الجديد مش Item اللي اتطبع قبل كده تاني\nObject.values(tablesCarts).forEach(hall=>{\n  Object.values(hall).forEach(t=>{ t.printedBon = {}; });\n});\n\n/* ============ PERSISTING OPEN TABLE CHECKS (الشيكات المفتوحة على الترابيزات) ============ */\n// بيحفظ كل الشيكات المفتوحة (اللي لسه ماتحصلتش) في التخزين المحلي، عشان لو البرنامج\n// اتقفل فجأة أو الجهاز اتطفى قبل ما تدوس \"تحصيل\"، الأصناف تفضل موجودة في الترابيزة\n// لما تفتح البرنامج تاني بدل ما تتمسح.\nconst TABLES_STORAGE_KEY = 'beans_open_tables';\nfunction saveTablesCarts(){\n  try{\n    localStorage.setItem(TABLES_STORAGE_KEY, JSON.stringify(tablesCarts));\n  }catch(e){\n    console.error('Failed to save open table checks', e);\n  }\n  try{ cloudSync('syncTables', HALLS, tablesCarts); }catch(e){}\n}\nfunction loadTablesCarts(){\n  try{\n    const raw = localStorage.getItem(TABLES_STORAGE_KEY);\n    if(!raw) return;\n    const saved = JSON.parse(raw);\n    Object.keys(tablesCarts).forEach(hall=>{\n      if(!saved[hall]) return;\n      Object.keys(tablesCarts[hall]).forEach(tableNum=>{\n        const savedTable = saved[hall][tableNum];\n        if(!savedTable) return;\n        tablesCarts[hall][tableNum] = {\n          items: Array.isArray(savedTable.items) ? savedTable.items : [],\n          discount: parseFloat(savedTable.discount) || 0,\n          notes: savedTable.notes || \"\",\n          ownerMode: !!savedTable.ownerMode,\n          printedBon: savedTable.printedBon || {},\n          label: savedTable.label || null,\n          openedAt: savedTable.openedAt || null\n        };\n        if(savedTable.extra) tablesCarts[hall][tableNum].extra = savedTable.extra;\n      });\n    });\n  }catch(e){\n    console.error('Failed to load open table checks', e);\n  }\n}\n\nconst todayStr = () => {\n  const d = new Date();\n  return d.toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});\n};\nconst dayKeyStr = (d) => (d || new Date()).toISOString().slice(0,10);\nconst fmt = n => (n||0).toLocaleString('en-US');\nconst fmt2 = n => (n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});\n\n/* ============ بيانات المحل (تظهر في هيدر تقرير Z) ============ */\n// عدّل القيم دي براحتك من هنا. سيب أي سطر فاضي '' لو مش عايز يظهر في التقرير.\nconst SHOP_NAME = 'Beans POS';\nconst SHOP_BRANCH = '';\nconst SHOP_COMMERCIAL_REG = '';\nconst SHOP_TAX_NUMBER = '';\n// الرقم الضريبي بييجي من إعدادات الشيك (الأدمن)، والثابت اللي فوق احتياطي بس\nfunction shopTaxNumber(){\n  try{ const n = String((getCheckSettings().taxNumber)||'').trim(); if(n) return n; }catch(e){}\n  return SHOP_TAX_NUMBER;\n}\n\n/* ============ ربط موقع المتابعة من البيت (Firebase) — اختياري تماماً ============ */\n// البرنامج يعمل عادي 100% من غير الجزء ده. لو عايز تفعّل موقع تقدر تشوف منه\n// المبيعات من البيت لحظياً، اعمل الخطوات دي:\n//   1) روح https://console.firebase.google.com واعمل مشروع جديد (مجاني).\n//   2) من القائمة الجانبية: Build → Firestore Database → Create database (Start in production mode).\n//   3) من Build → Authentication → Sign-in method: فعّل \"Anonymous\" و\"Email/Password\".\n//   4) من نفس شاشة Authentication → تبويب Users: أضف مستخدم بإيميل وباسورد (ده اللي هتسجل بيه دخول في الموقع من البيت).\n//   5) من Project settings (الترس بجانب Project Overview) → Your apps → اختار Web (<\/>) وسجل اسم لأي حاجة.\n//      هيديك كائن firebaseConfig زي اللي تحت — انقل القيم منه هنا بالظبط.\n//   6) في Firestore Database → Rules، حط القواعد دي واضغط Publish:\n//        rules_version = '2';\n//        service cloud.firestore {\n//          match /databases/{database}/documents {\n//            match /{document=**} {\n//              allow read, write: if request.auth != null;\n//            }\n//
