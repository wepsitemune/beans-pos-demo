etElementById('authOverlay').classList.add('show');\n  showAuthPane();\n})();\n\n\n\n/* ============ إعدادات الشيك (ضريبة، فاتورة، إنستا باي) + دليفري + عملاء ونقاط + باركود ============ */\nfunction checkSettingsStorageKey(){ return 'beans_check_settings'; }\nfunction customersStorageKey(){ return 'beans_customers'; }\nfunction barcodesStorageKey(){ return 'beans_barcodes'; }\nfunction checkSettingsDefaults(){\n  return {\n    businessName:'Beans POS', address:'', phone:'', footerText:'شكراً لزيارتكم ',\n    instapayNumber:'01270609990', showInstapay:true,\n    taxEnabled:false, taxRate:14, taxMode:'exclusive', taxLabelOn:true, taxNumber:'',\n    invoiceNumbering:false, invoicePrefix:'INV-', invoiceNext:1,\n    deliveryEnabled:true, deliveryFee:0,\n    loyaltyEnabled:true, earnEgpPerPoint:10, pointValue:0.5, showPointsOnReceipt:true,\n    receiptLang:'ar', footerEn:'Thank you for visiting!'\n  };\n}\nfunction getCheckSettings(){\n  const d = checkSettingsDefaults();\n  try{\n    const raw = localStorage.getItem(checkSettingsStorageKey());\n    const s = raw ? JSON.parse(raw) : {};\n    return Object.assign(d, (s && typeof s === 'object') ? s : {});\n  }catch(e){ return d; }\n}\nfunction saveCheckSettings(s){ localStorage.setItem(checkSettingsStorageKey(), JSON.stringify(s)); }\nfunction r2(n){ return Math.round(((+n||0) + Number.EPSILON) * 100) / 100; }\nfunction fmtMoney(n){ n = +n || 0; return Number.isInteger(n) ? fmt(n) : fmt2(n); }\n\n/* ---------- العملاء ---------- */\nfunction loadCustomers(){\n  try{\n    const raw = localStorage.getItem(customersStorageKey());\n    const a = raw ? JSON.parse(raw) : [];\n    return Array.isArray(a) ? a : [];\n  }catch(e){ return []; }\n}\nfunction saveCustomers(list){ localStorage.setItem(customersStorageKey(), JSON.stringify(list)); }\nfunction getCustomerById(id){ return id ? loadCustomers().find(c=>c.id===id) || null : null; }\nfunction normalizePhone(p){ return String(p||'').replace(/[^0-9]/g,''); }\nfunction searchCustomers(q){\n  q = String(q||'').trim().toLowerCase();\n  const digits = normalizePhone(q);\n  const list = loadCustomers();\n  if(!q) return list.slice(0, 30);\n  return list.filter(c=> (c.name||'').toLowerCase().includes(q) || (digits && normalizePhone(c.phone).includes(digits))).slice(0, 30);\n}\nfunction addCustomer(data){\n  const list = loadCustomers();\n  const phone = normalizePhone(data.phone);\n  if(phone && list.some(c=>normalizePhone(c.phone)===phone)) return { error:'رقم الموبايل ده مسجل لعميل تاني' };\n  const c = { id:'c'+Date.now()+Math.floor(Math.random()*1000), name:(data.name||'').trim(), phone, address:(data.address||'').trim(),\n              points:Math.max(0, Math.floor(+data.points||0)), visits:0, totalSpent:0, createdAt:Date.now(), lastVisit:null };\n  if(!c.name) return { error:'اكتب اسم العميل' };\n  list.push(c); saveCustomers(list);\n  return { customer:c };\n}\nfunction updateCustomer(id, patch){\n  const list = loadCustomers();\n  const c = list.find(x=>x.id===id);\n  if(!c) return { error:'العميل غير موجود' };\n  if(patch.phone !== undefined){\n    const phone = normalizePhone(patch.phone);\n    if(phone && list.some(x=>x.id!==id && normalizePhone(x.phone)===phone)) return { error:'رقم الموبايل ده مسجل لعميل تاني' };\n    patch.phone = phone;\n  }\n  Object.assign(c, patch);\n  saveCustomers(list);\n  return { customer:c };\n}\n\n/* ---------- الباركود ---------- */\nfunction loadBarcodes(){\n  try{ const o = JSON.parse(localStorage.getItem(barcodesStorageKey()) || '{}'); return (o && typeof o==='object') ? o : {}; }catch(e){ return {}; }\n}\nfunction getBarcodeFor(name){ return loadBarcodes()[name] || ''; }\nfunction setBarcodeFor(name, code){\n  code = String(code||'').trim();\n  const map = loadBarcodes();\n  if(code){\n    const clash = Object.keys(map).find(n=>n!==name && map[n]===code);\n    if(clash) return { error:`الباركود ده مستخدم لصنف \"${clash}\"` };\n    map[name] = code;\n  } else delete map[name];\n  localStorage.setItem(barcodesStorageKey(), JSON.stringify(map));\n  return { ok:true };\n}\nfunction findMenuItemByName(name){\n  for(const cat of MENU) for(const g of cat.groups) for(const it of g.items) if(it[0]===name) return it;\n  return null;\n}\nfunction handleBarcodeScan(code){\n  code = String(code||'').trim();\n  if(!code) return false;\n  const map = loadBarcodes();\n  const name = Object.keys(map).find(n=>map[n]===code);\n  const item = name ? findMenuItemByName(name) : null;\n  if(!item){ showToast(`باركود غير مسجل: ${code}`); return false; }\n  addToCart(item[0], item[1]);\n  return true;\n}\n\n/* ---------- حساب إجماليات الشيك (ضريبة / نقاط / دليفري) ---------- */\nfunction getCartExtra(tData){ return (tData && tData.extra) || {}; }\nfunction computeCheckTotals(){\n  const tData = tablesCarts[activeHall][activeTable];\n  const s = getCheckSettings();\n  const ex = getCartExtra(tData);\n  const owner = !!tData.ownerMode;\n  const sub = cartSubTotal();\n  const afterDisc = cartTotal();\n  const customer = ex.customerId ? getCustomerById(ex.customerId) : null;\n  let usedPts = 0;\n  if(s.loyaltyEnabled && customer && !owner && s.pointValue > 0){\n    usedPts = Math.max(0, Math.min(Math.floor(+ex.redeemPoints||0), customer.points||0, Math.floor(afterDisc / s.pointValue)));\n  }\n  const ptsDisc = r2(usedPts * s.pointValue);\n  const net = r2(afterDisc - ptsDisc);\n  let tax = 0;\n  const rate = (s.taxEnabled && s.taxRate > 0) ? s.taxRate/100 : 0;\n  if(rate > 0) tax = s.taxMode === 'exclusive' ? r2(net * rate) : r2(net - net/(1+rate));\n  const isDelivery = s.deliveryEnabled && ex.orderType === 'delivery';\n  const fee = isDelivery ? Math.max(0, +ex.deliveryFee || 0) : 0;\n  const grand = r2(net + (s.taxMode === 'exclusive' ? tax : 0) + fee);\n  const earned = (s.loyaltyEnabled && customer && !owner && s.earnEgpPerPoint > 0) ? Math.floor(net / s.earnEgpPerPoint) : 0;\n  return { sub, manualDisc: (parseFloat(tData.discount)||0), afterDisc, usedPts, ptsDisc, net, tax, taxRate: rate>0 ? s.taxRate : 0,\n           taxMode: s.taxMode, fee, grand, earned, isDelivery, address: ex.deliveryAddress || '', customer };\n}\nfunction orderExtraFields(T){\n  const o = {};\n  if(T.taxRate > 0){ o.tax = T.tax; o.taxRate = T.taxRate; o.taxMode = T.taxMode; }\n  o.net = T.net;\n  if(T.fee > 0) o.deliveryFee = T.fee;\n  if(T.isDelivery){ o.orderType = 'delivery'; o.deliveryAddress = T.address; }\n  if(T.customer){ o.customerId = T.customer.id; o.customerName = T.customer.name; o.customerPhone = T.customer.phone || ''; }\n  if(T.usedPts > 0){ o.pointsRedeemed = T.usedPts; o.pointsDiscount = T.ptsDisc; }\n  if(T.earned > 0) o.pointsEarned = T.earned;\n  return o;\n}\nfunction takeInvoiceNumber(){\n  const s = getCheckSettings();\n  if(!s.invoiceNumbering) return null;\n  const n = Math.max(1, Math.floor(+s.invoiceNext||1));\n  s.invoiceNext = n + 1;\n  saveCheckSettings(s);\n  return (s.invoicePrefix || '') + String(n).padStart(6, '0');\n}\nfunction applyOrderToCustomer(order){\n  if(!order.customerId || order.owner) return;\n  const c = getCustomerById(order.customerId);\n  if(!c) return;\n  updateCustomer(c.id, {\n    points: Math.max(0, (c.points||0) - (order.pointsRedeemed||0) + (order.pointsEarned||0)),\n    visits: (c.visits||0) + 1,\n    totalSpent: r2((c.totalSpent||0) + order.total),\n    lastVisit: Date.now()\n  });\n}\n\n/* ---------- عرض الإجماليات الإضافية وشريط الطلب في الشيك ---------- */\nfunction setRowVisible(id, show, text){\n  const el = document.getElementById(id);\n  if(!el) return;\n  el.style.display = show ? '' : 'none';\n  if(show && text !== undefined) el.querySelector('span:last-child').textContent = text;\n}\nfunction renderCheckExtras(){\n  const T = computeCheckTotals();\n  ['D','M'].forEach(k=>{\n    setRowVisible('ptsRow'+k, T.usedPts>0, '-'+fmtMoney(T.ptsDisc)+' ج.م');\n    setRowVisible('taxRow'+k, T.taxRate>0, fmtMoney(T.tax)+' ج.م');\n    setRowVisible('feeRow'+k, T.fee>0, fmtMoney(T.fee)+' ج.م');\n    const total = document.getElementById('cartTotal'+k);\n    if(total) total.textContent = fmtMoney(T.grand)+' ج.م';\n    const taxLbl = document.querySelector('#taxRow'+k+' span:first-child');\n    if(taxLbl) taxLbl.textContent = `${T.taxMode==='exclusive' ? 'ضريبة' : 'منها ضريبة'} ${T.taxRate}%`;\n    const meta = document.getElementById('cartMeta'+k);\n    if(meta){\n      const cust = T.customer;\n      meta.textContent = (T.isDelivery ? ' ' : ' ') + (cust ? cust.name + (getCheckSettings().loyaltyEnabled ? ' · '+(cust.points||0) : '') : 'عميل');\n      meta.classList.toggle('on', !!cust || T.isDelivery);\n      meta.onclick = openOrderInfoModal;\n    }\n  });\n  const mb = document.getElementById('mbTotal');\n  if(mb) mb.textContent = fmtMoney(T.grand)+' ج.م';\n}\n\n/* ---------- نافذة بيانات الطلب (نوع الطلب / عميل / دليفري / نقاط) ---------- */\nlet oiDraft = null;\nfunction openOrderInfoModal(){\n  const tData = tablesCarts[activeHall][activeTable];\n  const ex = getCartExtra(tData);\n  const s = getCheckSettings();\n  oiDraft = { orderType: ex.orderType || 'dine', customerId: ex.customerId || null,\n              deliveryFee: ex.deliveryFee !== undefined ? ex.deliveryFee : s.deliveryFee,\n              deliveryAddress: ex.deliveryAddress || '', redeemPoints: ex.redeemPoints || 0 };\n  document.getElementById('oiTitle').textContent = 'بيانات الطلب: ' + tableDisplayLabel(activeHall, activeTable);\n  document.getElementById('oiCustSearch').value = '';\n  document.getElementById('oiNewBox').hidden = true;\n  renderOrderInfoModal();\n  document.getElementById('orderInfoOverlay').classList.add('show');\n}\nfunction renderOrderInfoModal(){\n  const s = getCheckSettings();\n  const d = oiDraft;\n  const cust = d.customerId ? getCustomerById(d.customerId) : null;\n  document.querySelectorAll('#oiTypeRow button').forEach(b=>{\n    b.classList.toggle('on', b.dataset.type === d.orderType);\n    if(b.dataset.type==='delivery') b.style.display = s.deliveryEnabled ? '' : 'none';\n  });\n  do \" aria-hidden=\"true\"><path d=\"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z\"/><\/svg>${c.points||0}<\/span>`:''}<\/button>`).join('')\n    || (q.trim() ? '<div class=\"sub-note\">مفيش نتائج — اضغط \"عميل جديد\"<\/div>' : '');\n  document.querySelectorAll('#oiResults .cust-pick').forEach(b=>b.addEventListener('click', ()=>{\n    const c = getCustomerById(b.dataset.id);\n    d.customerId = c.id; d.redeemPoints = 0;\n    if(!d.deliveryAddress && c.address) d.deliveryAddress = c.address;\n    document.getElementById('oiCustSearch').value = '';\n    renderOrderInfoModal();\n  }));\n}\nfunction saveOrderInfoModal(){\n  const d = oiDraft;\n  d.deliveryFee = Math.max(0, parseFloat(document.getElementById('oiFee').value) || 0);\n  d.deliveryAddress = document.getElementById('oiAddress').value.trim();\n  d.redeemPoints = Math.max(0, Math.floor(+document.getElementById('oiPoints').value || 0));\n  const tData = tablesCarts[activeHall][activeTable];\n  tData.extra = { orderType: d.orderType, customerId: d.customerId, deliveryFee: d.deliveryFee, deliveryAddress: d.deliveryAddress, redeemPoints: d.redeemPoints };\n  if(d.orderType==='dine' && !d.customerId) tData.extra = null;\n  saveTablesCarts();\n  renderCart();\n  document.getElementById('orderInfoOverlay').classList.remove('show');\n}\nfunction closeOrderInfoModal(){ document.getElementById('orderInfoOverlay').classList.remove('show'); }\n\n/* ---------- لوحة إعدادات الشيك ---------- */\nfunction loadCheckSettingsForm(){\n  const s = getCheckSettings();\n  const set = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };\n  const chk = (id, v) => { const el = document.getElementById(id); if(el) el.checked = !!v; };\n  set('chkBusinessName', s.businessName); set('chkAddress', s.address); set('chkPhone', s.phone); set('chkFooter', s.footerText);\n  set('chkInstapayNumber', s.instapayNumber); chk('chkShowInstapayOnReceipt', s.showInstapay);\n  set('chkReceiptLang', s.receiptLang === 'en' ? 'en' : 'ar'); set('chkFooterEn', s.footerEn);\n  chk('chkTaxEnabled', s.taxEnabled); set('chkTaxRate', s.taxRate); set('chkTaxMode', s.taxMode); chk('chkTaxLabel', s.taxLabelOn); set('chkTaxNumber', s.taxNumber);\n  updateTaxHint();\n  chk('chkInvNumbering', s.invoiceNumbering); set('chkInvPrefix', s.invoicePrefix); set('chkInvNext', s.invoiceNext);\n  chk('chkDeliveryEnabled', s.deliveryEnabled); set('chkDeliveryFee', s.deliveryFee);\n  chk('chkLoyaltyEnabled', s.loyaltyEnabled); chk('chkShowPoints', s.showPointsOnReceipt); set('chkEarnEgp', s.earnEgpPerPoint); set('chkPointValue', s.pointValue);\n}\nfunction updateTaxHint(){\n  const el = document.getElementById('chkTaxHint');\n  if(!el) return;\n  const on = document.getElementById('chkTaxEnabled').checked;\n  const mode = document.getElementById('chkTaxMode').value;\n  const rate = document.getElementById('chkTaxRate').value;\n  if(!on) el.textContent = 'الضريبة مقفولة: مش هتتحسب ولا هتظهر على الشيك.';\n  else if(mode === 'exclusive') el.textContent = `الضريبة ${rate}% هتتحسب على الشيك وتتضاف على الإجمالي النهائي.`;\n  else el.textContent = ` وضع \"شاملة\": الضريبة ${rate}% بتتحسب جوه الأسعار ومش بتزود الإجمالي (بتظهر بس كسطر \"منها ضريبة\"). لو عايزها تتجمع على الإجمالي اختار \"تُضاف فوق الأسعار\".`;\n}\nfunction saveTaxSettingsImmediately(){\n  const settings = getCheckSettings();\n  const rate = Number(document.getElementById('chkTaxRate').value);\n  settings.taxEnabled = document.getElementById('chkTaxEnabled').checked;\n  if(Number.isFinite(rate) && rate >= 0 && rate <= 100) settings.taxRate = rate;\n  settings.taxMode = document.getElementById('chkTaxMode').value === 'exclusive' ? 'exclusive' : 'inclusive';\n  settings.taxLabelOn = document.getElementById('chkTaxLabel').checked;\n  saveCheckSettings(settings);\n  updateTaxHint();\n  renderCart();\n}\nfunction saveCheckSettingsForm(){\n  const val = id => document.getElementById(id).value;\n  const on = id => document.getElementById(id).checked;\n  const num = (id, def, min) => { const n = parseFloat(val(id)); return (isNaN(n) || n < min) ? def : n; };\n  const old = getCheckSettings();\n  const s = {\n    businessName: val('chkBusinessName').trim() || old.businessName, address: val('chkAddress').trim(), phone: val('chkPhone').trim(), footerText: val('chkFooter').trim(),\n    instapayNumber: val('chkInstapayNumber').trim(), showInstapay: on('chkShowInstapayOnReceipt'),\n    taxEnabled: on('chkTaxEnabled'), taxRate: Math.min(100, num('chkTaxRate', 14, 0)), taxMode: val('chkTaxMode') === 'exclusive' ? 'exclusive' : 'inclusive',\n    taxLabelOn: on('chkTaxLabel'), taxNumber: val('chkTaxNumber').trim(),\n    invoiceNumbering: on('chkInvNumbering'), invoicePrefix: val('chkInvPrefix').trim(), invoiceNext: Math.max(1, Math.floor(num('chkInvNext', old.invoiceNext, 1))),\n    deliveryEnabled: on('chkDeliveryEnabled'), deliveryFee: num('chkDeliveryFee', 0, 0),\n    loyaltyEnabled: on('chkLoyaltyEnabled'), showPointsOnReceipt: on('chkShowPoints'), earnEgpPerPoint: num('chkEarnEgp', 10, 1), pointValue: num('chkPointValue', 0.5, 0),\n    receiptLang: val('chkReceiptLang') === 'en' ? 'en' : 'ar', footerEn: val('chkFooterEn').trim()\n  };\n  if(s.taxEnabled && s.invoiceNumbering && !s.taxNumber){ showToast('تنبيه: لم تُدخل رقم التسجيل الضريبي — لن يظهر على الإيصال'); }\n  saveCheckSettings(s);\n  updateTaxHint();\n  renderCart();\n  showToast('تم حفظ إعدادات الشيك');\n}\nfunction exportTodayInvoicesCsv(){\n  const orders = (dayData && dayData.orders) ? dayData.orders.filter(o=>!o.owner) : [];\n  if(!orders.length){ showToast('مفيش فواتير في اليوم الحالي'); return; }\n  const esc = v => '\"' + String(v==null?'':v).replace(/\"/g,'\"\"') + '\"';\n  const preTax = o => {\n    const base = o.net!==undefined ? o.net : o.total;\n    return (o.tax && o.taxMode!=='exclusive') ? r2(base - o.tax) : base;\n  };\n  const head = ['رقم الفاتورة','التاريخ','الوقت','الترابيزة/النوع','العميل','الدفع','الصافي قبل الضريبة','نسبة الضريبة','قيمة الضريبة','رسوم التوصيل','الإجمالي'];\n  const rows = orders.map(o=>[o.invoiceNo||'', new Date(o.id).toISOString().slice(0,10), o.time, o.orderType==='delivery'?'دليفري':o.tableName, o.customerName||'',\n    o.paymentMethod||'cash', preTax(o), o.taxRate||0, o.tax||0, o.deliveryFee||0, o.total]);\n  const csv = '﻿' + [head].concat(rows).map(r=>r.map(esc).join(',')).join('\\r\\n');\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));\n  a.download = `invoices-${fileStamp()}.csv`;\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  showToast('تم تنزيل فواتير اليوم');\n}\n\n/* ---------- إدارة العملاء ---------- */\nlet custEditId = null;\nfunction renderCustomersAdmin(){\n  const q = document.getElementById('custSearch').value;\n  const list = searchCustomers(q);\n  const all = loadCustomers();\n  document.getElementById('custCount').textContent = `${all.length} عميل`;\n  document.getElementById('custList').innerHTML = list.map(c=>`\n    <div class=\"admin-item-row\">\n      <span><b>${escapeHtml(c.name)}<\/b> <small style=\"color:var(--muted)\">${escapeHtml(c.phone||'بدون رقم')} — <svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z\"/><\/svg> ${c.points||0} نقطة — ${c.visits||0} زيارة — ${fmt(c.totalSpent||0)} ج.م<\/small><\/span>\n      <button type=\"button\" class=\"admin-item-img-btn\" data-edit=\"${c.id}\" title=\"تعديل\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13.5 6.5l4 4\"/><\/svg><\/button>\n      <button type=\"button\" class=\"admin-item-del\" data-del=\"${c.id}\" title=\"حذف\"><svg class=\"bn-u\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/><\/svg><\/button>\n    <\/div>`).join('') || '<div class=\"sub-note\">لا يوجد عملاء<\/div>';\n  document.querySelectorAll('#custList [data-edit]').forEach(b=>b.addEventListener('click', ()=>openCustForm(b.dataset.edit)));\n  document.querySelectorAll('#custList [data-del]').forEach(b=>b.addEventListener('click', async ()=>{\n    const c = getCustomerById(b.dataset.del);\n    if(!c) return;\n    const ok = await customConfirm(`حذف العميل \"${c.name}\" ونقاطه نهائياً؟`, 'حذف عميل', 'حذف');\n    if(!ok) return;\n    saveCustomers(loadCustomers().filter(x=>x.id!==c.id));\n    renderCustomersAdmin();\n  }));\n}\nfunction openCustForm(id){\n  custEditId = id || null;\n  const c = id ? getCustomerById(id) : null;\n  document.getElementById('custForm').hidden = false;\n  document.getElementById('custName').value = c ? c.name : '';\n  document.getElementById('custPhone').value = c ? c.phone : '';\n  document.getElementById('custAddress').value = c ? c.address : '';\n  document.getElementById('custPoints').value = c ? (c.points||0) : 0;\n}\nfunction saveCustForm(){\n  const data = { name: document.getElementById('custName').value, phone: document.getElementById('custPhone').value,\n                 address: document.getElementById('custAddress').value, points: document.getElementById('custPoints').value };\n  let res;\n  if(custEditId){\n    if(!data.name.trim()){ showToast('اكتب اسم العميل'); return; }\n    res = updateCustomer(custEditId, { name:data.name.trim(), phone:data.phone, address:data.address.trim(), points:Math.max(0, Math.floor(+data.points||0)) });\n  } else res = addCustomer(data);\n  if(res.error){ showToast(res.error); return; }\n  document.getElementById('custForm').hidden = true;\n  renderCustomersAdmin();\n  showToast('تم حفظ العميل');\n}\n\n/* ---------- ربط الأحداث ---------- */\n(function wireCheckSettingsAndExtras(){\n  const $ = id => document.getElementById(id);\n  $('chkSaveBtn').addEventListener('click', saveCheckSettingsForm);\n  ['chkTaxEnabled','chkTaxRate','chkTaxMode','chkTaxLabel'].forEach(id=>{\n    $(id).addEventListener('change', saveTaxSettingsImmediately);\n  });\n  $('chkExportInvoicesBtn').addEventListener('click', exportTodayInvoicesCsv);\n  document.querySelectorAll('[data-admin-tab=\"check\"]').forEach(t=>t.addEventListener('click', loadCheckSettingsForm));\n  loadCheckSettingsForm();\n\n  $('custSearch').addEventListener('input', renderCustomersAdmin);\n  $('custAddBtn').addEventListener('click', ()=>openCustForm(null));\n  $('custSaveBtn').addEventListener('click', saveCustForm);\n  $('custCancelBtn').addEventListener('click', ()=>{ $('custForm').hidden = true; });\n\n  $('oiClose').addEventListener('click', closeOrderInfoModal);\n  $('oiSave').addEventListener('click', saveOrderInfoModal);\n  document.querySelectorAll('#oiTypeRow button').forEach(b=>b.addEventListener('click', ()=>{\n    oiDraft.deliveryFee = parseFloat($('oiFee').value) || 0;\n    oiDraft.deliveryAddress = $('oiAddress').value;\n    oiDraft.orderType = b.dataset.type; renderOrderInfoModal();\n  }));\n  $('oiCustSearch').addEventListener('input', renderOrderInfoModal);\n  $('oiNewBtn').addEventListener('click', ()=>{\n    $('oiNewBox').hidden = false;\n    const q = $('oiCustSearch').value.trim();\n    if(/^[0-9+\\s-]{6,}$/.test(q)) $('oiNewPhone').value = q; else if(q) $('oiNewName').value = q;\n  });\n  $('oiNewSave').addEventListener('click', ()=>{\n    const res = addCustomer({ name:$('oiNewName').value, phone:$('oiNewPhone').value, address:$('oiNewAddress').value });\n    if(res.error){ showToast(res.error); return; }\n    oiDraft.customerId = res.customer.id; oiDraft.redeemPoints = 0;\n    if(res.customer.address) oiDraft.deliveryAddress = res.customer.address;\n    ['oiNewName','oiNewPhone','oiNewAddress','oiCustSearch'].forEach(i=>$(i).value='');\n    $('oiNewBox').hidden = true;\n    renderOrderInfoModal();\n  });\n  $('oiPtsMax').addEventListener('click', ()=>{ $('oiPoints').value = $('oiPtsMax').dataset.max || 0; oiDraft.redeemPoints = +$('oiPoints').value; });\n  $('oiPoints').addEventListener('input', ()=>{ oiDraft.redeemPoints = Math.max(0, Math.floor(+$('oiPoints').value||0)); });\n\n  // باركود الأصناف في لوحة الإعدادات\n  $('adminItemsList').addEventListener('change', (e)=>{\n    const inp = e.target.closest('.barcode-edit-input');\n    if(!inp) return;\n    const res = setBarcodeFor(inp.dataset.name, inp.value);\n    if(res.error){ showToast(res.error); inp.value = getBarcodeFor(inp.dataset.name); }\n    else showToast(inp.value.trim() ? 'تم حفظ الباركود' : 'تم مسح الباركود');\n  });\n\n  // قارئ الباركود: يكتب أرقام بسرعة وينهي بـ Enter. نلتقطه من أي مكان في شاشة الكاشير.\n  let buf = '', lastT = 0;\n  document.addEventListener('keydown', (e)=>{\n    if(e.ctrlKey || e.altKey || e.metaKey) return;\n    const t = e.target;\n    const inField = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');\n    const now = Date.now();\n    if(now - lastT > 60) buf = '';\n    lastT = now;\n    if(e.key === 'Enter'){\n      const code = buf; buf = '';\n      if(code.length >= 4 && document.getElementById('adminModalOverlay') && !document.querySelector('.modal-overlay.show')){\n        e.preventDefault();\n        if(t === searchInput){ searchInput.value = ''; renderGrid(''); }\n        handleBarcodeScan(code);\n      } else if(t === searchInput){\n        const v = searchInput.value.trim();\n        if(v && Object.values(loadBarcodes()).includes(v)){ e.preventDefault(); searchInput.value=''; renderGrid(''); handleBarcodeScan(v); }\n      }\n      return;\n    }\n    if(e.key.length === 1 && (!inField || t === searchInput)) buf += e.key;\n  }, true);\n})();\n\n/* ---------- ملخص نوع الطلب / الضريبة / النقاط في التقارير ---------- */\nfunction orderTypeSummary(orders){\n  const paid = (orders || []).filter(o=>!o.owner);\n  const del = paid.filter(o=>o.orderType==='delivery');\n  const sum = (arr, k) => r2(arr.reduce((t,o)=>t+(+o[k]||0),0));\n  const delTotal = r2(del.reduce((t,o)=>t+(+o.total||0),0));\n  return {\n    delCount: del.length, delTotal,\n    dineCount: paid.length - del.length, dineTotal: r2(paid.reduce((t,o)=>t+(+o.total||0),0) - delTotal),\n    fees: sum(paid,'deliveryFee'), tax: sum(paid,'tax'),\n    ptsEarned: paid.reduce((t,o)=>t+(+o.pointsEarned||0),0), ptsUsed: paid.reduce((t,o)=>t+(+o.pointsRedeemed||0),0),\n    ptsDiscount: sum(paid,'pointsDiscount')\n  };\n}\nfunction fillTypeSummary(prefix, orders){\n  const S = orderTypeSummary(orders);\n  const set = (id, v) => { const el = document.getElementById(prefix+id); if(el) el.textContent = v; };\n  set('DelCount', S.delCount); set('DelTotal', fmtMoney(S.delTotal)); set('Fees', fmtMoney(S.fees));\n  set('Tax', fmtMoney(S.tax)); set('PtsEarned', S.ptsEarned); set('PtsUsed', S.ptsUsed);\n}\nfunction typeSummaryZHtml(orders){\n  const S = orderTypeSummary(orders);\n  if(!S.delCount && !S.fees && !S.tax && !S.ptsEarned && !S.ptsUsed) return '';\n  return `<div class=\"zr-hr1\"><\/div>\n      <div class=\"zr-section\">[حسب نوع الطلب]<\/div>\n      ${zrRow('صالة (' + S.dineCount + ' فاتورة):', fmt2(S.dineTotal))}\n      ${zrRow('دليفري (' + S.delCount + ' فاتورة):', fmt2(S.delTotal))}\n      ${S.fees ? zrRow('منها رسوم التوصيل:', fmt2(S.fees)) : ''}\n      ${S.tax ? zrRow('إجمالي الضريبة:', fmt2(S.tax)) : ''}\n      ${(S.ptsEarned || S.ptsUsed) ? zrRow('نقاط مكتسبة / مستبدلة:', S.ptsEarned + ' / ' + S.ptsUsed) : ''}`;\n}\nfunction typeSummaryRepHtml(orders){\n  const S = orderTypeSummary(orders);\n  if(!S.delCount && !S.fees && !S.tax && !S.ptsEarned && !S.ptsUsed) return '';\n  return `<div class=\"rep-hr1\"><\/div>\n    <div class=\"rep-section-bar\">حسب نوع الطلب<\/div>\n    ${repRow('صالة (' + S.dineCount + ' فاتورة):', fmt2(S.dineTotal))}\n    ${repRow('دليفري (' + S.delCount + ' فاتورة):', fmt2(S.delTotal))}\n    ${S.fees ? repRow('منها رسوم التوصيل:', fmt2(S.fees)) : ''}\n    ${S.tax ? repRow('إجمالي الضريبة:', fmt2(S.tax)) : ''}\n    ${(S.ptsEarned || S.ptsUsed) ? repRow('نقاط مكتسبة / مستبدلة:', S.ptsEarned + ' / ' + S.ptsUsed) : ''}`;\n}\n<\/script>\n\n<!-- ============ مزامنة سحابية اختيارية (Firebase) — لموقع المتابعة من البيت ============\n     السكريبت ده type=\"module\" لوحده لأنه بيستخدم Firebase SDK (ESM) من الإنترنت.\n     لو FIREBASE_CONFIG فاضي (القيم كلها '')، السكريبت هيوقف نفسه من الأول ومش هيعمل حاجة،\n     والبرنامج هيشتغل عادي 100% بشكل محلي زي ما هو. -->\n<script type=\"module\">\n(async function(){\n  const cfg = window.FIREBASE_CONFIG || {};\n  if(!cfg.apiKey || !cfg.projectId) return; // مش متفعّل — البرنامج شغال محلي عادي\n\n  try{\n    const { initializeApp } = window.__BEANS_FB.app;\n    const { getAuth, signInAnonymously, onAuthStateChanged } = window.__BEANS_FB.auth;\n    const {\n      getFirestore, initializeFirestore, doc, setDoc, onSnapshot, serverTimestamp,\n      collection, query, where, deleteDoc,\n      persistentLocalCache, persistentMultipleTabManager\n    } = window.__BEANS_FB.firestore;\n\n    const app = initializeApp(cfg);\n    const auth = getAuth(app);\n    // ============ تفعيل التخزين المحلي الدائم (IndexedDB) لـ Firestore ============\n    // ده هو حل مشكلة \"النت لما يقطع مبيبعتش البيانات\": من غير السطر ده، أي عملية بتتبعت\n    // وقت ما النت مقطوع كانت بتتخزن في الذاكرة (RAM) بس مؤقتًا، ولو البرنامج اتقفل أو\n    // الجهاز اتعمله إعادة تشغيل قبل ما النت يرجع، العمليات دي كانت بتضيع نهائي ومتوصلش\n    // للداشبورد أبداً. دلوقتي بقت بتتخزن على القرص (Disk) زي أي فاتورة عادية، وأول ما\n    // النت يرجع — حتى لو بعد ساعات أو بعد إعادة تشغيل الجهاز — Firestore نفسه بيبعتها\n    // تلقائي بالترتيب من غير أي كود إضافي مننا.\n    // وليه مفيش أي احتمال تكرار (duplicate): كل عملية بتتبعت بمعرّف ثابت (ID) زي رقم\n    // الفاتورة أو المصروف نفسه (مش رقم عشوائي جديد كل مرة)، وبنستخدم setDoc مع\n    // merge:true. يعني لو نفس العملية اتبعتت مرتين لأي سبب، السحابة هتعمل \"استبدال/تحديث\"\n    // لنفس السطر مش إضافة سطر جديد — فمفيش أي تكرار في البيانات على الإطلاق.\n    let db;\n    try{\n      db = initializeFirestore(app, {\n        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })\n      });\n    }catch(persistErr){\n      console.warn('تعذّر تفعيل التخزين الدائم لـ Firestore، هيشتغل بالذاكرة العادية (fallback)', persistErr);\n      db = getFirestore(app);\n    }\n    const DEVICE_ID = 'cashier_' + Math.random().toString(36).slice(2); // علشان نميز تحديثاتنا احنا عن تحديثات جاية من الداشبورد\n\n    await new Promise((resolve)=>{\n      onAuthStateChanged(auth, (user)=>{ if(user) resolve(); });\n      signInAnonymously(auth).catch(err=>{ console.warn('تعذر تسجيل دخول المزامنة السحابية', err); resolve(); });\n    });\n\n    window.CloudSync = {\n      syncBusinessDay(bd){\n        return setDoc(doc(db, 'businessDays', String(bd.id)), {\n          dateKey: bd.dateKey, openedAt: bd.openedAt, closedAt: bd.closedAt || null,\n          ts: Date.now(), updatedAt: serverTimestamp()\n        }, { merge:true });\n      },\n      syncShift(shift, bdId){\n        return setDoc(doc(db, 'shifts', String(shift.id)), {\n          ...shift, bdId: bdId || null, ts: Number(shift.id) || Date.now(), updatedAt: serverTimestamp()\n        }, { merge:true });\n      },\n      syncOrder(order, bdId, dateKey){\n        return setDoc(doc(db, 'orders', String(order.id)), {\n          ...order, bdId: bdId || null, dateKey: dateKey || null, ts: Number(order.id) || Date.now(), updatedAt: serverTimestamp()\n        }, { merge:true });\n      },\n      syncExpense(expense, bdId, dateKey){\n        return setDoc(doc(db, 'expenses', String(expense.id)), {\n          ...expense, bdId: bdId || null, dateKey: dateKey || null, deleted:false,\n          ts: Date.now(), updatedAt: serverTimestamp()\n        }, { merge:true });\n      },\n      deleteExpense(expenseId){\n        return setDoc(doc(db, 'expenses', String(expenseId)), {\n          deleted:true, updatedAt: serverTimestamp()\n        }, { merge:true });\n      },\n      deleteOrder(orderId, meta){\n        return setDoc(doc(db, 'orders', String(orderId)), {\n          deleted:true,\n          deletedBy: (meta && meta.by) || null,\n          deletedByUsername: (meta && meta.byUsername) || null,\n          deletedAt: (meta && meta.at) || null,\n          deletedFrom: (meta && meta.from) || null,\n          updatedAt: serverTimestamp()\n        }, { merge:true });\n      },\n      syncVoid(rec){\n        return setDoc(doc(db, 'voids', String(rec.id)), { ...rec, updatedAt: serverTimestamp() }, { merge:true });\n      },\n      syncMenu(menu){\n        // Firestore ما بيقبلش \"array جوه array\" (nested arrays)، وكل صنف عندنا متخزن كـ [الاسم, السعر]\n        // وده array جوه array items جوه array groups. فبنحول كل صنف لـ object {name, price} قبل الإرسال بس،\n        // من غير ما نغيّر شكل البيانات محليًا خالص (الكاشير يفضل شغال بالـ [name, price] العادي).\n        const safeMenu = (menu||[]).map(cat => ({\n          ...cat,\n          groups: (cat.groups||[]).map(g => ({\n            ...g,\n            items: (g.items||[]).map(it => Array.isArray(it) ? { name: it[0], price: it[1] } : it)\n          }))\n        }));\n        return setDoc(doc(db, 'settings', 'menu'), {\n          menu: safeMenu, updatedAt: serverTimestamp(), updatedBy: DEVICE_ID\n        });\n      },\n      syncInventory(items){\n        return setDoc(doc(db, 'settings', 'inventory'), {\n          items: (items||[]).map(i=>({\n            id:i.id, name:i.name, unit:i.unit, currentQty:i.currentQty||0,\n            minQty:i.minQty||0, costPerUnit:i.costPerUnit||0\n          })),\n          updatedAt: serverTimestamp(), updatedBy: DEVICE_ID\n        });\n      },\n      syncInventoryAudits(audits){\n        // سجل الجرد بيتبعت للداشبورد عشان يظهر فيه (آخر 200 جرد)\n        return setDoc(doc(db, 'settings', 'inventoryAudits'), {\n          audits: (audits||[]).slice(-200).map(a=>({\n            id:a.id, date:a.date,\n            entries:(a.entries||[]).map(e=>({\n              itemId:e.itemId, name:e.name, unit:e.unit, expected:e.expected,\n              counted:e.counted, variance:e.variance, value:e.value\n            }))\n          })),\n          updatedAt: serverTimestamp(), updatedBy: DEVICE_ID\n        });\n      },\n      syncAccounts(accounts){\n        return setDoc(doc(db, 'settings', 'accounts'), {\n          accounts: accounts, updatedAt: serverTimestamp(), updatedBy: DEVICE_ID\n        });\n      },\n      syncStaffProfiles(employees){\n        return setDoc(doc(db, 'settings', 'staffProfiles'), {\n          employees: employees || [], updatedAt: serverTimestamp(), updatedBy: DEVICE_ID\n        });\n      },\n      syncAttendance(record){\n        return setDoc(doc(db, 'attendance', String(record.id)), {\n          ...record, updatedAt: serverTimestamp(), updatedBy: DEVICE_ID\n        }, { merge:true });\n      },\n      deleteAttendance(id){\n        return deleteDoc(doc(db, 'attendance', String(id)));\n      },\n      watchAttendanceByDate(dateKey, cb){\n        // متابعة لحظية لتسجيلات الحضور والانصراف في يوم معيّن (مشتركة مع الداشبورد)\n        const q = query(collection(db, 'attendance'), where('dateKey', '==', dateKey));\n        return onSnapshot(q, (snap)=>{\n          const rows = [];\n          snap.forEach(d=> rows.push(d.data()));\n          cb(rows);\n        }, (err)=> console.warn('تعذر متابعة تسجيلات الحضور', err));\n      },\n      syncTables(halls, tablesCarts){\n        // بيبعت حالة كل الصالات والترابيزات (مفتوحة عليها طلب / فاضية) لشاشة \"بث مباشر\" في الداشبورد.\n        // بنحول الأرقام اللي بتتخزن كـ object keys (أرقام الترابيزات) لـ array عادي عشان Firestore يقبلها بسهولة.\n        const safeHalls = (halls||[]).map(h => ({ id:h.id, name:h.name, tableCount:h.tableCount||0 }));\n        const safeTables = {};\n        Object.keys(tablesCarts||{}).forEach(hallId=>{\n          const hallTables = tablesCarts[hallId] || {};\n          safeTables[hallId] = Object.keys(hallTables).map(num=>{\n            const t = hallTables[num] || {};\n            const items = Array.isArray(t.items) ? t.items : [];\n \" id=\"cGross\">٠<\/div><\/div>\n        <div class=\"card c-red\"><div class=\"ic\"><i data-lucide=\"receipt-text\"><\/i><\/div><div class=\"lbl\">المصروفات<\/div><div class=\"val\" id=\"cExp\">٠<\/div><\/div>\n        <div class=\"card c-teal\"><div class=\"ic\"><i data-lucide=\"trending-up\"><\/i><\/div><div class=\"lbl\">صافي المبيعات<\/div><div class=\"val\" id=\"cNet\">٠<\/div><\/div>\n        <div class=\"card c-purple\"><div class=\"ic\"><i data-lucide=\"files\"><\/i><\/div><div class=\"lbl\">عدد الفواتير<\/div><div class=\"val\" id=\"cCount\">٠<\/div><\/div>\n      <\/div>\n\n      <div class=\"summary-box\">\n        <h3>ملخص اليوم<\/h3>\n        <div class=\"summary-row\"><span>إجمالي الإيرادات<\/span><b id=\"sumGross\">٠ ج<\/b><\/div>\n        <div class=\"summary-row\"><span>إجمالي الخصومات<\/span><b id=\"sumDiscount\">٠ ج<\/b><\/div>\n        <div class=\"summary-row\"><span>كاش<\/span><b id=\"cCash\">٠ ج<\/b><\/div>\n        <div class=\"summary-row\"><span>محافظ / فودافون كاش<\/span><b id=\"cWallet\">٠ ج<\/b><\/div>\n        <div class=\"summary-row\"><span>صافي الربح التقريبي<\/span><b id=\"sumProfit\">٠ ج<\/b><\/div>\n      <\/div>\n\n      <div class=\"section-title\">الورديات<\/div>\n      <div id=\"shiftsBox\"><div class=\"panel\"><div class=\"empty-note\">جاري التحميل...<\/div><\/div><\/div>\n\n      <div class=\"section-title\">أحدث الفواتير (لحظي)<\/div>\n      <div id=\"ordersToolbar\" style=\"display:none; align-items:center; gap:8px; margin:0 0 8px; flex-wrap:wrap;\">\n        <span id=\"ordersSelCount\" style=\"font-size:12.5px; font-weight:700;\">محدد: 0<\/span>\n        <button type=\"button\" class=\"icon-btn danger\" id=\"ordersDeleteSelectedBtn\">حذف المحدد<\/button>\n        <button type=\"button\" class=\"icon-btn\" id=\"ordersClearSelBtn\">إلغاء التحديد<\/button>\n      <\/div>\n      <div class=\"panel table-scroll\">\n        <table>\n          <thead><tr>\n            <th style=\"width:34px;\"><input type=\"checkbox\" id=\"ord ton\" class=\"icon-btn\" id=\"ahPrevBtn\">‹ السابق<\/button>\n            <b id=\"ahMonthLbl\"><\/b>\n            <button type=\"button\" class=\"icon-btn\" id=\"ahNextBtn\">التالي ›<\/button>\n          <\/div>\n          <div class=\"cal-dow-row\" id=\"ahDowRow\"><\/div>\n          <div class=\"cal-grid\" id=\"ahGrid\"><\/div>\n          <div class=\"cal-sum\" id=\"ahMonthSummary\"><\/div>\n        <\/div>\n        <div id=\"ahDayView\" style=\"display:none;\">\n          <div class=\"cal-nav\">\n            <button type=\"button\" class=\"icon-btn\" id=\"ahBackBtn\">رجوع للتقويم<\/button>\n            <b id=\"ahDayTitle\"><\/b>\n          <\/div>\n          <div id=\"ahDayBody\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"tab-panel\" id=\"tabMenu\">\n      <div class=\"chart-box\">\n        <h3>إضافة قسم جديد<\/h3>\n        <div class=\"day-select-row\" style=\"margin-bottom:0;\">\n          <input type=\"text\" id=\"newCatNameInput\" placeholder=\"اسم القسم\">\n          <button class=\"btn\" style=\"width:auto; padding:9px 16px;\" id=\"addCatDashBtn\">إضافة القسم<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"chart-box\" style=\"margin-bottom: 14px;\">\n        <div class=\"day-select-row\" style=\"margin-bottom:0;\">\n          <input type=\"text\" id=\"menuSearchInput\" placeholder=\"ابحث عن أي صنف في المنيو...\" style=\"width:100%;\">\n        <\/div>\n      <\/div>\n\n      <div id=\"menuEditorBox\"><\/div>\n    <\/div>\n\n    <div class=\"tab-panel\" id=\"tabStaffHR\">\n      <div class=\"chart-box\">\n        <h3>إضافة موظف جديد<\/h3>\n        <div class=\"day-select-row\" style=\"margin-bottom:8px;\">\n          <input type=\"text\" id=\"hrNewName\" placeholder=\"الاسم\">\n          <select id=\"hrNewJob\">\n            <option value=\"باريستا\">باريستا<\/option>\n            <option value=\"كاشير\">كاشير<\/option>\n            <option value=\"شيف\">شيف<\/option>\n            <option value=\"ويتر\">ويتر<\/option>\n            <option value=\"سيكيورتي\">سيكيورتي<\/option>\n            <option value=\"أخرى\">أخرى<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"day-select-row\" style=\"margin-bottom:8px;\">\n          <input type=\"text\" id=\"hrNewPhone\" placeholder=\"رقم الهاتف\">\n          <input type=\"number\" step=\"any\" id=\"hrNewSalary\" placeholder=\"الراتب الأساسي\">\n          <input type=\"number\" step=\"any\" id=\"hrNewAgreedHours\" placeholder=\"ساعات الشيفت المتفق عليها\" value=\"8\" style=\"max-width:190px;\">\n        <\/div>\n        <div class=\"day-select-row\" style=\"margin-bottom:0;\">\n          <input type=\"date\" id=\"hrNewStartDate\">\n          <button class=\"btn\" style=\"width:auto; padding:9px 16px;\" id=\"addHrStaffBtn\">حفظ الموظف<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"section-title\">قائمة الموظفين<\/div>\n      <div id=\"hrStaffListBox\"><\/div>\n\n      <div class=\"section-title\">\n        <span>الجدول اليومي — الحضور والانصراف<\/span>\n      <\/div>\n      <div class=\"chart-box\">\n        <div class=\"day-select-row\" style=\"margin-bottom:10px;\">\n          <input type=\"date\" id=\"hrAttendanceDate\">\n        <\/div>\n        <div class=\"day-select-row\" style=\"margin-bottom:0; flex-wrap:wrap;\">\n          <select id=\"hrAttEmployee\" style=\"min-width:160px;\"><\/select>\n          <select id=\"hrAttStatus\" style=\"min-width:100px;\">\n            <option value=\"present\" selected>حاضر<\/option>\n            <option value=\"leave\">إجازة<\/option>\n            <option value=\"absent\">غياب مصرح<\/option>\n            <option value=\"absent_unauth\">غياب غير مصرح<\/option>\n          <\/select>\n          <div class=\"hr-att-time-field\">\n            <label for=\"hrAttIn\">وقت الحضور<\/label>\n            <input type=\"time\" id=\"hrAttIn\">\n          <\/div>\n          <div class=\"hr-att-time-field\">\n            <label for=\"hrAttOut\">وقت الانصراف<\/label>\n            <input type=\"time\" id=\"hrAttOut\">\n          <\/div>\n          <input type=\"number\" step=\"any\" id=\"hrAttDeduction\" placeholder=\"الخصم\" style=\"max-width:110px;\">\n          <input type=\"number\" step=\"any\" id=\"hrAttAdvance\" placeholder=\"السلفة\" style=\"max-width:110px;\">\n          <button type=\"button\" class=\"btn\" style=\"width:auto; padding:9px 14px; background:var(--surface-2); color:var(--cream); border:1px solid var(--line);\" id=\"hrAttPermissionBtn\">استئذان<\/button>\n          <button type=\"button\" class=\"btn\" style=\"width:auto; padding:9px 14px; background:var(--surface-2); color:var(--danger); border:1px solid var(--danger);\" id=\"hrAttUnauthBtn\">غياب غير مصرح<\/button>\n          <button class=\"btn\" style=\"width:auto; padding:9px 16px;\" id=\"addHrAttBtn\">تسجيل<\/button>\n        <\/div>\n                <div class=\"sub-note\" id=\"hrAttHoursPreview\" style=\"margin-top:4px; color:var(--gold-bright); display:none;\"><\/div>\n      <\/div>\n\n      <div class=\"panel table-scroll\">\n        <table>\n          <thead><tr>\n            <th>الاسم<\/th><th>الحضور<\/th><th>الانصراف<\/th><th>الساعات<\/th><th>الخصم<\/th><th>السلفة<\/th><th><\/th>\n          <\/tr><\/thead>\n          <tbody id=\"hrAttendanceBody\"><\/tbody>\n        <\/table>\n        <div class=\"empty-note\" id=\"hrAttendanceEmpty\" style=\"display:none;\">لا توجد تسجيلات حضور لهذا اليوم بعد<\/div>\n      <\/div>\n      <div class=\"summary-box\">\n        <div class=\"summary-row\"><span>إجمالي الساعات<\/span><b id=\"hrTotalHours\">٠<\/b><\/div>\n        <div class=\"summary-row\"><span>إجمالي الخصومات<\/span><b id=\"hrTotalDeduction\">٠<\/b><\/div>\n        <div class=\"summary-row\"><span>إجمالي السلف<\/span><b id=\"hrTotalAdvance\">٠<\/b><\/div>\n      <\/div>\n    <\/div>\n\n    <!-- مودال ملف الموظف الإحصائي (بيفتح لما تدوس على اسم الموظف في جدول الحضور) -->\n    <div class=\"table-modal-overlay\" id=\"employeeStatsOverlay\">\n      <div class=\"table-modal\" style=\"max-width:420px;\">\n        <div class=\"table-modal-head\">\n          <h3 id=\"employeeStatsTitle\">موظف<\/h3>\n          <button type=\"button\" class=\"table-modal-close\" id=\"employeeStatsClose\" aria-label=\"إغلاق\"><i data-lucide=\"x\"><\/i><\/button>\n        <\/div>\n        <div class=\"table-modal-body\">\n          <div class=\"day-select-row\" style=\"margin-bottom:14px;\">\n            <label style=\"font-size:13px; color:var(--cream-dim);\">الشهر:<\/label>\n            <input type=\"month\" id=\"employeeStatsMonth\" style=\"max-width:160px;\">\n          <\/div>\n          <div class=\"cards-grid\" id=\"employeeStatsCards\"><\/div>\n          <div class=\"summary-box\" id=\"employeeStatsSalaryBox\" style=\"margin-top:4px;\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"tab-panel\" id=\"tabAccounts\">\n      <div class=\"chart-box\">\n        <h3>إضافة حساب موظف جديد<\/h3>\n        <div class=\"day-select-row\" style=\"margin-bottom:8px;\">\n          <input type=\"text\" id=\"newStaffUsername\" placeholder=\"اسم المستخدم (تسجيل الدخول)\">\n          <input type=\"text\" id=\"newStaffPassword\" placeholder=\"كلمة المرور\">\n        <\/div>\n        <div class=\"day-select-row\" style=\"margin-bottom:8px;\">\n          <input type=\"text\" id=\"newStaffName\" placeholder=\"اسم الموظف اللي بيظهر في الفواتير\">\n        <\/div>\n        <div style=\"display:flex; flex-wrap:wrap; gap:12px; margin-bottom:10px;\">\n          <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;\">\n            <input type=\"checkbox\" id=\"newStaffPermSales\"> المبيعات\n          <\/label>\n          <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;\">\n            <input type=\"checkbox\" id=\"newStaffPermExpenses\"> المصروفات\n          <\/label>\n          <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;\">\n            <input type=\"checkbox\" id=\"newStaffPermCashDiscount\"> خصم الكاش\n          <\/label>\n          <label style=\"display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;\">\n            <input type=\"checkbox\" id=\"newStaffPermOwnerDiscount\"> خصم الأونر\n          <\/label>\n        <\/div>\n        <button class=\"btn\" style=\"width:auto; padding:9px 16px;\" id=\"addStaffBtn\">إضافة الحساب<\/button>\n      <\/div>\n\n      <div class=\"section-title\">حسابات الموظفين وصلاحياتهم (دخول الكاشير)<\/div>\n      <div id=\"staffListBox\"><\/div>\n\n    <\/div>\n\n    <div class=\"tab-panel\" id=\"tabSensitive\">\n      <div class=\"sens-subtabs\">\n        <button type=\"button\" class=\"sens-subtab active\" data-spane=\"dash\">\n          <span class=\"sens-st-title\">حذف الفواتير من الداشبورد<\/span>\n          <small id=\"sensDashCount\">0 عملية<\/small>\n        <\/button>\n        <button type=\"button\" class=\"sens-subtab\" data-spane=\"cashier\">\n          <span class=\"sens-st-title\">باقي الحذف والإلغاءات (من الكاشير)<\/span>\n          <small id=\"sensCashierCount\">0 عملية<\/small>\n        <\/button>\n      <\/div>\n\n      <div class=\"period-row\">\n        <label>الفترة:<\/label>\n        <div class=\"period-toggle\">\n          <button type=\"button\" class=\"active\" id=\"sensDayBtn\">يوم معيّن<\/button>\n          <button type=\"button\" id=\"sensMonthBtn\">شهر كامل<\/button>\n        <\/div>\n        <input type=\"date\" id=\"sensDateInput\" style=\"max-width:180px;\">\n        <input type=\"month\" id=\"sensMonthInput\" style=\"max-width:180px; display:none;\">\n      <\/div>\n\n      <div class=\"sens-pane active\" id=\"sensPaneDash\">\n        <div class=\"panel table-scroll\">\n          <table>\n            <thead><tr>\n              <th>الوقت<\/th><th>الترابيزة<\/th><th>الأصناف<\/th><th>القيمة<\/th><th>مين حذفها<\/th>\n            <\/tr><\/thead>\n            <tbody id=\"sensitiveDashBody\"><\/tbody>\n          <\/table>\n          <div class=\"empty-note\" id=\"sensitiveDashEmpty\" style=\"display:none;\">لا توجد فواتير اتحذفت من الداشبورد في الفترة دي<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"sens-pane\" id=\"sensPaneCashier\">\n        <div class=\"panel table-scroll\">\n          <table>\n            <thead><tr>\n              <th>الوقت<\/th><th>النوع<\/th><th>التفاصيل<\/th><th>القيمة<\/th><th>مين عمل العملية<\/th>\n            <\/tr><\/thead>\n            <tbody id=\"sensitiveLogBody\"><\/tbody>\n          <\/table>\n          <div class=\"empty-note\" id=\"sensitiveLogEmpty\" style=\"display:none;\">لا توجد عمليات حذف أو إلغاء مسجلة في الفترة دي<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- ============ الإعدادات: استيراد كل بيانات الكاشير من Firebase ============ -->\n    <div class=\"tab-panel\" id=\"tabSettings\">\n      <div class=\"chart-box\">\n        <h3>⬇️ استيراد كل بيانات الكاشير من Firebase<\/h3>\n        <div class=\"set-note\">\n          بيسحب كل اللي اتسجل على السحابة (أيام العمل والورديات والفواتير والمصروفات والمنيو والحسابات والاستاف والصالات)\n          ويطلّعهم في <b>ملف نسخة احتياطية<\/b> بنفس صيغة ملف الكاشير بالظبط.<br>\n          بعد التنزيل: افتح الكاشير ← لوحة الأدمن ← إعدادات ← <b>النسخ الاحتياطي للبيانات<\/b> ← <b>استيراد نسخة احتياطية<\/b> ← اختار الملف.\n        <\/div>\n        <label class=\"set-check\">\n          <input type=\"checkbox\" id=\"backupIncludeInventory\">\n          <span>تضمين المخزون (أسماء الأصناف والكميات). تنبيه: وصفات المخزون وحركاته مش بتتخزن على Firebase، فلو فعّلتها هتتفرّغ على الكاشير بعد الاستيراد.<\/span>\n        <\/label>\n        <button class=\"btn\" id=\"backupDownloadBtn\">تنزيل نسخة احتياطية كاملة من Firebase<\/button>\n        <div class=\"set-status\" id=\"backupStatus\"><\/div>\n        <div class=\"set-warn\">\n          استيراد الملف على الكاشير بيستبدل كل بياناته الحالية بالموجود في الملف. أي حاجة اتسجلت على الكاشير أوفلاين ومارفعتش على Firebase هتتمسح.\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"bottom-nav\">\n    <button class=\"bn-btn active\" id=\"bnMonitor\"><i class=\"ic\" data-lucide=\"house\"><\/i>الرئيسية<\/button>\n    <button class=\"bn-btn\" id=\"bnStaffHR\"><i class=\"ic\" data-lucide=\"users-round\"><\/i>الاستاف<\/button>\n    <button class=\"bn-btn\" id=\"bnInventory\"><i class=\"ic\" data-lucide=\"package\"><\/i>المخزون<\/button>\n    <button class=\"bn-btn\" id=\"bnMenu\"><i class=\"ic\" data-lucide=\"utensils\"><\/i>المنيو<\/button>\n    <button class=\"bn-btn\" id=\"bnMore\"><i class=\"ic\" data-lucide=\"menu\"><\/i>المزيد<\/button>\n  <\/div>\n\n  <div class=\"more-sheet-overlay\" id=\"moreSheetOverlay\">\n    <div class=\"more-sheet\">\n      <div class=\"handle\"><\/div>\n      <button class=\"more-item\" id=\"moreTables\"><i class=\"ic\" data-lucide=\"table-2\"><\/i> بث الترابيزات<\/button>\n      <button class=\"more-item\" id=\"moreReports\"><i class=\"ic\" data-lucide=\"chart-no-axes-column-increasing\"><\/i> تقارير وإحصائيات<\/button>\n      <button class=\"more-item\" id=\"moreAccounts\"><i class=\"ic\" data-lucide=\"users-round\"><\/i> حسابات الكاشير<\/button>\n      <button class=\"more-item\" id=\"moreSensitive\"><i class=\"ic\" data-lucide=\"shield-alert\"><\/i> الحذف والإلغاءات<\/button>\n      <button class=\"more-item\" id=\"moreSettings\"><i class=\"ic\" data-lucide=\"settings-2\"><\/i> الإعدادات<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script type=\"module\">\nfunction renderDashboardIcons(){\n  if(window.lucide) window.lucide.createIcons();\n}\nlet iconRenderQueued = false;\nnew MutationObserver(()=>{\n  if(iconRenderQueued) return;\n  iconRenderQueued = true;\n  requestAnimationFrame(()=>{\n    iconRenderQueued = false;\n    renderDashboardIcons();\n  });\n}).observe(document.body,{childList:true,subtree:true});\nrenderDashboardIcons();\n\n/* ============ حط هنا بيانات مشروع Firebase (نفس القيم اللي في برنامج الكاشير بالظبط) ============ */\nconst FIREBASE_CONFIG = {apiKey: \"demo-key\", authDomain: \"beans-demo.local\", projectId: \"beans-demo\", storageBucket: \"beans-demo.local\", messagingSenderId: \"0\", appId: \"demo\"};\n\nconst EXPENSE_CATEGORY_LABELS = {\n  cleaning: 'مستلزمات نظافة',\n  hospitality: 'ضيافة',\n  emergency: 'مستلزمات طارئة',\n  quick_purchase: 'مشتريات نقدية سريعة',\n  maintenance: 'صيانة',\n  bills: 'فواتير (كهرباء / مياه / نت)',\n  delivery: 'توصيل ونقل',\n  salary_advance: 'سلفة / مرتبات',\n  marketing: 'تسويق وإعلانات',\n  other: 'أخرى'\n};\nconst catLabel = id => EXPENSE_CATEGORY_LABELS[id] || 'أخرى';\nconst fmt2 = n => (n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});\n\nif(!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId){\n  document.getElementById('noConfigScreen').style.display = 'block';\n  document.getElementById('loginScreen').style.display = 'none';\n} else {\n  init();\n}\n\nasync function init(){\n  const { initializeApp } = window.__BEANS_FB.app;\n  const { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } =\n    window.__BEANS_FB.auth;\n  const { getFirestore, collection, query, where, orderBy, limit, onSnapshot, doc, getDoc, getDocs, setDoc, deleteDoc, serverTimestamp } =\n    window.__BEANS_FB.firestore;\n\n  const app = initializeApp(FIREBASE_CONFIG);\n  const auth = getAuth(app);\n  const db = getFirestore(app);\n\n  const loginScreen = document.getElementById('loginScreen');\n  const appEl = document.getElementById('app');\n  const loginBtn = document.getElementById('loginBtn');\n  const loginErr = document.getElementById('loginErr');\n\n  loginBtn.addEventListener('click', doLogin);\n  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });\n\n  function doLogin(){\n    const email = document.getElementById('loginEmail').value.trim();\n    const pass = document.getElementById('loginPassword').value;\n    if(!email || !pass){ loginErr.textContent = 'من فضلك أدخل الإيميل وكلمة المرور'; return; }\n    loginBtn.disabled = true; loginErr.textContent = '';\n    signInWithEmailAndPassword(auth, email, pass)\n      .catch(err=>{ loginErr.textContent = 'بيانات الدخول غير صحيحة'; console.warn(err); })\n      .finally(()=>{ loginBtn.disabled = false; });\n  }\n\n  document.getElementById('logoutBtn').addEventListener('click', ()=> signOut(auth));\n\n  onAuthStateChanged(auth, (user)=>{\n    if(user){\n      loginScreen.style.display = 'none';\n      appEl.style.display = 'block';\n      startDashboard(db, { collection, query, where, orderBy, limit, onSnapshot, doc, getDoc, getDocs, setDoc, deleteDoc, serverTimestamp, currentUserEmail: ()=> (auth.currentUser && auth.currentUser.email) || 'dashboard' });\n    } else {\n      appEl.style.display = 'none';\n      loginScreen.style.display = 'flex';\n    }\n  });\n}\n\n/* ============ تبديل التبويبات ============ */\n/* ============ التنقل: الشريط السفلي + شيت \"المزيد\" ============ */\nconst BN_TABS = ['monitor','staffhr','inventory','menu','tables','reports','accounts','sensitive','settings'];\nconst BN_PRIMARY = {monitor:'bnMonitor', staffhr:'bnStaffHR', inventory:'bnInventory', menu:'bnMenu'};\nconst TAB_PANEL_ID = {monitor:'tabMonitor', staffhr:'tabStaffHR', inventory:'tabInventory', menu:'tabMenu', tables:'tabTables', reports:'tabReports', accounts:'tabAccounts', sensitive:'tabSensitive', settings:'tabSettings'};\n\nfunction switchTab(which){\n  BN_TABS.forEach(t=>{\n    document.getElementById(TAB_PANEL_ID[t]).classList.toggle('active', t===which);\n  });\n  Object.entries(BN_PRIMARY).forEach(([t,btnId])=>{\n    document.getElementById(btnId).classList.toggle('active', t===which);\n  });\n  closeMoreSheet();\n  window.scrollTo({top:0, behavior:'smooth'});\n}\n\ndocument.getElementById('bnMonitor').addEventListener('click', ()=> switchTab('monitor'));\ndocument.getElementById('bnStaffHR').addEventListener('click', ()=> switchTab('staffhr'));\ndocument.getElementById('bnInventory').addEventListener('click', ()=> switchTab('inventory'));\ndocument.getElementById('bnMenu').addEventListener('click', ()=> switchTab('menu'));\ndocument.getElementById('bnMore').addEventListener('click', ()=> openMoreSheet());\ndocument.getElementById('moreTables').addEventListener('click', ()=> switchTab('tables'));\ndocument.getElementById('moreReports').addEventListener('click', ()=> switchTab('reports'));\ndocument.getElementById('moreAccounts').addEventListener('click', ()=> switchTab('accounts'));\ndocument.getElementById('moreSensitive').addEventListener('click', ()=> switchTab('sensitive'));\ndocument.getElementById('moreSettings').addEventListener('click', ()=> switchTab('settings'));\ndocument.getElementById('moreSheetOverlay').addEventListener('click', (e)=>{\n  if(e.target.id === 'moreSheetOverlay') closeMoreSheet();\n});\nfunction openMoreSheet(){ document.getElementById('moreSheetOverlay').classList.add('show'); }\nfunction closeMoreSheet(){ document.getElementById('moreSheetOverlay').classList.remove('show'); }\n\n/* ============ تبويب المتابعة اللحظية ============ */\nlet _daysUnsub = null, _ordersUnsub = null, _expensesUnsub = null, _shiftsUnsub = null;\nlet _daysCache = [];\n\nfunction startDashboard(db, fns){\n  const { collection, query, where, orderBy, limit, onSnapshot, doc, getDoc } = fns;\n  const statusDot = document.getElementById('statusDot');\n  const statusTxt = document.getElementById('statusTxt');\n  statusDot.className = 'status-dot on';\n  statusTxt.textContent = 'متصل — البيانات بتتحدث لحظياً';\n\n  const daySelect = document.getElementById('daySelect');\n  daySelect.addEventListener('change', ()=> loadDay(db, fns, daySelect.value));\n\n  if(_daysUnsub) _daysUnsub();\n  const daysQ = query(collection(db,'businessDays'), orderBy('ts','desc'), limit(60));\n  _daysUnsub = onSnapshot(daysQ, (snap)=>{\n    _daysCache = [];\n    snap.forEach(d=> _daysCache.push({ id:d.id, ...d.data() }));\n    const prevSelected = daySelect.value;\n    daySelect.innerHTML = _daysCache.map(d=>{\n      const lbl = `${d.dateKey || d.id} ${d.closedAt ? '(مغلق)' : '(مفتوح الآن)'}`;\n      return `<option value=\"${d.id}\">${lbl}<\/option>`;\n    }).join('') || '<option value=\"\">لا توجد أيام عمل بعد<\/option>';\n    const toSelect = _daysCache.find(d=>d.id===prevSelected) ? prevSelected : (_daysCache[0] ? _daysCache[0].id : '');\n    daySelect.value = toSelect;\n    updateDayBadge(toSelect);\n    if(toSelect) loadDay(db, fns, toSelect);\n  }, (err)=>{\n    statusDot.className = 'status-dot off';\n    statusTxt.textContent = 'في مشكلة في الاتصال';\n    console.warn(err);\n  });\n\n  startReports(db, fns);\n  startInventory(db, fns);\n  startMenuSync(db, fns);\n  startStaff(db, fns);\n  startSensitiveOps(db, fns);\n  startStaffHR(db, fns);\n  startTablesLive(db, fns);\n  startSettings(db, fns);\n}\n\nfunction updateDayBadge(dayId){\n  const badge = document.getElementById('dayStatusBadge');\n  const d = _daysCache.find(x=>x.id===dayId);\n  if(!d){ badge.textContent=''; return; }\n  if(d.closedAt){ badge.className='day-status-badge closed'; badge.textContent='مغلق'; }\n  else { badge.className='day-status-badge open'; badge.textContent='مفتوح الآن'; }\n}\n\n/* ============ تبويب بث الترابيزات (مفتوحة/فاضية) ============ */\nlet _tablesData = null; // آخر نسخة وصلت من الكاشير: {halls:[...], tables:{hallId:[{num,count,total,label,openedAt}...]}}\nlet _tablesTickInterval = null;\n\nfunction elapsedSinceTables(ts){\n  if(!ts) return '';\n  const mins = Math.max(0, Math.floor((Date.now()-ts)/60000));\n  if(mins<1) return 'من دلوقتي';\n  if(mins<60) return `من ${mins} دقيقة`;\n  const h = Math.floor(mins/60), m = mins%60;\n  return `من ${h} س${m>0?' و'+m+' د':''}`;\n}\n\nfunction startTablesLive(db, fns){\n  const { doc, onSnapshot } = fns;\n  const dot = document.getElementById('tablesStatusDot');\n  const txt = document.getElementById('tablesStatusTxt');\n\n  onSnapshot(doc(db, 'settings', 'tables'), (snap)=>{\n    if(!snap.exists()){\n      dot.className = 'status-dot off';\n      txt.textContent = 'لسه معرفش أي ترابيزات — تأكد إن الكاشير متصل بالسحابة';\n      document.getElementById('tablesLiveBody').innerHTML = '<div class=\"empty-note\">لا توجد بيانات ترابيزات بعد<\/div>';\n      return;\n    }\n    dot.className = 'status-dot on';\n    txt.textContent = 'متصل — الحالة بتتحدث لحظياً';\n    _tablesData = snap.data();\n    renderTablesLive();\n  }, (err)=>{\n    dot.className = 'status-dot off';\n    txt.textContent = 'في مشكلة في الاتصال';\n    console.warn(err);\n  });\n\n  if(_tablesTickInterval) clearInterval(_tablesTickInterval);\n  _tablesTickInterval = setInterval(renderTablesLive, 30000); // تحديث \"من كام دقيقة\" كل 30 ثانية من غير ما نستنى تغيير فعلي\n}\n\nfunction renderTablesLive(){\n  const body = document.getElementById('tablesLiveBody');\n  if(!body || !_tablesData) return;\n  const halls = Array.isArray(_tablesData.halls) ? _tablesData.halls : [];\n  const tables = _tablesData.tables || {};\n  if(!halls.length){ body.innerHTML = '<div class=\"empty-note\">لا توجد صالات مسجلة بعد<\/div>'; return; }\n\n  let html = '';\n  halls.forEach(hall=>{\n    const hallTables = (tables[hall.id] || []).slice().sort((a,b)=>a.num-b.num);\n    html += `<div class=\"live-hall-block\"><div class=\"live-hall-name\">${escapeHtmlD(hall.name)} (${hall.tableCount} ترابيزة)<\/div><div class=\"tables-live-grid\">`;\n    for(let i=1;i<=hall.tableCount;i++){\n      const t = hallTables.find(x=>x.num===i);\n      const count = t ? t.count : 0;\n      const hasItems = count > 0;\n      const label = t && t.label ? t.label : `ترابيزة ${i}`;\n      html += `\n        <div class=\"table-live-card ${hasItems?'occupied':''}\" data-hall=\"${escapeHtmlD(hall.id)}\" data-num=\"${i}\">\n          <div class=\"table-live-status-icon\"><i data-lucide=\"${hasItems?'circle-dot':'circle-check'}\"><\/i><\/div>\n          <div class=\"tl-name\">${escapeHtmlD(label)}<\/div>\n          <div class=\"tl-status\">${hasItems ? count+' صنف مفتوح' : 'فاضية'}<\/div>\n          ${hasItems ? `<div class=\"tl-total\">${fmtD(t.total)} ج.م<\/div><div class=\"tl-time\">${elapsedSinceTables(t.openedAt)}<\/div>` : ''}\n        <\/div>`;\n    }\n    html += `<\/div><\/div>`;\n  });\n  body.innerHTML = html;\n}\nfunction escapeHtmlD(s){ return String(s==null?'':s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction fmtD(n){ return (n||0).toLocaleString('en-US'); }\n\n/* ---------- مودال تفاصيل الترابيزة (بيفتح لما تدوس على أي كارت) ---------- */\ndocument.getElementById('tablesLiveBody').addEventListener('click', (e)=>{\n  const card = e.target.closest('.table-live-card');\n  if(!card) return;\n  showTableDetail(card.dataset.hall, Number(card.dataset.num));\n});\ndocument.getElementById('tableDetailClose').addEventListener('click', closeTableDetail);\ndocument.getElementById('tableDetailOverlay').addEventListener('click', (e)=>{\n  if(e.target.id === 'tableDetailOverlay') closeTableDetail();\n});\nfunction closeTableDetail(){\n  document.getElementById('tableDetailOverlay').classList.remove('show');\n}\nfunction showTableDetail(hallId, num){\n  if(!_tablesData) return;\n  const hall = (_tablesData.halls||[]).find(h=>h.id===hallId);\n  const hallTables = (_tablesData.tables && _tablesData.tables[hallId]) || [];\n  const t = hallTables.find(x=>x.num===num);\n  const label = (t && t.label) ? t.label : `ترابيزة ${num}`;\n  document.getElementById('tableDetailTitle').textContent = `${hall ? hall.name+' — ' : ''}${label}`;\n\n  const body = document.getElementById('tableDetailBody');\n  const items = t && Array.isArray(t.items) ? t.items.filter(it=>(it.qty||0)>0) : [];\n  if(!items.length){\n    body.innerHTML = `<div class=\"table-modal-body\"><div class=\"empty-note\">مفيش طلب مفتوح على الترابيزة دي حالياً<\/div><\/div>`;\n  } else {\n    const rows = items.map(it => `\n      <div class=\"tm-item-row\">\n        <span class=\"tm-item-name\">${escapeHtmlD(it.name)} <span class=\"tm-item-qty\">×${it.qty}<\/span><\/span>\n        <span class=\"tm-item-sub\">${fmtD((it.price||0)*(it.qty||0))} ج.م<\/span>\n      <\/div>`).join('');\n    body.innerHTML = `\n      <div class=\"table-modal-body\">\n        <div class=\"tm-meta\">${elapsedSinceTables(t.openedAt) || ''}<\/div>\n        ${rows}\n        <div class=\"tm-total-row\"><span>الإجمالي<\/span><span>${fmtD(t.total)} ج.م<\/span><\/div>\n      <\/div>`;\n  }\n  document.getElementById('tableDetailOverlay').classList.add('show');\n}\n\nfunction loadDay(db, fns, bdId){\n  _dashDb = db; _dashFns = fns;\n  _selectedOrderIds.clear();\n  const { collection, query, where, onSnapshot } = fns;\n  updateDayBadge(bdId);\n  if(_ordersUnsub) _ordersUnsub();\n  if(_expensesUnsub) _expensesUnsub();\n  if(_shiftsUnsub) _shiftsUnsub();\n  if(!bdId){\n    renderOrders([]); renderExpenses([]); renderShifts([]);\n    return;\n  }\n\n  let ordersData = [], expensesData = [], shiftsData = [];\n\n  const ordersQ = query(collection(db,'orders'), where('bdId','==',bdId));\n  _ordersUnsub = onSnapshot(ordersQ, (snap)=>{\n    ordersData = [];\n    snap.forEach(d=>{ const v = d.data(); if(!v.deleted) ordersData.push(v); });\n    ordersData.sort((a,b)=> (b.ts||0) - (a.ts||0));\n    renderOrders(ordersData);\n    updateSummary(ordersData, expensesData);\n  });\n\n  const expensesQ = query(collection(db,'expenses'), where('bdId','==',bdId));\n  _expensesUnsub = onSnapshot(expensesQ, (snap)=>{\n    expensesData = [];\n    snap.forEach(d=>{ const v = d.data(); if(!v.deleted) expensesData.push(v); });\n    expensesData.sort((a,b)=> (b.ts||0) - (a.ts||0));\n    renderExpenses(expensesData);\n    updateSummary(ordersData, expensesData);\n  });\n\n  const shiftsQ = query(collection(db,'shifts'), where('bdId','==',bdId));\n  _shiftsUnsub = onSnapshot(shiftsQ, (snap)=>{\n    shiftsData = [];\n    snap.forEach(d=> shiftsData.push(d.data()));\n    shiftsData.sort((a,b)=> (b.ts||0) - (a.ts||0));\n    renderShifts(shiftsData);\n  });\n}\n\nfunction updateSummary(orders, expenses){\n  const paid = orders.filter(o=>!o.owner);\n  const gross = orders.reduce((s,o)=>s+(o.subTotal||0),0);\n  const net = paid.reduce((s,o)=>s+(o.total||0),0);\n  const cash = paid.filter(o=>(o.paymentMethod||'cash')==='cash').reduce((s,o)=>s+(o.total||0),0);\n  const wallet = paid.filter(o=>o.paymentMethod==='instapay'||o.paymentMethod==='wallet').reduce((s,o)=>s+(o.total||0),0);\n  const expTotal = expenses.reduce((s,e)=>s+(e.amount||0),0);\n  document.getElementById('cGross').textContent = fmt2(gross);\n  document.getElementById('cNet').textContent = fmt2(net);\n  document.getElementById('cCash').textContent = fmt2(cash) + ' ج';\n  document.getElementById('cWallet').textContent = fmt2(wallet) + ' ج';\n  document.getElementById('cExp').textContent = fmt2(expTotal);\n  document.getElementById('cCount').textContent = orders.length;\n  document.getElementById('sumGross').textContent = fmt2(gross) + ' ج';\n  document.getElementById('sumProfit').textContent = fmt2(net - expTotal) + ' ج';\n  const discTotal = orders.reduce((s,o)=>s+(o.discount||0),0);\n  document.getElementById('sumDiscount').textContent = fmt2(discTotal) + ' ج';\n}\n\nlet _ordersView = [];\nconst _selectedOrderIds = new Set();\nlet _dashDb = null, _dashFns = null;\n\nfunction updateOrdersToolbar(){\n  const n = _selectedOrderIds.size;\n  document.getElementById('ordersToolbar').style.display = n ? 'flex' : 'none';\n  document.getElementById('ordersSelCount').textContent = `محدد: ${n}`;\n  document.getElementById('ordersDeleteSelectedBtn').textContent = `حذف المحدد (${n})`;\n  const all = document.getElementById('ordersSelectAll');\n  all.checked = _ordersView.length > 0 && n === _ordersView.length;\n  all.indeterminate = n > 0 && n < _ordersView.length;\n}\n\nasync function deleteDashboardOrders(ids){\n  if(!_dashDb || !_dashFns) return;\n  const list = ids.map(id=> _ordersView.find(o=> String(o.id)===String(id))).filter(Boolean);\n  if(!list.length) return;\n  const msg = list.length === 1\n    ? `هيتم حذف الفاتورة نهائياً (${list[0].tableName||'-'} — ${fmt2(list[0].total)} ج.م). الإجراء ده مش هينفع يترجع.`\n    : `هيتم حذف ${list.length} فاتورة نهائياً. الإجراء ده مش هينفع يترجع.`;\n  if(!confirm(msg)) return;\n  const { doc, setDoc, serverTimestamp, currentUserEmail } = _dashFns;\n  const by = currentUserEmail();\n  const atIso = new Date().toISOString();\n  const btn = document.getElementById('ordersDeleteSelectedBtn');\n  btn.disabled = true;\n  let done = 0;\n  try{\n    for(const o of list){\n      // نفس الحقول اللي الكاشير كان بيكتبها لما يحذف فاتورة، مع deletedFrom='dashboard' عشان الكاشير يشيلها عنده\n      await setDoc(doc(_dashDb,'orders',String(o.id)), {\n        deleted:true, deletedBy:by, deletedByUsername:by, deletedAt:atIso, deletedFrom:'dashboard',\n        updatedAt: serverTimestamp()\n      }, { merge:true });\n      const vid = 'v' + Date.now() + Math.random().toString(36).slice(2,7);\n      await setDoc(doc(_dashDb,'voids',vid), {\n        id:vid, ts:Date.now(), by, byUsername:by, at:atIso, source:'dashboard',\n        dateKey:o.dateKey||null, type:'order', orderId:String(o.id),\n        tableName:o.tableName||'', total:o.total||0, subTotal:o.subTotal||0,\n        items:(o.items||[]).map(i=>({name:i.name, qty:i.qty, price:i.price})),\n        updatedAt: serverTimestamp()\n      }, { merge:true });\n      _selectedOrderIds.delete(String(o.id));\n      done++;\n    }\n  }catch(err){\n    console.warn('فشل حذف فاتورة', err);\n    alert(`تم حذف ${done} من ${list.length} فاتورة فقط، وحصل خطأ في الباقي. جرّب تاني.`);\n  }finally{\n    btn.disabled = false;\n    updateOrdersToolbar();\n  }\n}\n\n(function wireOrdersDelete(){\n  const body = document.getElementById('ordersBody');\n  body.addEventListener('change', (e)=>{\n    const chk = e.target.closest('.order-select-chk');\n    if(!chk) return;\n    const id = String(chk.dataset.oid);\n    if(chk.checked) _selectedOrderIds.add(id); else _selectedOrderIds.delete(id);\n    updateOrdersToolbar();\n  });\n  body.addEventListener('click', (e)=>{\n    const btn = e.target.closest('.order-del-btn');\n    if(btn) deleteDashboardOrders([btn.dataset.oid]);\n  });\n  document.getElementById('ordersSelectAll').addEventListener('change', (e)=>{\n    _selectedOrderIds.clear();\n    if(e.target.checked) _ordersView.forEach(o=> _selectedOrderIds.add(String(o.id)));\n    renderOrders(_ordersView);\n  });\n  document.getElementById('ordersClearSelBtn').addEventListener('click', ()=>{\n    _selectedOrderIds.clear();\n    renderOrders(_ordersView);\n  });\n  document.getElementById('ordersDeleteSelectedBtn').addEventListener('click', ()=>{\n    deleteDashboardOrders([..._selectedOrderIds]);\n  });\n})();\n\nfunction renderOrders(orders){\n  _ordersView = orders;\n  // نشيل من التحديد أي فاتورة اختفت من القائمة\n  const live = new Set(orders.map(o=>String(o.id)));\n  [..._selectedOrderIds].forEach(id=>{ if(!live.has(id)) _selectedOrderIds.delete(id); });\n  const body = document.getElementById('ordersBody');\n  const empty = document.getElementById('ordersEmpty');\n  if(!orders.length){ body.innerHTML=''; empty.style.display='block'; updateOrdersToolbar(); return; }\n  empty.style.display='none';\n  body.innerHTML = orders.map(o=>{\n    const itemsStr = (o.items||[]).map(i=>`${i.name} ×${i.qty}`).join('، ');\n    const payLbl = o.owner ? '<span class=\"pill owner\">أونر<\/span>'\n      : (o.paymentMethod==='instapay'||o.paymentMethod==='wallet') ? '<span class=\"pill wallet\">محافظ<\/span>'\n      : '<span class=\"pill cash\">كاش<\/span>';\n    const oid = escapeHtmlD(o.id);\n    return `<tr>\n      <td><input type=\"checkbox\" class=\"order-select-chk\" data-oid=\"${oid}\" ${_selectedOrderIds.has(String(o.id))?'checked':''}><\/td>\n      <td>${o.time||'-'}<\/td>\n      <td>${o.tableName||'-'}<\/td>\n      <td class=\"items-list\">${itemsStr}${o.notes?` <br><i>(${o.notes})<\/i>`:''}<\/td>\n      <td>${fmt2(o.discount||0)}<\/td>\n      <td><b>${fmt2(o.total||0)}<\/b><\/td>\n      <td>${payLbl}<\/td>\n      <td>${o.cashier||'-'}<\/td>\n      <td><button type=\"button\" class=\"icon-btn danger order-del-btn\" data-oid=\"${oid}\" title=\"حذف الفاتورة\">حذف<\/button><\/td>\n    <\/tr>`;\n  }).join('');\n  updateOrdersToolbar();\n}\n\nfunction renderExpenses(expenses){\n  const body = document.getElementById('expensesBody');\n  const empty = document.getElementById('expensesEmpty');\n  if(!expenses.length){ body.innerHTML=''; empty.style.display='block'; return; }\n  empty.style.display='none';\n  body.innerHTML = expenses.map(e=>`<tr>\n      <td>${e.time||'-'}<\/td>\n      <td>${catLabel(e.category)}<\/td>\n      <td>${e.note||'-'}<\/td>\n      <td><b>${fmt2(e.amount||0)}<\/b><\/td>\n      <td>${e.cashierName||'-'}<\/td>\n    <\/tr>`).join('');\n}\n\nfunction renderShifts(shifts){\n  const box = document.getElementById('shiftsBox');\n  if(!shifts.length){ box.innerHTML = '<div class=\"panel\"><div class=\"empty-note\">لا توجد ورديات مسجلة لهذا اليوم<\/div><\/div>'; return; }\n  box.innerHTML = shifts.map(s=>{\n    const isOpen = s.status === 'open';\n    return `<div class=\"shift-card\">\n      <div class=\"top\">\n        <b>${s.cashierName || '-'}<\/b>\n        <span class=\"day-status-badge ${isOpen?'open':'closed'}\">${isOpen?'مفتوحة':'مغلقة'}<\/span>\n      <\/div>\n      <div class=\"row\"><span>العهدة الافتتاحية<\/span><b>${fmt2(s.openingCash)}<\/b><\/div>\n      ${!isOpen ? `\n        <div class=\"row\"><span>النقدية المتوقعة<\/span><b>${fmt2(s.expectedCash)}<\/b><\/div>\n        <div class=\"row\"><span>النقدية الفعلية<\/span><b>${fmt2(s.countedCash)}<\/b><\/div>\n        <div class=\"row\"><span>العجز / الزيادة<\/span><b>${(s.variance>=0?'+':'')+fmt2(s.variance)}<\/b><\/div>\n      ` : ''}\n    <\/div>`;\n  }).join('');\n}\n\n/* ============ تبويب التقارير والإحصائيات ============ */\nlet _reportOrdersUnsub = null, _reportExpensesUnsub = null;\nlet _menuCatalog = []; // كل أصناف المنيو (متزامنة من الكاشير) — بتتحمل مرة واحدة\nlet _peakChart = null;\nlet _reportPeriodMode = 'day'; // 'day' | 'month'\nlet _repOrders = [], _repExpenses = [];\n\nfunction todayIso(){\n  const d = new Date();\n  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\n}\nfunction currentMonthIso(){\n  const d = new Date();\n  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');\n}\n\nasync function startReports(db, fns){\n  const { doc, getDoc, collection, query, where, onSnapshot } = fns;\n\n  const dateInput = document.getElementById('periodDateInput');\n  const monthInput = document.getElementById('periodMonthInput');\n  dateInput.value = todayIso();\n  monthInput.value = currentMonthIso();\n\n  document.getElementById('periodDayBtn').addEventListener('click', ()=>{\n    _reportPeriodMode = 'day';\n    document.getElementById('periodDayBtn').classList.add('active');\n    document.getElementById('periodMonthBtn').classList.remove('active');\n    dateInput.style.display = ''; monthInput.style.display = 'none';\n    loadReportPeriod(db, fns);\n  });\n  document.getElementById('periodMonthBtn').addEventListener('click', ()=>{\n    _reportPeriodMode = 'month';\n    document.getElementById('periodMonthBtn').classList.add('active');\n    document.getElementById('periodDayBtn').classList.remove('active');\n    dateInput.style.display = 'none'; monthInput.style.display = '';\n    loadReportPeriod(db, fns);\n  });\n  dateInput.addEventListener('change', ()=> loadReportPeriod(db, fns));\n  monthInput.addEventListener('change', ()=> loadReportPeriod(db, fns));\n\n  loadReportPeriod(db, fns);\n}\n\nfunction loadReportPeriod(db, fns){\n  const { collection, query, where, onSnapshot } = fns;\n  if(_reportOrdersUnsub) _reportOrdersUnsub();\n  if(_reportExpensesUnsub) _reportExpensesUnsub();\n\n  let startKey, endKey;\n  if(_reportPeriodMode === 'day'){\n    const d = document.getElementById('periodDateInput').value || todayIso();\n    startKey = d; endKey = d;\n  } else {\n    const m = document.getElementById('periodMonthInput').value || currentMonthIso(); // 'YYYY-MM'\n    startKey = m + '-01';\n    endKey = m + '-31'; \n  }\n\n  let ordersData = [], expensesData = [];\n\n  const ordersQ = query(collection(db,'orders'), where('dateKey','>=',startKey), where('dateKey','<=',endKey));\n  _reportOrdersUnsub = onSnapshot(ordersQ, (snap)=>{\n    ordersData = [];\n    snap.forEach(d=>{ const v = d.data(); if(!v.deleted) ordersData.push(v); });\n    renderReports(ordersData, expensesData);\n  });\n\n  const expensesQ = query(collection(db,'expenses'), where('dateKey','>=',startKey), where('dateKey','<=',endKey));\n  _reportExpensesUnsub = onSnapshot(expensesQ, (snap)=>{\n    expensesData = [];\n    snap.forEach(d=>{ const v = d.data(); if(!v.deleted) expensesData.push(v); });\n    renderReports(ordersData, expensesData);\n  });\n}\n\nfunction renderReports(orders, expenses){\n  _repOrders = orders; _repExpenses = expenses;\n  const paid = orders.filter(o=>!o.owner);\n  const gross = orders.reduce((s,o)=>s+(o.subTotal||0),0);\n  const net = paid.reduce((s,o)=>s+(o.total||0),0);\n  const expTotal = expenses.reduce((s,e)=>s+(e.amount||0),0);\n  const profit = net - expTotal;\n\n  document.getElementById('rGross').textContent = fmt2(gross);\n  document.getElementById('rProfit').textContent = fmt2(profit);\n  document.getElementById('rExp').textContent = fmt2(expTotal);\n  document.getElementById('rCount').textContent = orders.length;\n\n  const hourCounts = new Array(24).fill(0);\n  orders.forEach(o=>{\n    if(o.ts){ const h = new Date(o.ts).getHours(); hourCounts[h]++; }\n  });\n  const hourLabels = Array.from({length:24}, (_,h)=> String(h).padStart(2,'0')+':00');\n  renderPeakHoursChart(hourLabels, hourCounts);\n\n  const itemQty = {};\n  orders.forEach(o=>{\n    (o.items||[]).forEach(i=>{\n      itemQty[i.name] = (itemQty[i.name]||0) + (i.qty||1);\n    });\n  });\n  const sortedItems = Object.entries(itemQty).sort((a,b)=>b[1]-a[1]);\n  renderItemSalesList(sortedItems);\n}\n\nfunction renderItemSalesList(sortedItems){\n  const box = document.getElementById('itemSalesList');\n  if(!box) return;\n  if(!sortedItems.length){\n    box.innerHTML = '<div class=\"empty-note\">مفيش مبيعات مسجلة في الفترة دي<\/div>';\n    return;\n  }\n  box.innerHTML = sortedItems.map(([name, qty], i)=>`\n    <div class=\"day-row\">\n      <span class=\"d\" style=\"min-width:26px; color:var(--muted);\">${i+1}<\/span>\n      <span class=\"info\" style=\"flex:1; color:var(--cream); font-size:13px; text-align:right;\">${escapeHtmlD(name)}<\/span>\n      <b style=\"color:var(--gold-bright); min-width:36px; text-align:left;\">${qty}<\/b>\n    <\/div>`).join('');\n}\n\nfunction renderPeakHoursChart(labels, data){\n  const ctx = document.getElementById('peakHoursChart');\n  if(_peakChart) _peakChart.destroy();\n  _peakChart = new Chart(ctx, {\n    type: 'bar',\n    data: { labels, datasets: [{ label: 'عدد الفواتير', data, backgroundColor: '#6B3A1F', borderRadius: 4 }] },\n    options: {\n      responsive:true,\n      plugins:{ legend:{ display:false } },\n      scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } }\n    }\n  });\n}\n\n\n\n/* ============ مركز التقارير المتقدمة (مع الماسكوت) ============ */\nconst REP_CATS = [\n  { id:'time', icon:'clock-3', title:'الأوقات وجداول التشغيل', tip:'عشان تظبط الشفتات على الزحمة',\n    reports:[\n      { id:'hourly', title:'مبيعات الساعات', desc:'أوقات الذروة والساعات الهادية' },\n      { id:'dow',    title:'أيام الأسبوع ومواسم الذروة', desc:'مقارنة السبت لحد الجمعة' } ] },\n  { id:'cust', icon:'users-round', title:'العملاء وبرامج الولاء', tip:'مين بيرجع ومتوسط الفاتورة',\n    reports:[\n      { id:'aov',   title:'متوسط قيمة الفاتورة (AOV)', desc:'فلوس الزبون الواحد وتقسيمها' },\n      { id:'loyal', title:'ولاء العملاء والنقاط', desc:'أكتر الزبائن ترددًا على المحل' } ] },\n  { id:'pay', icon:'credit-card', title:'طرق الدفع', tip:'كام في المية كاش وكام إنستا باي',\n    reports:[ { id:'pay', title:'توزيع طرق الدفع', desc:'كاش · إنستا باي · غيرهم' } ] }\n];\nconst REP_DOW = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];\nconst REP_DOW_ORDER = [6,0,1,2,3,4,5]; // يبدأ بالسبت\nconst REP_MASCOT_TIPS = { home:'اختار القسم اللي عايز تشوفه', cat:'اختار التقرير' };\nlet _repView = { cat:null, rep:null };\n\nconst repEsc = s => String(s==null?'':s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst repEmpty = msg => `<div class=\"empty-note\">${msg}<\/div>`;\nconst repStat = (lbl, val, cls='') => `<div class=\"rep-stat ${cls}\"><div class=\"v\">${val}<\/div><div class=\"l\">${lbl}<\/div><\/div>`;\nconst repStats = html => `<div class=\"rep-stats\">${html}<\/div>`;\nconst repTable = (heads, rows) => `<div class=\"rep-table-wrap\"><table class=\"rep-table\"><thead><tr>${heads.map(h=>`<th>${h}<\/th>`).join('')}<\/tr><\/thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody><\/table><\/div>`;\nconst repBars = rows => {\n  const max = Math.max(1, ...rows.map(r=>r.value));\n  return rows.map(r=>`<div class=\"rep-bar-row\">\n      <span class=\"rep-bar-lbl\">${r.label}<\/span>\n      <div class=\"rep-bar-track\"><div class=\"rep-bar-fill${r.hot?' hot':''}\" style=\"width:${(r.value/max*100).toFixed(1)}%\"><\/div><\/div>\n      <b class=\"rep-bar-val\">${r.display}<\/b><\/div>`).join('');\n};\nconst repNote = html => `<div class=\"rep-note\">${html}<\/div>`;\nconst repPct = (a,b) => b ? (a/b*100).toFixed(1)+'%' : '0%';\n\nfunction repPaid(){ return (_repOrders||[]).filter(o=>!o.owner); }\n\n/* 4) مبيعات الساعات */\nfunction repHourlyReport(){\n  const paid = _repOrders||[];\n  if(!paid.length) return repEmpty('مفيش فواتير في الفترة دي');\n  const cnt = new Array(24).fill(0), rev = new Array(24).fill(0);\n  paid.forEach(o=>{ if(o.ts){ const h=
